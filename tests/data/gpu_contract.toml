# THE GPU CONTRACT, CASE BY CASE -- `docs/execution/gpu.md` § 1.
#
# Each case is what a person (or a probe) writes, and what molbuilder must
# answer.  `tests/test_gpu_contract.py` runs every case down the road a
# person runs, through the one runner every contract table shares
# (`tests/support/road.py`, `run_road_case`, whose header names each key).
#
# A RULE CHANGES, ITS ROWS CHANGE.  A case is a row here, never a function.

# EVERY LAUNCH VALUE IS STATED (`architecture.md` § 5.2): each case's run
# card is this, under its own `run`, and on a machine with a scheduler its
# `allocation` is this, under its own -- so a case states only what it is
# about, and takes away (`run_unset`, `allocation_unset`) what it refuses.
[run_base.siesta]
mpi_np = 2
omp_threads = 1

[run_base.pyscf]
threads = 1

[allocation_base]
domain = "gpu"
time = "01:00:00"
mem = "8G"

# What every SIESTA case's template carries, under the case's own
# `template`: the ELPA solver, because a SIESTA GPU run needs one -- GPU with
# ScaLAPACK is refused where the deck is written (`gpu.md` G3, G6).  A CPU
# case therefore runs CPU-ELPA, and its deck says `.false.` out loud.
[siesta_template]
diag_algorithm = "ELPA-1STAGE"

# The menu every case gets unless it says otherwise: shaped like ASU Sol --
# a CPU queue, and a queue of 128-core nodes beside 48-core nodes with four
# GPUs each.
[[queues]]
name = "cpu"
partition = "cpu"
qos = "public"
max_time = "1-00:00:00"
max_cores = 128
node_types = [{ cores = 128, nodes = 10 }]

[[queues]]
name = "gpu"
partition = "gpu"
qos = "public"
max_time = "1-00:00:00"
max_cores = 128
gpu = { a100 = 4 }
node_types = [{ cores = 128, nodes = 10 },
              { cores = 48, nodes = 5, gpu = { a100 = 4 } }]

# ===================================================================== #
#  1 · ALLOWED OR REFUSED                                               #
# ===================================================================== #

[[case]]
name = "a GPU run that states no count is refused at prep"
run = { use_gpu = true }
refused = "states no GPU count"

[[case]]
name = "the template's use_gpu with nothing on the card is refused too"
template = { use_gpu = true }
refused = "states no GPU count"

[[case]]
name = "a card in --gpus is refused by the flag"
run = { use_gpu = true }
prep = ["--gpus", "a100:1"]
refused = "names no card"

[[case]]
name = "SIESTA on a GPU whose target's record lists no GPU build of it is prepared as asked, the note naming the env and its install (gpu.md G6)"
run = { use_gpu = true, gpu_count = 1 }
record = { conda_envs = ["molbuilder-siesta"] }
said = ["lists no ``molbuilder-siesta-gpu`` environment",
        "bash scripts/install-env.sh install molbuilder-siesta-gpu"]
run_sh = ["molbuilder-siesta-gpu"]

[[case]]
name = "a GPU job on a queue that lists no GPUs is prepared as asked, its fit saying so (scheduler.md R2a, R6)"
run = { use_gpu = true, gpu_count = 1, mpi_np = 4 }
allocation = { domain = "cpu" }
said = ["fits no node of cpu -- 1 GPU is over cpu's most GPUs on a node (0 GPUs); its record lists no GPUs"]
header = ["#SBATCH --gres=gpu:1", "#SBATCH -p cpu"]

[[case]]
name = "one node holds the GPUs a job asks -- more than any node of its queue carries is said, with the most there is"
run = { use_gpu = true, gpu_count = 8, mpi_np = 8 }
said = ["fits no node of gpu -- 8 GPUs is over gpu's most GPUs on a node (4 GPUs)"]
header = ["#SBATCH --gres=gpu:8"]

# A run on a scheduler that names no queue is refused at prep, shown the
# record's queues with its own request's fit on each (`submission.md` S5).
[[case]]
name = "the queue list fits the job's own GPU count"
run = { use_gpu = true, gpu_count = 2, mpi_np = 2 }
allocation_unset = ["domain"]
refused = ["states no queue (domain)",
           "2 GPUs is over cpu's most GPUs on a node (0 GPUs); its record lists no GPUs",
           "fits 5 of 15 nodes of gpu (33%): 48 cores · a100"]

[[case]]
name = "a GPU job's cores are fit on the nodes that have GPUs -- prep says what each kind of machine lacks (scheduler.md R3, R10)"
run = { use_gpu = true, gpu_count = 1, mpi_np = 64 }
said = ["fits no node of gpu -- no one machine of gpu holds all of it: the 48-core machines have 48 cores; the 128-core machines have no GPU"]
header = ["#SBATCH -n 64", "#SBATCH --gres=gpu:1"]

[[case]]
name = "a CPU job on the same queue keeps its 128-core nodes"
run = { use_gpu = false, mpi_np = 64 }
header = ["#SBATCH -n 64", "#SBATCH -p gpu"]
header_lacks = ["--gres"]

[[case]]
name = "a queue listing several cards holds the most any node holds"
queues = [{ name = "public", partition = "public", qos = "public", max_time = "1-00:00:00", gpu = { a100 = 4, "a100.20gb" = 16 }, node_types = [{ cores = 48, nodes = 50, gpu = { a100 = 4 } }, { cores = 48, nodes = 2, gpu = { "a100.20gb" = 16 } }] }]
allocation = { domain = "public" }
run = { use_gpu = true, gpu_count = 16, mpi_np = 16 }
header = ["#SBATCH --gres=gpu:16"]

# ===================================================================== #
#  2 · WHAT IS PRODUCED                                                 #
# ===================================================================== #

[[case]]
name = "a GPU run asks a count on the GPU partition, bound, and its deck says GPU"
run = { use_gpu = true, gpu_count = 2, mpi_np = 8 }
header = ["#SBATCH -n 8", "#SBATCH -p gpu", "#SBATCH --gres=gpu:2",
          "#SBATCH --gres-flags=enforce-binding"]
header_lacks = ["a100"]
deck_says = { "Diag.ELPA.GPU" = ".true." }
run_sh = ["molbuilder-siesta-gpu", "socket co-location"]
said = ["gpu share  8 rank(s) / 2 GPU(s) = 4 rank(s)/GPU"]

[[case]]
name = "an uneven split is judged by its busiest device: 97 ranks on 2 GPUs put 49 on one, past MPS's ceiling of 48"
run = { use_gpu = true, gpu_count = 2, mpi_np = 97 }
said = ["gpu share  97 rank(s) / 2 GPU(s) = 48 rank(s)/GPU  (uneven: 1 device(s) carry one extra rank)",
        "WARNING 49 ranks/GPU exceeds MPS's own ceiling of 48 clients/device"]

[[case]]
name = "fewer ranks than GPUs share none, said as it is"
run = { use_gpu = true, gpu_count = 2, mpi_np = 1 }
said = ["gpu share  1 rank(s) / 2 GPU(s): a GPU each, and 1 GPU(s) with no rank"]

# THE SOLVER IS NOT THE ACCELERATOR (G3): `diag_algorithm` chooses the
# eigensolver and decides no environment and no resource -- the packaged
# SIESTA runs ELPA on the CPU, through ELSI.  The row below is the one above
# with the two-stage solver: the solver reaches the deck, and the queue, the
# GPUs and the environment are the same.
[[case]]
name = "...on the two-stage ELPA, the same queue, GPUs and environment"
template = { diag_algorithm = "ELPA-2STAGE" }
run = { use_gpu = true, gpu_count = 2, mpi_np = 8 }
header = ["#SBATCH -n 8", "#SBATCH -p gpu", "#SBATCH --gres=gpu:2",
          "#SBATCH --gres-flags=enforce-binding"]
header_lacks = ["a100"]
deck_says = { "Diag.Algorithm" = "ELPA-2STAGE", "Diag.ELPA.GPU" = ".true." }
run_sh = ["molbuilder-siesta-gpu", "socket co-location"]

[[case]]
name = "the binding turned off leaves it out of the header"
allocation = { gpu_binding = false }
run = { use_gpu = true, gpu_count = 2, mpi_np = 8 }
header = ["#SBATCH --gres=gpu:2"]
header_lacks = ["enforce-binding"]

[[case]]
name = "a PySCF run states its count like SIESTA's, on one process"
engine = "pyscf"
run = { use_gpu = true, gpu_count = 2, threads = 4 }
header = ["#SBATCH -n 1", "#SBATCH -c 4", "#SBATCH -p gpu",
          "#SBATCH --gres=gpu:2"]
deck_says = { USE_GPU = true }
said = ["gpu share  one process on 2 GPU(s)"]

# GPU acceleration is ELPA's: ScaLAPACK with a GPU is refused rather than
# written (`engines/siesta.md` § 7).
[[case]]
name = "a GPU run on ScaLAPACK is refused"
template = { diag_algorithm = "ScaLAPACK" }
run = { use_gpu = true, gpu_count = 1, mpi_np = 2 }
refused = "requires an ELPA diagonalizer"

[[case]]
name = "use_gpu in the template and the count on the card"
template = { use_gpu = true }
run = { gpu_count = 2, mpi_np = 4 }
header = ["#SBATCH --gres=gpu:2"]

[[case]]
name = "a --gpus flag beats the card"
run = { use_gpu = true, gpu_count = 1 }
prep = ["--gpus", "3"]
header = ["#SBATCH --gres=gpu:3"]

[[case]]
name = "a CPU run asks for no GPU anywhere"
run = { use_gpu = false, mpi_np = 4 }
header = ["#SBATCH -n 4", "#SBATCH -p gpu"]
header_lacks = ["--gres"]
deck_says = { "Diag.ELPA.GPU" = ".false." }
run_sh = ["molbuilder-siesta"]
run_sh_lacks = ["molbuilder-siesta-gpu", "socket co-location", "_have_mps=",
                "MOLBUILDER_GPU_NUMA"]

# ...and its twin on ScaLAPACK (G3): the solver decides neither the queue nor
# the environment, so a CPU run on ELPA runs the packaged build as one on
# ScaLAPACK does.
[[case]]
name = "...on ScaLAPACK, the same queue and the same packaged build"
template = { diag_algorithm = "ScaLAPACK" }
run = { use_gpu = false, mpi_np = 4 }
header = ["#SBATCH -n 4", "#SBATCH -p gpu"]
header_lacks = ["--gres"]
run_sh = ["molbuilder-siesta"]
run_sh_lacks = ["molbuilder-siesta-gpu"]

[[case]]
name = "a count for a run that does not use the GPU is refused at prep, before anything is written"
run = { gpu_count = 2, mpi_np = 4 }
refused = "asks for 2 GPU(s) and does not use the GPU"
made_lacks = ["01_coarse"]

[[case]]
name = "--gpus on a run that does not use the GPU is refused the same"
run = { use_gpu = false, mpi_np = 4 }
prep = ["--gpus", "2"]
refused = "asks for 2 GPU(s) and does not use the GPU"

[[case]]
name = "a PySCF run is asked the same"
engine = "pyscf"
run = { gpu_count = 1, threads = 2 }
refused = "asks for 1 GPU(s) and does not use the GPU"

[[case]]
name = "a GPU run binds its ranks to cores and to its GPU's socket, and says so"
run = { use_gpu = true, gpu_count = 1, mpi_np = 4 }
run_sh = ['_mpirun_bind="--bind-to core --map-by package:PE=$_omp_threads"',
          "MOLBUILDER_GPU_NUMA",
          "GPU resources : GPU mode (ELPA-CUDA, no NCCL) -- chosen $_mpi_np ranks × $_omp_threads threads",
          "(or measure it: prep bench, for this stage)"]

# run-reports.md § 2.1a, § 2.6: the monitor samples GPUs (--gpu) exactly when the run uses one.
[[case]]
name = "a SIESTA GPU run's monitor samples its GPUs"
run = { use_gpu = true, gpu_count = 1, mpi_np = 2 }
run_sh = ['" --gpu --interval "${MB_MONITOR_INTERVAL:-10}" ']

[[case]]
name = "...a PySCF GPU run's too"
engine = "pyscf"
run = { use_gpu = true, gpu_count = 1, threads = 2 }
run_sh = ['" --gpu --interval "${MB_MONITOR_INTERVAL:-10}" ']

[[case]]
name = "...and a SIESTA CPU run's samples none"
run = { use_gpu = false }
run_sh = ['" --interval "${MB_MONITOR_INTERVAL:-10}" ']
run_sh_lacks = ["--gpu --interval"]

[[case]]
name = "...nor a PySCF CPU run's"
engine = "pyscf"
run = { use_gpu = false }
run_sh = ['" --interval "${MB_MONITOR_INTERVAL:-10}" ']
run_sh_lacks = ["--gpu --interval"]

[[case]]
name = "--env names the env a job activates, over the GPU route"
run = { use_gpu = true, gpu_count = 1 }
prep = ["--env", "molbuilder-siesta"]
run_sh = ["molbuilder-siesta"]
run_sh_lacks = ["molbuilder-siesta-gpu"]

[[case]]
name = "a prep for another machine reads that machine's record"
machine = "named"
run = { use_gpu = true, gpu_count = 1 }
header = ["#SBATCH -p gpu", "#SBATCH --gres=gpu:1"]

[[case]]
name = "a benchmark's trials ask their own count"
bench = { use_gpu = [true], mpi_np = [8], gpu_count = [1, 2], omp_threads = [1] }
bench_gres = ["gpu:1", "gpu:2"]

[[case]]
name = "a benchmark's GPU ask bounds its trials, as its rank ask does: a declared cell past it is left out by name (generator.md 4.1, 4.3a)"
bench = { use_gpu = [true], mpi_np = [8], gpu_count = [1, 2], omp_threads = [1] }
prep = ["--gpus", "1"]
said = ["2 GPUs is over this prep's --gpus (1 GPU)"]
bench_gres = ["gpu:1"]

[[case]]
name = "...and a cell the machine proposed past it, the same way -- the prep is not refused over a cell nobody declared"
bench = { use_gpu = [true], mpi_np = [8], omp_threads = [1] }
prep = ["--gpus", "2"]
said = ["4 GPUs is over this prep's --gpus (2 GPUs)"]
bench_gres = ["gpu:1", "gpu:2"]

[[case]]
name = "...and a trial on the CPU asks no GPU, whatever the benchmark was allowed"
bench = { use_gpu = [false], mpi_np = [8], omp_threads = [1] }
prep = ["--gpus", "1"]
bench_header_lacks = ["--gres"]

[[case]]
name = "the binding turned off reaches the benchmark's trials too"
allocation = { gpu_binding = false }
bench = { use_gpu = [true], mpi_np = [8], gpu_count = [2], omp_threads = [1] }
bench_gres = ["gpu:2"]
bench_header_lacks = ["enforce-binding"]

# A BENCHMARK NAMED ON A QUEUE WITH NO GPUs, on a record whose other queue
# has them: its GPU cells are enumerated for the record's GPUs and each is fit
# on that queue -- a declared one kept, a proposed one left out by that
# queue's numbers, its CPU cells kept: a cell that fits is never denied by a
# sibling that does not (`generator.md` § 4.3a).
[[case]]
name = "a benchmark named on a queue with no GPUs keeps its declared GPU cells, each cell's fit saying so (scheduler.md R6)"
allocation = { domain = "cpu" }
bench = { use_gpu = [true], mpi_np = [8], gpu_count = [1], omp_threads = [1] }
said = ["1 kept on cpu", "8 cores · 1 GPU fits no node of cpu -- 1 GPU is over cpu's most GPUs on a node (0 GPUs); its record lists no GPUs"]
bench_gres = ["gpu:1"]

[[case]]
name = "...and prepared to run where it is launched (--no-sbatch), a declared GPU cell is fit on the target's probed node, which records none: kept, its fit naming it"
prep = ["--no-sbatch"]
bench = { use_gpu = [true], mpi_np = [2], gpu_count = [1], omp_threads = [1] }
said = ["1 kept", "1 GPU is over the target's probed node's GPUs (0 GPUs)"]
# ...and it is the node it is fit on, never the queue the description names.
said_lacks = ["kept on"]

[[case]]
name = "...and a GPU cell whose device count the machine proposed -- none declared -- is the machine's proposal: left out there by that queue's numbers, its declared CPU cell kept"
allocation = { domain = "cpu" }
bench = { use_gpu = [true, false], mpi_np = [8], omp_threads = [1] }
said = ["1 kept on cpu", "left out (3)", "1 GPU is over cpu's most GPUs on a node (0 GPUs); its record lists no GPUs"]
bench_header_lacks = ["--gres"]

[[case]]
name = "...and declared device counts in a grid whose ranks the machine proposed: no node holds 8 GPUs, so nothing is proposed, and the refusal says how to keep them -- declare the cells whole"
bench = { use_gpu = [true], gpu_count = [8] }
refused = ["8 GPUs is over gpu's most GPUs on a node (4 GPUs)", "no GPU cell is left", "or declare the cells whole"]

[[case]]
name = "...and a cell the machine proposed there is left out by that queue's numbers, its CPU cells kept"
allocation = { domain = "cpu" }
bench = { use_gpu = [true, false] }
said = ["left out (", "1 GPU is over cpu's most GPUs on a node (0 GPUs); its record lists no GPUs"]
bench_header_lacks = ["--gres"]

[[case]]
name = "a benchmark on GPUs where no queue lists any is refused"
queues = [{ name = "cpu", partition = "cpu", qos = "public", max_time = "1-00:00:00", max_cores = 128 }]
allocation = { domain = "cpu" }
bench = { use_gpu = [true], mpi_np = [8], omp_threads = [1] }
refused = "no queue with recorded GPUs"
