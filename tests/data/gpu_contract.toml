# THE GPU CONTRACT, CASE BY CASE -- `docs/execution/gpu.md` § 1.
#
# Each case is what a person (or a probe) writes, and what molbuilder must
# answer.  `tests/test_gpu_contract.py` runs every case down the road a
# person runs, through the one runner every contract table shares
# (`tests/support/road.py`, `run_road_case`, whose header names each key).
#
# A RULE CHANGES, ITS ROWS CHANGE.  A case is a row here, never a function.

# EVERY LAUNCH VALUE IS STATED (`architecture.md` § 5.2): each case's run
# card is this, under its own `run`, and on a machine with a scheduler its
# `allocation` is this, under its own -- so a case states only what it is
# about, and takes away (`run_unset`, `allocation_unset`) what it refuses.
[run_base.siesta]
mpi_np = 2
omp_threads = 1

[run_base.pyscf]
threads = 1

[allocation_base]
domain = "gpu"
time = "01:00:00"
mem = "8G"

# What every SIESTA case's template carries, under the case's own
# `template`: the ELPA solver, because a SIESTA GPU run needs one -- GPU with
# ScaLAPACK is refused where the deck is written (`gpu.md` G3, G6).  A CPU
# case therefore runs CPU-ELPA, and its deck says `.false.` out loud.
[siesta_template]
diag_algorithm = "ELPA-1STAGE"

# The menu every case gets unless it says otherwise: shaped like ASU Sol --
# a CPU queue, and a queue of 128-core nodes beside 48-core nodes with four
# GPUs each.
[[queues]]
name = "cpu"
partition = "cpu"
qos = "public"
max_time = "1-00:00:00"
max_cores = 128
node_types = [{ cores = 128, nodes = 10 }]

[[queues]]
name = "gpu"
partition = "gpu"
qos = "public"
max_time = "1-00:00:00"
max_cores = 128
gpu = { a100 = 4 }
node_types = [{ cores = 128, nodes = 10 },
              { cores = 48, nodes = 5, gpu = { a100 = 4 } }]

# ===================================================================== #
#  1 · ALLOWED OR REFUSED                                               #
# ===================================================================== #

[[case]]
name = "a GPU run that states no count is refused at prep"
run = { use_gpu = true }
refused = "states no GPU count"

[[case]]
name = "the template's use_gpu with nothing on the card is refused too"
template = { use_gpu = true }
refused = "states no GPU count"

[[case]]
name = "a card in --gpus is refused by the flag"
run = { use_gpu = true }
prep = ["--gpus", "a100:1"]
refused = "names no card"

[[case]]
name = "--gpus 0 is no count"
run = { use_gpu = true }
prep = ["--gpus", "0"]
refused = "--gpus:"

# (The `scheduler` block's refusal is `molbuilder_json.toml`'s row: the reader
#  refuses on the key, so its gpu sub-block is no second path -- 2026-10-02.)

[[case]]
name = "SIESTA on a GPU is refused when the target has no GPU build of it"
run = { use_gpu = true, gpu_count = 1 }
record = { conda_envs = ["molbuilder-siesta"] }
refused = "env is not installed"

[[case]]
name = "a queue named for a GPU job must list GPUs"
run = { use_gpu = true, gpu_count = 1, mpi_np = 4 }
launch = ["--domain", "cpu"]
launch_refused = "its record lists no GPUs"

[[case]]
name = "one node must hold the GPUs asked for -- refused at prep, on the queue the run names"
run = { use_gpu = true, gpu_count = 8, mpi_np = 8 }
refused = "needs 8 GPUs but gpu allows 4 GPUs"

# A queue named nowhere reaches launch only for a benchmark, whose shelves'
# queue is named when they are sent (the unit 11 review, 2026-10-05).
[[case]]
name = "the queue list checks the job's own GPU count"
bench = { use_gpu = [true], gpu_count = [2], mpi_np = [2], omp_threads = [1] }
prep = ["--no-sbatch"]
allocation_unset = ["domain"]
launch = []
launch_refused = "no --domain"
listing = ["needs 2 GPUs but cpu allows 0 GPUs (its record lists no GPUs)"]

[[case]]
name = "a GPU job's cores fit the widest node that has GPUs"
run = { use_gpu = true, gpu_count = 1, mpi_np = 64 }
refused = "needs 64 cores but gpu allows 48 cores"

[[case]]
name = "a CPU job on the same queue keeps its 128-core nodes"
run = { use_gpu = false, mpi_np = 64 }
launch = ["--domain", "gpu"]
line = ["-n 64", "-p gpu"]
line_lacks = ["--gres"]

# ("a queue that marks GPUs without a count is not refused on the number"
# stood here: its queue marked GPUs by `gpu_partition` alone, a column
# removed 2026-10-02 -- `scheduler.md` § 4.)

[[case]]
name = "a record silent about which nodes hold the GPUs keeps its whole ceiling"
queues = [{ name = "old", partition = "old", qos = "public", max_time = "1-00:00:00", max_cores = 48, gpu = { a100 = 4 } }]
allocation = { domain = "old" }
run = { use_gpu = true, gpu_count = 2, mpi_np = 4096 }
refused = "needs 4096 cores but old allows 48 cores"

[[case]]
name = "a hand-written GPU row is read like a probed one"
queues = [{ name = "gpu", partition = "gpu", qos = "public", max_time = "1-00:00:00", gpu = { type = "a100", per_node = 4 } }]
run = { use_gpu = true, gpu_count = 4, mpi_np = 4 }
launch = ["--domain", "gpu"]
line = ["--gres=gpu:4"]

[[case]]
name = "...and refuses past its count like a probed one"
queues = [{ name = "gpu", partition = "gpu", qos = "public", max_time = "1-00:00:00", gpu = { type = "a100", per_node = 4 } }]
run = { use_gpu = true, gpu_count = 5, mpi_np = 5 }
refused = "needs 5 GPUs but gpu allows 4 GPUs"

[[case]]
name = "a node list that names no GPUs keeps its widest node for a GPU job"
queues = [{ name = "site", partition = "p", qos = "public", max_time = "1-00:00:00", gpu = { type = "a100", per_node = 4 }, node_types = [{ cores = 96, nodes = 2 }] }]
allocation = { domain = "site" }
run = { use_gpu = true, gpu_count = 1, mpi_np = 97 }
refused = "needs 97 cores but site allows 96 cores"

[[case]]
name = "a queue listing several cards holds the most any node holds"
queues = [{ name = "public", partition = "public", qos = "public", max_time = "1-00:00:00", gpu = { a100 = 4, "a100.20gb" = 16 }, node_types = [{ cores = 48, nodes = 50, gpu = { a100 = 4 } }, { cores = 48, nodes = 2, gpu = { "a100.20gb" = 16 } }] }]
allocation = { domain = "public" }
run = { use_gpu = true, gpu_count = 16, mpi_np = 16 }
launch = ["--domain", "public"]
line = ["--gres=gpu:16"]

# ===================================================================== #
#  2 · WHAT IS PRODUCED                                                 #
# ===================================================================== #

[[case]]
name = "a GPU run asks a count on the GPU partition, bound, and its deck says GPU"
run = { use_gpu = true, gpu_count = 2, mpi_np = 8 }
header = ["#SBATCH -n 8", "#SBATCH -p gpu", "#SBATCH --gres=gpu:2",
          "#SBATCH --gres-flags=enforce-binding"]
header_lacks = ["a100"]
deck = ["Diag.ELPA.GPU .true."]
run_sh = ["molbuilder-siesta-gpu", "socket co-location"]
launch = ["--domain", "gpu"]
line = ["-n 8", "-p gpu", "--gres=gpu:2", "--gres-flags=enforce-binding"]

[[case]]
name = "the binding turned off leaves both renderings"
allocation = { gpu_binding = false }
run = { use_gpu = true, gpu_count = 2, mpi_np = 8 }
header = ["#SBATCH --gres=gpu:2"]
header_lacks = ["enforce-binding"]
launch = ["--domain", "gpu"]
line = ["--gres=gpu:2"]
line_lacks = ["enforce-binding"]

[[case]]
name = "a PySCF run states its count like SIESTA's, on one process"
engine = "pyscf"
run = { use_gpu = true, gpu_count = 2, threads = 4 }
header = ["#SBATCH -n 1", "#SBATCH -c 4", "#SBATCH -p gpu",
          "#SBATCH --gres=gpu:2"]
deck = ["mf = _mb_to_gpu(mf) if _USING_GPU else mf"]

[[case]]
name = "use_gpu in the template and the count on the card"
template = { use_gpu = true }
run = { gpu_count = 2, mpi_np = 4 }
header = ["#SBATCH --gres=gpu:2"]

[[case]]
name = "a GPU run states its rank count -- one per GPU is not assumed"
run = { use_gpu = true, gpu_count = 2 }
run_unset = ["mpi_np"]
refused = "ranks (mpi_np)"

[[case]]
name = "a --gpus flag beats the card"
run = { use_gpu = true, gpu_count = 1 }
prep = ["--gpus", "3"]
header = ["#SBATCH --gres=gpu:3"]

[[case]]
name = "SLURM's own untyped spelling is a count too"
run = { use_gpu = true }
prep = ["--gpus", "gpu:2"]
header = ["#SBATCH --gres=gpu:2"]

[[case]]
name = "a CPU run asks for no GPU anywhere"
run = { use_gpu = false, mpi_np = 4 }
header = ["#SBATCH -n 4"]
header_lacks = ["--gres"]
deck = ["Diag.ELPA.GPU .false."]
run_sh_lacks = ["molbuilder-siesta-gpu", "socket co-location"]

[[case]]
name = "a count for a run that does not use the GPU is refused at prep, before anything is written"
run = { gpu_count = 2, mpi_np = 4 }
refused = "asks for 2 GPU(s) and does not use the GPU"
made_lacks = ["01_coarse"]

[[case]]
name = "--gpus on a run that does not use the GPU is refused the same"
run = { use_gpu = false, mpi_np = 4 }
prep = ["--gpus", "2"]
refused = "asks for 2 GPU(s) and does not use the GPU"

[[case]]
name = "a PySCF run is asked the same"
engine = "pyscf"
run = { gpu_count = 1, threads = 2 }
refused = "asks for 1 GPU(s) and does not use the GPU"

[[case]]
name = "a GPU run binds its ranks to cores and to its GPU's socket, and says so"
run = { use_gpu = true, gpu_count = 1, mpi_np = 4 }
run_sh = ['_mpirun_bind="--bind-to core --map-by package:PE=$_omp_threads"',
          '_launch_cmd="$_numa_wrap_gpu mpirun -np $_mpi_np $_mpirun_bind $_siesta_target"',
          "MOLBUILDER_GPU_NUMA",
          "GPU resources : GPU mode (ELPA-CUDA, no NCCL) -- chosen $_mpi_np ranks × $_omp_threads threads",
          "(or measure it: prep bench, for this stage)"]
run_sh_lacks = ["ppr:", "nvidia-smi topo -m", "MOLBUILDER_MPI_NP",
                "envs advise", "_mb_gpu_val"]

[[case]]
name = "a CPU run carries no GPU placement"
run = { use_gpu = false }
run_sh = ['_numa_wrap_gpu="${_numa_wrap_gpu:-}"', '_mpirun_bind=""']
run_sh_lacks = ["_have_mps=", "MOLBUILDER_GPU_NUMA"]

[[case]]
name = "a CPU run on ScaLAPACK runs the packaged build"
template = { diag_algorithm = "ScaLAPACK" }
run = { use_gpu = false }
run_sh = ["molbuilder-siesta"]
run_sh_lacks = ["molbuilder-siesta-gpu"]

[[case]]
name = "--env names the env a job activates, over the GPU route"
run = { use_gpu = true, gpu_count = 1 }
prep = ["--env", "molbuilder-siesta"]
run_sh = ["molbuilder-siesta"]
run_sh_lacks = ["molbuilder-siesta-gpu"]

[[case]]
name = "a prep for another machine reads that machine's record"
machine = "named"
run = { use_gpu = true, gpu_count = 1 }
header = ["#SBATCH -p gpu", "#SBATCH --gres=gpu:1"]

[[case]]
name = "a benchmark's trials ask their own count"
bench = { use_gpu = [true], mpi_np = [8], gpu_count = [1, 2], omp_threads = [1] }
bench_gres = ["gpu:1", "gpu:2"]

[[case]]
name = "a benchmark's GPU ask bounds its trials, as its rank ask does: a declared cell past it is crossed out by name (generator.md 4.1, 4.3a)"
bench = { use_gpu = [true], mpi_np = [8], gpu_count = [1, 2], omp_threads = [1] }
prep = ["--gpus", "1"]
said = ["needs 2 GPUs but this prep's ask allows 1 GPUs"]
bench_gres = ["gpu:1"]

[[case]]
name = "...and a cell the machine proposed past it, the same way -- the prep is not refused over a cell nobody declared"
bench = { use_gpu = [true], mpi_np = [8], omp_threads = [1] }
prep = ["--gpus", "2"]
said = ["needs 4 GPUs but this prep's ask allows 2 GPUs"]
bench_gres = ["gpu:1", "gpu:2"]

[[case]]
name = "...and a trial on the CPU asks no GPU, whatever the benchmark was allowed"
bench = { use_gpu = [false], mpi_np = [8], omp_threads = [1] }
prep = ["--gpus", "1"]
bench_header_lacks = ["--gres"]

[[case]]
name = "the binding turned off reaches the benchmark's trials too"
allocation = { gpu_binding = false }
bench = { use_gpu = [true], mpi_np = [8], gpu_count = [2], omp_threads = [1] }
bench_gres = ["gpu:2"]
bench_header_lacks = ["enforce-binding"]
launch = ["--gpu-domain", "gpu"]
line = ["--gres=gpu:2"]
line_lacks = ["enforce-binding"]

[[case]]
name = "a benchmark on GPUs where no queue lists any is refused"
queues = [{ name = "cpu", partition = "cpu", qos = "public", max_time = "1-00:00:00", max_cores = 128 }]
allocation = { domain = "cpu" }
bench = { use_gpu = [true], mpi_np = [8], omp_threads = [1] }
refused = "no queue with recorded GPUs"

[[case]]
name = "a benchmark on GPUs on a machine with none at all is refused"
machine = "workstation"
bench = { use_gpu = [true], mpi_np = [4], omp_threads = [1] }
refused = "states no GPU"

# ===================================================================== #
#  3 · WHAT THE RUN SCRIPT DOES HERE                                    #
# ===================================================================== #

[[case]]
name = "the ranks are spread over the GPUs the machine gives"
machine = "workstation"
run = { use_gpu = true, gpu_count = 2, mpi_np = 4 }
given_gpus = "0,1"
runs = ["4 ranks over 2 GPU(s) = 2 rank(s)/GPU"]

[[case]]
name = "...whatever was asked: it counts what it is given"
machine = "workstation"
run = { use_gpu = true, gpu_count = 2, mpi_np = 4 }
given_gpus = "0"
runs = ["4 ranks over 1 GPU(s) = 4 rank(s)/GPU"]

[[case]]
name = "the MPS switch starts the daemon and leaves the stated rank count"
machine = "workstation"
run = { use_gpu = true, gpu_count = 1, mpi_np = 4 }
given_gpus = "0"
run_args = ["--mps"]
runs = ["4 ranks over 1 GPU(s) = 4 rank(s)/GPU"]
