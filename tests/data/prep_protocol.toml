# THE PREP PROTOCOL -- `docs/execution/job-system.md` § 5.0.
#
# A prepped stage is not prepped again: a redo is a rollback -- the state
# saved before its prep, restored -- and a prep anew (user, 2026-10-02:
# "refuse it, redo via rollback").  Before prep writes, it saves the folder's
# state -- always, the note led by the time it was taken -- and says so
# (`checkpointing.md` § 9; user, 2026-10-03).  Every check and every decision
# is made before anything is written, so a refused prep writes nothing but its
# line in the ledger and there is nothing to put back: the stage is not
# counted prepped, the calculation is not set to the machine, the prep is not
# recorded as prepped (rule 3).
#
# `tests/test_prep_protocol.py` runs every case down the road a person runs,
# through the one runner every contract table shares (`tests/support/road.py`,
# `run_road_case`, whose header names each key).
#
# A RULE CHANGES, ITS ROWS CHANGE.  A case is a row here, never a function.

[run_base.siesta]
mpi_np = 2
omp_threads = 1

[allocation_base]
domain = "cpu"
time = "01:00:00"
mem = "8G"

[[queues]]
name = "cpu"
partition = "cpu"
qos = "public"
max_time = "1-00:00:00"
max_cores = 64
node_types = [{ cores = 64, nodes = 10 }]

[[queues]]
name = "gpu"
partition = "gpu"
qos = "public"
max_time = "1-00:00:00"
max_cores = 128
gpu = { a100 = 4 }
node_types = [{ cores = 48, nodes = 5, gpu = { a100 = 4 } }]

# ===================================================================== #
#  A PREPPED STAGE IS NOT PREPPED AGAIN                                 #
# ===================================================================== #

[[case]]
name = "a prepped stage is not prepped again -- the refusal names the way back, a rollback"
before = [["prep", "run", "coarse"]]
refused = ["stage 'coarse' is already prepped", "a prepped stage is not prepped again", "molbuilder checkpoint list"]

[[case]]
name = "a later prep leaves an earlier stage's files as that stage's own prep wrote them -- its deck, its run script, its monitor"
before = [["prep", "run", "coarse"]]
stage = "medium"
prep = ["--cold"]
kept = ["01_coarse/H2_01_coarse.fdf", "01_coarse/H2_01_coarse.run.sh", "01_coarse/mb_monitor.pyz"]

[[case]]
name = "...in the flat shape too, where the earlier stage's run script is the run folder's own, which ran"
shape = "flat"
machine = "workstation"
stand_in = { leaves_restart = true }
before = [["prep", "run", "coarse"],
          ["launch", "run", "coarse", "--mode", "direct", "--yes"]]
stage = "medium"
kept = ["H2_01_coarse.fdf", "H2_01_coarse.run.sh"]

[[case]]
name = "...a prepped benchmark too"
bench = { mpi_np = [2] }
before = [["prep", "bench", "coarse"]]
refused = ["the benchmark of stage 'coarse' is already prepped", "molbuilder checkpoint list"]

[[case]]
name = "a first prep refused at its last step writes nothing -- no stage folder, no data files, no copy of the machine's record, no plan, no log; not counted prepped, not recorded as prepped, its shape still free: the build installed and the machine re-probed, as the refusal says, the prep is taken"
template = { diag_algorithm = "ELPA-1STAGE" }
run = { use_gpu = true, gpu_count = 1 }
allocation = { domain = "gpu" }
record = { conda_envs = ["molbuilder-siesta"] }
refused = ["env is not installed", "re-probe that machine"]
made_lacks = ["01_coarse", "pseudos", "environment.json", "job-set.json",
              "STAGE-PLAN.md", "H2_01_coarse.siesta.hierarchical.pipeline.log"]
status_says = ["First incomplete stage: coarse, not prepped yet"]
ledger_lacks = ["prepped"]
saved = { shape = "flat" }
reprobed = { conda_envs = ["molbuilder-siesta", "molbuilder-siesta-gpu"] }

# ===================================================================== #
#  A DISABLED STAGE IS NEVER USED                                       #
#  (`engines/stages.md` § 6.2; user, 2026-10-03, Q1: "mark the dir as   #
#  disabled and never allow use")                                       #
# ===================================================================== #

[[case]]
name = "a stage the description disables is refused at prep, saying how to enable it"
stage = "tight"
refused = ["stage 'tight' is disabled in this description", "\"enabled\": true"]

[[case]]
name = "...one disabled after its prep is never continued from -- and status shows its folder disabled"
before = [["prep", "run", "coarse"]]
disabled = ["coarse"]
stage = "medium"
prep = ["--from", "01_coarse/run-0"]
refused = ["--from '01_coarse/run-0': stage 'coarse' is disabled"]
status_says = ["disabled in the description -- its folder is kept as it is and never used"]

[[case]]
name = "...nor launched"
before = [["prep", "run", "coarse"]]
disabled = ["coarse"]
stage = "medium"
prep = ["--cold"]
launch = []
launch_stage = "coarse"
launch_refused = ["stage 'coarse' is disabled in this description"]

# ===================================================================== #
#  LAUNCH ACTS ON A PREPPED STAGE                                       #
# ===================================================================== #

[[case]]
name = "a stage described and not prepped is refused at launch by name, with its prep and its launch -- as status says"
launch = []
launch_stage = "medium"
launch_refused = ["stage 'medium' is not prepped yet", "molbuilder jobset prep run medium"]

# ===================================================================== #
#  A CALCULATION THAT HAS PRODUCED KEEPS ITS SHAPE                      #
#  (`web/task-setup.md` § 4; § 5.0's "changing it later")               #
# ===================================================================== #

[[case]]
name = "a calculation with a prepped stage keeps its shape -- Task setup's Save refuses another, naming the way back"
saved = { shape = "flat" }
save_refused = ["shape is fixed once it has produced", "coarse is prepped", "molbuilder checkpoint list"]

[[case]]
name = "...a prepped benchmark is a prep too"
bench = { mpi_np = [2] }
saved = { shape = "flat" }
save_refused = ["shape is fixed once it has produced", "coarse is prepped"]

# ===================================================================== #
#  THE SAVE, BEFORE PREP WRITES -- ALWAYS, AND SAID                     #
#  (`checkpointing.md` § 9; user, 2026-10-03: "always save through      #
#  checkpoint, notify user, ... name of the checkpoint clearly shows   #
#  timestamp")                                                          #
# ===================================================================== #

[[case]]
name = "before it writes, prep saves the folder's state -- its first, when it has none -- the note led by the time it was taken, and says so"
said = ["the folder's state was saved first:", "before prep run coarse"]
saved_states = ["{stamp} · before prep run coarse"]

[[case]]
name = "...a new state when the folder changed since the one it stands at"
before = [["prep", "run", "medium", "--cold"]]
said = ["the folder's state was saved first:"]
saved_states = ["{stamp} · before prep run coarse", "{stamp} · before prep run medium"]

[[case]]
name = "...and none when nothing changed: the state it stands at is named"
saved_first = true
said = ["the folder's state was already saved:", "set up", "nothing changed since"]
saved_states = ["set up"]

# ===================================================================== #
#  A STAGE'S NUMBER IS ITS FILES' -- `project-layout.md` § 4.2 (W38 F4) #
# ===================================================================== #
#
# One door answers it (`materialize.stage_home`): a stage that has files
# keeps the number they carry; one that has none takes its place in the
# description when no folder holds that number, else the next after every
# one in use.  It was the place in the description everywhere until
# 2026-10-03, so a stage removed after its prep renumbered every stage
# after it.

[[case]]
name = "a stage removed after its prep leaves every later number as it was -- #2 is still the folder 02_medium"
before = [["prep", "run", "coarse", "--cold"], ["prep", "run", "medium", "--cold"]]
removed = ["coarse"]
stage = "#2"
refused = ["stage 'medium' is already prepped (02_medium/)"]

[[case]]
name = "a stage added after production takes the next number -- the stage with files keeps its own"
before = [["prep", "run", "coarse", "--cold"]]
added = [{ name = "extra", at = 0 }]
stage = "extra"
prep = ["--cold"]
made = ["01_coarse/run-0", "02_extra/run-0"]
made_lacks = ["01_extra"]

# ===================================================================== #
#  THE STAGE NAMED IS THE STAGE WRITTEN, FROM THE DESCRIPTION           #
#  (§ 5.0 checkpoints 4 and 4b: the stage resolves once -- the          #
#  description, its template and the run card read once -- and every    #
#  deck and run script is written from that answer)                     #
# ===================================================================== #

[[case]]
name = "the stage named is the stage written -- its own values, its token, its header line"
deck = ["MD.TypeOfRun CG", "MD.MaxForceTol 0.05", "# Stage 01_coarse --"]

[[case]]
name = "...a later stage its own"
stage = "medium"
prep = ["--cold"]
deck = ["MD.TypeOfRun Broyden", "MD.MaxForceTol 0.04", "# Stage 02_medium --"]

[[case]]
name = "a stage the ladder does not hold is refused by name"
stage = "nonesuch"
refused = ["nonesuch"]
made_lacks = ["job-set.json"]

[[case]]
name = "a template value no stage varies reaches the deck"
template = { mesh_cutoff = 275.0 }
deck = ["MeshCutoff 275.0"]

[[case]]
name = "the template's retry budget reaches the run script"
template = { continue_retries = 4 }
run_sh = ["_siesta_retry_max=4"]

[[case]]
name = "...the run card's beats it"
template = { continue_retries = 4 }
run = { continue_retries = 2 }
run_sh = ["_siesta_retry_max=2"]

[[case]]
name = "...and no budget writes no retry loop"
template = { continue_retries = 0 }
run_sh_lacks = ["_siesta_retry_max="]

[[case]]
name = "the description's reporting policy reaches the run script -- when, how often, and where, by name"
notify = { on_scf_converged = true, every_hours = 4, channels = ["slack", "lab"] }
run_sh = ["--notify-on-scf", "--notify-every-hours 4", '--notify-channels "slack,lab"']

[[case]]
name = "...an empty channel list survives -- report to none, never to every channel"
notify = { on_scf_converged = true, channels = [] }
run_sh = ['--notify-channels ""']

[[case]]
name = "...and a description without one leaves the run script without one"
run_sh_lacks = ["--notify-"]
