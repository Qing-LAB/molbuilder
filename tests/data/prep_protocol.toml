name = "...and with neither, a value to vary is not a grid: nothing is made up for it"
bench = { diag_algorithm = ["ELPA-1STAGE", "ELPA-2STAGE"] }
refused = ['does not state "MPI ranks (np)" (mpi_np) and "OMP threads per rank" (omp_threads)']

# ===================================================================== #
#  A GROUP: STAGES THAT SHARE ONE JOB -- `engines/stages.md` § 2        #
# ===================================================================== #

[[case]]
name = "a description whose group holds a stage and the one it builds on is refused at prep, naming both and why, before anything is written"
groups = [1, 1]
refused = ["`medium` is in group 1 with `coarse`, which it builds on", "Give `medium` a new group"]
made_lacks = ["job-set.json", "01_coarse"]

[[case]]
name = "a group goes whole the first time -- a member launched alone before its group has run is refused, naming the group's launch"
groups = [1, 1]
stage_run = { medium = { restart = "clean" } }
stage = ["coarse", "medium"]
said = ["group 1 -- one job: coarse, medium, one after another (their walls summed, the largest memory); its header: launch/H2_group-01_coarse-02_medium.sbatch",
        "header: -J H2_group-01_coarse-02_medium  -N 1  -n 2  -c 1  -t 0-02:00:00  -p cpu  -q public  --mem=8G"]
# ...and not a member's own: its first launch is the group's one job.
said_lacks = ["header: -J H2_01_coarse", "header: -J H2_02_medium"]
made = ["launch/H2_group-01_coarse-02_medium.sbatch"]
launch = []
launch_stage = "medium"
launch_refused = ["`medium` was never launched, and its group 1 holds `coarse` too", "molbuilder jobset launch task --group 1"]

[[case]]
name = "a PySCF group's one job runs one process at a time -- its header, rendered for the members' shared request, asks one task, and its first launch is planned whole"
engine = "pyscf"
stage_strategy = "publishable"
groups = [1, 1]
stage_run = { medium = { restart = "clean" } }
stage = ["coarse", "medium"]
said = ["group 1 -- one job: coarse, medium, one after another (their walls summed, the largest memory); its header: launch/H2_group-01_coarse-02_medium.sbatch",
        "header: -J H2_group-01_coarse-02_medium  -N 1  -n 1"]
made = ["launch/H2_group-01_coarse-02_medium.sbatch"]
launch = []
launch_stage = ["coarse", "medium"]
listing = ["launch/H2_group-01_coarse-02_medium.sbatch"]

[[case]]
name = "...and its first launch, named by its group, is planned whole -- each member still what the description gives, the members on its rows the group's to check -- and sends the group's one header"
groups = [1, 1]
stage_run = { medium = { restart = "clean" } }
stage = ["coarse", "medium"]
launch = []
launch_stage = ["coarse", "medium"]
listing = ["launch/H2_group-01_coarse-02_medium.sbatch"]

[[case]]
name = "groups are matched by their members -- a prepared job whose members are now two groups is formed again in one prep, naming only one of them refused"
groups = [1, 1]
stage_run = { medium = { restart = "clean" } }
before = [["prep", "task", "--group", "1"]]
regrouped = [1, 2]
stage = "coarse"
refused = ["group 2 holds stages prepared in one job with the groups picked", "molbuilder jobset prep task --group 1 --group 2"]

[[case]]
name = "...and naming both forms each again, each its own job"
groups = [1, 1]
stage_run = { medium = { restart = "clean" } }
before = [["prep", "task", "--group", "1"]]
regrouped = [1, 2]
stage = ["coarse", "medium"]
said = ["prepared coarse: 01_coarse/run-0  (reused -- not launched yet)", "prepared medium: 02_medium/run-0  (reused -- not launched yet)"]
made_lacks = ["launch/H2_group-01_coarse-02_medium.sbatch"]

[[case]]
name = "...and a prepared job's member put in one group with a stage not prepared is formed again the same way: prep naming its group alone is refused, and status names the one prep that takes, every group it forms"
groups = [1, 1]
stage_run = { medium = { restart = "clean" } }
before = [["prep", "task", "--group", "1"]]
added = [{ name = "fine", overrides = { restart = "clean" } }]
regrouped = [1, 2, 2]
stage = "medium"
refused = ["group 1 holds stages prepared in one job with the groups picked", "molbuilder jobset prep task --group 1 --group 2"]
status_says = ["prepared, its members changed", "molbuilder jobset prep task --group 1 --group 2"]
status_lacks = ["molbuilder jobset prep task --group 2 --bundle"]

[[case]]
name = "...and a member the description no longer holds is among them: the old header, named by its members' own files, is removed"
groups = [1, 1]
stage_run = { medium = { restart = "clean" } }
before = [["prep", "task", "--group", "1"]]
removed = ["coarse"]
stage = "medium"
made_lacks = ["launch/H2_group-01_coarse-02_medium.sbatch"]

[[case]]
name = "a group's one job is placed at prep -- its members' walls summed, its fit said when the queue it names allows less (scheduler.md R6)"
groups = [1, 1]
stage_run = { coarse = { time = "23:30:00" }, medium = { restart = "clean" } }
stage = ["coarse", "medium"]
said = ["-t 1-00:30:00  -p cpu  -q public",
        "24h30m is over cpu's wall (1-00:00:00)"]
# ...and a member's own fit is not said: the group's one job is what is sent.
said_lacks = ["· 23h30m fits"]
made = ["launch/H2_group-01_coarse-02_medium.sbatch"]

# ===================================================================== #
#  THE TASK'S QUESTION -- `job-system.md`, *The task*                   #
# ===================================================================== #

[[case]]
name = "a prep naming no group shows the groups and, with nobody to ask, is refused naming the line that picks them -- writing nothing"
stage = ""
refused = ["the task's groups:", "group 1", "coarse", "nobody to ask which groups to prepare", "prep task --group 1 --group 2"]
made_lacks = ["job-set.json", "01_coarse"]

# ===================================================================== #
#  A LAUNCHED STAGE AND ITS JOB REQUEST                                  #
#  (`execution/job-request.md` § 5; user, 2026-10-21)                   #
# ===================================================================== #

[[case]]
name = "a launched group is prepared again for its job request -- its runs kept, no run opened, each deck the same calculation as the one its run ran"
before = [["prep", "task", "--group", "1"]]
launched = ["coarse"]
changed = { execution = { mpi_np = 4, omp_threads = 1 } }
kept = ["01_coarse/run-0/H2_01_coarse.fdf", "01_coarse/run-0/run.json"]
# ...and no progress log left beside the stage's deck, which no run writes:
# a log with no closing line reads as a run still going.
made_lacks = ["01_coarse/run-1", "01_coarse/H2_01_coarse.molwatch.log"]
said = ["prepared coarse again: launched -- its runs are kept", "mpi_np 4",
        "at its next launch: launched again, it continues from its own latest run, or `--cold` starts it over"]

[[case]]
name = "...and a change to what it computes is refused at Save -- naming the stage, what differs and the way back, nothing saved or written (task-setup.md 8; the user, 2026-10-27)"
before = [["prep", "task", "--group", "1"]]
launched = ["coarse"]
changed = { overrides = { coarse = { mesh_cutoff = 400.0 } } }
change_refused = ["`coarse` has run", "mesh_cutoff", "start group 1 (coarse) from the beginning"]

[[case]]
name = "...and its way back starts the group from the beginning: the folder saved as it stands, the state saved before its first launch restored by its id, its prep (the user, 2026-10-25)"
before = [["prep", "task", "--group", "1"]]
first_launch_refused = true
launched = ["coarse"]
changed = { overrides = { coarse = { mesh_cutoff = 400.0 } } }
change_refused = ["start group 1 (coarse) from the beginning", "molbuilder checkpoint save -p", "molbuilder jobset prep task --group 1"]
restores_state = "before launch task group 1 (coarse)"

[[case]]
name = "...and a launched member given another group is refused at Save, naming it and the way back -- the group's members are fixed (task-setup.md 5)"
groups = [1, 1]
stage_run = { medium = { restart = "clean" } }
before = [["prep", "task", "--group", "1"]]
launched = ["coarse", "medium"]
regrouped = [1, 2]
regroup_refused = ["`coarse` was launched in one job with `medium`, and group 1 now holds `coarse` without it", "put `medium` back beside `coarse` in one group"]

[[case]]
name = "...and a stage that has run is not taken out of the description: Save refuses it, naming the stage and the way back (task-setup.md 8, 9)"
groups = [1, 1]
stage_run = { medium = { restart = "clean" } }
before = [["prep", "task", "--group", "1"]]
launched = ["coarse", "medium"]
removed = ["medium"]
change_refused = ["`medium` has run", "taken out of the description", "start group 1 (coarse, medium) from the beginning"]

[[case]]
name = "...and `prep task` naming no group, on a calculation whose every group has run and is unchanged, offers none and says how to see where each stands"
groups = [1, 1]
stage_run = { medium = { restart = "clean" } }
before = [["prep", "task", "--group", "1"]]
launched = ["coarse", "medium"]
stage = ""
refused = ["it offers no group", "molbuilder jobset status"]

# ONE ANSWER, TWO DOORS (`job-system.md`, *What prep answers*): what a person
# reads is composed once, the terminal printing the lines the page draws.  THE
# SILENT FAILURE: a door keeping wording of its own -- the page's resources line
# never said a memory cap, and it said "takes nothing" of a benchmark.
[[case]]
name = "both doors say one stage's answer in the same lines, and its preview says them as what it would do -- no state saved, no log written, the header shown line for line beside it"
run = { max_memory_mb = 2048 }
both_doors = true
said = ["memory cap 2048 MB"]
preview_said = ["would prepare coarse: 01_coarse/run-0", "would bring in: ", "takes nothing from another run", "memory cap 2048 MB"]
preview_lacks = ["the folder's state was saved first", "pipeline log:", "prepared coarse:", "brought in: H2"]

[[case]]
name = "both doors say a group's answer in the same lines, what the prep did once standing above its stages -- the state saved, its config -- and its one job after its last member"
groups = [1, 1]
stage_run = { medium = { restart = "clean" } }
stage = ["coarse", "medium"]
both_doors = true
said_once = ["the folder's state was saved first:", "config:", "group 1 -- one job:", "held fixed"]
said = ["header: -J H2_group-01_coarse-02_medium"]
preview_said = ["would prepare coarse: 01_coarse/run-0", "would prepare medium: 02_medium/run-0", "group 1 -- one job: coarse, medium"]
# ...its header's lines shown line for line beside a preview, never again in one.
preview_lacks = ["header: -J"]
preview_group_header = ["#SBATCH -J H2_group-01_coarse-02_medium"]
page_found_once = ["held fixed"]

[[case]]
name = "both doors say a benchmark's answer in the same lines -- its grid, its trials, its shelves -- and nothing of a stage's first launch, which a trial has none of"
bench = { mpi_np = [1, 2], omp_threads = [1] }
both_doors = true
said = ["bench grid: 2 combination(s) enumerated"]
said_lacks = ["takes nothing from another run"]
preview_said = ["bench grid: 2 combination(s) enumerated", "would prepare 2 trial dir(s) for stage 'coarse'"]
preview_lacks = ["takes nothing from another run", "pipeline log:", "prepared 2 trial dir(s)"]

[[case]]
name = "both doors name a run of points in the same words -- each point as a message names it, beside its folder -- and walk it as one job"
calculation = "vibration"
stage = "freq"
both_doors = true
said = ["prepared freq @ the relaxation: 01_freq/run-0/relax", "prepared freq @ the force constants: 01_freq/run-0/fc", "one job walking its 2 calls"]
preview_said = ["would prepare freq @ the relaxation: 01_freq/run-0/relax", "one job walking its 2 calls"]

[[case]]
name = "a pick that finds one group as planned and prepares another says each warning once -- and the finding of the one it prepares stays under it, not above as if both said it"
groups = [1, 2]
stage_run = { medium = { restart = "clean" } }
stage = ["coarse", "medium"]
before = [["prep", "task", "--group", "1"]]
both_doors = true
said = ["coarse (01_coarse): prepared, never launched, and already as this prep would prepare it now -- nothing to write (group 1)"]
said_once = ["held fixed"]
# ...the page told of the group left as it stands too, as the terminal is.
page_stage_found = { coarse = ["held fixed"], medium = ["held fixed"] }
