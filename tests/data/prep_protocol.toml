# THE PREP PROTOCOL -- `docs/execution/job-system.md` § 5.0.
#
# Prep prepares the groups picked (`--group N`), each one job; a group
# prepared and never launched is prepared again, whole (user, 2026-10-11); a
# launched stage is not -- its way back is the state saved before its
# group's first launch.  What a stage takes from another stage's run is its
# first launch's: launch refuses, before anything is sent, a stage whose
# upstream has not finished.  Before prep writes, it saves the folder's
# state -- always, the note led by the time it was taken -- and says so
# (`checkpointing.md` § 9; user, 2026-10-03).  Every check and every decision
# is made before anything is written, so a refused prep writes nothing but its
# line in the ledger and there is nothing to put back: the stage is not
# counted prepared, the calculation is not set to the machine, the prep is not
# recorded as prepared (rule 3).
#
# `tests/test_prep_protocol.py` runs every case down the road a person runs,
# through the one runner every contract table shares (`tests/support/road.py`,
# `run_road_case`, whose header names each key).
#
# A RULE CHANGES, ITS ROWS CHANGE.  A case is a row here, never a function.

[run_base.siesta]
mpi_np = 2
omp_threads = 1

[run_base.pyscf]
threads = 1

[allocation_base]
domain = "cpu"
time = "01:00:00"
mem = "8G"

[[queues]]
name = "cpu"
partition = "cpu"
qos = "public"
max_time = "1-00:00:00"
max_cores = 64
node_types = [{ cores = 64, nodes = 10 }]

[[queues]]
name = "gpu"
partition = "gpu"
qos = "public"
max_time = "1-00:00:00"
max_cores = 128
gpu = { a100 = 4 }
node_types = [{ cores = 48, nodes = 5, gpu = { a100 = 4 } }]

# ===================================================================== #
#  THE STRUCTURE IS THE ONE IT WAS DESCRIBED WITH                       #
#  (`model/structure-molstruct.md` § 3)                                 #
# ===================================================================== #

[[case]]
name = "a structure whose atom moved after it was described is refused at prep, in the read door's words -- its labels and cell were saved for other coordinates"
source_edited = { atom = 1, line = "H 5.000000 5.000000 5.900000" }
refused = ["the structure has changed since this calculation was described", "atoms or cell are not the ones its .molstruct.json was saved with"]

[[case]]
name = "a structure whose held atoms changed after it was described is refused at prep -- every stage of a calculation is of the one structure it was described with"
held_edited = [1]
refused = ["the structure has changed since this calculation was described", "structure fingerprint"]

# ===================================================================== #
#  A GROUP PREPARED AND NEVER LAUNCHED IS PREPARED AGAIN               #
# ===================================================================== #

[[case]]
name = "a group prepared and never launched is prepared again -- its first run reused, said"
before = [["prep", "task", "--group", "1"]]
said = ["prepared coarse: 01_coarse/run-0  (reused -- not launched yet)"]

[[case]]
name = "a later group's prep leaves an earlier stage's files as that stage's own prep wrote them -- its deck, its run script, its monitor"
before = [["prep", "task", "--group", "1"]]
stage = "medium"
kept = ["01_coarse/H2_01_coarse.fdf", "01_coarse/H2_01_coarse.run.sh", "01_coarse/mb_monitor.pyz"]

[[case]]
name = "every group is prepared before anything has run -- what a stage takes from the stage before it is its first launch's, said"
stage = ["coarse", "medium"]
made = ["01_coarse/run-0", "02_medium/run-0"]
said = ["at launch: takes", "from `coarse`'s newest run, which must have finished"]

[[case]]
name = "...each file it names by the rule its launch copies by -- the optimizer's history only between stages that run one optimizer: `medium` (Broyden) takes no `.CG` from `coarse` (CG)"
stage = ["coarse", "medium"]
said = ["at launch: takes H2.XV, H2.DM"]
said_lacks = ["H2.CG from `coarse`"]

[[case]]
name = "...a prepared benchmark too"
bench = { mpi_np = [2], omp_threads = [1] }
before = [["prep", "bench", "coarse"]]
refused = ["the benchmark of stage 'coarse' is already prepared", "molbuilder checkpoint list"]

[[case]]
name = "a first prep refused at its last step writes nothing -- no stage folder, no data files, no copy of the machine's record, no plan, no log; not counted prepared, not recorded as prepared, its shape still free: the build installed and the machine re-probed, as the refusal says, the prep is taken"
template = { diag_algorithm = "ELPA-1STAGE" }
run = { use_gpu = true, gpu_count = 1 }
allocation = { domain = "gpu" }
record = { conda_envs = ["molbuilder-siesta"] }
refused = ["env is not installed", "re-probe that machine"]
made_lacks = ["01_coarse", "pseudos", "environment.json", "job-set.json",
              "STAGE-PLAN.md", "H2_01_coarse.siesta.hierarchical.pipeline.log"]
status_says = ["group 1  coarse", "not prepared -- next:"]
ledger_lacks = ["prepared"]
saved = { shape = "flat" }
reprobed = { conda_envs = ["molbuilder-siesta", "molbuilder-siesta-gpu"] }

# ===================================================================== #
#  LAUNCH ACTS ON A PREPPED STAGE                                       #
# ===================================================================== #

[[case]]
name = "a stage described and not prepared is refused at launch by name, with its group's prep and launch -- as status says"
launch = []
launch_stage = "medium"
launch_refused = ["stage 'medium' is not prepared yet", "molbuilder jobset prep task --group 2"]

[[case]]
name = "a stage's first launch waits for the stage before it -- refused before anything is sent, in the status door's words, naming the group to launch first"
stage = ["coarse", "medium"]
launch = []
launch_stage = "medium"
launch_refused = ["`medium` continues from the newest attempt of `coarse`", "which has not been launched", "molbuilder jobset launch task --group 1"]
launch_writes_nothing = true

[[case]]
name = "a prepared stage is still what the description gives at its first launch -- a run card changed since its prep is refused, naming its group's prep again"
saved = { execution = { mpi_np = 4, omp_threads = 1 } }
launch = []
launch_refused = ["`coarse` was prepared from the description as it stood then", "H2_01_coarse.run.sh", "prepare its group again -- it was never launched", "molbuilder jobset prep task --group 1"]

[[case]]
name = "a group's first launch saves the folder's state at the send, before anything is written, and says which -- the state a redo of the group restores, named though the scheduler then refuses the send -- empties its run whole and gives prep's own files back as they lie, and records what each stage took: the first stage, nothing"
launch = []
launch_sends = true
launch_refused = ["refused coarse", "the folder's state was saved first:", "· before launch task group 1 (coarse)"]
after_launch = { made = ["01_coarse/run-0/H2_01_coarse.molwatch.log", "01_coarse/run-0/H2_01_coarse.fdf"], saved_states = ["{stamp} · before launch task group 1 (coarse)", "{stamp} · before prep task group 1 (coarse)"], ledger_holds = ["launch saved", { decision = "launch starts-cold", asked = false }] }

# ===================================================================== #
#  A CALCULATION THAT HAS PRODUCED KEEPS ITS SHAPE                      #
#  (`web/task-setup.md` § 4; § 5.0's "changing it later")               #
# ===================================================================== #

[[case]]
name = "a calculation with a prepared stage keeps its shape -- Task setup's Save refuses another, naming the way back"
saved = { shape = "flat" }
save_refused = ["shape is fixed once it has produced", "coarse is prepared", "molbuilder checkpoint list"]

[[case]]
name = "...a prepared benchmark is a prep too"
bench = { mpi_np = [2], omp_threads = [1] }
saved = { shape = "flat" }
save_refused = ["shape is fixed once it has produced", "coarse is prepared"]

# ===================================================================== #
#  THE SAVE, BEFORE PREP WRITES -- ALWAYS, AND SAID                     #
#  (`checkpointing.md` § 9; user, 2026-10-03: "always save through      #
#  checkpoint, notify user, ... name of the checkpoint clearly shows   #
#  timestamp")                                                          #
# ===================================================================== #

[[case]]
name = "before it writes, prep saves the folder's state -- its first, when it has none -- the note led by the time it was taken, and says so"
said = ["the folder's state was saved first:", "before prep task group 1 (coarse)"]
saved_states = ["{stamp} · before prep task group 1 (coarse)"]

[[case]]
name = "...a new state when the folder changed since the one it stands at"
before = [["prep", "task", "--group", "2"]]
said = ["the folder's state was saved first:"]
saved_states = ["{stamp} · before prep task group 1 (coarse)", "{stamp} · before prep task group 2 (medium)"]

[[case]]
name = "...and none when nothing changed: the state it stands at is named"
saved_first = true
said = ["the folder's state was already saved:", "set up", "nothing changed since"]
saved_states = ["set up"]

# ===================================================================== #
#  A STAGE'S NUMBER IS ITS FILES' -- `project-layout.md` § 4.2 (W38 F4) #
# ===================================================================== #
#
# One door answers it (`materialize.stage_home`): a stage that has files
# keeps the number they carry; one that has none takes its place in the
# description when no folder holds that number, else the next after every
# one in use.

[[case]]
name = "a stage removed after its prep leaves every later number as it was -- #2 is still the folder 02_medium"
before = [["prep", "task", "--group", "1"], ["prep", "task", "--group", "2"]]
removed = ["coarse"]
stage = "#2"
said = ["prepared medium: 02_medium/run-0  (reused -- not launched yet)"]

[[case]]
name = "a stage added after production takes the next number -- the stage with files keeps its own"
before = [["prep", "task", "--group", "1"]]
added = [{ name = "extra", at = 0 }]
stage = "extra"
made = ["01_coarse/run-0", "02_extra/run-0"]
made_lacks = ["01_extra"]

# ===================================================================== #
#  THE STAGE NAMED IS THE STAGE WRITTEN, FROM THE DESCRIPTION           #
#  (§ 5.0 checkpoints 4 and 4b: the stage resolves once -- the          #
#  description, its template and the run card read once -- and every    #
#  deck and run script is written from that answer)                     #
# ===================================================================== #

[[case]]
name = "the stage named is the stage written -- its own values, its token, its header line, and the cores per rank its run card states"
deck = ["MD.TypeOfRun CG", "MD.MaxForceTol 0.05", "# Stage 01_coarse --", "# runtime.omp_threads_requested: 1"]

[[case]]
name = "...a later stage its own"
stage = "medium"
deck = ["MD.TypeOfRun Broyden", "MD.MaxForceTol 0.04", "# Stage 02_medium --"]

[[case]]
name = "a group the description does not hold is refused by its number, naming the ones it does"
stage = ""
prep = ["--group", "9"]
refused = ["group 9: the description holds groups 1, 2"]
made_lacks = ["job-set.json"]

[[case]]
name = "a template value no stage varies reaches the deck"
template = { mesh_cutoff = 275.0 }
deck = ["MeshCutoff 275.0"]

[[case]]
name = "the template's retry budget reaches the run script"
template = { continue_retries = 4 }
run_sh = ["_siesta_retry_max=4"]

[[case]]
name = "...the run card's beats it"
template = { continue_retries = 4 }
run = { continue_retries = 2 }
run_sh = ["_siesta_retry_max=2"]

[[case]]
name = "...and no budget writes no retry loop"
template = { continue_retries = 0 }
run_sh_lacks = ["_siesta_retry_max="]

[[case]]
name = "the description's reporting policy reaches the run script -- when, how often, and where, by name"
notify = { on_scf_converged = true, every_hours = 4, channels = ["slack", "lab"], report = ["*"] }
run_sh = ["--notify-on-scf", "--notify-every-hours 4", '--notify-channels "slack,lab"']

[[case]]
name = "...an empty channel list survives -- report to none, never to every channel"
notify = { on_scf_converged = true, every_hours = 6, channels = [], report = ["*"] }
run_sh = ['--notify-channels ""']

# run-reports.md § 2.6, stages.md § 6.9: the report fields chosen reach the monitor line by name.
[[case]]
name = "...the report fields it names reach the monitor line"
notify = { on_scf_converged = true, every_hours = 6, channels = ["*"], report = ["elapsed_s", "energy", "max_force"] }
run_sh = ['--notify-report "elapsed_s,energy,max_force" --watch-pid $$']

# run-reports.md § 2.6, stages.md § 6.9: an empty report list survives -- the summary line alone.
[[case]]
name = "...and an empty report list survives as one -- never as every field"
notify = { on_scf_converged = true, every_hours = 6, channels = ["*"], report = [] }
run_sh = ['--notify-report "" --watch-pid $$']

[[case]]
name = "...and a description without one leaves the run script without one"
run_sh_lacks = ["--notify-"]

[[case]]
name = "a benchmark's declared grid states its ranks and its cores per rank -- one alone is refused, never filled"
bench = { mpi_np = [1, 2] }
refused = ["declares mpi_np and not omp_threads", "Declare omp_threads's points too"]

# ===================================================================== #
#  A GROUP: STAGES THAT SHARE ONE JOB -- `engines/stages.md` § 2        #
# ===================================================================== #

[[case]]
name = "a description whose group holds a stage and the one it builds on is refused at prep, naming both and why, before anything is written"
groups = [1, 1]
refused = ["`medium` is in group 1 with `coarse`, which it builds on", "Give `medium` a new group"]
made_lacks = ["job-set.json", "01_coarse"]

[[case]]
name = "a group goes whole the first time -- a member launched alone before its group has run is refused, naming the group's launch"
groups = [1, 1]
stage_run = { medium = { restart = "clean" } }
stage = ["coarse", "medium"]
said = ["group 1 -- one job: coarse, medium, one after another (their walls summed, the largest memory); its header: launch/H2_group-01_coarse-02_medium.sbatch",
        "header: -J H2_group-01_coarse-02_medium  -N 1  -n 2  -c 1  -t 0-02:00:00  -p cpu  -q public  --mem=8G"]
# ...and not a member's own: its first launch is the group's one job.
said_lacks = ["header: -J H2_01_coarse", "header: -J H2_02_medium"]
made = ["launch/H2_group-01_coarse-02_medium.sbatch"]
launch = []
launch_stage = "medium"
launch_refused = ["`medium` was never launched, and its group 1 holds `coarse` too", "molbuilder jobset launch task --group 1"]

[[case]]
name = "a PySCF group's one job runs one process at a time -- its header, rendered for the members' shared request, asks one task, and its first launch is planned whole"
engine = "pyscf"
stage_strategy = "publishable"
groups = [1, 1]
stage_run = { medium = { restart = "clean" } }
stage = ["coarse", "medium"]
said = ["group 1 -- one job: coarse, medium, one after another (their walls summed, the largest memory); its header: launch/H2_group-01_coarse-02_medium.sbatch",
        "header: -J H2_group-01_coarse-02_medium  -N 1  -n 1"]
made = ["launch/H2_group-01_coarse-02_medium.sbatch"]
launch = []
launch_stage = ["coarse", "medium"]
listing = ["launch/H2_group-01_coarse-02_medium.sbatch"]

[[case]]
name = "...and its first launch, named by its group, is planned whole -- each member still what the description gives, the members on its rows the group's to check -- and sends the group's one header"
groups = [1, 1]
stage_run = { medium = { restart = "clean" } }
stage = ["coarse", "medium"]
launch = []
launch_stage = ["coarse", "medium"]
listing = ["launch/H2_group-01_coarse-02_medium.sbatch"]

[[case]]
name = "groups are matched by their members -- a prepared job whose members are now two groups is formed again in one prep, naming only one of them refused"
groups = [1, 1]
stage_run = { medium = { restart = "clean" } }
before = [["prep", "task", "--group", "1"]]
regrouped = [1, 2]
stage = "coarse"
refused = ["group 2 holds stages prepared in one job with the groups picked", "molbuilder jobset prep task --group 1 --group 2"]

[[case]]
name = "...and naming both forms each again, each its own job"
groups = [1, 1]
stage_run = { medium = { restart = "clean" } }
before = [["prep", "task", "--group", "1"]]
regrouped = [1, 2]
stage = ["coarse", "medium"]
said = ["prepared coarse: 01_coarse/run-0  (reused -- not launched yet)", "prepared medium: 02_medium/run-0  (reused -- not launched yet)"]
made_lacks = ["launch/H2_group-01_coarse-02_medium.sbatch"]

[[case]]
name = "...and a member the description no longer holds is among them: the old header, named by its members' own files, is removed"
groups = [1, 1]
stage_run = { medium = { restart = "clean" } }
before = [["prep", "task", "--group", "1"]]
removed = ["coarse"]
stage = "medium"
made_lacks = ["launch/H2_group-01_coarse-02_medium.sbatch"]

[[case]]
name = "a group's one job is admitted at prep -- its members' walls summed, refused when the queue it names allows less"
groups = [1, 1]
stage_run = { coarse = { time = "23:30:00" }, medium = { restart = "clean" } }
stage = ["coarse", "medium"]
refused = ["group 1's one job (coarse, medium: their walls summed and the largest memory) does not fit the queue 'cpu'", "needs 1470 min", "Ask for less where it is stated:", "wall: the run card (`execution` in task.json)", "wall: the description (`allocation` in task.json)"]
made_lacks = ["job-set.json", "01_coarse"]

# ===================================================================== #
#  THE TASK'S QUESTION -- `job-system.md`, *The task*                   #
# ===================================================================== #

[[case]]
name = "a prep naming no group shows the groups and, with nobody to ask, is refused naming the line that picks them -- writing nothing"
stage = ""
refused = ["the task's groups:", "group 1", "coarse", "nobody to ask which groups to prepare", "prep task --group 1 --group 2"]
made_lacks = ["job-set.json", "01_coarse"]
