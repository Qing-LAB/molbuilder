# THE PREP PROTOCOL -- `docs/execution/job-system.md` § 5.0.
#
# Prep prepares the groups picked (`--group N`), each one job; a group
# prepared and never launched is prepared again, whole (user, 2026-10-11),
# where what it would write differs, and has nothing to write where it does
# not (user, 2026-10-23); a
# launched one is prepared again for its job request alone, its runs kept
# -- what it computes takes the way back, the
# state saved before its group's first launch (user, 2026-10-21).  What a stage takes from another stage's run is its
# first launch's: launch refuses, before anything is sent, a stage whose
# upstream has not finished.  Before prep writes, it saves the folder's
# state -- always, the note led by the time it was taken -- and says so
# (`checkpointing.md` § 9; user, 2026-10-03).  Every check and every decision
# is made before anything is written, so a refused prep writes nothing but its
# line in the ledger and there is nothing to put back: the stage is not
# counted prepared, the calculation is not set to the machine, the prep is not
# recorded as prepared (rule 3).
#
# `tests/test_prep_protocol.py` runs every case down the road a person runs,
# through the one runner every contract table shares (`tests/support/road.py`,
# `run_road_case`, whose header names each key).
#
# A RULE CHANGES, ITS ROWS CHANGE.  A case is a row here, never a function.

[run_base.siesta]
mpi_np = 2
omp_threads = 1

[run_base.pyscf]
threads = 1

[allocation_base]
domain = "cpu"
time = "01:00:00"
mem = "8G"

[[queues]]
name = "cpu"
partition = "cpu"
qos = "public"
max_time = "1-00:00:00"
max_cores = 64
node_types = [{ cores = 64, nodes = 10 }]

[[queues]]
name = "gpu"
partition = "gpu"
qos = "public"
max_time = "1-00:00:00"
max_cores = 128
gpu = { a100 = 4 }
node_types = [{ cores = 48, nodes = 5, gpu = { a100 = 4 } }]

# ===================================================================== #
#  THE STRUCTURE IS THE ONE IT WAS DESCRIBED WITH                       #
#  (`model/structure-molstruct.md` § 3)                                 #
# ===================================================================== #

[[case]]
name = "a structure whose atom moved after it was described is refused at prep, in the read door's words -- its labels and cell were saved for other coordinates"
source_edited = { atom = 1, line = "H 5.000000 5.000000 5.900000" }
refused = ["the structure has changed since this calculation was described", "atoms or cell are not the ones its .molstruct.json was saved with"]

[[case]]
name = "a structure whose held atoms changed after it was described is refused at prep -- every stage of a calculation is of the one structure it was described with"
held_edited = [1]
refused = ["the structure has changed since this calculation was described", "structure fingerprint"]

# ===================================================================== #
#  A GROUP PREPARED AND NEVER LAUNCHED: NOTHING TO WRITE, OR AGAIN     #
# ===================================================================== #

[[case]]
name = "a group prepared, never launched, and already as this prep would prepare it has nothing to write -- said with what is next, no file written again and no state saved (the user, 2026-10-23)"
points_before_prep = { coarse = "" }
before = [["prep", "task", "--group", "1"]]
said = ["coarse (01_coarse): prepared, never launched, and already as this prep would prepare it now -- nothing to write (group 1)", "each group, and what is next:"]
said_lacks = ["the folder's state was"]
kept = ["01_coarse/H2_01_coarse.fdf", "01_coarse/H2_01_coarse.run.sh", "01_coarse/run-0/H2_01_coarse.fdf", "STAGE-PLAN.md", "jobset-decisions.log"]

[[case]]
name = "...and a SIESTA vibration -- one stage, one run in phases -- prepared again as it was has nothing to write: each phase's deck and run script kept as they were (engines/vibration.md 5.11 2)"
calculation = "vibration"
points_before_prep = { freq = "one job walking its calls, prep preparing them (one wall for the whole run)" }
stage = "freq"
before = [["prep", "task", "--group", "1"]]
said = ["freq (01_freq): prepared, never launched, and already as this prep would prepare it now -- nothing to write (group 1)"]
said_lacks = ["the folder's state was"]
kept = ["01_freq/relax/H2_01_freq.fdf", "01_freq/relax/H2_01_freq.run.sh", "01_freq/fc/H2_01_freq.fdf", "01_freq/fc/H2_01_freq.run.sh", "STAGE-PLAN.md", "jobset-decisions.log"]

[[case]]
name = "a SIESTA vibration's prep says the run's count and sizes beside its wall -- the relaxation's steps, the force constants' SCFs, the optical calls and each .EPSIMG's size -- and its one job walks the run on the stage's one wall (engines/vibration.md 5.11 9)"
calculation = "vibration"
stage = "freq"
points_compared = "freq"
template = { compute_raman = true }
# The road's H2 holds atom 0, so one atom is free -- one mode, every mode
# Raman for's default picks; a vibration's template
# carries the catalogue's recommended relax_steps, 100.
said = ["the run: relax up to 100 geometry steps · fc 7 SCFs (1 + 6 × 1 free atom) · optical 3 calls (1 + 2 × 1 mode), each .EPSIMG about 0.8 MB (15,001 photon energies, one spin channel; 0.4 MB more with two)",
        "one job walking its calls -- 2 prepared, the rest planned by the job (one wall for the whole run)"]

# A run is one start, and what a launch again does is the launch's own fact
# (`running-a-job.md` § 3.5): a kind that does not resume starts over from
# its deck, nothing of its run copied in.  THE SILENT FAILURE: a failed
# PySCF vibration told to "continue warm" from files no launch copies.
[[case]]
name = "a PySCF vibration's run script says, on a failure, that a launch again starts it over from its deck -- this kind of run does not resume"
engine = "pyscf"
calculation = "vibration"
stage = "freq"
run_sh = ["what a launch again will do: a launch again starts this run over from its deck, nothing of it copied in -- this kind of run does not resume"]
run_sh_lacks = ["continue warm from the files this run saved"]

[[case]]
name = "...and one as described -- Compute Raman off, its default, no optical phase -- says its two calls, none planned in the job, on the stage's one wall"
calculation = "vibration"
stage = "freq"
said = ["the run: relax up to 100 geometry steps · fc 7 SCFs (1 + 6 × 1 free atom)",
        "one job walking its 2 calls (one wall for the whole run)"]
said_lacks = ["the rest planned by the job", "1 free atom) · optical"]

[[case]]
name = "...and Raman for a frequency range, at most the modes the run reports: 3 x the free atoms less the whole-body motions the held atoms leave -- the road's H2, atom 0 held, its stretch alone (science/normal-modes.md 3.1), only the run knowing which lie in the range"
calculation = "vibration"
stage = "freq"
template = { compute_raman = true, raman_modes = "range", raman_freq_min_cm1 = 100.0 }
said = ["the run: relax up to 100 geometry steps · fc 7 SCFs (1 + 6 × 1 free atom) · optical up to 3 calls (1 + 2 × the modes within the range, at most 1), each .EPSIMG about 0.8 MB"]

[[case]]
name = "...and Raman for a range stated nowhere -- neither end given -- is refused at prep, naming the setting and the ways on, before a deck is written (engines/vibration.md 3.1)"
calculation = "vibration"
stage = "freq"
template = { compute_raman = true, raman_modes = "range" }
refused = ["Raman for is \"Modes in a frequency range\" and neither Raman from nor Raman up to is given"]

[[case]]
name = "...and its benchmark is prepared as any stage's: each trial's deck and run script in the trial's own run, no phase folder of the stage's run asked of a trial (engines/vibration.md 5.5)"
calculation = "vibration"
stage = "freq"
bench = { mpi_np = [2], omp_threads = [1] }
made = ["01_freq/bench/bench-G0N2C1/run-0/H2-G0N2C1_01_freq.fdf", "01_freq/bench/bench-G0N2C1/run-0/H2-G0N2C1_01_freq.run.sh"]
made_lacks = ["01_freq/relax", "01_freq/fc"]

[[case]]
name = "...and with Raman on, its progress log seeded only where the run opens a call -- the relaxation's and the force constants' in its first run -- and none left in the optical calls' container, below which the job plans each call (project-layout.md 1.6.2)"
calculation = "vibration"
stage = "freq"
template = { compute_raman = true }
made = ["01_freq/run-0/relax/H2_01_freq.molwatch.log", "01_freq/run-0/fc/H2_01_freq.molwatch.log"]
made_lacks = ["01_freq/optical/H2_01_freq.molwatch.log", "01_freq/relax/H2_01_freq.molwatch.log", "01_freq/fc/H2_01_freq.molwatch.log"]

[[case]]
name = "...and a charged one has the Makov-Payne correction script beside each deck it writes -- each phase's, and each call's of its first run -- as a charged single run has it beside its deck (siesta.md, the correction script)"
calculation = "vibration"
stage = "freq"
structure = { elements = ["O", "O", "C"], positions = [[5.0, 5.0, 6.20], [5.0, 5.0, 3.84], [5.0, 5.0, 5.0]], regions = { frozen_atoms = [2] }, cell = [10.0, 10.0, 10.0] }
template = { net_charge = 2 }
made = ["01_freq/relax/makov_payne_correction.py", "01_freq/fc/makov_payne_correction.py", "01_freq/run-0/relax/makov_payne_correction.py", "01_freq/run-0/fc/makov_payne_correction.py"]

[[case]]
name = "...its job carries the relaxation's warm files -- what a launch again continues the run's relaxation from (engines/vibration.md 5.11 6)"
calculation = "vibration"
stage = "freq"
plan_carries = { freq = ["H2.XV", "H2.DM", "H2.CG"] }

[[case]]
name = "...and a structure already relaxed, which runs no relaxation, carries none"
calculation = "vibration"
stage = "freq"
template = { already_relaxed = true }
plan_carries = { freq = [] }

# ---- A DISPLACEMENT SWEEP: its later stage continues from the first, whose
# relaxation it takes over (engines/vibration.md 5.9; job-system.md 5.4) --
# so every stage's force constants are taken at one geometry.  What the take-over
# copies, renamed for the stage, is read off real runs.
[[case]]
name = "a SIESTA displacement sweep's later stage, added in a group of its own, says at prep that its first launch takes the first stage's relaxation over (engines/vibration.md 5.9)"
calculation = "vibration"
saved_first = true
added = [{ name = "freq_half", overrides = { fc_displacement = 0.02 } }]
stage = ["freq", "freq_half"]
said = ["at launch: takes the relaxation over from `freq`'s newest run, which must have finished"]

[[case]]
name = "...and put in one group with the first stage it is refused, naming both and why: it builds on that stage"
calculation = "vibration"
saved_first = true
added = [{ name = "freq_half", overrides = { fc_displacement = 0.02 } }]
regrouped = [1, 1]
regroup_refused = ["`freq_half` is in group 1 with `freq`, which it builds on"]
regroup_status = 400

[[case]]
name = "...and its first launch waits for the first stage -- refused before anything is sent, in the status door's words, naming the group to launch first"
calculation = "vibration"
saved_first = true
added = [{ name = "freq_half", overrides = { fc_displacement = 0.02 } }]
stage = ["freq", "freq_half"]
launch = []
launch_stage = "freq_half"
launch_refused = ["`freq_half` continues from the newest attempt of `freq`", "which has not been launched", "molbuilder jobset launch task --group 1"]
launch_writes_nothing = true

[[case]]
name = "...and --from names a run of the first stage to take the relaxation from -- one never launched refused, naming why"
calculation = "vibration"
saved_first = true
added = [{ name = "freq_half", overrides = { fc_displacement = 0.02 } }]
stage = ["freq", "freq_half"]
launch = ["--from", "01_freq/run-0"]
launch_stage = "freq_half"
launch_refused = ["--from '01_freq/run-0': that run was never launched"]
launch_writes_nothing = true

[[case]]
name = "...and one launched whose relaxation is not done refused, naming the ways on -- a run that has it, or --cold"
calculation = "vibration"
before = [["prep", "task", "--group", "1"]]
launched = ["freq"]
added = [{ name = "freq_half", overrides = { fc_displacement = 0.02 } }]
stage = "freq_half"
launch = ["--from", "01_freq/run-0"]
launch_stage = "freq_half"
launch_refused = ["`freq_half` takes the relaxation over from the run it continues from, and 01_freq/run-0 holds none of it done", "--stage freq_half --cold"]
launch_writes_nothing = true

[[case]]
name = "...and launched --cold it takes nothing: it relaxes on its own, its walk running the relaxation"
calculation = "vibration"
saved_first = true
added = [{ name = "freq_half", overrides = { fc_displacement = 0.02 } }]
stage = ["freq", "freq_half"]
launch = ["--cold"]
launch_stage = "freq_half"
launch_mode = "direct"
listing = ["runs the relaxation"]
launch_writes_nothing = true

[[case]]
name = "...and one whose description changed since is prepared again whole -- its first run reused, and what differed named"
before = [["prep", "task", "--group", "1"]]
changed = { overrides = { coarse = { max_scf_iter = 200 } } }
said = ["prepared coarse: 01_coarse/run-0  (reused -- not launched yet)", "prepared again -- differed from what was prepared: 01_coarse/H2_01_coarse.fdf"]

[[case]]
name = "...and a charged molecule whose charge the person then makes 0 in its template is prepared again with no correction script beside its deck -- every file beside a deck is prep's, and one this prep does not write is taken away (job-system.md, The task, prep task 5): a charged correction left beside a neutral deck for a person to run"
structure = { elements = ["C", "O", "O", "H"], positions = [[5.0, 5.0, 5.0], [6.26, 5.0, 5.0], [4.37, 6.09, 5.0], [4.45, 4.05, 5.0]], cell = [10.0, 10.0, 10.0] }
template = { net_charge = -1 }
before = [["prep", "task", "--group", "1"]]
changed = { template = { net_charge = 0 } }
made_lacks = ["01_coarse/makov_payne_correction.py"]

[[case]]
name = "...and a sequence of groups (--one-job) is one job: nothing to write when every group of it and its one header are as this prep plans them -- no state saved, nothing written again, and still sent as one job"
before = [["prep", "task", "--group", "1", "--group", "2", "--one-job"]]
stage = ["coarse", "medium"]
prep = ["--one-job"]
said = ["coarse (01_coarse): prepared, never launched, and already as this prep would prepare it now -- nothing to write", "medium (02_medium): prepared, never launched, and already as this prep would prepare it now -- nothing to write", "next -- send them as one job:"]
said_lacks = ["the folder's state was"]
kept = ["01_coarse/H2_01_coarse.fdf", "02_medium/H2_02_medium.fdf", "STAGE-PLAN.md", "jobset-decisions.log"]

[[case]]
name = "...and a group of that sequence prepared alone takes the sequence's one header away -- it summed the group's request as it was, and is no longer one prep writes; prep ... --one-job writes it again (job-system.md 6.0, A sequence of groups): a stale request sent as the sequence's one job"
before = [["prep", "task", "--group", "1", "--group", "2", "--one-job"]]
changed = { overrides = { medium = { max_scf_iter = 200 } } }
stage = "medium"
made_lacks = ["launch/H2_sequence-01_coarse-02_medium.sbatch"]
kept = ["01_coarse/H2_01_coarse.fdf"]

[[case]]
name = "a later group's prep leaves an earlier stage's files as that stage's own prep wrote them -- its deck, its run script, its monitor"
before = [["prep", "task", "--group", "1"]]
stage = "medium"
kept = ["01_coarse/H2_01_coarse.fdf", "01_coarse/H2_01_coarse.run.sh", "01_coarse/mb_monitor.pyz"]

[[case]]
name = "every group is prepared before anything has run -- what a stage takes from the stage before it is its first launch's, said"
stage = ["coarse", "medium"]
made = ["01_coarse/run-0", "02_medium/run-0"]
said = ["at launch: takes", "from `coarse`'s newest run, which must have finished"]

[[case]]
name = "...each file it names by the rule its launch copies by -- the optimizer's history only between stages that run one optimizer: `medium` (Broyden) takes no `.CG` from `coarse` (CG)"
stage = ["coarse", "medium"]
said = ["at launch: takes H2.XV, H2.DM"]
said_lacks = ["H2.CG from `coarse`"]

# A trial measures its point once (`submit._plan_trial`), so its run
# script's way on after a failure, and its one-start guard, say so -- never
# "launch the stage again", which its benchmark's launch would skip.
[[case]]
name = "a benchmark trial's run script says, on a failure and at a second start, that a trial measures its point once -- its benchmark's launch does not start it again"
bench = { mpi_np = [2], omp_threads = [1] }
made_says = { "01_coarse/bench/bench-G0N2C1/run-0/H2-G0N2C1_01_coarse.run.sh" = ["what a launch again will do: a trial measures its point once, and its benchmark's launch does not start it again", "a run is one start; a trial measures its point once"] }

[[case]]
name = "...a prepared benchmark too"
bench = { mpi_np = [2], omp_threads = [1] }
before = [["prep", "bench", "coarse"]]
refused = ["the benchmark of stage 'coarse' is already prepared", "molbuilder checkpoint list"]

# ===================================================================== #
#  LAUNCH ACTS ON A PREPPED STAGE                                       #
# ===================================================================== #

[[case]]
name = "a stage described and not prepared is refused at launch by name, with its group's prep and launch -- as status says"
launch = []
launch_stage = "medium"
launch_refused = ["stage 'medium' is not prepared yet", "molbuilder jobset prep task --group 2"]

[[case]]
name = "a stage's first launch waits for the stage before it -- refused before anything is sent, in the status door's words, naming the group to launch first"
stage = ["coarse", "medium"]
launch = []
launch_stage = "medium"
launch_refused = ["`medium` continues from the newest attempt of `coarse`", "which has not been launched", "molbuilder jobset launch task --group 1"]
launch_writes_nothing = true

[[case]]
name = "a run card changed since a stage's prep is said by status -- changed since prepared, the value was and now, and its group's prep -- and its launch sends what prep wrote (job-system.md, The task, Changed since prepared)"
saved = { execution = { mpi_np = 4, omp_threads = 1 } }
launch = []
after_launch = { status_says = ["changed since prepared: coarse: run card mpi_np: 2 → 4 -- prepare it again", "molbuilder jobset prep task --group 1"] }

[[case]]
name = "a run card value stated since a stage's prep is a change too -- said not stated → its value, as one changed is (job-system.md, The task, Changed since prepared: the run card holds only what is stated)"
saved = { execution = { mpi_np = 2, omp_threads = 1, max_memory_mb = 4000 } }
launch = []
after_launch = { status_says = ["changed since prepared: coarse: run card max_memory_mb: not stated → 4000 -- prepare it again", "molbuilder jobset prep task --group 1"] }

[[case]]
name = "a group's first launch saves the folder's state at the send, before anything is written, and says which -- the state a redo of the group restores, named though the scheduler then refuses the send -- empties its run whole and gives prep's own files back as they lie, and records what each stage took: the first stage, nothing"
launch = []
launch_sends = true
launch_refused = ["refused coarse", "the folder's state was saved first:", "· before launch task group 1 (coarse)"]
after_launch = { made = ["01_coarse/run-0/H2_01_coarse.molwatch.log", "01_coarse/run-0/H2_01_coarse.fdf"], saved_states = ["{stamp} · before launch task group 1 (coarse)", "{stamp} · before prep task group 1 (coarse)"], ledger_holds = ["launch saved", { decision = "launch starts-cold", asked = false }] }

# ===================================================================== #
#  ONE LAYOUT: A DESCRIPTION STATING ANOTHER IS REFUSED BY NAME          #
#  (`project-layout.md` § 1; `engines/stages.md` § 6.7)                 #
# ===================================================================== #

[[case]]
name = "a description stating the flat layout is refused by the description's own reader, naming the one layout and the way out -- Task setup's Save answers as for every description its reader refuses"
saved = { shape = "flat" }
save_status = 400
save_refused = ["'flat'", "'hierarchical'", "the calculation again"]

# ===================================================================== #
#  THE SAVE, BEFORE PREP WRITES -- ALWAYS, AND SAID                     #
#  (`checkpointing.md` § 9; user, 2026-10-03: "always save through      #
#  checkpoint, notify user, ... name of the checkpoint clearly shows   #
#  timestamp")                                                          #
# ===================================================================== #

[[case]]
name = "before it writes, prep saves the folder's state -- its first, when it has none -- the note led by the time it was taken, and says so"
said = ["the folder's state was saved first:", "before prep task group 1 (coarse)"]
saved_states = ["{stamp} · before prep task group 1 (coarse)"]

[[case]]
name = "...a new state when the folder changed since the one it stands at"
before = [["prep", "task", "--group", "2"]]
said = ["the folder's state was saved first:"]
saved_states = ["{stamp} · before prep task group 1 (coarse)", "{stamp} · before prep task group 2 (medium)"]

[[case]]
name = "...and none when nothing changed: the state it stands at is named"
saved_first = true
said = ["the folder's state was already saved:", "set up", "nothing changed since"]
saved_states = ["set up"]

# ===================================================================== #
#  A STAGE'S NUMBER IS ITS FILES' -- `project-layout.md` § 4.2 (W38 F4) #
# ===================================================================== #
#
# One door answers it (`materialize.stage_home`): a stage that has files
# keeps the number they carry; one that has none takes its place in the
# description when no folder holds that number, else the next after every
# one in use.

[[case]]
name = "a stage removed after its prep leaves every later number as it was -- #2 is still the folder 02_medium"
before = [["prep", "task", "--group", "1"], ["prep", "task", "--group", "2"]]
removed = ["coarse"]
stage = "#2"
said = ["medium (02_medium): prepared, never launched, and already as this prep would prepare it now -- nothing to write"]

[[case]]
name = "a stage added after production takes the next number -- the stage with files keeps its own"
before = [["prep", "task", "--group", "1"]]
added = [{ name = "extra", at = 0 }]
stage = "extra"
made = ["01_coarse/run-0", "02_extra/run-0"]
made_lacks = ["01_extra"]

# ===================================================================== #
#  THE STAGE NAMED IS THE STAGE WRITTEN, FROM THE DESCRIPTION           #
#  (§ 5.0 checkpoints 4 and 4b: the stage resolves once -- the          #
#  description, its template and the run card read once -- and every    #
#  deck and run script is written from that answer)                     #
# ===================================================================== #

[[case]]
name = "the stage named is the stage written -- its own values, its token, its header line, and the cores per rank its run card states"
deck = ["MD.TypeOfRun CG", "MD.MaxForceTol 0.05", "# Stage 01_coarse --", "# runtime.omp_threads_requested: 1"]

[[case]]
name = "...a later stage its own"
stage = "medium"
deck = ["MD.TypeOfRun Broyden", "MD.MaxForceTol 0.04", "# Stage 02_medium --"]

[[case]]
name = "a group the job request does not hold is refused by its number, naming the ones it does"
stage = ""
prep = ["--group", "9"]
refused = ["group 9: the job request holds groups 1, 2"]
made_lacks = ["job-set.json"]

[[case]]
name = "a template value no stage varies reaches the deck"
