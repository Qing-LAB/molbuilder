# THE WEIGHT RULE OF A FRAME SET'S RECORD -- `engines/transport.md` § 2a.12:
# every frame states its weight, the base included, each a number in (0, 1],
# the set's summing to 1 within the tolerance the record writes (1e-6); a set
# whose frames state no weight is a family with no average, said so.  Frames
# are said as a person reads them, counted from 1 with their folder token
# (`model/structure.md` § 2.2e).
#
# Run by `tests/test_transport_on_a_real_junction_e2e.py`: each case is a
# frame set a script writes from the real relaxation's pair -- the bridge
# moved as the module's own frame set's is -- with the case's weights; the
# set described, its seed and leads prepared (which composes the junction;
# nothing is launched), and its record read where the Results tab reads it,
# `/api/transport/record`.
#
# Keys of a [[case]]:
#   weights     each frame's weight, in frame order
#   unstated    the frames (0-based) whose rows state no weight
#   refused     the record is refused, these words in its message
#   no_average  the record is composed and its average says why there is
#               none, in these words

[[case]]
name = "the weights do not sum to 1"
weights = [0.5, 0.25, 0.125]
refused = ["the 3 frames' weights sum to 0.875, not 1 within 1e-06"]

[[case]]
name = "a weight outside (0, 1]"
weights = [1.2, -0.1, -0.1]
refused = ["frame 1 of 3 (f000) states the weight 1.2",
           "frame 2 of 3 (f001) states the weight -0.1",
           "frame 3 of 3 (f002) states the weight -0.1",
           "a weight is a number in (0, 1]"]

[[case]]
name = "some frames state a weight and one does not"
weights = [0.5, 0.5, 0.0]
unstated = [2]
refused = ["frame 3 of 3 (f002) states no weight while the others do"]

[[case]]
name = "no frame states a weight"
weights = [0.0, 0.0, 0.0]
unstated = [0, 1, 2]
no_average = ["no frame of the set states a weight"]
