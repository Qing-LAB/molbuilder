# WHICH VIEWER OPENS A FILE ON THE RESULTS TAB -- `docs/web/presenters.md`
# § 1 (the presenters and their files) and § 2 (the first presenter whose
# `match` says yes, in the order they REGISTERED on the page, wins).
#
# `tests/test_inspector_registry_e2e.py` asks every row of the registry on
# the live `/results` page, where the order is the one the browser ran the
# scripts in: a plain script runs while the page parses, a deferred or
# module one after it, so a presenter in the wrong queue moves -- on
# 2026-08-05 `.spectra.json` files went to the text pane that way.
#
# Three questions, three tables:
#   [[pick]]      -- the viewer a file opens in (`pick`); no `opens`, none;
#   [[result]]    -- the viewer that lists it in the dropdown (`pickResult`,
#                    a presenter marked a result); no `lists`, not listed;
#   [[heading]]   -- the dropdown heading it sits under (`resultCategory`);
#                    no `heading`, none.
#
# A row naming an `answer` is asked of a REAL file, with what the server
# says of it: the first file of the named run's calculation the route
# answers (`/api/results/dir`, `runs.folder_answer` -- `presenters.md` § 2)
# with that `role`, or with that `parser` and no role, in that `folder` of
# the run's tree when one is named -- its record composed by the page as the
# dropdown passes it.  With `copied_to`, that file is copied, as a person
# copies one, into a folder of that name in a projects tree no calculation
# claims, and asked there.  The runs are the session's (`tests/conftest.py`):
# `siesta` an H2 optimization (`real_h2_layered`), `pyscf` one on PySCF
# (`real_h2_pyscf`), `vibration` CO2's SIESTA vibration
# (`real_co2_vibration`), `sweep` a SIESTA vibration's displacement sweep on
# H2 (`real_h2_sweep`), `bench` an H2 benchmark (`real_h2_bench`),
# `transport` a calculation described on the relaxed bridged chain
# (`real_bridged_chain`).  A row naming neither is asked with no answer, as
# a file no folder answers for is.  A `meta` typed here is left only where
# no session run makes the file -- each says so -- and each field it
# carries is checked to be one the server can give (`test_presenters_rows.py`).
#
# A RULE CHANGES, ITS ROWS CHANGE.  A case is a row here, never a function.

# --------------------------------------------------------------------- #
#  The viewer a file opens in                                            #
# --------------------------------------------------------------------- #

# geomeTRIC's multi-frame *_geom_optim.xyz is a trajectory, not a structure
# (structure claimed it and drew frame 0 alone, 2026-06-12).
[[pick]]
name = "a geomeTRIC *_geom_optim.xyz opens as a trajectory"
answer = { run = "pyscf", role = "_geom_optim.xyz" }
opens = "trajectory"

# A file the directory answers nothing about is claimed by no run viewer
# (2026-10-18): the trajectory viewer reads the catalogue's role, never a
# suffix off the name -- so the same name with no answer is what its format
# says, a geometry file, which the structure viewer takes.
[[pick]]
name = "...and the same name with no answer opens as a plain structure"
file = "/tmp/foo_geom_optim.xyz"
opens = "structure"

# A plain .xyz is a geometry format, which the structure viewer takes.
[[pick]]
name = "a plain .xyz opens as a structure"
file = "/tmp/water_demo/water.xyz"
opens = "structure"

# ...with the directory's answer too: the trajectory parser reads any .xyz,
# and no catalogue row names this one (2.16.3 opened it as a trajectory) --
# the structure a calculation was described from, in a folder no
# calculation claims, its engine `unknown`.
[[pick]]
name = "...and with the answer the directory gives it, no role, still"
answer = { run = "pyscf", folder = "P/structure", parser = "pyscf" }
opens = "structure"

[[pick]]
name = "a .molwatch.log opens as a trajectory"
answer = { run = "siesta", role = ".molwatch.log" }
opens = "trajectory"

[[pick]]
name = "a SIESTA .out opens as a trajectory"
answer = { run = "siesta", role = ".out" }
opens = "trajectory"

[[pick]]
name = "a plain .log falls through to the text pane"
file = "/tmp/run/foo.log"
opens = "source"

# `.molwatch.log` is trajectory's, so a matcher a little too loose takes
# PySCF's plain stdout, `.pyscf.log`, with it.
[[pick]]
name = "...and so does a .pyscf.log, which is plain stdout"
file = "/tmp/run/foo.pyscf.log"
opens = "source"

[[pick]]
name = "a .pdb opens as a structure"
file = "/tmp/protein.pdb"
opens = "structure"

[[pick]]
name = "a .txt opens in the text pane"
file = "/tmp/notes.txt"
opens = "source"

[[pick]]
name = "...and so does a .py, a deck or a script"
file = "/projects/foo/run/vib.py"
opens = "source"

# The markdown editor is registered ahead of the text pane, which would
# otherwise serve a .md read-only (§ 1, § 3).
[[pick]]
name = "a .md opens in the markdown editor"
file = "/projects/foo/notes/README.md"
opens = "markdown"

# Claimed by exact basename, ahead of the text pane, which takes every .json.
[[pick]]
name = "a sweep's job-set.json opens as its benchmark summary"
answer = { run = "bench", parser = "job-set-sweep" }
opens = "bench-summary"

[[pick]]
name = "...and another .json beside it still in the text pane"
file = "/p/calc/01_coarse/bench/bench-result.json"
opens = "source"

[[pick]]
name = "a .fdf, an input, opens in the text pane"
file = "/projects/foo/spectrum/run.fdf"
opens = "source"

# The compound suffix wins over the plain .json the text pane also takes.
[[pick]]
name = "a .spectra.json opens as a spectrum"
answer = { run = "vibration", role = ".spectra.json" }
opens = "spectra"

[[pick]]
name = "a .fc-sweep.json opens as its displacement sweep"
answer = { run = "sweep", role = ".fc-sweep.json" }
opens = "fc-sweep"

# The transport record is `summarize task`'s copy, opened as a file
# (`results.md` § 0.1): the report is claimed on the registry's word for the
# description, never on a name.
# TYPED: the record is `summarize task`'s on a finished transport ladder,
# which no session fixture runs (`test_transport_on_a_real_junction_e2e.py`
# runs one for its module).
[[pick]]
name = "a transport record by name alone opens in the text pane"
file = "/projects/BDT/transport/bdt.transport.json"
meta = { role = ".transport.json", parser = "transport-json", engine = "siesta" }
opens = "source"

[[pick]]
name = "...and the calculation's task.json, on the registry's word, as its report"
answer = { run = "transport", parser = "transport-task" }
opens = "transport"

[[pick]]
name = "a plain .json opens in the text pane"
file = "/projects/foo/user/config.json"
opens = "source"

[[pick]]
name = "a suffix nothing claims opens in nothing"
file = "/projects/foo/spectrum/run.unknown_ext"

[[pick]]
name = "nor does an empty path"
file = ""

# --------------------------------------------------------------------- #
#  The viewer that lists a file in the dropdown                          #
# --------------------------------------------------------------------- #

[[result]]
name = "a .out is listed by the trajectory viewer"
answer = { run = "siesta", role = ".out" }
lists = "trajectory"

[[result]]
name = "a .molwatch.log too"
answer = { run = "pyscf", role = ".molwatch.log" }
lists = "trajectory"

[[result]]
name = "...and a geomeTRIC *_geom_optim.xyz"
answer = { run = "pyscf", role = "_geom_optim.xyz" }
lists = "trajectory"

[[result]]
name = "a .spectra.json by the spectrum viewer"
answer = { run = "vibration", role = ".spectra.json" }
lists = "spectra"

# TYPED: the record is `summarize task`'s on a finished transport ladder,
# which no session fixture runs (`test_transport_on_a_real_junction_e2e.py`
# runs one for its module).
[[result]]
name = "a transport record by name alone is no result"
file = "/projects/BDT/transport/bdt.transport.json"
meta = { role = ".transport.json", parser = "transport-json", engine = "siesta" }

[[result]]
name = "...but a transport calculation's task.json is, as its report"
answer = { run = "transport", parser = "transport-task" }
lists = "transport"

# A result presenter registered ahead of the text pane, or the dropdown
# never offers a SIESTA vibration's sweep (`engines/vibration.md` § 5.9).
[[result]]
name = "a .fc-sweep.json by its sweep viewer"
answer = { run = "sweep", role = ".fc-sweep.json" }
lists = "fc-sweep"

[[result]]
name = "a sweep's job-set.json by its benchmark summary"
answer = { run = "bench", parser = "job-set-sweep" }
lists = "bench-summary"

[[result]]
name = "a .xyz by the structure viewer"
file = "/projects/foo/optimized.xyz"
lists = "structure"

[[result]]
name = "a .pdb too"
file = "/projects/foo/protein.pdb"
lists = "structure"

# The text pane matches inputs and logs, and is no result: the dropdown
# would flood with them.
[[result]]
name = "a .fdf input is not listed"
file = "/projects/foo/inputs/job.fdf"

[[result]]
name = "nor a .md, which the markdown editor opens"
file = "/projects/foo/notes/README.md"

[[result]]
name = "nor a plain .log"
file = "/projects/foo/build.log"

[[result]]
name = "nor a suffix nothing claims"
file = "/projects/foo/data.xyzzy"

[[result]]
name = "nor an empty path"
file = ""

# --------------------------------------------------------------------- #
#  The heading a file sits under in the dropdown                         #
# --------------------------------------------------------------------- #

# A run's heading is the folder answer's words: the engine's and the
# calculation's noun (2.65.0: until then every run read *... optimization*).
[[heading]]
name = "a .out in a SIESTA optimization sits under SIESTA optimization"
answer = { run = "siesta", role = ".out" }
heading = "SIESTA optimization"

# Every engine writes a .molwatch.log: filed by suffix, SIESTA runs once sat
# under PySCF while the plot title said SIESTA (2026-09-04).
[[heading]]
name = "a .molwatch.log in a SIESTA vibration, under SIESTA vibration"
answer = { run = "vibration", role = ".molwatch.log" }
heading = "SIESTA vibration"

# A RUN'S FILE COPIED INTO A FOLDER OF THE PERSON'S OWN: that folder is no
# calculation's, so the server claims none of its files -- no role, no noun
# (`runs.folder_answer`) -- and no run viewer lists the copy, under any
# heading.
[[heading]]
name = "a run's .out copied into a folder of the person's own sits under none"
answer = { run = "siesta", role = ".out", copied_to = "P/mine" }

# A transport calculation's report opens through its description, on the
# registry's word for it -- `task.json` by name is every calculation's.
[[heading]]
name = "a transport calculation's task.json sits under Transport"
answer = { run = "transport", parser = "transport-task" }
heading = "Transport"

[[heading]]
name = "...and another calculation's task.json under nothing"
file = "/projects/BDT/relax/task.json"

[[heading]]
name = "a sweep's job-set.json sits under Benchmark sweeps"
answer = { run = "bench", parser = "job-set-sweep" }
heading = "Benchmark sweeps"

[[heading]]
name = "a .fc-sweep.json sits under Spectrum"
answer = { run = "sweep", role = ".fc-sweep.json" }
heading = "Spectrum"

[[heading]]
name = "a .spectra.json sits under Vibrational spectrum"
answer = { run = "vibration", role = ".spectra.json" }
heading = "Vibrational spectrum"

[[heading]]
name = "a .xyz under Structure"
file = "/projects/foo/q.xyz"
heading = "Structure"

[[heading]]
name = "a .pdb too"
file = "/projects/foo/p.pdb"
heading = "Structure"
