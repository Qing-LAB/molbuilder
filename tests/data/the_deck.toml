# WHAT A DECK SAYS -- each thing the description states, written as its
# engine reads it: `docs/engines/siesta.md`, `docs/engines/pyscf.md`.
#
# A deck is written one way, by `jobset prep` -- the engine describes it, the
# framework renders, writes and checks it (`script-preparation.md` § 4.3) --
# so every row here is prepared on the road: `molbuilder describe` of a held H2, or of
# the structure the row gives, then `prep`, and the deck read where prep
# wrote it (`process/testing.md` § 3a).  `tests/test_the_deck.py` runs every
# case through the one runner every contract table shares
# (`tests/support/road.py`, `run_road_case`, whose header names each key).
#
# A RULE CHANGES, ITS ROWS CHANGE.  A case is a row here, never a function.

machine = "workstation"

[run_base.siesta]
mpi_np = 1
omp_threads = 1

[run_base.pyscf]
threads = 1

# ===================================================================== #
#  SIESTA                                                                #
# ===================================================================== #

# A deck whose description states no solver solves with molbuilder's default,
# not SIESTA's own (`docs/engines/siesta.md` § 7; user, 2026-10-12).
[[case]]
name = "a SIESTA deck that states no solver solves with ELPA-1STAGE, molbuilder's default"
stage_strategy = ""
deck_says = { "Diag.Algorithm" = "ELPA-1STAGE" }

# A relaxation is bounded by MD.Steps whatever its algorithm: SIESTA 5.4.2
# reads that one count for CG, Broyden and FIRE, and a count it does not
# read leaves a single point that reports success.
[[case]]
name = "a CG relaxation is bounded by MD.Steps, the one count SIESTA reads"
stage_strategy = ""
template = { relax_type = "CG", relax_steps = 42 }
deck_says = { "MD.TypeOfRun" = "CG", "MD.Steps" = "42" }

[[case]]
name = "...a Broyden one too"
stage_strategy = ""
template = { relax_type = "Broyden", relax_steps = 42 }
deck_says = { "MD.TypeOfRun" = "Broyden", "MD.Steps" = "42" }

[[case]]
name = "...and a FIRE one"
stage_strategy = ""
template = { relax_type = "FIRE", relax_steps = 42 }
deck_says = { "MD.TypeOfRun" = "FIRE", "MD.Steps" = "42" }

# WHAT NOTHING CHASES IS NOT STATED AS CHASED: with no relaxation the force
# target and the step count enter nothing (`engines/template.md` § 5), and
# neither the line saying what this stage computes nor the targets its progress
# log hands the Watch tab name them.
[[case]]
name = "a single point's own line names no force target and no step count"
stage_strategy = ""
template = { relax_type = "none", relax_steps = 77 }
deck_lacks = ["force tol ", "max 77 steps"]
progress_log_targets = {}

# EACH RUNG CONVERGES TO ITS TIER (`engines/tuning.md` § 2.3, the authority
# for SIESTA's force tolerance, one per tier): loose preopt 0.05 eV/Å,
# publishable 0.04, tight -- the crystal and surface number -- 0.01.  A rung
# whose deck said another would converge somewhere else and call it done.
# `vib-quality` is the shipped ladder that runs all three rungs.
[[case]]
name = "the coarse rung's deck states the loose-preopt force tolerance"
stage_strategy = "vib-quality"
deck_says = { "MD.MaxForceTol" = "0.05 eV/Ang" }

[[case]]
name = "...the medium rung's the publishable one"
stage_strategy = "vib-quality"
before = [["prep", "task", "--group", "1"]]
stage = "medium"
deck_says = { "MD.MaxForceTol" = "0.04 eV/Ang" }

[[case]]
name = "...and the tight rung's the crystal-and-surface one"
stage_strategy = "vib-quality"
before = [["prep", "task", "--group", "1"], ["prep", "task", "--group", "2"]]
stage = "tight"
deck_says = { "MD.MaxForceTol" = "0.01 eV/Ang" }

# The SCF's mixer and criteria, as the deck states them and as the one fdf
# reader reads them back -- what a transport calculation citing this run
# starts each SCF stage from (`engines/transport.md` § 3.1; TD6, 2026-10-09).
[[case]]
name = "the deck's SCF mixer and criteria read back through the one fdf reader"
stage_strategy = ""
template = { mixing_weight = 0.1, pulay_history = 6, dm_tolerance = 0.0001, dm_energy_tolerance = 0.001, scf_energy_converge = true }
deck_reads = { mixing_weight = 0.1, pulay_history = 6, dm_tolerance = 0.0001, dm_energy_tolerance_ev = 0.001, scf_energy_converge = true }

# One k-point has nothing to parallelise over; several do, on ScaLAPACK.
[[case]]
name = "a Gamma-only calculation's diagonaliser is not parallelised over k-points"
deck_says = { "Diag.ParallelOverK" = ".false." }

[[case]]
name = "...a periodic one sampling several on ScaLAPACK is"
structure = { elements = ["H", "H"], positions = [[5.0, 5.0, 5.0], [5.0, 5.0, 5.741]], cell = [10.0, 10.0, 10.0], axis_kind = ["periodic", "periodic", "periodic"] }
template = { kgrid = [4, 4, 4], diag_algorithm = "ScaLAPACK" }
deck_says = { "Diag.ParallelOverK" = ".true." }

# ...but never with ELPA, which SIESTA's manual calls not compatible with it,
# so the deck says what runs (`engines/siesta.md` § 6.1); set on with ELPA, it
# is written as set and prep warns.
[[case]]
name = "...unless the solver is ELPA, which SIESTA runs over the orbitals only"
structure = { elements = ["H", "H"], positions = [[5.0, 5.0, 5.0], [5.0, 5.0, 5.741]], cell = [10.0, 10.0, 10.0], axis_kind = ["periodic", "periodic", "periodic"] }
template = { kgrid = [4, 4, 4], diag_algorithm = "ELPA-1STAGE" }
deck_says = { "Diag.ParallelOverK" = ".false." }

[[case]]
name = "...and the k-point split set on with ELPA is written as set, with a warning"
structure = { elements = ["H", "H"], positions = [[5.0, 5.0, 5.0], [5.0, 5.0, 5.741]], cell = [10.0, 10.0, 10.0], axis_kind = ["periodic", "periodic", "periodic"] }
template = { kgrid = [4, 4, 4], diag_algorithm = "ELPA-1STAGE", parallel_over_k = true }
deck_says = { "Diag.ParallelOverK" = ".true." }
said = "SIESTA's manual says ELPA is not compatible with Diag.ParallelOverK"

# The labels are the person's: the deck's record carries every one of them,
# as the structure holds it (`model/structure-annotations.md`).
[[case]]
name = "every label the structure carries reaches the deck's record"
structure = { elements = ["H", "H", "H", "H", "H", "H"], positions = [[3.0, 7.0, 7.0], [4.5, 7.0, 7.0], [6.0, 7.0, 7.0], [7.5, 7.0, 7.0], [9.0, 7.0, 7.0], [10.5, 7.0, 7.0]], cell = [14.0, 14.0, 14.0], regions = { frozen_atoms = [0, 5], left_lead = [0, 1], molecule = [2, 3], right_lead = [4, 5] } }
deck = ['"frozen_atoms":[0,5]', '"left_lead":[0,1]', '"molecule":[2,3]', '"right_lead":[4,5]']

# What the engine will read is recorded in the run's output, inside one
# fence either engine's reader reads (`script-preparation.md` § 4.2b): the
# run script of a deck that states keywords echoes it -- the deck read by the
# framework's one deck reader, beside the job (`mb_monitor.pyz deck`,
# `running-a-job.md` § 1 step 16) -- and a script deck prints it itself.
[[case]]
name = "a SIESTA run script records its effective parameters in the fence either engine's reader reads, the deck read by the bundle's one deck reader"
run_sh = ["# === molbuilder effective-parameters BEGIN ===", "# === molbuilder effective-parameters END ===",
          'mb_monitor.pyz deck "']

# BlockSize has two states: a number set or benchmarked, written verbatim,
# or unset -- no line, and SIESTA uses its own automatic (`siesta.md` § 1.1,
# `tuning.md` § 2.11).
[[case]]
name = "an unset BlockSize writes no BlockSize line"
deck_lacks = ["\nBlockSize "]

[[case]]
name = "...and a set one is written as set, never snapped to a power of two"
template = { block_size = 24 }
deck_says = { "BlockSize" = "24" }

# running-a-job.md § 4.2, job-contracts.md § 3.2: the engine is declared in PROVENANCE, deck and run script.
[[case]]
name = "a SIESTA deck and its run script declare their engine"
deck = ["\n# engine siesta\n"]
run_sh = ["\n# engine siesta\n"]

# run-identity.md § 2, § 3.2: the label is the SystemLabel literal, unsuffixed on every rung.
[[case]]
name = "a later rung's deck carries the calculation's label, unsuffixed"
before = [["prep", "task", "--group", "1"]]
stage = "medium"
deck_says = { "SystemLabel" = "H2" }

# SIESTA's OMM runs a polarized density only with the spin held
# (`science/chemistry-correctness.md` ES6, `m_dminim.F90`): SIESTA stops
# otherwise, which is SIESTA's -- the deck is written as asked, and the stop
# said beforehand as information (the user, 2026-11-02).
[[case]]
name = "OMM with a floating moment is written as asked"
template = { solution_method = "OMM", spin_treatment = "unrestricted", unpaired_electrons = "free" }
deck_says = { "SolutionMethod" = "OMM" }

[[case]]
name = "...and OMM with the count held is written"
template = { solution_method = "OMM", spin_treatment = "unrestricted", unpaired_electrons = 2 }
deck_says = { "SolutionMethod" = "OMM", "Spin.Fix" = ".true." }

# ===================================================================== #
#  PySCF                                                                 #
# ===================================================================== #

# THE HARD-SCF HINT (`pyscf/layout.py`, `hard_scf_hint`): a commented level
# shift where an open-d metal is present, the commonest reason such an SCF does
# not converge; nothing for a clean organic, where the line would be noise.
[[case]]
name = "a PySCF deck for an open-d metal carries the commented level shift"
engine = "pyscf"
structure = { elements = ["Fe", "N", "N", "N", "N"], positions = [[6.0, 6.0, 6.0], [8.0, 6.0, 6.0], [4.0, 6.0, 6.0], [6.0, 8.0, 6.0], [6.0, 4.0, 6.0]], cell = [12.0, 12.0, 12.0] }
template = { spin_treatment = "unrestricted", unpaired_electrons = 2 }
deck = ["# mf.level_shift = 0.2"]

[[case]]
name = "...and a clean organic's none"
engine = "pyscf"
deck_lacks = ["# mf.level_shift = 0.2"]

[[case]]
name = "...a PySCF deck in the same fence, its run script echoing none"
engine = "pyscf"
deck = ["# === molbuilder effective-parameters BEGIN ===", "# === molbuilder effective-parameters END ==="]
run_sh_lacks = ["mb_monitor.pyz deck"]

# A deck is one rung (`stages.md` § 1.1a), so it relaxes through one call,
# `relax`, which returns geomeTRIC's converged flag, carrying the rung's six
# convergence targets -- each under geomeTRIC's own keyword for it.
[[case]]
name = "a PySCF relaxation is one call, carrying the rung's six geomeTRIC targets"
engine = "pyscf"
deck = ["convergence_energy = _GEOM_ETOL,", "convergence_grms = _GEOM_GRMS,", "convergence_gmax = _GEOM_GMAX,", "convergence_drms = _GEOM_DRMS,", "convergence_dmax = _GEOM_DMAX,", "maxsteps = _GEOM_MAX_STEPS,"]
deck_once = ["mol_eq, _GEOM_CONVERGED = _mb_relax("]

[[case]]
name = "...and the relaxed geometry is evaluated through mf.reset, which drops the integrals of the geometry before it"
engine = "pyscf"
deck = ["mf.reset(mol_eq)"]

[[case]]
name = "...a deck that does not optimize relaxes nothing and saves no relaxed geometry"
engine = "pyscf"
template = { optimize = false }
deck = ["e = mf.kernel()"]
deck_lacks = ["= _mb_relax(", "_save_structure(mol_eq"]

# The targets the progress log draws, in its own units: geomeTRIC's
# Ha/Bohr times 51.42208619 (the ASE convention) -- 2.0e-4 Ha/Bohr is
# 0.0102844 eV/A, 1.0e-4 is 0.0051422.
[[case]]
name = "the rung's convergence targets reach its progress log in eV/A"
engine = "pyscf"
template = { geom_gmax = 2.0e-4, geom_grms = 1.0e-4, geom_max_steps = 100 }
deck = ["'01_coarse': {", "'max_force_tol_eV_per_A': 0.0102844", "'rms_force_tol_eV_per_A': 0.0051422", "'max_geom_iter': 100,"]

# EACH RUNG CONVERGES TO ITS TIER (`engines/tuning.md` § 2.4, the authority
# for geomeTRIC's five criteria, and § 2.5 for the SCF tolerance), each
# number as the deck assigns it: loose (coarse) gmax 2.0e-3,
# grms 1.3e-3, dmax 7.2e-3, drms 4.8e-3 Ha/Bohr and Å, energy 1.0e-5 Ha, SCF
# 1e-7; publishable (medium) 4.5e-4, 3.0e-4, 1.8e-3, 1.2e-3, 1.0e-6, SCF
# 1e-9; tight 2.0e-4, 1.0e-4, 1.0e-3, 5.0e-4, 1.0e-6, SCF 1e-10 -- each
# the value Python holds when the deck runs, whatever its spelling.  Three
# of the tight rung's criteria were once wrong in the code, copied from the
# implementation it replaced (2026-08-18).
[[case]]
name = "the coarse rung's PySCF deck states the loose tier's five criteria and SCF tolerance"
engine = "pyscf"
stage_strategy = "vib-quality"
deck_says = { _GEOM_GMAX = 2.0e-3, _GEOM_GRMS = 1.3e-3, _GEOM_DMAX = 7.2e-3, _GEOM_DRMS = 4.8e-3, _GEOM_ETOL = 1.0e-5, "mf.conv_tol" = 1.0e-7 }

[[case]]
name = "...the medium rung's the publishable tier's"
engine = "pyscf"
stage_strategy = "vib-quality"
before = [["prep", "task", "--group", "1"]]
stage = "medium"
deck_says = { _GEOM_GMAX = 4.5e-4, _GEOM_GRMS = 3.0e-4, _GEOM_DMAX = 1.8e-3, _GEOM_DRMS = 1.2e-3, _GEOM_ETOL = 1.0e-6, "mf.conv_tol" = 1.0e-9 }

[[case]]
name = "...and the tight rung's the tight tier's"
engine = "pyscf"
stage_strategy = "vib-quality"
before = [["prep", "task", "--group", "1"], ["prep", "task", "--group", "2"]]
stage = "tight"
deck_says = { _GEOM_GMAX = 2.0e-4, _GEOM_GRMS = 1.0e-4, _GEOM_DMAX = 1.0e-3, _GEOM_DRMS = 5.0e-4, _GEOM_ETOL = 1.0e-6, "mf.conv_tol" = 1.0e-10 }

# The progress log's writer writes its whole header when it is built, so
# a runtime fact written after it is lost.
[[case]]
name = "every runtime fact is written before the progress log's writer is built"
engine = "pyscf"
deck_order = ["_RUNTIME_INFO[", "_RUNTIME_INFO.update(", "_mb_MolwatchEmitter("]

# The water permittivity is the Minnesota solvent set's (Gaussian's and
# PySCF's own), 78.3553.
[[case]]
name = "a solvent stated puts the deck in PCM, with its permittivity"
engine = "pyscf"
template = { solvent = "water" }
deck = ["from pyscf.solvent import pcm", "mf = mf.PCM()", "mf.with_solvent.eps = 78.3553"]

[[case]]
name = "density fitting turned off writes no density fit"
engine = "pyscf"
template = { density_fit = false }
deck_lacks = ["mf = mf.density_fit("]

[[case]]
name = "a gradient tolerance stated is written, to two significant figures"
engine = "pyscf"
template = { scf_conv_tol_grad = 1.0e-6 }
deck = ["mf.conv_tol_grad = 1.0e-06"]

[[case]]
name = "...and none stated writes none: PySCF derives its own -- nor a second-order solver none asked for"
engine = "pyscf"
deck_lacks = ["mf.conv_tol_grad =", "mf = mf.newton()"]

# The second-order solver wraps the assembled mean field: after the GPU's
# promotion, which wants the plain class, and before the stability check,
# which must ask the object that runs.
[[case]]
name = "a second-order solver wraps the mean field after the GPU promotion and before the stability check"
engine = "pyscf"
template = { scf_soscf = true, spin_treatment = "unrestricted", unpaired_electrons = 2 }
deck_order = ["mf = _mb_to_gpu(mf) if _USING_GPU else mf", "mf = mf.newton()", "_mb_stability = getattr(mf, 'stability', None)"]

# An open shell's stability is checked before the optimizer moves an atom --
# optimizing on a saddle gives a wrong geometry -- repaired rather than
# reported, judged by the energy (a degenerate shell's orbitals rotate
# freely), and said when it cannot run (`engines/pyscf.md` § 7.3).
[[case]]
name = "an open shell's stability is checked before the optimizer, repaired, judged by its energy, and said when it cannot be"
engine = "pyscf"
template = { method = "HF", spin_treatment = "unrestricted", unpaired_electrons = 2 }
deck = ["mf.make_rdm1(_internal, mf.mo_occ)", "mf.kernel(mf.make_rdm1(", "if e < _e_prev - _MB_STABILITY_ETOL:", "if not callable(_mb_stability):", "except NotImplementedError", "NOT CHECKED"]
deck_order = ["_internal = _mb_stability()[0]", "mol_eq, _GEOM_CONVERGED = _mb_relax("]

[[case]]
name = "...and a closed shell's is not checked"
engine = "pyscf"
deck_lacks = ["_mb_stability"]

[[case]]
name = "...and an open-shell single point runs its SCF once"
engine = "pyscf"
template = { method = "HF", spin_treatment = "unrestricted", unpaired_electrons = 2, optimize = false }
deck_once = ["e = mf.kernel()"]

# Hartree-Fock has no functional and no grid; dispersion is not a DFT
# question, so HF takes it like any method (`engines/pyscf.md` § 7a).
[[case]]
name = "a Hartree-Fock deck names no functional and no grid, and keeps its dispersion"
engine = "pyscf"
template = { method = "HF" }
deck = ['mf.disp = "d3bj"']
deck_lacks = ["mf.xc =", "mf.grids.level ="]

[[case]]
name = "...and dispersion none writes none"
engine = "pyscf"
template = { method = "HF", dispersion = "none" }
deck_lacks = ["mf.disp ="]

# A core potential is applied only where both halves are stated -- which
# potential, on which atoms; either half empty means none, never one picked
# (`engines/pyscf.md` § 3).
[[case]]
name = "a core potential named for named atoms reaches the molecule"
engine = "pyscf"
template = { ecp = "lanl2dz", ecp_atoms = ["H"] }
deck = ["ecp = {'H': 'lanl2dz'},"]

[[case]]
name = "no core potential stated writes none"
engine = "pyscf"
deck_lacks = ["ecp ="]

[[case]]
name = "...nor a potential named for no atoms"
engine = "pyscf"
template = { ecp = "lanl2dz", ecp_atoms = [] }
deck_lacks = ["ecp ="]

[[case]]
name = "...nor atoms named with no potential"
engine = "pyscf"
template = { ecp = "", ecp_atoms = ["*"] }
deck_lacks = ["ecp ="]

# What a rung reads of the run before it is its `restart` answer's, and
# nothing else's (`run-identity.md` § 4 rule 2): set to continue, it reads
# the checkpoint's density and the relaxed geometry where they are -- the
# geometry before PySCF builds the molecule from the deck's own atoms --
# whether or not it writes a geometry of its own; set clean, it reads
# neither, and still writes the checkpoint the next rung reads.
[[case]]
name = "a PySCF rung set to continue reads the density and geometry the run before it left, before it builds the molecule"
engine = "pyscf"
deck = ['mf.init_guess = "chkfile"']
deck_order = ["_opt_path = _mb_outfile(JOB + '_optimized.xyz')", "mol = gto.M("]

[[case]]
name = "...whether or not it writes a geometry of its own"
engine = "pyscf"
template = { save_optimized_xyz = false }
deck = ["_opt_path = _mb_outfile(JOB + '_optimized.xyz')"]

[[case]]
name = "...set clean, it reads neither, and still writes its checkpoint"
engine = "pyscf"
template = { restart = "clean" }
deck = ["mf.chkfile = "]
deck_lacks = ['mf.init_guess = "chkfile"', "_opt_path = _mb_outfile(JOB + '_optimized.xyz')"]

# running-a-job.md § 4.2, job-contracts.md § 3.2: the engine is declared in PROVENANCE, deck and run script.
[[case]]
name = "a PySCF deck and its run script declare their engine"
engine = "pyscf"
deck = ["\n# engine pyscf\n"]
run_sh = ["\n# engine pyscf\n"]

# run-identity.md § 2, § 3.2: the label is the JOB literal, unsuffixed on every rung.
[[case]]
name = "...and a later PySCF rung's deck carries the label unsuffixed"
engine = "pyscf"
stage_strategy = "publishable"
before = [["prep", "task", "--group", "1"]]
stage = "medium"
deck = ["\nJOB = \"H2\""]

# pyscf.md § 2: _initial.xyz is saved right after gto.M, before any optimization.
[[case]]
name = "a PySCF deck saves the input geometry right after building the molecule, before relaxing"
engine = "pyscf"
deck_order = ["mol = gto.M(", "\n_save_structure(mol, _mb_outfile(JOB + '_initial.xyz'", "= _mb_relax("]

# ===================================================================== #
#  A PySCF VIBRATION                                                     #
# ===================================================================== #

# THE KIND'S SCIENCE REACHES PREP.  Until 2026-08-21 the deck's own `validate`
# call skipped the spectra science: its dispatch keyed on the config's type,
# and the deck's config view matched no validator, so a green end-to-end run
# hid a gate that never ran (`engines/vibration.md` I11).  A warning is advice:
# the deck is written as asked.  With the orbital probe asked, the displacement
# enters a run, so it is advised on...
[[case]]
name = "a PySCF vibration's displacement outside the accepted window is written as asked, with the kind's advice, when the orbital probe enters it"
engine = "pyscf"
calculation = "vibration"
stage = "freq"
template = { displacement_amplitude_ang = 0.5, es_mode_selection = "all" }
said = ["0.02-0.20"]
deck_says = { DISPLACEMENT_AMPLITUDE_ANG = 0.5 }

# ...and under `skip` it enters nothing: a person is told so, never told to
# change a greyed-out field (`engines/template.md` § 5).
[[case]]
name = "...and under `skip`, where it enters nothing, is said to have no effect, with no advice on its size"
engine = "pyscf"
calculation = "vibration"
stage = "freq"
template = { displacement_amplitude_ang = 0.5 }
said = ["has no effect here"]
said_lacks = ["0.02-0.20"]

[[case]]
name = "a PySCF vibration's probe set to listed modes and listing none is said at prep: no per-mode data will come"
engine = "pyscf"
calculation = "vibration"
stage = "freq"
template = { es_mode_selection = "explicit", es_explicit_indices = "" }
said = ["[config.es_explicit_indices]", "no mode indices were entered"]

# A duplicated resolution-and-emission pair shipped 2026-08-21 and made every
# ECP deck a SyntaxError (`keyword argument repeated`) -- which only the
# compiler sees, and prep's own deck check asks the compiler
# (`pyscf/layout.py`, `check_rules`).
[[case]]
name = "a gold dimer's ECP vibration deck names its core potential once, in a deck that compiles"
engine = "pyscf"
calculation = "vibration"
stage = "freq"
structure = { elements = ["Au", "Au"], positions = [[5.0, 5.0, 5.0], [5.0, 5.0, 7.47]], cell = [10.0, 10.0, 10.0] }
template = { ecp = "lanl2dz", ecp_atoms = ["Au"] }
deck = ["{'Au': 'lanl2dz'},"]
deck_once = ["ecp ="]

# Raman's displaced SCFs ask for a CPU pick by a run-time flag on a DFT deck;
# an HF deck imports no `dft`, and that it reads none is the namespace test's
# (`tests/test_emitted_program_namespace.py`).
[[case]]
name = "a DFT Raman deck picks stock PySCF's module when a displaced SCF is forced onto the CPU"
engine = "pyscf"
calculation = "vibration"
stage = "freq"
template = { compute_raman = true }
deck = ["dft if force_cpu else"]

# WHERE ONE ENGINE HAS NOTHING TO DO WITH A SHARED SETTING'S VALUE, IT IS SAID,
# NOT HIDDEN (`engines/template.md` § 6.2a): the sweep gives every mode.
[[case]]
name = "a PySCF Raman deck says that the range asked narrows nothing, and names the range"
engine = "pyscf"
calculation = "vibration"
stage = "freq"
template = { compute_raman = true, raman_modes = "range", raman_freq_min_cm1 = 200.0 }
deck = ["narrows nothing here", "the polarizability sweep gives them all at once"]
said = ["the frequency range narrows nothing here"]

# FROZEN MEANS FROZEN THROUGH EVERY PHASE (the user's ruling, 2026-08-21;
# `engines/vibration.md` I6): the relaxation before the Hessian takes the held
# set as geomeTRIC's $freeze file, the optimization deck's own mechanism, and
# hands it over -- its indices 1-based, the road's held atom 0 its atom 1.
# Before this the relaxation silently moved them (E-V2e: no constraints reached
# geomeTRIC).  And it is said out loud, by prep and in the Methods paragraph.
[[case]]
name = "a PySCF vibration's held atoms stay held through the relaxation, and prep and the Methods paragraph say what that means"
engine = "pyscf"
calculation = "vibration"
stage = "freq"
deck = ['.write("$freeze', '.write("xyz 1', "constraints=str(", "static field of the fixed", "partial Hessian"]
said = ["atom index 0 (H)", "taken over the free atoms only"]
said_once = ["holds them fixed"]

[[case]]
name = "...and one holding none carries none of it"
engine = "pyscf"
calculation = "vibration"
stage = "freq"
structure = { elements = ["H", "H"], positions = [[5.0, 5.0, 5.0], [5.0, 5.0, 5.741]], cell = [10.0, 10.0, 10.0] }
deck_lacks = ["$freeze", "constraints=", "static field of the fixed", "partial Hessian"]
said_lacks = ["holds them fixed"]

# EACH FACT EARNS ONE FINDING (the dedup ruling, 2026-08-21): the parity of the
# electronic state is the state's own family, asked once for every kind; the
# grid's verdict the kind's, the engine's copy deferring on a vibration deck.
# A PySCF vibration offers `restricted` alone (`engines/template.md` § 6.3a), so
# its mismatch is a closed shell on an odd count: a methyl's nine electrons.
[[case]]
name = "a closed shell on an odd count is one finding on a PySCF vibration"
engine = "pyscf"
calculation = "vibration"
stage = "freq"
structure = { elements = ["C", "H", "H", "H"], positions = [[5.0, 5.0, 5.0], [6.08, 5.0, 5.0], [4.46, 5.935, 5.0], [4.46, 4.065, 5.0]], cell = [10.0, 10.0, 10.0] }
template = { spin_treatment = "restricted", unpaired_electrons = 0 }
said_once = ["The electron count and the unpaired count disagree"]

[[case]]
name = "...an odd count on an even number of electrons, one on an optimization"
engine = "pyscf"
stage_strategy = ""
template = { spin_treatment = "unrestricted", unpaired_electrons = 1 }
said_once = ["The electron count and the unpaired count disagree"]

[[case]]
name = "...and a hybrid's grid below its minimum, one on a vibration"
engine = "pyscf"
calculation = "vibration"
stage = "freq"
template = { functional = "b3lyp", grid_level = 1 }
said_once = ["warn [config.grid_level]"]
said = ["for a hybrid functional"]
