# THE RECORD THE PROBE WRITES -- `docs/configuration.md` § 5 (M-1, M-6).
#
# A machine's facts are measured by `jobset probe` on that machine; what the
# probe cannot see there is declared to it (`--set`, `--scheduler`), and over
# an existing record it asks, per difference, which value survives -- No, the
# default, keeps the record; silence is no; `--yes` takes the probe.
#
# `tests/test_machine_record.py` runs every case down the road a person runs,
# through the one runner every contract table shares (`tests/support/road.py`,
# `run_road_case`, whose header names each key).  A row about the record
# alone ends after the probe (`ends_at = "probe"`).
#
# A RULE CHANGES, ITS ROWS CHANGE.  A case is a row here, never a function.

[[case]]
name = "a fact the probe cannot see is declared to it, and lands typed"
ends_at = "probe"
probe = [["--set", "gpus_per_node=4", "--set", "gpu_type=a100", "--set", "mem_total_gb=1536.5"]]
record_says = { topology = { gpus_per_node = 4, gpu_type = "a100", mem_total_gb = 1536.5 } }
record_declared = ["topology"]

[[case]]
name = "--scheduler declares the kind, and --name files the record under the name a machine preps it by"
ends_at = "probe"
probe = [["--name", "sol-x", "--scheduler", "slurm", "--set", "cores_per_socket=64"]]
record_says = { scheduler = { kind = "slurm" }, topology = { cores_per_socket = 64 } }
record_declared = ["scheduler", "topology"]
probe_said = ["--target sol-x"]

# ---- THE SCHEDULER: its kind, and where its commands are there
# (`configuration.md` § 5 M-2, `execution/scheduler.md` § 6a).  The probe
# looks for each kind's submit command on PATH where it runs; what it cannot
# find is declared to it.

[[case]]
name = "where no scheduler's submit command is on PATH, the probe records a machine with no scheduler, naming no command"
ends_at = "probe"
probe_path_lacks = ["sbatch"]
probe = [[]]
record_says = { scheduler = { kind = "workstation" } }
probe_said = ["Machine: scheduler=workstation  cores/socket="]

[[case]]
name = "--scheduler names a kind with a queue whose submit command is neither on PATH nor declared -- refused, saying how to declare where it is"
ends_at = "probe"
probe_path_lacks = ["sbatch"]
probe = [["--scheduler", "slurm"]]
probe_refused = ["names no submit command", "--set scheduler.submit=PATH"]

[[case]]
name = "the probe measures whether this machine's manager's `run` enters an environment, and the record says so with the manager it tried"
ends_at = "probe"
probe = [[]]
record_says = { manager_run = { run_works = true } }

[[case]]
name = "where a scheduler's submit command is on PATH, the probe records its kind, and each command where PATH finds it"
ends_at = "probe"
probe = [[]]
record_says = { scheduler = { kind = "slurm" } }
record_found_on_path = { submit = "sbatch" }

[[case]]
name = "--set scheduler.submit declares where the submit command is -- a site's own wrapper -- and the record keeps it, declared"
ends_at = "probe"
probe = [["--set", "scheduler.submit=/opt/site/bin/submit-wrapper"]]
record_says = { scheduler = { kind = "slurm", submit = "/opt/site/bin/submit-wrapper" } }
record_declared = ["scheduler"]

[[case]]
name = "...and the way out, taken: a site whose only submit command is its own wrapper names the kind and where the wrapper is, and the record keeps both, declared"
ends_at = "probe"
probe_path_lacks = ["sbatch"]
probe = [["--scheduler", "slurm", "--set", "scheduler.submit=/opt/site/bin/submit-wrapper"]]
record_says = { scheduler = { kind = "slurm", submit = "/opt/site/bin/submit-wrapper" } }
record_declared = ["scheduler"]

[[case]]
name = "over a record, a declared submit command is asked about like every other difference, and No keeps it, still declared"
ends_at = "probe"
probe = [["--set", "scheduler.submit=/opt/site/bin/submit-wrapper"],
         { flags = [], answers = "n\nn\nn\nn\nn\nn\n" }]
record_says = { scheduler = { kind = "slurm", submit = "/opt/site/bin/submit-wrapper" } }
record_declared = ["scheduler"]
probe_said = ["kept recorded: scheduler"]

[[case]]
name = "a command declared where no scheduler is found, and no kind named, is refused -- asking which kind it is"
ends_at = "probe"
probe_path_lacks = ["sbatch"]
probe = [["--set", "scheduler.submit=/opt/site/bin/submit-wrapper"]]
probe_refused = ["has no queue, and names commands (submit)", "--scheduler slurm"]

[[case]]
name = "over a record, each difference is asked, and No -- the default -- keeps what the record says"
ends_at = "probe"
probe = [["--set", "gpus_per_node=4", "--set", "gpu_type=a100"],
         { flags = ["--set", "gpus_per_node=1", "--set", "gpu_type=rtx"], answers = "n\nn\nn\nn\nn\n" }]
record_says = { topology = { gpus_per_node = 4, gpu_type = "a100" } }
probe_said = ["kept recorded"]

[[case]]
name = "a declared fact kept over a probe that cannot see it stays declared -- its section's source keeps flag"
ends_at = "probe"
probe = [["--set", "mem_total_gb=1536.5"],
         { flags = [], answers = "" }]
record_says = { topology = { mem_total_gb = 1536.5 } }
record_declared = ["topology"]

[[case]]
name = "with no environment manager answering, the record leaves out which environments exist -- and the probe says what it left out, and why"
ends_at = "probe"
machine_config = { env_init = { activation = "conda activate", preamble = "true" }, envs = { manager = "/nonexistent/bin/conda" } }
probe = [[]]
record_lacks = ["conda_envs", "env_arch"]
probe_said = ["`conda_envs` and `env_arch` are left out of the record", "/nonexistent/bin/conda"]

[[case]]
name = "...and Yes takes the probed value"
ends_at = "probe"
probe = [["--set", "gpus_per_node=4", "--set", "gpu_type=a100"],
         { flags = ["--set", "gpus_per_node=1", "--set", "gpu_type=rtx"], answers = "y\ny\ny\ny\ny\n" }]
record_says = { topology = { gpus_per_node = 1, gpu_type = "rtx" } }

[[case]]
name = "an unanswered question declines: a scripted probe without --yes changes nothing"
ends_at = "probe"
probe = [["--set", "gpus_per_node=4", "--set", "gpu_type=a100"],
         { flags = ["--set", "gpus_per_node=1", "--set", "gpu_type=rtx"], answers = "" }]
record_says = { topology = { gpus_per_node = 4, gpu_type = "a100" } }
probe_said = ["silence is no"]

[[case]]
name = "--yes takes every probed value, asking nothing"
ends_at = "probe"
probe = [["--set", "gpus_per_node=4", "--set", "gpu_type=a100"],
         ["--set", "gpus_per_node=1", "--set", "gpu_type=rtx"]]
record_says = { topology = { gpus_per_node = 1, gpu_type = "rtx" } }

# HOW A SHELL ENTERS AN ENVIRONMENT is this machine's molbuilder.json's: the
# probe copies it as it stands, asking nothing, and says when it changed
# (`configuration.md` § 4, M-6).
[[case]]
name = "with no env_init in this machine's molbuilder.json the probe writes nothing -- it is required, and a record never keeps one from before"
ends_at = "probe"
machine_config = {}
record = { env_init = { activation = "source activate", preamble = "module load mamba" } }
probe = [["--scheduler", "workstation"]]
probe_refused = ["states no `env_init.activation`", "molbuilder envs init-config"]

[[case]]
name = "a probe nobody answers copies this machine's env_init over the record's, asking nothing, and says so -- and the stamp follows the probe"
ends_at = "probe"
machine_config = { env_init = { activation = "conda activate", preamble = "source /home/u/miniconda3/etc/profile.d/conda.sh" } }
record = { env_init = { activation = "source activate", preamble = "module load mamba" }, detected_at = "2026-08-01T00:00:00+00:00" }
probe = [{ flags = [], answers = "" }]
record_says = { env_init = { activation = "conda activate", preamble = "source /home/u/miniconda3/etc/profile.d/conda.sh" } }
probe_said = ["env_init: copied from this machine's molbuilder.json"]
record_stamped = true

[[case]]
name = "a record that already says what the probe found is told so, and asked nothing"
ends_at = "probe"
probe = [["--set", "gpus_per_node=4"], { flags = ["--set", "gpus_per_node=4"], answers = "" }]
record_says = { topology = { gpus_per_node = 4 } }
probe_said = ["already says this"]

