# WHAT MOLBUILDER WRITES, BY NAME -- `docs/execution/job-contracts.md` § 2.2,
# `docs/execution/project-layout.md` § 5.
#
# The catalogue (`runfiles.WRITTEN`) is the one source of every file
# molbuilder writes into a calculation folder, and the Task setup card is its
# reading: *"a card cannot show a spelling the writers do not use"* (§ 2.2a).
# So every name the card gives a stage -- in the calculation's own shape,
# unless the row says it is written only sometimes -- is on disk once the
# stage has been prepped, and launched where the row says so.
#
# Every run here is made on the road: `jobset prep` and `jobset launch`, our
# wrapper running the suite's stand-in engine (`process/testing.md` § 6).
# `tests/test_the_catalogue.py` runs every case through the one runner every
# contract table shares (`tests/support/road.py`, `run_road_case`).
#
# A RULE CHANGES, ITS ROWS CHANGE.  A case is a row here, never a function.

machine = "workstation"

[run_base.siesta]
mpi_np = 1
omp_threads = 1

[[case]]
name = "every file the card names for a stage is there as it names it -- a launched stage and the stage prepped after it, the hierarchy"
stand_in = { leaves_restart = true }
before = [["prep", "run", "coarse"],
          ["launch", "run", "coarse", "--mode", "direct", "--yes"]]
stage = "medium"
card_written = [{ stage = "coarse", moments = ["prep", "launch", "run"] },
                { stage = "medium", moments = ["prep"] }]

[[case]]
name = "...and the flat shape"
shape = "flat"
stand_in = { leaves_restart = true }
before = [["prep", "run", "coarse"],
          ["launch", "run", "coarse", "--mode", "direct", "--yes"]]
stage = "medium"
card_written = [{ stage = "coarse", moments = ["prep", "launch", "run"] },
                { stage = "medium", moments = ["prep"] }]
