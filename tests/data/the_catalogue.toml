# WHAT MOLBUILDER WRITES, BY NAME -- `docs/execution/job-contracts.md` § 2.2,
# `docs/execution/project-layout.md` § 5.
#
# The catalogue (`runfiles.WRITTEN`) is the one source of every file
# molbuilder writes into a calculation folder, and the Task setup card is its
# reading: *"a card cannot show a spelling the writers do not use"* (§ 2.2a).
# So every name the card gives a stage --
# unless the row says it is written only sometimes -- is on disk once the
# stage has been prepared, and launched where the row says so.
#
# Every row here prepares; the names a launch and its run write are checked on
# real runs (`tests/test_the_road_on_real_runs_e2e.py`, plan § 5y).
# `tests/test_the_catalogue.py` runs every case through the one runner every
# contract table shares (`tests/support/road.py`, `run_road_case`).
#
# A RULE CHANGES, ITS ROWS CHANGE.  A case is a row here, never a function.

machine = "workstation"

[run_base.siesta]
mpi_np = 1
omp_threads = 1

[[case]]
name = "a SIESTA calculation's pseudopotentials are where its run opens them: its one copy in pseudos/, and a real copy beside the deck in the stage's run folder -- SIESTA opens only its working directory"
made = ["pseudos/H.psml", "01_coarse/run-0/H.psml"]

# ONE HOME FOR THE LIVE LOG, AND THE HOME IS THE RUN'S FOLDER (`project-layout.md`
# § 1.0: a run directory "holds everything it produces").  MEASURED, 2026-09-19,
# on a finished Raman run: prep seeded the log beside the deck it renders, in the
# stage's folder, and the run then wrote its own inside its run -- a 971-byte
# stub with no `# concluded:` footer in `01_raman/`, the real concluded log in
# `01_raman/run-0/`, one name.  An unconcluded log is how every reader tells a
# run is still going, so the stage's folder reported a FINISHED calculation as
# Running, permanently, and offered the stub to open.
[[case]]
name = "a stage's progress log is seeded in its run and nowhere else -- two homes for one log reported a finished run as running"
made = ["01_coarse/run-0/H2_01_coarse.molwatch.log"]
made_lacks = ["01_coarse/H2_01_coarse.molwatch.log"]

[[case]]
name = "every file the card names for a prepared stage is there as it names it"
card_written = [{ stage = "coarse", moments = ["prep"] }]
