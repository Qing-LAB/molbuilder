# WHAT A TRANSPORT CALCULATION'S DECK SAYS -- written as its engines read it:
# `docs/engines/transport.md`.
#
# A transport calculation starts from a finished relaxation, so every row cites
# the junction a real SIESTA relaxed: `tests/test_transport_decks_e2e.py` runs
# each case through the runner every contract table shares (`tests/support/
# road.py`, `run_road_case`, whose header names each key), with that pair as its
# `structure`.

machine = "workstation"

[run_base.siesta]
mpi_np = 1
omp_threads = 1

[run_base.pyscf]
threads = 1

# THE ONE QUEUE A ROW ON A MACHINE WITH A SCHEDULER SENDS TO, `machine = "this"`.
[[queues]]
name = "gpu"
partition = "gpu"
qos = "public"
max_time = "1-00:00:00"
max_cores = 48
gpu = { a100 = 4 }
node_types = [{ cores = 48, nodes = 5, gpu = { a100 = 4 } }]

# A REAL IN DECIMAL NOTATION IS WRITTEN AS SET, every digit (F12's reviews,
# D2: a 0.00625 V bias written 0.0063, a 5e-7 eV broadening written 0) --
# the decimal twin of the deck table's scientific-notation row.
[[case]]
name = "a value in decimal notation is written as it was set, never rounded"
calculation = "transport"
stage = "device"
before = [["prep", "task", "--group", "1"]]
template = { negf_eq_pole_ev = 12.3456789 }
deck_says = { "TS.Contours.Eq.Pole" = "12.3456789 eV" }

# `SolutionMethod` switches the SCF to NEGF; `TS.SolutionMethod` is how the
# Green's function is inverted, and 5.4.2 stops on `transiesta` there
# ("Unrecognized TranSiesta solution method", measured): two keywords, two
# values.
[[case]]
name = "the device deck states its label, the NEGF solver and how the Green's function is inverted"
calculation = "transport"
stage = "device"
before = [["prep", "task", "--group", "1"]]
deck_says = { SystemLabel = "H2", SolutionMethod = "transiesta", "TS.SolutionMethod" = "BTD" }

# THE DEVICE'S CHARGE CORRECTION is TranSIESTA's `TS.dQ`, written as chosen:
# `none`, TranSIESTA's own default, where nobody chose (`engines/transport.md`
# § 2a.12, § 2a.13).  A value the person chose reaching the device deck is the
# generated row of `test_every_value_a_rungs_tab_offers_reaches_its_deck`.
[[case]]
name = "the device deck states its charge correction -- TranSIESTA's own none where nobody chose one"
calculation = "transport"
stage = "device"
before = [["prep", "task", "--group", "1"]]
deck_says = { "TS.dQ" = "none" }

# THE BIAS WINDOW'S SPACING (`engines/transport.md` § 2a.11, *The levers*;
# the user, 2026-11-15: "Only give error when you have no points"): refused
# only when it leaves the window no point; one point is written as set.
# 0.001 V at 10 K is a 0.0096 eV window: 0.1 eV gives it none, 0.01 eV one.
[[case]]
name = "a device point under bias whose spacing leaves its window no point is refused at prep, naming the largest that gives one"
calculation = "transport"
bias = "0,0.001"
stage = "device"
before = [["prep", "task", "--group", "1"]]
template = { negf_neq_spacing_ev = 0.1, electronic_temperature = 10.0 }
refused = ["[config.negf_neq_spacing_ev]", "no point", "at or below 0.0192 eV"]

[[case]]
name = "...one point is written as set, nothing said"
calculation = "transport"
bias = "0,0.001"
stage = "device"
before = [["prep", "task", "--group", "1"]]
template = { negf_neq_spacing_ev = 0.01, electronic_temperature = 10.0 }
said_lacks = ["[config.negf_neq_spacing_ev]"]

[[case]]
name = "...and 0 V has no window and no check"
calculation = "transport"
stage = "device"
before = [["prep", "task", "--group", "1"]]
template = { negf_neq_spacing_ev = 0.1, electronic_temperature = 10.0 }
deck = ["delta 0.1 eV"]
said_lacks = ["[config.negf_neq_spacing_ev]"]

# A VALUE OF THE CALCULATION'S RUN CARD reaches the rungs the item's `stages`
# names (`engines/stages.md` § 6.8d, `execution/gpu.md` § 1.1): each SCF rung's
# job asks the GPU, and the transmission's -- `tbtrans` runs on no GPU -- holds
# none, so prep's G5 has nothing to refuse there (measured 2026-10-17: the
# transmission a GPU job, holding a device it never uses).
[[case]]
name = "a calculation run on the GPU: its first group's job asks it"
calculation = "transport"
stage = "seed"
machine = "this"
run = { use_gpu = true, gpu_count = 1, mpi_np = 4 }
allocation = { domain = "gpu", time = "01:00:00", mem = "8G" }
header = ["#SBATCH --gres=gpu:1"]

[[case]]
name = "...its device's job asks it"
calculation = "transport"
stage = "device"
machine = "this"
before = [["prep", "task", "--group", "1"]]
run = { use_gpu = true, gpu_count = 1, mpi_np = 4 }
allocation = { domain = "gpu", time = "01:00:00", mem = "8G" }
header = ["#SBATCH --gres=gpu:1"]

[[case]]
name = "...and its transmission's holds none"
calculation = "transport"
stage = "transmission"
machine = "this"
before = [["prep", "task", "--group", "1"], ["prep", "task", "--group", "2"]]
run = { use_gpu = true, gpu_count = 1, mpi_np = 4 }
allocation = { domain = "gpu", time = "01:00:00", mem = "8G" }
header_lacks = ["--gres"]
