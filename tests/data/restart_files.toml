# THE RESTART FILES IN EFFECT -- `docs/execution/job-contracts.md` § 4.2a,
# `docs/execution/architecture.md` § 3.2 (`warm_list`).
#
# A calculation follows molbuilder's restart-file list for its engine unless it
# has its own `warm-files.toml` beside `task.json`, made by copying the
# engine's file and editing it -- and then EVERY reader follows its own
# (plan W36 ⑧; user: "keep customization, make every reader use it").  The
# rows here ask two of them: what each stage's job declares it carries, and
# the run script's restart check.
#
# `tests/test_restart_files.py` runs every case down the road a person runs,
# through the one runner every contract table shares (`tests/support/road.py`,
# `run_road_case`, whose header names each key).
#
# A RULE CHANGES, ITS ROWS CHANGE.  A case is a row here, never a function.

machine = "workstation"

[run_base.siesta]
mpi_np = 2
omp_threads = 1

[run_base.pyscf]
threads = 1

[[case]]
name = "a restart file a calculation's own list adds is one its run script checks for"
own_warm_files = { add = [".NEWSTATE"] }
run_sh = ["NEWSTATE"]

# ...and one it withholds -- `carry` taken off its row, as the shipped list
# says to do for one debugging ladder -- is one no stage's job declares:
# prep writes what the list declares, so it knows no suffix of its own
# (`run-identity.md` § 4 rules 1 and 4: a declaration on the job, never
# engine knowledge in the producer).  The declaration is what the launch
# then judges pair by pair (`warm_carry`: coarse's CG history is not handed
# to medium's Broyden, `job-contracts.md` § 4.2a) -- these rows read the
# declaration.
[[case]]
name = "...and one it withholds is one no stage's job declares it carries"
own_warm_files = { withhold = [".DM"] }
before = [["prep", "task", "--group", "1"]]
stage = "medium"
plan_carries = { coarse = ["H2.XV", "H2.CG"], medium = ["H2.XV", "H2.CG"] }
# ...and the plan names WHICH list answered, so a surprising carry is
# debuggable from the calculation alone.
made_says = { "STAGE-PLAN.md" = ["P/optimization/H2/warm-files.toml"] }

# ...and with every carried suffix withheld, no stage declares anything: the
# producer forces none of its own, `.XV` included.
[[case]]
name = "...and with every one withheld, no stage's job declares any file"
own_warm_files = { withhold = [".DM", ".XV", ".CG"] }
before = [["prep", "task", "--group", "1"]]
stage = "medium"
plan_carries = { coarse = [], medium = [] }

[[case]]
name = "a run script says what its deck does with the state a run leaves, read off the deck as prep writes it -- a stage that continues (`running-a-job.md` § 3.5)"
run_sh = ["this deck says 'start from: continue'"]

# EVERY KEY ITS RUN READS, ANSWERED (`run-identity.md` § 4 rule 2): SIESTA
# 5.4.2 reads a .DM it finds unless told `.false.`, and an .XV or .CG only
# when told `.true.`, so the deck states each answer.  `MD.UseSaveCG` is read in a CG
# relaxation alone (`read_options.F90`'s cg branch), so only a CG deck
# writes it.
[[case]]
name = "a stage set restart: clean answers .false. to every restart key its run reads, the CG one with them"
template = { restart = "clean" }
deck = ["DM.UseSaveDM .false.", "MD.UseSaveXV .false.", "MD.UseSaveCG .false."]

[[case]]
name = "...a stage that continues answers .true. -- and a Broyden stage writes no CG key"
stage_strategy = ""
template = { restart = "continue", relax_type = "Broyden" }
deck = ["DM.UseSaveDM .true.", "MD.UseSaveXV .true."]
deck_lacks = ["MD.UseSaveCG"]

[[case]]
name = "...a continuing stage that relaxes nothing still reads the geometry it continues from"
stage_strategy = ""
template = { restart = "continue", relax_type = "none" }
deck = ["DM.UseSaveDM .true.", "MD.UseSaveXV .true."]
deck_lacks = ["MD.UseSaveCG"]


# The run script's Mode line says what the deck does with prior state
# (`running-a-job.md` § 3.5): a clean deck reads none of what lies on disk.
[[case]]
name = "a clean stage's run script says its deck reads no prior state"
template = { restart = "clean" }
run_sh = ['_mode="CLEAN (this deck reads no prior state']
run_sh_lacks = ['_mode="CONTINUES (engine will load']

[[case]]
name = "...and a continuing stage's says what the engine will load"
template = { restart = "continue" }
run_sh = ['_mode="CONTINUES (engine will load']
run_sh_lacks = ['_mode="CLEAN (']


# A failed run says what a launch again will do (`running-a-job.md` § 3.5),
# and a stop at its wall says so first (§ 3.6) -- a run is one start, so the
# way on is the next launch.  THE SILENT FAILURE: a failure that ends with
# no word on how to go on, or a wall stop read as any other failure.
[[case]]
name = "a continuing stage's run script says, on a failure, that a launch again continues warm -- and a stop at its wall says so first"
template = { restart = "continue" }
run_sh = ['what a launch again will do: launch the stage again to continue warm from the files this run saved',
          'stopped at its wall: launch the stage again to continue warm from the files this run saved']

# HOW IT ENDED, asked of the framework's reader for every engine
# (`running-a-job.md` § 3.5): the output read by the reader its role names,
# with the session log as the engine's stderr where the output keeps it
# apart (SIESTA's), and the advice for its cause asked by meaning, never by a
# marker the script types.  THE SILENT FAILURE: a run of one engine whose
# failure says nothing of how it ended.
[[case]]
name = "a SIESTA run script asks how a failure ended with its session log as the engine's stderr, and the advice for its cause by meaning"
run_sh = ['--stderr "$_runwrap_log"', 'how it ended: ', '$(_mb_ending advice)']
run_sh_lacks = ["stopped-by", "IMAX = 0"]

[[case]]
name = "...and a PySCF run script says how it ended too, its output carrying the engine's stderr"
engine = "pyscf"
run_sh = ['how it ended: ', 'ending "$_out_file" "$@"']
run_sh_lacks = ['--stderr "$_runwrap_log"',
                # its output's family names no stop at the wall and keeps no
                # advice (its catalogue row's `stops` reader), so neither is asked
                "if _mb_ending out-of-time; then", "$(_mb_ending advice)"]

[[case]]
name = "...and a clean stage's, that a launch again starts over from its deck's coordinates"
template = { restart = "clean" }
run_sh = ['what a launch again will do: this deck reads no prior state, so a launch again starts over from its own coordinates']
run_sh_lacks = ['continue warm from the files this run saved']
