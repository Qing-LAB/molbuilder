# THE RESTART FILES IN EFFECT -- `docs/execution/job-contracts.md` § 4.2a,
# `docs/execution/architecture.md` § 3.2 (`warm_list`).
#
# A calculation follows molbuilder's restart-file list for its engine unless it
# has its own `warm-files.toml` beside `task.json`, made by copying the
# engine's file and editing it -- and then EVERY reader follows its own: what
# the next stage takes, `jobset status`'s warm-files column, and the run
# script's restart check (plan W36 ⑧; user: "keep customization, make every
# reader use it").
#
# `tests/test_restart_files.py` runs every case down the road a person runs,
# through the one runner every contract table shares (`tests/support/road.py`,
# `run_road_case`, whose header names each key).
#
# A RULE CHANGES, ITS ROWS CHANGE.  A case is a row here, never a function.

machine = "workstation"

[run_base.siesta]
mpi_np = 2
omp_threads = 1

[[case]]
name = "a restart file a calculation's own list adds is one its run script checks for"
own_warm_files = { add = [".NEWSTATE"] }
run_sh = ["NEWSTATE"]

[[case]]
name = "a run script says what its deck does with the state a run leaves, read off the deck as prep writes it -- a stage that continues (`running-a-job.md` § 3.5)"
run_sh = ["This deck says 'start from: continue'"]

# EVERY KEY ITS RUN READS, ANSWERED (`run-identity.md` § 4 rule 2): SIESTA
# 5.4.2 reads a .DM it finds unless told `.false.`, and an .XV or .CG only
# when told `.true.`, so the deck states each answer.  `MD.UseSaveCG` is read in a CG
# relaxation alone (`read_options.F90`'s cg branch), so only a CG deck
# writes it.
[[case]]
name = "a stage set restart: clean answers .false. to every restart key its run reads, the CG one with them"
template = { restart = "clean" }
deck = ["DM.UseSaveDM .false.", "MD.UseSaveXV .false.", "MD.UseSaveCG .false."]

[[case]]
name = "...a stage that continues answers .true. -- and a Broyden stage writes no CG key"
stage_strategy = ""
template = { restart = "continue", relax_type = "Broyden" }
deck = ["DM.UseSaveDM .true.", "MD.UseSaveXV .true."]
deck_lacks = ["MD.UseSaveCG"]

[[case]]
name = "...a continuing stage that relaxes nothing still reads the geometry it continues from"
stage_strategy = ""
template = { restart = "continue", relax_type = "none" }
deck = ["DM.UseSaveDM .true.", "MD.UseSaveXV .true."]
deck_lacks = ["MD.UseSaveCG"]


# The run script's Mode line says what the deck does with prior state
# (`running-a-job.md` § 3.5): a clean deck reads none of what lies on disk.
[[case]]
name = "a clean stage's run script says its deck reads no prior state"
template = { restart = "clean" }
run_sh = ['_mode="CLEAN (this deck reads no prior state']
run_sh_lacks = ['_mode="WARM-RESTART (silent; engine will load']

[[case]]
name = "...and a continuing stage's says what the engine will load"
template = { restart = "continue" }
run_sh = ['_mode="WARM-RESTART (silent; engine will load']
run_sh_lacks = ['_mode="CLEAN (']

