# THE LAUNCH PROTOCOL -- `docs/execution/job-system.md` § 6.0.
#
# `launch` is built as `prep` is: one plan, made with nothing written, shown
# and asked, then sent as it was shown -- and every decision written down in
# the calculation's ledger: every refusal, the question and its answer, each
# submission as it goes (a run here when it starts).  A dry run stops at the
# question and writes nothing, the ledger included.
#
# Every row here stops before an engine would run -- a refusal, or a dry run.
# What a launch writes as its run starts -- its launch record, its ledger
# line, a benchmark's walk -- is read off real runs (`tests/test_the_road_on_real_runs_e2e.py`,
# plan § 5y).  `tests/test_launch_protocol.py` runs every case through the
# one runner every contract table shares (`tests/support/road.py`,
# `run_road_case`, whose header names each key).  What no row can reach --
# the folder changing between a launch's plan and its send, inside one
# command -- is the API-level check beside the launch door's tests
# (`tests/test_launch_door.py`).
#
# A RULE CHANGES, ITS ROWS CHANGE.  A case is a row here, never a function.

machine = "workstation"

[run_base.siesta]
mpi_np = 1
omp_threads = 1

[[case]]
name = "a refusal is written down -- one the verb says before anything is planned too"
launch = ["--time", "1h"]
launch_mode = "direct"
launch_sends = true
launch_refused = "--time: a submitted job's wall, restated on the line that sends it -- `--mode direct` does not read it"
after_launch = { ledger_holds = ["refused"] }

[[case]]
name = "a refused dry run writes nothing"
launch = ["--time", "1h"]
launch_mode = "direct"
launch_refused = "--time: a submitted job's wall, restated on the line that sends it -- `--mode direct` does not read it"
launch_writes_nothing = true

# ---- A RUN HERE, IN THE BACKGROUND UNLESS SAID (job-system.md § 6.0, *A run
# here starts in the background, unless said*): planned, shown and asked as
# any run here; what it runs once started is read off real runs.
[[case]]
name = "a run here waited on is planned, shown and asked as one left in the background is -- a dry run, which writes nothing"
launch = ["--foreground"]
launch_mode = "direct"
listing = ["WOULD run", "bash H2_01_coarse.run.sh"]
launch_writes_nothing = true

[[case]]
name = "a launch waited on, on a queue, is refused, naming why: nothing runs here to wait for -- with the launch as typed for each mode, a queue's line without it"
machine = "this"
queues = [{ name = "cpu", partition = "cpu", qos = "public", max_time = "1-00:00:00", max_cores = 64, node_types = [{ cores = 64, nodes = 10 }] }]
allocation = { domain = "cpu", time = "01:00:00", mem = "8G" }
launch = ["--foreground"]
launch_mode = "submit"
launch_sends = true
launch_refused = ["--foreground: waits for a run here", "--stage coarse --foreground --mode direct", "--stage coarse --mode submit"]
after_launch = { ledger_holds = ["refused"] }

# ---- THE LINE IS THE RECORD'S SCHEDULER'S (`scheduler.md` § 6a): its kind's
# words, its submit command where the machine's record says it is -- never
# whatever this computer's PATH finds, where the suite's own refusing
# `sbatch` stands first and says other words.
[[case]]
name = "a launch sends its line with the submit command the machine's record names, where the record says it is -- not whatever PATH finds first"
machine = "this"
queues = [{ name = "cpu", partition = "cpu", qos = "public", max_time = "1-00:00:00", max_cores = 64, node_types = [{ cores = 64, nodes = 10 }] }]
allocation = { domain = "cpu", time = "01:00:00", mem = "8G" }
launch = []
launch_mode = "submit"
launch_sends = true
launch_refused = ["refused coarse (rc=1)", "the basic tests send nothing to a scheduler"]
after_launch = { ledger_holds = ["refused"] }

# ...FROM THE CALCULATION'S OWN COPY of its machine's record (`scheduler.md`
# § 6a; `configuration.md` M-3): a calculation prepared for another machine
# is sent with that machine's line, whatever this one's record says.
[[case]]
name = "a calculation prepared for another machine shows the line its own copy of that machine's record gives -- this machine having no scheduler"
machine = "named"
queues = [{ name = "cpu", partition = "cpu", qos = "public", max_time = "1-00:00:00", max_cores = 64, node_types = [{ cores = 64, nodes = 10 }] }]
allocation = { domain = "cpu", time = "01:00:00", mem = "8G" }
launch = []
launch_mode = "submit"
line = ["-J H2/coarse", "H2_01_coarse.sbatch --run 0"]

# ---- ASKED ABOUT WHERE NO SCHEDULER IS (`running-a-job.md` § 5.5: no
# scheduler here is an answer): a group's one job answers as a stage does.
# Whether there is one to ask is the machine's record's kind, never this
# computer's PATH -- where the suite's `sbatch` stands (`scheduler.md` § 6a).
[[case]]
name = "a group asked about on a machine whose record names no scheduler is answered, as a stage is -- nothing to wait for, whatever PATH holds"
groups = [1, 1]
stage_run = { medium = { restart = "clean" } }
stage = ["coarse", "medium"]
launch = []
launch_stage = ["coarse", "medium"]
launch_mode = "ask"
listing = ["no scheduler on this machine"]

# ---- A BENCHMARK'S WALK (job-system.md § 6.0, *A benchmark's walk*)

# THE DRY RUN SHOWS THE PLAN THE LAUNCH WOULD SEND (`job-system.md` § 6.0):
# what a launch writes as its run starts is read off real runs (plan § 5y).
[[case]]
name = "a launch naming no stage plans the one stage prepared and not launched, started in the background -- a dry run, which writes nothing"
launch = []
launch_stage = ""
launch_mode = "direct"
listing = ["WOULD start", "bash H2_01_coarse.run.sh"]
launch_writes_nothing = true

[[case]]
name = "a benchmark run here is planned as one walk of its unlaunched trials, as a shelf is on a queue"
bench = { mpi_np = [1, 2], omp_threads = [1] }
launch = []
launch_mode = "direct"
listing = ["bench-group", "rides the group -np 2 -omp 1"]
launch_writes_nothing = true
