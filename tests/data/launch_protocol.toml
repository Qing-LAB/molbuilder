# THE LAUNCH PROTOCOL -- `docs/execution/job-system.md` § 6.0.
#
# `launch` is built as `prep` is: one plan, made with nothing written, shown
# and asked, then sent as it was shown -- and every decision written down in
# the calculation's ledger: every refusal, the question and its answer, each
# submission as it goes (a run here when it starts).  A dry run stops at the
# question and writes nothing, the ledger included.
#
# Every row here stops before an engine would run -- a refusal, or a dry run.
# What a launch writes as its run starts -- its launch record, its ledger
# line, a benchmark's walk -- is read off real runs (`tests/test_the_road_on_real_runs_e2e.py`,
# plan § 5y).  `tests/test_launch_protocol.py` runs every case through the
# one runner every contract table shares (`tests/support/road.py`,
# `run_road_case`, whose header names each key).  What no row can reach --
# the folder changing between a launch's plan and its send, inside one
# command -- is the API-level check beside the launch door's tests
# (`tests/test_launch_door.py`).
#
# A RULE CHANGES, ITS ROWS CHANGE.  A case is a row here, never a function.

machine = "workstation"

[run_base.siesta]
mpi_np = 1
omp_threads = 1

[[case]]
name = "a refusal is written down -- one the verb says before anything is planned too"
launch = ["--time", "1h"]
launch_mode = "direct"
launch_sends = true
launch_refused = "--time: what a scheduler is asked for"
after_launch = { ledger_holds = ["refused"] }

[[case]]
name = "a refused dry run writes nothing"
launch = ["--time", "1h"]
launch_mode = "direct"
launch_refused = "--time: what a scheduler is asked for"
launch_writes_nothing = true

# ---- A BENCHMARK'S WALK (job-system.md § 6.0, *A benchmark's walk*)

# THE DRY RUN SHOWS THE PLAN THE LAUNCH WOULD SEND (`job-system.md` § 6.0):
# what a launch writes as its run starts is read off real runs (plan § 5y).
[[case]]
name = "a launch naming no stage plans the one stage prepared and not launched -- a dry run, which writes nothing"
launch = []
launch_stage = ""
launch_mode = "direct"
listing = ["WOULD run", "bash H2_01_coarse.run.sh"]
launch_writes_nothing = true

[[case]]
name = "a benchmark run here is planned as one walk of its unlaunched trials, as a shelf is on a queue"
bench = { mpi_np = [1, 2], omp_threads = [1] }
launch = []
launch_mode = "direct"
listing = ["bench-group", "rides the group"]
launch_writes_nothing = true
