# WHAT `molbuilder.json` MAY HOLD -- `docs/configuration.md` § 4.
#
# Your preferences about this installation, and nothing else: no fact about
# a machine (that is its record, `environment.json`) and no value of a job
# (that is the job's own statement).  A key the contract does not list is
# refused, and a retired one is refused BY NAME, saying what to do instead.
#
# `tests/test_molbuilder_json.py` runs every case down the road a person
# runs, through the one runner every contract table shares
# (`tests/support/road.py`, `run_road_case`, whose header names each key):
# `machine_config` is this machine's file -- the one there is.
#
# A RULE CHANGES, ITS ROWS CHANGE.  A case is a row here, never a function.

# Every case's run states its launch values, so what is under test is the
# config alone (`architecture.md` § 5.2).
[run_base.siesta]
mpi_np = 2
omp_threads = 1

[allocation_base]
domain = "cpu"
time = "01:00:00"
mem = "8G"

[[queues]]
name = "cpu"
partition = "cpu"
qos = "public"
max_time = "1-00:00:00"
max_cores = 64

# ===================================================================== #
#  `launch` -- how a job is sent when no --mode is given                #
# ===================================================================== #

[[case]]
name = "launch.mode in this machine's file sends a launch given no --mode"
machine_config = { launch = { mode = "submit" } }
launch_mode = ""
launch = []
line = ["-p cpu", "-q public"]

[[case]]
name = "no --mode and no launch.mode is refused, naming the key"
launch_mode = ""
launch = []
launch_refused = "sets no `launch.mode`"

[[case]]
name = "a launch.mode that is neither direct nor submit is refused"
machine_config = { launch = { mode = "batch" } }
refused = 'launch.mode must be "direct" or "submit"'

[[case]]
name = "launch holds one key -- a queue is not a preference"
machine_config = { launch = { mode = "submit", domain = "cpu" } }
refused = "'launch' holds one key, 'mode'; got 'domain'"

[[case]]
name = "a comment key is ignored, at the top and inside a section"
machine_config = { _note = "mine", launch = { _comment = "this box", mode = "submit" } }
launch_mode = ""
launch = []
line = ["-p cpu"]

# ===================================================================== #
#  Every preference section reads                                        #
# ===================================================================== #

[[case]]
name = "every preference section, together, reads"
machine_config = { launch = { mode = "submit" }, env_init = { activation = "conda activate" }, envs = { siesta = "molbuilder-siesta" }, checkpoint = { size_limit_bytes = 1000000 }, rate_limit = { enabled = false }, admin = { emails = ["someone@example.edu"] }, tls = { cert = "/srv/cert.pem", key = "/srv/key.pem" } }
header = ["#SBATCH -p cpu"]

# ===================================================================== #
#  Retired, refused BY NAME with what to do instead                     #
# ===================================================================== #

[[case]]
name = "the scheduler block is refused, saying where its values live now"
machine_config = { scheduler = { kind = "slurm", directives = { partition = "cpu", qos = "public" }, defaults = { cpus_per_task = 8 } } }
refused = "'scheduler' is no longer configured (retired 2026-10-02) -- delete the block"

[[case]]
name = "script_generation is refused, showing the env_init block its values go in"
machine_config = { script_generation = { activation = "source activate", preamble = "module load mamba" } }
refused = '"env_init": {"activation": "source activate", "preamble": "module load mamba"}'

[[case]]
name = "execution is refused, showing the launch block to write instead"
machine_config = { execution = { mode = "submit", domain = "cpu" } }
refused = '"launch": {"mode": "submit"}'

[[case]]
name = "...and says its default queue has no replacement"
machine_config = { execution = { mode = "submit", domain = "cpu" } }
refused = "'domain' has no replacement: a job names its own queue"

[[case]]
name = "an unknown section is refused, naming the live ones and no retired one"
machine_config = { queue = "cpu" }
refused = "key(s) 'queue'.  Known sections: tls, envs, auth, launch, env_init, checkpoint, admin, rate_limit, paths."

[[case]]
name = "env_init's activation is one of the two forms -- no default, no third"
machine_config = { env_init = { activation = "mamba activate" } }
refused = "'env_init.activation' must be one of 'source activate', 'conda activate'"

[[case]]
name = "env_init holds the activation and the preamble, and nothing else"
machine_config = { env_init = { activation = "conda activate", shell = "bash" } }
refused = "'env_init' holds 'activation' and 'preamble'; got 'shell'"

# ===================================================================== #
#  Inside every section, a key the contract does not list is refused    #
#  (`configuration.md` § 4) -- one sentence, `_refuse_unknown`           #
# ===================================================================== #

[[case]]
name = "a misspelled admin key is refused -- it read as nobody named, so everyone signed in was an admin"
machine_config = { admin = { email = ["operator@example.edu"] } }
refused = "'admin' holds one key, 'emails'; got 'email'"

[[case]]
name = "an envs key that is no category is refused"
machine_config = { envs = { siseta = "molbuilder-siesta" } }
refused = "got 'siseta'"

[[case]]
name = "a checkpoint key it does not hold is refused"
machine_config = { checkpoint = { size_limit = 1000000 } }
refused = "'checkpoint' holds 'size_limit_bytes' and 'engines'; got 'size_limit'"

# ===================================================================== #
#  rate_limit -- read typed where the config is read, before a server   #
#  starts on it                                                          #
# ===================================================================== #

[[case]]
name = "rate_limit's off switch is a JSON boolean -- the text false read as on"
machine_config = { rate_limit = { enabled = "false" } }
refused = "'rate_limit.enabled' must be a JSON boolean (true / false)"

[[case]]
name = "a cooldown that is not a whole number of seconds is refused before a restart can die on it"
machine_config = { rate_limit = { cooldown_s = "1h" } }
refused = "'rate_limit.cooldown_s' must be a whole number of seconds above 0"

[[case]]
name = "an allowlist entry that is no address is refused, naming it"
machine_config = { rate_limit = { allowlist = ["127.0.0.1", "localhost"] } }
refused = "'rate_limit.allowlist' entry 'localhost' is not an IP address or network"

[[case]]
name = "rate_limit.admin_emails is refused by name, pointing at the admin section"
machine_config = { rate_limit = { admin_emails = ["operator@example.edu"] } }
refused = "'rate_limit.admin_emails' moved to the top-level 'admin' section"
