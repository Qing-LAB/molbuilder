# EVERY LAUNCH VALUE IS STATED -- `docs/execution/architecture.md` § 5.2.
#
# A run's ranks and cores per rank, and -- where prep writes a `.sbatch` --
# its queue, wall and memory, are stated in the description or on the
# command line, or prep refuses and names where to state each (user,
# 2026-10-02: "explicit job config is the only way allowed").  The target's
# record CHECKS an ask; it never supplies a value of it.
#
# `tests/test_launch_values.py` runs every case down the road a person runs,
# through the one runner every contract table shares (`tests/support/road.py`,
# `run_road_case`, whose header names each key).
#
# A RULE CHANGES, ITS ROWS CHANGE.  A case is a row here, never a function.

# What every case states, under its own `run` / `allocation`; a case takes
# away (`run_unset`, `allocation_unset`) what it is about.
[run_base.siesta]
mpi_np = 2
omp_threads = 1

[run_base.pyscf]
threads = 1

[allocation_base]
domain = "cpu"
time = "01:00:00"
mem = "8G"

# A queue for work, and a short one beside it on the same partition.
[[queues]]
name = "cpu"
partition = "cpu"
qos = "public"
max_time = "1-00:00:00"
max_cores = 64
node_types = [{ cores = 64, nodes = 10 }]

[[queues]]
name = "debug"
partition = "cpu"
qos = "debug"
max_time = "00:15:00"
max_cores = 64
node_types = [{ cores = 64, nodes = 2 }]

# ===================================================================== #
#  1 · STATED, OR REFUSED -- naming where to state it                   #
# ===================================================================== #

[[case]]
name = "a SIESTA run states its rank count -- no width of the target"
run_unset = ["mpi_np"]
refused = '{"mpi_np": N} in task.json, or --np N'

[[case]]
name = "a SIESTA run states its cores per rank -- no thread count of one"
run_unset = ["omp_threads"]
refused = '{"omp_threads": N} in task.json, or --cpus-per-task N'

[[case]]
name = "a PySCF run states its threads -- not the node's cores"
engine = "pyscf"
run_unset = ["threads"]
refused = '{"threads": N} in task.json, or --cpus-per-task N'

[[case]]
name = "a run on a scheduler names its queue, from the record's list"
allocation_unset = ["domain"]
refused = "(the target's record lists: cpu, debug)"

[[case]]
name = "a run on a scheduler states its wall -- no queue ceiling"
allocation_unset = ["time"]
refused = "wall (time)"

[[case]]
name = "a run on a scheduler states its memory -- no scheduler default"
allocation_unset = ["mem"]
refused = "memory (mem)"

[[case]]
name = "every value stated nowhere is named in one refusal"
run_unset = ["mpi_np", "omp_threads"]
allocation_unset = ["domain", "time", "mem"]
refused = "states no ranks (mpi_np), cores per rank (omp_threads), queue (domain), wall (time), memory (mem)"

[[case]]
name = "a queue the target's record does not list is refused"
allocation = { domain = "nowhere" }
refused = "names the queue 'nowhere', which the target's record does not list -- it lists: cpu, debug"

[[case]]
name = "a named target whose record lists no queues is renewed by ITS probe, on that machine, the file copied here"
machine = "named"
queues = []
refused = ["(sol's) lists no queues at all", "molbuilder jobset probe --write --name sol", "copy the sol.json it writes"]

[[case]]
name = "...and a calculation whose own copy lists none is told it takes a new prep from a saved state as well -- a re-probe alone changes nothing"
calculation_record = { schema = "molbuilder/environment@2", scheduler = "slurm", env_init = { activation = "conda activate", preamble = "true" } }
refused = ["(this calculation's environment.json, snapshotted at its first prep) lists no queues at all", "then go back to the state saved before its first prep", "molbuilder checkpoint list"]

[[case]]
name = "a run on a machine with no scheduler is asked for no queue, wall or memory"
machine = "workstation"
header_absent = true
run_sh = ["_mpi_np_default=2", "_omp_threads_default=1"]

[[case]]
name = "--no-sbatch writes no header, and asks for none of the three"
prep = ["--no-sbatch"]
allocation_unset = ["domain", "time", "mem"]
header_absent = true

# A run prepped with no header is not sent to a queue at all -- its launch is
# refused for the header it lacks, a dry run too (`job-system.md` § 6.0: the
# plan shown is the plan sent).  The header a benchmark's shelf is sent with
# is written at its launch, and states only what was stated.
[[case]]
name = "...and launch fills none in: a benchmark's shelf, its header written at launch, states its wall and memory"
prep = ["--no-sbatch"]
allocation_unset = ["time", "mem"]
bench = { mpi_np = [1, 2] }
launch = []
launch_refused = "states no wall (time), memory (mem)"

[[case]]
name = "a target whose record says nothing of its activation is refused"
record = { env_init = {} }
refused = "this machine's record does not say how a shell enters an environment there"

[[case]]
name = "...a named target too -- recorded on that machine, its record copied here, and the refusal says the copy back"
machine = "named"
named_record = { env_init = {} }
refused = ["the record of 'sol' does not say how a shell enters an environment there", "on that machine, then copy the sol.json it writes into"]

[[case]]
name = "this machine's own env_init never reaches a wrapper written for another machine"
machine = "named"
machine_config = { env_init = { activation = "conda activate", preamble = "source /home/u/miniconda3/etc/profile.d/conda.sh" } }
run_sh_lacks = ["miniconda3"]

[[case]]
name = "a calculation's own copy of its record is named when it states no activation -- no probe reaches it"
machine = "workstation"
calculation_record = { schema = "molbuilder/environment@2", scheduler = "workstation", script_generation = { activation = "conda activate" } }
refused = "this calculation's record of its machine"

[[case]]
name = "...and one that does not read is refused by name -- never another machine's record answering"
machine = "workstation"
calculation_record = "{ not json"
refused = "this calculation's record of its machine cannot be read"

# A CALCULATION IS SET TO THE MACHINE OF ITS FIRST PREP, and that does not
# change (`configuration.md` M-3): its copy names the machine, a later
# `--target` is checked against the name, and another record reaches it only
# through a new prep from a saved state.
[[case]]
name = "a calculation set to a machine takes --target naming it again, whatever was re-probed since"
machine = "named"
calculation_record = { schema = "molbuilder/environment@2", detected_at = "2026-08-01T00:00:00+00:00", scheduler = "slurm", env_init = { activation = "conda activate", preamble = "true" }, domains = [{ name = "cpu", partition = "cpu", qos = "public", max_time = "1-00:00:00", max_cores = 64 }], machine = "sol" }

[[case]]
name = "...and is refused any other, this machine too -- naming the one it is set to, and a new prep from a saved state"
machine = "workstation"
calculation_record = { schema = "molbuilder/environment@2", scheduler = "slurm", env_init = { activation = "conda activate", preamble = "true" }, domains = [{ name = "cpu", partition = "cpu", qos = "public", max_time = "1-00:00:00", max_cores = 64 }], machine = "sol" }
refused = ["this calculation is set to 'sol'", "To go on with it: --target sol", "and prep again with --target this"]

[[case]]
name = "the probe copies this machine's env_init into the record it writes"
machine = "workstation"
machine_config = { env_init = { activation = "source activate", preamble = "module load mamba/latest" } }
probe = [["--scheduler", "workstation"]]
run_sh = ["module load mamba/latest", "source activate"]

[[case]]
name = "...into a named record too, carried to wherever it is prepped for"
machine = "workstation"
machine_config = { env_init = { activation = "source activate", preamble = "module load mamba/latest" } }
probe = [["--scheduler", "workstation", "--name", "sol"]]
run_sh = ["module load mamba/latest", "source activate"]

[[case]]
name = "...whole: a preamble dropped from molbuilder.json leaves the record"
machine = "workstation"
machine_config = { env_init = { activation = "source activate" } }
record = { env_init = { activation = "source activate", preamble = "module load mamba/latest" } }
probe = [["--scheduler", "workstation"]]
run_sh = ["source activate"]
run_sh_lacks = ["module load mamba/latest"]

# ===================================================================== #
#  2 · WHAT IS PRODUCED -- the stated values, and nothing else          #
# ===================================================================== #

[[case]]
name = "the header carries each stated value, and no site settings"
header = ["#SBATCH -n 2", "#SBATCH -c 1", "#SBATCH -t 0-01:00:00",
          "#SBATCH -p cpu", "#SBATCH -q public", "#SBATCH --mem=8G"]
header_lacks = ["--mail", "--export", "--gres"]
run_sh = ["_mpi_np_default=2", "_omp_threads_default=1"]

[[case]]
name = "a PySCF run asks one task and its threads"
engine = "pyscf"
run = { threads = 6 }
header = ["#SBATCH -n 1", "#SBATCH -c 6"]
run_sh = ["_omp_threads_default=6",
          '_omp_threads="$_omp_threads_default"; _omp_from="stated at prep"']

[[case]]
name = "a run's placement is recorded at prep, each value with its source, and said"
said = ["placed on cpu (cpu/public)", "queue, wall, memory from the description", "ranks, cores per rank from the run card"]

[[case]]
name = "launch asks a queue the request prep asked: a PySCF run's cores are its threads"
engine = "pyscf"
run = { threads = 48 }
queues = [
    { name = "cpu", partition = "cpu", qos = "public", max_time = "1-00:00:00", max_cores = 64, node_types = [{ cores = 64, nodes = 10 }] },
    { name = "small", partition = "small", qos = "public", max_time = "1-00:00:00", max_cores = 16, node_types = [{ cores = 16, nodes = 4 }] },
]
launch = ["--domain", "small"]
launch_refused = "needs 48 cores but small allows 16 cores"

[[case]]
name = "a PySCF run takes no rank count: it runs one process"
engine = "pyscf"
run = { threads = 2 }
prep = ["--np", "4"]
refused = "which runs one process"

[[case]]
name = "the run card's wall and queue beat allocation's"
run = { time = "00:10:00", domain = "debug" }
header = ["#SBATCH -t 0-00:10:00", "#SBATCH -q debug"]

[[case]]
name = "a prep flag states what the description does not"
run_unset = ["mpi_np"]
prep = ["--np", "6"]
header = ["#SBATCH -n 6"]

[[case]]
name = "a launch flag overrides the wall prep baked"
launch = ["--time", "3h"]
line = ["-t 0-03:00:00", "-p cpu", "-q public"]

[[case]]
name = "the record checks the wall: one longer than the queue allows is refused at prep"
allocation = { domain = "debug" }
refused = "but debug allows 00:15:00"

[[case]]
name = "the queues launch lists ask what its door admits -- the wall and memory prep baked, when launch states none"
prep = ["--no-sbatch"]
allocation_unset = ["domain"]
queues = [
    { name = "cpu", partition = "cpu", qos = "public", max_time = "1-00:00:00", max_cores = 64, node_types = [{ cores = 64, nodes = 10 }] },
    { name = "debug", partition = "cpu", qos = "debug", max_time = "00:15:00", max_cores = 64, max_mem_gb = 4, node_types = [{ cores = 64, nodes = 2 }] },
]
launch = []
launch_refused = "no --domain"
listing = ["but debug allows 00:15:00", "but debug allows 4"]

[[case]]
name = "this machine's record has the last word at launch, and the refusal says how to follow it -- the ask, or a new prep from a saved state"
calculation_record = { schema = "molbuilder/environment@2", scheduler = "slurm", env_init = { activation = "conda activate", preamble = "true" }, domains = [{ name = "cpu", partition = "cpu", qos = "public", max_time = "1-00:00:00", max_cores = 128 }] }
run = { mpi_np = 96 }
launch = []
launch_refused = "to prepare against this machine's record (configuration.md M-3), go back to the state saved before the calculation's first prep"

# ===================================================================== #
#  3 · WHAT THE RUN SCRIPT DOES HERE                                    #
# ===================================================================== #

[[case]]
name = "the run script runs the stated ranks and threads"
machine = "workstation"
run = { mpi_np = 3, omp_threads = 2 }
given_gpus = ""
runs = ["MPI ranks    : 3   (source: stated at prep)",
        "OMP threads  : 2   (source: stated at prep)"]

[[case]]
name = "a flag on the run script still overrides, and says so"
machine = "workstation"
run = { mpi_np = 3, omp_threads = 2 }
given_gpus = ""
run_args = ["-np", "5"]
runs = ["MPI ranks    : 5   (source: -np flag)"]
