# EVERY LAUNCH VALUE IS STATED -- `docs/execution/architecture.md` § 5.2.
#
# A run's ranks and cores per rank, and -- where prep writes a `.sbatch` --
# its queue, wall and memory, are stated in the description or on the
# command line, or prep refuses and names where to state each (user,
# 2026-10-02: "explicit job config is the only way allowed").  The target's
# record CHECKS an ask; it never supplies a value of it.
#
# `tests/test_launch_values.py` runs every case down the road a person runs,
# through the one runner every contract table shares (`tests/support/road.py`,
# `run_road_case`, whose header names each key).
#
# A RULE CHANGES, ITS ROWS CHANGE.  A case is a row here, never a function.

# What every case states, under its own `run` / `allocation`; a case takes
# away (`run_unset`, `allocation_unset`) what it is about.
[run_base.siesta]
mpi_np = 2
omp_threads = 1

[run_base.pyscf]
threads = 1

[allocation_base]
domain = "cpu"
time = "01:00:00"
mem = "8G"

# A queue for work, and a short one beside it on the same partition.
[[queues]]
name = "cpu"
partition = "cpu"
qos = "public"
max_time = "1-00:00:00"
max_cores = 64
node_types = [{ cores = 64, nodes = 10 }]

[[queues]]
name = "debug"
partition = "cpu"
qos = "debug"
max_time = "00:15:00"
max_cores = 64
node_types = [{ cores = 64, nodes = 2 }]

# ===================================================================== #
#  1 · STATED, OR REFUSED -- naming where to state it                   #
# ===================================================================== #

[[case]]
name = "a SIESTA run states its rank count -- no width of the target"
run_unset = ["mpi_np"]
refused = 'the run card on Task setup ("execution": {"mpi_np": N} in job-request.json), or --np N'

[[case]]
name = "a SIESTA run states its cores per rank -- no thread count of one"
run_unset = ["omp_threads"]
refused = 'the run card on Task setup ("execution": {"omp_threads": N} in job-request.json), or --cpus-per-task N'

[[case]]
name = "a PySCF run states its threads -- not the node's cores"
engine = "pyscf"
run_unset = ["threads"]
refused = 'the run card on Task setup ("execution": {"threads": N} in job-request.json), or --cpus-per-task N'

[[case]]
name = "a flag's count is a count: --np 0 is refused as it is typed, naming the flag and the item's reason"
prep = ["--np", "0"]
refused = "--np 0: it must be greater than 0 -- a count of MPI processes: 0 runs nothing"

[[case]]
name = "a run card's value is its item's type: a rank count written as text is refused at prep, in the item's words"
run = { mpi_np = "8" }
refused = "execution sets mpi_np = '8', which is not a whole number"

[[case]]
name = "a run on a scheduler names its queue -- shown the record's queues with its fit on each"
allocation_unset = ["domain"]
queues = [
    { name = "cpu", partition = "cpu", qos = "public", max_time = "1-00:00:00", max_cores = 64, node_types = [{ cores = 64, nodes = 10 }] },
    { name = "debug", partition = "cpu", qos = "debug", max_time = "00:15:00", max_cores = 64, node_types = [{ cores = 64, nodes = 2, mem_gb = 4 }] },
]
refused = ["states no queue (domain)", "the target's record lists:",
           "cpu/public", "cpu/debug",
           "1h is over debug's wall (00:15:00)",
           "8 GB is over debug's largest machine (4 GB)"]

[[case]]
name = "every value stated nowhere is named in one refusal"
run_unset = ["mpi_np", "omp_threads"]
allocation_unset = ["domain", "time", "mem"]
refused = "states no ranks (mpi_np), cores per rank (omp_threads), queue (domain), wall (time), memory (mem)"

[[case]]
name = "a queue the target's record does not list is refused"
allocation = { domain = "nowhere" }
refused = "names the queue 'nowhere', which the target's record does not list -- it lists: cpu, debug"

[[case]]
name = "a scheduler whose record lists no queues has none a run could name -- refused, naming the probe that renews it, never asked to state one"
allocation_unset = ["domain"]
queues = []
refused = ["goes to a scheduler, and the record it reads", "lists no queues at all -- none a job could name", "molbuilder jobset probe --write"]

[[case]]
name = "a named target whose record lists no queues is renewed by ITS probe, on that machine, the file copied here"
machine = "named"
queues = []
refused = ["(sol's) lists no queues at all", "molbuilder jobset probe --write --name sol", "copy the sol.json it writes"]

[[case]]
name = "a run on a machine with no scheduler is asked for no queue, wall or memory"
machine = "workstation"
header_absent = true
run_sh = ["_mpi_np_default=2", "_omp_threads_default=1"]

[[case]]
name = "--no-sbatch writes no header, and asks for none of the three"
prep = ["--no-sbatch"]
allocation_unset = ["domain", "time", "mem"]
header_absent = true
said = ["no header -- ranks, cores per rank from the run card"]

[[case]]
name = "...and prepared again with it, a stage keeps no header from the prep before: its launch to a queue is refused for the header it lacks"
before = [["prep", "task", "--group", "1"]]
prep = ["--no-sbatch"]
header_absent = true
launch = []
launch_refused = ["there is no scheduler header", "prepared with --no-sbatch"]

[[case]]
name = "...and a benchmark prepared with it runs where it is launched: its cells are fit on the target's probed node, not its queues -- a declared one kept (scheduler.md R6)"
prep = ["--no-sbatch"]
bench = { mpi_np = [8, 32], omp_threads = [1] }
said = ["2 kept", "32 cores is over the target's probed node's cores (16 cores)"]
said_lacks = ["kept on"]

# Work prepared with no header is not sent to a queue at all -- its launch
# is refused for the header it lacks, a dry run too (`job-system.md` § 6.0:
# the plan shown is the plan sent).  A benchmark's shelf header is written
# at its launch from the queue its prep placed it on, so one prepared with
# --no-sbatch has none to write.
[[case]]
name = "...and a benchmark prepared with --no-sbatch is not sent to a queue: its shelves have no queue from prep"
prep = ["--no-sbatch"]
allocation_unset = ["time", "mem"]
bench = { mpi_np = [1, 2], omp_threads = [1] }
launch = []
launch_refused = ["there is no scheduler header", "prepared with --no-sbatch"]

[[case]]
name = "a machine never probed is refused at prep, naming the probe that records it -- and nothing is written"
machine = "unprobed"
refused = ["no machine record for this machine", "molbuilder jobset probe --write"]
made_lacks = ["environment.json", "01_coarse"]

[[case]]
name = "this machine's own env_init never reaches a wrapper written for another machine"
machine = "named"
machine_config = { env_init = { activation = "conda activate", preamble = "source /home/u/miniconda3/etc/profile.d/conda.sh" } }
run_sh_lacks = ["miniconda3"]

# A CALCULATION IS SET TO THE MACHINE OF ITS FIRST PREP, and that does not
# change (`configuration.md` M-3): its copy names the machine, a later
# `--target` is checked against the name, and another record reaches it only
# through a new prep from a saved state.
[[case]]
name = "a calculation set to a machine takes --target naming it again"
machine = "named"
before = [["prep", "task", "--group", "1"]]
stage = "medium"

[[case]]
name = "...and is refused any other, this machine too -- naming the one it is set to, and a new prep from a saved state"
machine = "named"
before = [["prep", "task", "--group", "1"]]
stage = "medium"
prep = ["--target", "this"]
refused = ["this calculation is set to 'sol'", "To go on with it: --target sol", "and prep again with --target this"]

[[case]]
name = "the probe copies this machine's env_init into the record it writes"
machine = "workstation"
machine_config = { env_init = { activation = "source activate", preamble = "module load mamba/latest" } }
probe = [["--scheduler", "workstation"]]
run_sh = ["module load mamba/latest", "source activate"]

[[case]]
name = "...into a named record too, carried to wherever it is prepared for"
machine = "workstation"
machine_config = { env_init = { activation = "source activate", preamble = "module load mamba/latest" } }
probe = [["--scheduler", "workstation", "--name", "sol"]]
run_sh = ["module load mamba/latest", "source activate"]

[[case]]
name = "...whole: a preamble dropped from molbuilder.json leaves the record"
machine = "workstation"
machine_config = { env_init = { activation = "source activate" } }
record = { env_init = { activation = "source activate", preamble = "module load mamba/latest" } }
probe = [["--scheduler", "workstation"]]
run_sh = ["source activate"]
run_sh_lacks = ["module load mamba/latest"]

# ===================================================================== #
#  2 · WHAT IS PRODUCED -- the stated values, and nothing else          #
# ===================================================================== #

[[case]]
name = "the header carries each stated value, and no site settings -- and the sbatch line sends it, restating none"
header = ["#SBATCH -J H2_01_coarse", "#SBATCH -N 1",
          "#SBATCH -n 2", "#SBATCH -c 1", "#SBATCH -t 0-01:00:00",
          "#SBATCH -p cpu", "#SBATCH -q public", "#SBATCH --mem=8G",
          "#SBATCH -o slurm.%j.out", 'bash H2_01_coarse.run.sh "$@"']
# NO SITE SETTING AMONG ITS DIRECTIVES -- the comment above them names the
# line to send it by hand, its `--export ALL,MB_LAUNCHED_BY=manual` among it,
# which is not one.
header_lacks = ["#SBATCH --mail", "#SBATCH --export", "#SBATCH --gres"]
launch = []
line = ["H2_01_coarse.sbatch --run 0"]
line_lacks = ["-p ", "-q ", "-t ", "-n ", "-c ", "--mem"]
listing = ["header: -J H2_01_coarse  -N 1  -n 2  -c 1  -t 0-01:00:00  -p cpu  -q public  --mem=8G"]
run_sh = ["_mpi_np_default=2", "_omp_threads_default=1"]

[[case]]
name = "a PySCF run asks one task and its threads -- and its deck runs on those threads, by hand too"
engine = "pyscf"
run = { threads = 6 }
header = ["#SBATCH -n 1", "#SBATCH -c 6"]
deck = ["THREADS = 6", "_mb_cap_threads(THREADS)"]
run_sh = ["_omp_threads_default=6",
          '_omp_threads="$_omp_threads_default"; _omp_from="stated at prep"']

# job-contracts.md § 6.2: a stated max_memory_mb is the wrapper's `ulimit -v`, in KiB.
[[case]]
name = "a stated memory cap is the run script's ulimit -v, in KiB -- and prep says it"
run = { max_memory_mb = 2048 }
run_sh = ["\nulimit -v 2097152 "]
said = ["memory cap 2048 MB"]

# job-contracts.md § 6.2: none stated is no cap -- no ulimit line.
[[case]]
name = "...and none stated writes no ulimit line"
run_sh_lacks = ["\nulimit -v"]

# running-a-job.md § 3.2: BLAS is pinned to one thread per rank.
[[case]]
name = "a SIESTA run script pins BLAS to one thread"
run_sh = ["\nexport MKL_NUM_THREADS=1\n", "\nexport OPENBLAS_NUM_THREADS=1\n"]

[[case]]
name = "a memory cap left unset is no cap -- nothing fills one in: the PySCF deck's run settings hold none, and its molecule and the run's facts read them"
engine = "pyscf"
deck = ["MAX_MEMORY_MB = None", "max_memory = MAX_MEMORY_MB,", "max_memory_mb=MAX_MEMORY_MB"]

[[case]]
name = "...and the PySCF vibration deck alike"
engine = "pyscf"
calculation = "vibration"
stage = "freq"
deck = ["MAX_MEMORY_MB = None", "max_memory = MAX_MEMORY_MB,", "max_memory_mb=MAX_MEMORY_MB"]

[[case]]
name = "a run's placement is recorded at prep, each value with its source, and said"
said = ["placed on cpu (cpu/public)", "queue, wall, memory from the job request's allocation", "ranks, cores per rank from the run card",
        "header: -J H2_01_coarse  -N 1  -n 2  -c 1  -t 0-01:00:00  -p cpu  -q public  --mem=8G"]

[[case]]
name = "prep fits the run's whole request on its queue: a PySCF run's cores are its threads"
engine = "pyscf"
run = { threads = 48 }
allocation = { domain = "small" }
queues = [
    { name = "cpu", partition = "cpu", qos = "public", max_time = "1-00:00:00", max_cores = 64, node_types = [{ cores = 64, nodes = 10 }] },
    { name = "small", partition = "small", qos = "public", max_time = "1-00:00:00", max_cores = 16, node_types = [{ cores = 16, nodes = 4 }] },
]
said = ["48 cores · 8 GB · 1h fits no node of small -- 48 cores is over small's largest machine (16 cores)"]
header = ["#SBATCH -c 48", "#SBATCH -p small"]

[[case]]
name = "a PySCF run takes no rank count: it runs one process"
engine = "pyscf"
run = { threads = 2 }
prep = ["--np", "4"]
refused = "which runs one process"

[[case]]
name = "the run card's wall and queue beat allocation's"
run = { time = "00:10:00", domain = "debug" }
header = ["#SBATCH -t 0-00:10:00", "#SBATCH -q debug"]

[[case]]
name = "a prep flag states what the description does not"
run_unset = ["mpi_np"]
prep = ["--np", "6"]
header = ["#SBATCH -n 6"]

[[case]]
name = "a launch's --time restates the wall prep wrote, on the sbatch line -- and the request shown carries the wall sent, the header's beside it"
launch = ["--time", "3h"]
line = ["-t 0-03:00:00 --export", "H2_01_coarse.sbatch", "MB_WALL_S=10800"]
listing = ["-t 0-03:00:00 (this launch's --time; the header says 0-01:00:00)"]

[[case]]
name = "--mem 0 at prep is the whole node, sent as said"
prep = ["--mem", "0"]
header = ["#SBATCH --mem=0"]

[[case]]
name = "...and a spelling that is no amount of memory is refused at prep, in the flag's words"
prep = ["--mem", "12Q"]
refused = "--mem: "

[[case]]
name = "the fit says the wall: one longer than the queue allows is prepared as asked, and said (scheduler.md R6)"
allocation = { domain = "debug" }
said = ["1h is over debug's wall (00:15:00)"]
header = ["#SBATCH -q debug", "#SBATCH -t 0-01:00:00"]

# A benchmark keeps the calculation's ask -- `allocation` is the
# calculation's and the benchmark's, `execution` this run's (`stages.md`
# § 6.8e): a run card's two-day wall on every trial would queue each
# ten-minute measurement behind everything.
[[case]]
name = "a benchmark keeps the calculation's wall and queue, never a run card's"
bench = { mpi_np = [1], omp_threads = [1] }
run = { time = "2-00:00:00", domain = "debug" }
bench_header = ["#SBATCH -t 0-01:00:00", "#SBATCH -p cpu", "#SBATCH -q public"]
bench_header_lacks = ["#SBATCH -q debug"]
said = ["placed on cpu (", "bench-group-cpu-G0K1C1  header: -J bench-group-cpu-G0K1C1  -N 1  -n 1  -c 1  -t 0-01:00:00  -p cpu  -q public  --mem=8G",
        "1 core · 8 GB · 1h fits all 10 nodes of cpu"]
launch = []

[[case]]
name = "...and a queue named at prep is the one its shelves are sent to"
bench = { mpi_np = [1], omp_threads = [1] }
prep = ["--domain", "long"]
queues = [
    { name = "cpu", partition = "cpu", qos = "public", max_time = "1-00:00:00", max_cores = 64, node_types = [{ cores = 64, nodes = 10 }] },
    { name = "long", partition = "long", qos = "public", max_time = "7-00:00:00", max_cores = 64, node_types = [{ cores = 64, nodes = 10 }] },
]
bench_header = ["#SBATCH -p long"]
said = ["placed on long ("]
launch = []

# ASKED ABOUT (`--mode ask`), every line is shown with every value of the
# header it sends -- what the answer is an answer about (`submission.md` S4).
[[case]]
name = "asked about, each line is shown with every value of the header it sends"
launch = []
launch_mode = "ask"
listing = ["would send coarse   -> domain cpu", "header: -J H2_01_coarse  -N 1  -n 2  -c 1  -t 0-01:00:00  -p cpu  -q public  --mem=8G"]

# ...ASKED OF THE MACHINE'S RECORD'S SCHEDULER (`scheduler.md` § 6a): the line
# is put once to the submit command the record names, where it says it is --
# not whatever PATH finds first -- with SLURM's ask, `--test-only`, so nothing
# is sent.
[[case]]
name = "asked about, the line is put once to the submit command the machine's record names, with SLURM's ask -- nothing is sent"
launch = []
launch_mode = "ask"
scheduler_called = [["--test-only", "-J", "H2/coarse", "H2_01_coarse.sbatch"]]

# A BENCHMARK STATES ITS QUEUE BEFORE ITS GRID IS ENUMERATED ON IT: one naming
# none is refused for that first, the record's queues listed.
[[case]]
name = "a benchmark on a scheduler names its queue, refused for that before its grid"
allocation_unset = ["domain"]
bench = { mpi_np = [1, 2], omp_threads = [1] }
refused = ["states no queue (domain)", "the target's record lists:", "cpu/public", "cpu/debug"]

# A QUEUE'S JOB CAP (`scheduler.md` R14): each kept cell of a benchmark is one
# shelf, one submitted job -- said at prep, where the grid can still change,
# as a condition: what is already queued there is not on the record.
[[case]]
name = "a benchmark of more shelves than its queue lets one person have submitted is told so at prep -- a condition, not a prediction"
bench = { mpi_np = [1, 2, 3, 4, 5, 6], omp_threads = [1] }
queues = [
    { name = "cpu", partition = "cpu", qos = "public", max_time = "1-00:00:00", max_cores = 64, max_submit_jobs = 2, node_types = [{ cores = 64, nodes = 10 }] },
]
said = ["cpu takes 2 submitted job(s) per user", "this benchmark is 6 shelf job(s)",
        "with nothing of yours already queued there, 2 go and 4 come back",
        "fewer if you already hold some",
        "launching the benchmark again sends exactly them"]

[[case]]
name = "...and one that fits says nothing of it"
bench = { mpi_np = [1, 2], omp_threads = [1] }
queues = [
    { name = "cpu", partition = "cpu", qos = "public", max_time = "1-00:00:00", max_cores = 64, max_submit_jobs = 2, node_types = [{ cores = 64, nodes = 10 }] },
]
said_lacks = ["submitted job(s) per user"]


