[[route]]
rule = "/api/admin/rate_limit/status"
method = "GET"
takes_no_path = "Nothing; it reports the rate limiter's in-memory state."

[[route]]
rule = "/api/admin/reload"
method = "POST"
only_when = "the server runs under its supervisor (serve start)"
takes_no_path = "Nothing; it exits so the supervisor starts a fresh server."

[[route]]
rule = "/api/admin/reload/available"
method = "GET"
takes_no_path = "Nothing; it answers whether a supervisor runs and the session is an admin."

[[route]]
rule = "/api/backends"
method = "GET"
takes_no_path = "Nothing; it lists the builder backends this machine has."

