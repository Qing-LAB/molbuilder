# THE PATH FENCE, ASKED OF EVERY /api/ ROUTE (`web/web-api.md` § 2.1) -- run
# by `tests/test_the_path_fence.py`.
#
# One [[route]] per rule and method the app serves: either `takes_no_path`,
# what it takes instead, or one [[route.path]] per place a filesystem path
# enters, `request` the whole request that reaches the fence, the path there
# OUTSIDE the projects tree.  `only_when` marks a route the app registers
# only on a machine set up for it.  A probe is refused in the fence's words,
# "is outside", unless it names its own (`refusal`: the docs routes fence
# against docs/, not the projects tree; a `..` refused before it resolves
# says "may not contain '..'"), with a 4xx unless it states the
# `status` its route answers a refusal with (the preflight answers what it
# found, its refusal a finding).
#
# PLACEHOLDERS the runner fills:
#   {outside_file} {outside_dir}  beside the projects tree
#   {inside_file} {inside_dir}    inside it
#   {outside_by_climbing}    a tree-relative name whose `..` climbs out of it
#   {link_out}               a link inside {inside_dir} to {outside_dir},
#                            named from {inside_dir}
#   {link_out_from_root}     the same link, named from the tree's root
#
# A route that takes a TREE-RELATIVE name is asked each spelling that could
# climb out: an absolute path, a `..`, and a link inside the tree.
#   {outside_from_docs_img}  {outside_file}, relative to the docs' images

[[route]]
rule = "/api/<route>"
method = "POST"
only_when = "this machine's notify key file names a route"
takes_no_path = "A secret route segment, two signed headers and a JSON run report; the log it appends to is reports_dir()/<user>.jsonl, the user resolved from the key file, never from the request."

