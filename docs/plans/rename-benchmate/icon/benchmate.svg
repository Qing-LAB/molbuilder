<title>Benchmate</title>
<desc>Benchmate icon (H5): a chip (in silico) holding a molecular junction - two close-packed metal electrode tips bridged by a 3-D molecule - with an electron wave packet crossing the top edge and electrons crossing the bottom edge.</desc>
