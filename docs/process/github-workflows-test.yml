# MANUAL-PUSH TEMPLATE for .github/workflows/test.yml
#
# molbuilder's PAT lacks the ``workflow`` scope, so changes under
# .github/workflows/ can't be pushed by Claude via the normal
# commit path (CLAUDE.md memory rule).  Copy this file to
# ``.github/workflows/test.yml`` and push it manually with a PAT
# that has the workflow scope:
#
#     cp docs/templates/github-workflows-test.yml \
#        .github/workflows/test.yml
#     git add .github/workflows/test.yml
#     git commit -m "ci: enable GitHub Actions test workflow"
#     git push   # uses a workflow-scoped credential
#
# What this workflow does:
#   * Runs on every push / PR to main.
#   * Single Python 3.12 matrix (matches the conda env the project
#     develops against).
#   * Installs deps via the pyproject.toml ``[test]`` extras, NO
#     editable install (per the load-bearing "never pip install -e"
#     rule in CLAUDE.md memory).
#   * Skips Playwright / chromium tests (the project's slow path;
#     run locally via ``make test-all``).

name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          # Non-editable install of test extras.  Skips runtime
          # extras (pyscf etc.) which the fast subset doesn't need.
          pip install ".[test]"

      - name: Run fast pytest subset
        run: |
          # Mirrors ``make test`` -- no Playwright, no slow markers.
          python -m pytest -q --no-header \
              --ignore=tests/test_molbuilder_e2e.py \
              --ignore=tests/test_atom_list_render_paths.py \
              -m "not slow and not e2e"

  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pre-commit/action@v3.0.1
