# THE KIND TABLE -- every kind of calculation molbuilder describes, and its
# part on each engine it runs on (docs/execution/architecture.md § 3.3).
# Read by one reader, `kind_table.py` (`kind(name)`, `CalculationKind.on`);
# shared code names no kind -- it asks this record (rule A18).
#
# A kind's own facts sit in its table; what the pair decides sits in its
# `on.<engine>` table, and the engines a kind runs on are those tables --
# no second list says which engine runs which kind.  The engines are the
# engine table's (`engine_table.toml`); a part naming another is refused.
#
# A part that is code is named "module:NAME" and resolved by the floor it
# lives on (`kind_table.part`), never imported here.
#
# A kind's ladder (docs/execution/job-system.md § 5.4) is read off its
# roles: a kind without roles is INDEPENDENT -- one calculation tuned stage
# by stage, each stage continuing from the one before; a kind with roles is
# LINKED, each stage building on what the kind says -- the inputs its rungs
# take from the rungs it names (its part's `inputs`, and the `gather` that
# takes them at a first launch), or, with no `inputs`, nothing of another
# stage, each built on the calculation's structure.
#
# A kind's `description`: what its description carries beyond every kind's
# fields -- `cites`, the slot it cites instead of holding a structure (its
# structure IS that citation, copied in at prep, and its identity is the
# citation); `carries`, the fields only it may state -- `bias` stated
# whenever carried, its voltages a list from 0.0.
#
# A kind's `topic`: the folder every new project lays down for its
# calculations -- a project's run topics are the kinds'
# (`execution/job-contracts.md` § 2.5).
#
# A kind's `handover`: the tab that hands it over to Task setup, by its key
# in `web/tabs.py` -- with none, it describes on its own tab, nothing
# awaiting.  Its `charge` {value, why}: the charge it fixes, where it fixes
# one, and why.  Its `no_benchmark`: why it takes no benchmark, where it
# takes none.
#
# A part's `words`: the engine's own name for the kind, where it has one --
# the program that runs it on that engine.
#
# A rung's role (`roles`): what the rung does, named by the kind -- what a
# catalogue item's `stages` names (`engines/template.md` § 6.4) -- and what
# it computes: "scf", an SCF; "product", no SCF at all -- each also the
# named set of roles a catalogue item's `stages` may cite.  A role that is a
# LEAD names the region of the junction it is cut from (`lead`): its files
# are on that region's name, it samples the transport axis with its own
# count, and a kind with leads is open along that axis on every other rung
# (`execution/architecture.md` § 3.3).  The region's name has this one home
# (`transport/sort.py` reads it), and a lead's name is no other kind's role.
# How a pair's stages play the roles (`stage_roles`): "own", its stages are
# its rungs -- every role, in order, a stage's role its name, which fixes
# them; "every", each stage every role; or the list of roles each stage
# plays.  The ladder a new description starts from (`ladder`), each stage
# with no overrides: the rungs where they are fixed, read off the roles;
# else as the pair lists them -- a vibration's one stage, `freq`, to which a
# person may add stages (engines/vibration.md § 5.9); a pair that lists none
# starts from its engine's ladder (the engine table's `presets`,
# execution/job-system.md § 5.4).
#
# A pair's `sum`: what `summarize task` adds up for it, a part -- with none,
# its stages each write their own result.  Its `retired`: a stage older
# versions wrote that it no longer holds beside its others -- the stage, the
# role it played, the version that retired it and why -- which the reader
# refuses naming `jobset migrate`, and migrate folds into the others.

[optimization]
noun = "optimization"
topic = "optimization"
handover = "structure-optimization"

[optimization.on.siesta]

[optimization.on.pyscf]


[vibration]
noun = "vibration"
topic = "spectrum"
handover = "spectrum-calculation"
roles = [
    { name = "relaxation",      computes = "scf" },
    { name = "force_constants", computes = "scf" },
    { name = "optical",         computes = "scf" },
]
# THE RESULTS IT GIVES, in the order a person decides them
# (`engines/template.md` § 6.2a) -- the cards a form of the kind draws after
# *Setup*; which of them an engine gives is its catalogue items'.
results = [
    { key = "modes", title = "Frequencies and mode shapes", line = "Relax the structure first -- unless you say it is already relaxed -- then take the force constants: every vibrational mode, its frequency and how the atoms move.  Everything below is computed from these modes." },
    { key = "infrared", title = "Infrared", line = "How strongly each mode absorbs infrared light -- from how the dipole changes as the mode moves.  Cheap on SIESTA and for a free molecule on PySCF; with atoms held and Raman off, PySCF takes 6 extra SCFs per free atom." },
    { key = "raman", title = "Raman", line = "How strongly each mode scatters laser light -- from how the polarizability changes as the mode moves.  The expensive one: extra calculations at displaced geometries." },
    { key = "thermochemistry", title = "Thermochemistry", line = "The zero-point energy, and the energy, entropy and free energy at a temperature -- the vibrational part on SIESTA and with atoms held, the free molecule's whole answer on PySCF (with its translation and rotation).  No extra calculation." },
    { key = "probe", title = "Orbital energies along a mode", line = "How the frontier orbital energies move when the molecule is pushed along a mode -- two extra SCFs per mode picked." },
]

[vibration.on.siesta]
# Its one stage is one run in three phases, and carries every phase's role
# (`engines/vibration.md` § 5.11 § 9).
stage_roles = "every"
# ...in one stage, `freq`, the harmonic analysis -- a new description's.
ladder = ["freq"]
shape = "hierarchical"
why = "A SIESTA vibration is hierarchical, and no other shape is taken -- its one run's SIESTA calls, the relaxation, the force constants and the optical calls, each run in a folder of its own: in one directory they would write over each other's .DM and .XV (engines/vibration.md § 5.11 § 1)."
points = "molbuilder.jobset.vibration_points:POINTS"
rung = "molbuilder.jobset.prep:siesta_vibration_rung_of"
# Its stages' force constants compared, where it has two or more
# (`engines/vibration.md` § 5.9).
sum = "molbuilder.jobset.vibration_sum:SUM"
retired = { stage = "relax", role = "relaxation", since = "2.42.0", why = "a SIESTA vibration is one run in phases -- its relaxation the run's first call, switched by already_relaxed (engines/vibration.md 5.11)" }

[vibration.on.pyscf]
# It relaxes inside its one deck, so each of its stages is the
# force-constant run.
stage_roles = ["force_constants"]
ladder = ["freq"]
# A vibration's summary is the displacement sweep, which a PySCF vibration
# never has -- its second derivatives are analytic -- and is refused naming
# why (engines/vibration.md § 5.9).
sum = "molbuilder.jobset.vibration_sum:SUM"


[transport]
noun = "transport calculation"
topic = "transport"
# No `handover`: its stages, shape and identity are fixed, so it describes
# on its own tab (POST /api/transport/describe), nothing awaiting.
no_benchmark = "its parameters come from its own template and each rung's run card, and its one axis is the bias list in task.json (engines/transport.md 2a.10)"
roles = [
    { name = "seed",         computes = "scf" },
    { name = "electrode_L",  computes = "scf", lead = "L-electrode" },
    { name = "electrode_R",  computes = "scf", lead = "R-electrode" },
    { name = "device",       computes = "scf" },
    { name = "transmission", computes = "product" },
]

[transport.charge]
value = 0
why = "a transport junction is neutral: its boundaries are open, so the electrodes' chemical potentials set its electron number"

[transport.description]
# Its relaxed junction, cited (engines/transport.md § 3.1); the electrode
# rename (§ 4); its voltages, a list from 0.0 (§ 2a.10); the finished
# calculation it extends (§ 2a.16).
cites = "junction"
carries = ["swap_electrodes", "bias", "reuses"]

[transport.on.siesta]
words = "TranSIESTA"
# Its stages are its rungs, every one, in order (the seed among them: the
# device starts from its density, user 2026-10-12).
stage_roles = "own"
shape = "hierarchical"
why = "A transport calculation is hierarchical, and no other shape is taken -- its five stages exchange files through their own attempts, which the flat shape has no directories to hold (engines/transport.md § 2a.11)."
points = "molbuilder.jobset.transport_points:POINTS"
rung = "molbuilder.jobset.prep:transport_rung_of"
# Which rung hands which file to which (the ladder's DAG), and the gather
# that takes them at a rung's first launch (engines/transport.md § 6.1).
inputs = "molbuilder.transport.stages:inputs_of"
gather = "molbuilder.jobset.gather:gather_sources"
# Its transmission points read into the calculation's record and data file,
# current against voltage (engines/transport.md § 2a.12).
sum = "molbuilder.jobset.transport_sum:SUM"
