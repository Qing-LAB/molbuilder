# THE ENGINE TABLE -- every engine molbuilder runs
# (docs/execution/architecture.md § 3.3).  Read by one reader,
# `engine_table.py` (`engine(name)`); shared code names no engine -- it asks
# this record (rule A18).  The engines the kind table's parts name, the file
# catalogue's rows name (`runfiles`), the parameter catalogue serves
# (`template.catalogue`) and the warm-file vocabularies sit under
# (`warmfiles`) are these, each checked where that declaration loads.
#
# A fact another declaration holds stays there: an engine's deck and its
# other files are the file catalogue's, the settings it offers and why one is
# not offered the parameter catalogue's.
#
# A part that is code is named "module:NAME" and resolved by the floor it
# lives on (`kind_table.part`), never imported here.

[siesta]
# Its name as a person reads it -- before a form's every card title, and in
# the chemistry card's states (`web/form-schema.md` § 1.3).
words = "SIESTA"
# The setting that names a calculation's files.
identity_field = "system_label"
# The dataclass a template is rebuilt into (floor 1, `config/`).
config = "molbuilder.config.siesta:SiestaConfig"
# Its own settings checks, asked by the settings gate with the state and the
# box the gate works out once (science/validation.md § 7).
validator = "molbuilder.validation.siesta:validate_siesta"
# How it tells that two decks are the same calculation: its keywords read as
# SIESTA reads them (floor 1; `deck_record.same_calculation`).
same_calculation = "molbuilder.siesta.engine_input:engine_input_differences"
# What it supplies for prep to run its steps over it (floor 3, its own
# package's builder of `jobset/engines.py`'s `EngineSeam`;
# `script-preparation.md` § 4).
seam = "molbuilder.siesta.seam:siesta_seam"
# THE LONGEST LABEL IT KEEPS WHOLE in the names of the files it writes:
# SIESTA 5.4.2 cut a 58-character label's files at 50 characters, and two
# benchmark trials differing only past the cut were written to one stem
# (2026-08-24).  Held a few below the cut so suffixes like `.DM` stay
# unambiguous; a longer label is refused at prep, never cut
# (execution/run-identity.md § 3).
longest_label = 48
# What it computes the atoms in: the structure's own cell.
computes_in = "cell"
# A run is MPI ranks, each with its threads.
one_process = false
# Its method, where its catalogue offers no choice: a density-functional
# code (the electronic state's `method`, science/chemistry-correctness.md
# § 2a).
method = "DFT"
# Whether it has a benchmark lane: a benchmark's measurement pins name its
# settings (execution/job-request.md § 3.4).
benchmark = true
# Its stage presets, {tier: {item: value}}: the table its ladder's tiers are
# read from, by the one ladder rule (`jobset.ladder.engine_ladder`).
presets = "molbuilder.config.siesta:SIESTA_STAGE_PRESETS"
# ITS DECK STATES ITS SETTINGS AS KEYWORDS, read by this reader -- the fdf's
# key rule, its switches, its values and blocks, and the deck with its
# includes -- which a run's setup rows, the run script and the benchmark's
# trial check read the deck back by (floor 1, travels beside a job).
keyword_reader = "molbuilder.parse.fdf:KEYWORDS"
# The environment its runs enter: a category of configuration.md § 4
# (`diagnostics.DEFAULT_ENV_NAMES`, overridable in `envs`) ...
environment = "siesta"
# ... and the one a run that uses a GPU enters: SIESTA's GPU capability is a
# build of its own, an environment (execution/gpu.md G3, G8).
gpu_environment = "siesta-gpu"
# THE PROGRAMS ITS RUNS START, each with its name as a run's log says it --
# the first its own; a job names another (`Job.program`: a transmission's
# `tbtrans`, engines/transport.md § 6.1b).  The run script launches the
# program, probes its build and caps its memory (running-a-job.md § 1).
programs = { siesta = "SIESTA", tbtrans = "TBtrans" }

[pyscf]
words = "PySCF"
identity_field = "job_name"
config = "molbuilder.config.pyscf:PySCFConfig"
validator = "molbuilder.validation.pyscf:validate_pyscf"
# Two scripts are the same calculation when the values they set are.
same_calculation = "molbuilder.pyscf.script_input:script_differences"
seam = "molbuilder.pyscf.seam:pyscf_seam"
# No longest label: PySCF writes its files whole, so only the cap every label
# has binds it (execution/run-identity.md § 3).
# PySCF's `gto.M` is gas phase: one molecule in free space, whatever the
# structure's cell -- its electron count a molecule's, a vibration removing
# a free cluster's motions, no box to judge.
computes_in = "free space"
# ONE process -- a Python script with OpenMP threads -- so its request asks
# one task.
one_process = true
# No benchmark lane: the measurement pins name SIESTA's settings.
benchmark = false
presets = "molbuilder.config.pyscf:PYSCF_STAGE_PRESETS"
# No keyword reader: a Python script, its settings the script's own values.
environment = "pyscf"
# No GPU environment: PySCF's GPU is a device its deck checks at its start
# (execution/gpu.md G8).  No program: the deck is a script the job's own
# python runs, and it applies the memory cap and reads the wall itself.
