help = """
Your assertion that this structure already sits at a stationary point -- a geometry where the forces vanish.  With it on, the vibration deck skips its built-in relaxation and goes straight to the Hessian; relaxation is otherwise the deck's mandatory first act.
A harmonic analysis is only valid at a stationary point.  Off one, frequencies shift and spurious imaginary modes appear.
The deck still checks the gradient at the input geometry and warns with the max-force number.  It never refuses, because the statement is yours to make.  That number also appears on the viewer's relaxation phase chip.
"""

[item.compute_raman]
kind = "deck"
calculations = ["vibration"]
expands = ["finite-difference polarizability loop"]
category = ["procedure"]
engines = ["pyscf"]
engine_key = "(molbuilder: finite-diff polarizability path)"
type = "bool"
value = true
default = true
group = "profile"
label = "Compute Raman activities"
tier = "basic"
help = """
Compute how strongly each mode scatters light in a Raman experiment -- the activity follows from how much the molecule's polarizability changes as the mode vibrates.

This is the expensive optional, and the one that sets the run's cost: roughly 6 x (number of free atoms) extra SCFs, each followed by a polarizability response calculation -- one per +/- finite-difference displacement in each Cartesian direction.

Turn it off if you only want frequencies, or frequencies plus IR: IR without Raman takes an analytic route that needs no displacement loop at all.  Turning it on makes IR free, because the dipole can be read at each displacement the Raman loop is already computing.
"""

[item.compute_ir]
kind = "deck"
calculations = ["vibration"]
expands = ["analytic dipole derivatives (or a finite-difference dipole loop)"]
category = ["procedure"]
engines = ["pyscf"]
engine_key = "(molbuilder: pyscf.prop.infrared, else finite-diff dipoles)"
type = "bool"
value = false
default = false
group = "profile"
label = "Compute IR intensities"
tier = "basic"
help = """
Compute IR absorption intensities (km/mol) from the dipole-moment derivative dmu/dR -- how much the molecule's dipole shifts as each mode vibrates, which is what makes a band bright or dark.

Cost depends on what else you ticked.  With Raman off this is nearly free: the derivative comes from the very coupled-perturbed response the Hessian already solves, measured at about +14% on top of the Hessian.  With Raman on it is free outright -- Raman's displacement loop runs anyway, and the dipole is read at each point it already computes.

The slow path is a fallback, not the design: if the env lacks `pyscf.prop.infrared` (never released to PyPI -- `envs doctor` reports it and `envs repair --include-optional` installs it), the deck finite-differences the dipole instead.  Same intensities, 6N extra SCFs.  Which route actually ran is recorded in the results and shown in the viewer's run summary.

The analytic route reproduces Q-Chem's published NH3 intensities to 0.02 km/mol, and the two routes' derivative tensors agree to 0.02%.  Band ordering reproduces the literature for water at B3LYP/def2-SVP (bend ~55 km/mol > asym ~27 > sym ~5).
"""

[item.displacement_amplitude_ang]
kind = "deck"
calculations = ["vibration"]
expands = ["mode displacement step"]
category = ["accuracy"]
engines = ["pyscf"]
engine_key = "(molbuilder: finite-difference step amplitude)"
type = "float"
value = 0.02
default = 0.02
range = [0.02, 0.2]
unit = "Å"
group = "stage"
label = "Displacement amplitude"
tier = "advanced"
help = """
How far atoms are pushed along each mode eigenvector when probing how the orbitals shift.  Only the per-mode electronic-structure step uses it.

The two ends of the allowed window (0.02-0.20 A) are the two ways this goes wrong, which is why it is narrow:

  too small -- the orbital-energy difference shrinks toward the SCF noise floor and the slope you measure is numerical noise.  0.02 A is the smallest amplitude the default scf_conv_tol=1e-9 resolves cleanly (FD noise on the HOMO shift is ~1e-8 Ha there, well under the signal); below it you must tighten scf_conv_tol as well, and the preflight says so.
  too large -- the response stops being linear.  Anharmonic mixing becomes noticeable near 0.10 A ([Mills1972] section 2.4), and by 0.20 A the linear-response assumption has broken, so the slope describes the amplitude you chose rather than the mode.

The default sits at the BOTTOM of the window on purpose: inside it, smaller is more linear, so the only reason to raise it is an SCF you cannot tighten.  Treat anything between 0.10 and 0.20 A as contaminated rather than clean.
"""

[item.es_mode_selection]
kind = "deck"
calculations = ["vibration"]
expands = ["per-mode displaced-SCF loop"]
category = ["procedure"]
engines = ["pyscf"]
engine_key = "(molbuilder: per-mode electronic-structure selector)"
type = "enum"
value = "skip"
default = "skip"
choices = ["skip", "all", "top_n", "threshold", "explicit"]
group = "stage"
label = "Mode selection"
tier = "basic"
help = """
Which vibrational modes get the displaced-geometry orbital-energy probe -- a look at the orbital energies with the molecule pushed along a mode.
  skip      -- don't run this step at all; you get a spectrum but no per-mode HOMO/LUMO data.  Use this for first-pass exploration.
  all       -- every mode (cost ~ 2 N modes).
  top_n     -- the N modes with the strongest Raman activity.
  threshold -- every mode whose Raman activity exceeds your cutoff.
  explicit  -- you list specific mode numbers.
Each chosen mode costs two extra SCF calculations (one at +A, one at -A along the mode), so this is the most expensive part of the run and its cost scales linearly with how many modes you pick.
Caveat: top_n and threshold rank by Raman brightness, which is NOT the same as electron-phonon coupling strength -- a mode that's transport-critical can be Raman-weak ([Galperin2007]).  When in doubt, use explicit (after looking at the spectrum) or all.
"""

[item.es_top_n]
kind = "deck"
calculations = ["vibration"]
expands = ["per-mode displaced-SCF loop"]
category = ["procedure"]
