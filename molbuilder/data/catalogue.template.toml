engine_key = "(molbuilder: per-stage non-convergence policy)"
type = "enum"
value = "halt"
default = "halt"
choices = ["proceed", "continue", "halt"]
group = "stage"
label = "If max_steps runs out"
tier = "advanced"
help = "what to do if geomeTRIC's 5 criteria aren't all met when max_steps runs out: proceed (accept the partial geometry and let the next rung start from it), continue (extend this rung with more iterations), halt (raise rather than hand on a geometry nobody accepted).  This is THIS rung's answer: a ladder is N decks and N jobs, so each deck carries its own policy and none of them can see the others."

[item.geom_continue_retries]
