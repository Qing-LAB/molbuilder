default = false
group = "budget"
label = "Use GPU (NVIDIA, via gpu4pyscf)"
help = "run the SCF (and geom-opt forces) on an NVIDIA GPU via the gpu4pyscf extension.  The recipe for ``molbuilder-pySCF`` installs the matching ``cupy-cudaNx[ctk]`` + ``gpu4pyscf-cudaNx`` wheels for the project's pinned CUDA toolkit (see ``molbuilder envs doctor molbuilder-pySCF``); the script probes gpu4pyscf at runtime and falls back to CPU if the package isn't importable or the GPU is missing / too old (compute capability < 7.0)."

