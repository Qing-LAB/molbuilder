engine_key = "(molbuilder: per-mode selector parameter)"
type = "int"
value = 10
default = 10
range = [1, 1000]
group = "stage"
label = "Top-N modes"
tier = "advanced"
help = """
How many of the brightest Raman-active modes get orbital-energy data.  Used only when Mode selection is set to top_n.
Cost grows linearly: N modes = 2 N SCF calculations.
"""

[item.es_threshold]
kind = "deck"
calculations = ["vibration"]
expands = ["per-mode displaced-SCF loop"]
category = ["procedure"]
engines = ["pyscf"]
