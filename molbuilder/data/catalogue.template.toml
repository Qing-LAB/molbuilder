label = "Continue retries"
tier = "advanced"
help = "only meaningful when on_nonconvergence='continue': how many additional max_steps batches to spend before falling through to halt.  Total step budget = max_steps * (1 + continue_retries).  Named geom_* to stay distinct from Resources.continue_retries, which is the WRAPPER's warm-restart count and a different thing entirely."
