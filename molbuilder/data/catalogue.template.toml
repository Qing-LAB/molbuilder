default = 0.0003
unit = "Ha/Bohr"
range = [1e-06, 0.1]
group = "stage"
label = "‖F‖RMS"
tier = "advanced"
help = """
The optimisation is converged when the root-mean-square (RMS) force on the atoms drops below this, in Ha/Bohr.
The gradient criteria are the ones that say the structure actually sits at a stationary point; the displacement criteria only say the optimiser stopped moving. Leave this too loose and the residual forces contaminate whatever you run on top of the geometry, a frequency calculation most of all.
"""

[item.geom_dmax]
kind = "engine"
category = ["accuracy"]
engines = ["pyscf"]
anchor = "convergence_dmax"
