[item.functional]
kind = "engine"
category = ["method"]
engines = ["pyscf"]
anchor = "mf.xc"
engine_key = "mf.xc = ..."
manual = "PySCF 2.13 pyscf.dft.rks.KohnShamDFT 'xc'"
type = "str"
value = "B3LYP"
default = "B3LYP"
group = "profile"
label = "Functional"
help = """
XC functional, written as ``mf.xc`` (B3LYP / PBE / PBE0 / M06-2X / wB97X-D / ...).
DEVIATION: PySCF's own default is 'LDA,VWN'.  That is the fallback ``dft.RKS`` carries when nothing has been set, not a recommendation -- setting mf.xc is expected of every real calculation.  This catalogue starts at B3LYP, the most widely used hybrid in molecular chemistry (Becke, J. Chem. Phys. 98, 5648 (1993); Lee, Yang & Parr, Phys. Rev. B 37, 785 (1988)), and it pairs with the D3(BJ) dispersion this project also defaults to -- which is what repairs B3LYP's known weakness on non-covalent interactions.

Pure GGAs (PBE, BLYP) run 2-3x faster than a hybrid because they need no exact-exchange build. What they lose with it is the partial cancellation of self-interaction error that exact exchange provides, so a pure functional suffers more of it -- which surfaces as underestimated gaps and over-delocalised anions. Worth taking for a pre-optimization, rarely for the number you publish."""

[item.basis]
kind = "engine"
category = ["method", "accuracy"]
engines = ["pyscf"]
anchor = "gto.M"
engine_key = "gto.M(basis=...)"
manual = "PySCF 2.13 pyscf.gto.mole.MoleBase 'basis'"
type = "str"
value = "def2-SVP"
default = "def2-SVP"
group = "profile"
label = "Basis set"
help = """
Gaussian basis set.  This is NOT a per-stage knob -- the convergence ladder varies tolerances, not the level of theory.  Pick once based on the chemistry.
Per-tier:
  • screening / loose preopt: def2-SVP (current default)
  • publishable:               def2-TZVP (modern standard for organic chemistry; ECPs bundled to Rn)
  • tight (vib/IR/energy):    def2-TZVPP or def2-QZVP
WHAT def2-SVP IS AND IS NOT GOOD FOR.  It is a double-zeta set: fine for screening and preoptimisation, and usable for structures when paired with a dispersion correction (this project defaults to D3BJ).  Its real weakness is BASIS-SET SUPERPOSITION ERROR -- for double-zeta sets that can exceed 40% of a binding energy, and it artificially SHORTENS intermolecular distances.  So treat def2-SVP interaction energies and complex geometries as unconverged, and move to def2-TZVP for anything published.  Covalent bond lengths are much less affected: DFT bond-length errors are typically 0.01-0.07 A and are driven more by the functional than by the basis.
NOTE ON WHAT THIS PROJECT CORRECTS: D3BJ repairs the missing dispersion, not the superposition error -- PySCF applies no geometric counterpoise (gCP).  The composite methods built for exactly this (PBEh-3c, r2SCAN-3c) pair a small basis with BOTH corrections.
This help claimed a "30% bond-length error in conjugated systems -- NEVER publish" until 2026-08-15.  No source supports it; the figure appears to be a garbled import of the 40%-of-binding-energy BSSE result, which is about noncovalent interactions rather than covalent bonds, and is not specific to conjugation.
Sources: Weigend & Ahlrichs, Phys. Chem. Chem. Phys. 7, 3297 (2005) for the basis sets themselves; Sure & Grimme, J. Comput. Chem. 34, 1672 (2013) for the small-basis error analysis; Bursch et al., Angew. Chem. Int. Ed. 61, e202205735 (2022) for the best-practice recommendation.  See docs/engines/tuning.md § 2.8."""

[item.auxbasis]
refs = ["Weigend2002"]
kind = "engine"
category = ["method"]
engines = ["pyscf"]
anchor = "density_fit"
engine_key = "mf = mf.density_fit(auxbasis=...)"
manual = "PySCF 2.13 pyscf.df.addons / scf.hf.SCF.density_fit 'auxbasis' (an argument of the density-fitting call, not a standalone assignment -- pyscf/layout.py reads it there)"
type = "str"
group = "profile"
label = "Auxiliary fitting basis"
optional = true
help = "auxiliary fitting basis; None lets density_fit() auto-pick"

[item.density_fit]
kind = "engine"
category = ["method", "execution"]
engines = ["pyscf"]
anchor = "mf"
engine_key = "mf = mf.density_fit()"
manual = "PySCF 2.13 pyscf.scf.hf.SCF 'density_fit()'"
type = "bool"
value = true
default = true
group = "profile"
label = "Density fitting"
help = """
Approximate the four-centre electron-repulsion integrals by three-centre ones over an auxiliary basis (also called resolution of the identity), which is what makes the Coulomb and exchange build cheap.
DEVIATION: PySCF applies NO density fitting unless ``mf.density_fit()`` is called; we default it on.  The speed-up is large and the error it introduces sits well below the error of the orbital basis itself when the auxiliary set matches the basis -- which is why it is standard practice rather than a shortcut.  Turn it off when you need exact-integral reference numbers, or when comparing against a published value that did not use it.

In practice the SCF iteration cost drops by roughly 5-10x, and for organic systems the total-energy error it introduces stays under about 0.1 kcal/mol."""

[item.dispersion]
kind = "engine"
category = ["method"]
engines = ["pyscf"]
anchor = "mf.disp"
engine_key = "mf.disp = ..."
manual = "PySCF 2.13 pyscf.scf.dispersion 'mf.disp'"
type = "enum"
choices = ["d3bj", "d3zero", "d4", "none"]
value = "d3bj"
default = "d3bj"
group = "profile"
label = "Dispersion"
optional = true
help = """
Grimme dispersion correction, written as ``mf.disp``.
d3bj (default) is D3 with Becke-Johnson damping; d3zero is D3 with the original zero damping; d4 is the newer, charge-dependent D4.  'none' disables the correction.
BJ damping is the usual recommendation for D3 -- it does not go to zero at short range, which is where zero damping tends to under-bind.  Use d3zero only to reproduce a published number that used it.
SOURCE: the accepted spellings are PySCF 2.13's own (pyscf/scf/dispersion.py); a value outside that set raises NotImplementedError at run time, not at setup.

It matters most for biomolecules and anything weakly bound: pi-stacking, van der Waals contacts and hydrogen-bond geometries are all under-bound without a correction, and the cost of adding one is negligible."""

