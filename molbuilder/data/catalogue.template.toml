[item.negf_eq_pole_ev]
stages = ["device"]
kind = "engine"
category = ["convergence"]
engines = ["siesta"]
calculations = ["transport"]
anchor = "TS.Contours.Eq.Pole"
engine_key = "TS.Contours.Eq.Pole"
manual = "SIESTA 5.4.2 TranSIESTA §'Complex contour'"
type = "float"
value = 0.0
default = 0.0
unit = "eV"
range = [0.0, 10.0]
group = "stage"
label = "Equilibrium pole energy"
tier = "advanced"
help = """
How far up the imaginary axis the equilibrium contour's poles sit.  0 means LET TRANSIESTA CHOOSE, which is the default and is usually right.
It is not independent of the electronic temperature.  In SIESTA 5.4.2's own source (`Src/m_ts_chem_pot.F90`), a deck that declares `%block TS.ChemPot.<name>` without a `contour.eq` inside it takes the continued-fraction branch (:299), where the pole count is `N = int(E / (pi * kT))` (:319) and the run STOPS when N < 20 (:324) -- "The continued fraction method requires at least 20 poles" -- after the queue wait.
At 300 K that makes 1.63 eV the floor.  Confirmed on a live run at every point: 1.5 eV gives 18 poles and dies, 1.7 gives 20, 2.0 gives 24, 3.0 gives 36, 4.0 gives 49.
Left at 0 nothing is written and the branch's own default applies -- `E = pi * 60 * kT * 0.7` (:316), about 42 poles -- which scales with the temperature as a fixed number cannot.
The COUNT cannot be set from here.  `TS.Contours.Eq.Pole.N` is a real keyword (:113) and this branch overwrites it from the energy; only the block-interior `contour.eq.pole.n` (:263) short-circuits that, and this emitter does not write blocks.
More poles cost SCF time and buy a better-integrated density matrix.
"""

[item.bias_voltage_v]
stages = ["device"]
kind = "engine"
category = ["system"]
engines = ["siesta"]
calculations = ["transport"]
anchor = "TS.Voltage"
engine_key = "TS.Voltage"
manual = "SIESTA 5.4.2 TranSIESTA §'Bias'"
type = "float"
value = 0.0
default = 0.0
unit = "V"
range = [-5.0, 5.0]
group = "stage"
label = "Bias voltage"
tier = "basic"
help = """
The voltage held across the junction for this device run -- the difference between the two leads' chemical potentials.

You give it in volts, because that is what a person means and measures.  The deck spells it `TS.Voltage <v> eV`, which is not a mismatch: fdf treats this as an energy, and the energy an electron gains across V volts is exactly V electron-volts, so the number is the same and only the unit word differs.  Do not "fix" either side to match the other.

It is the experiment, and it decides what the result may be called.  At zero bias the device is converged once and tbtrans sweeps energy, giving T(E); an I-V obtained by integrating that single curve against the leads' Fermi functions is the linear-response approximation and must say so.  A genuine finite-bias result re-converges the device at every voltage, giving T(E, V), because the potential drop reshapes the molecular levels.

There is no universal voltage above which the approximation fails: compare eV/2 with the gap from the Fermi level to the nearest transmission resonance.  Below ~0.1 V linear response is sound; above ~0.5-1 V it is not.  The dependable check is to converge at zero and at your maximum and compare the two curves inside the window.

Each transmission point must read its own point's converged Hamiltonian, never another's.
"""

[item.ts_hs_save]
stages = ["electrode_L", "electrode_R"]
role = ["transport"]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
calculations = ["transport"]
anchor = "TS.HS.Save"
engine_key = "TS.HS.Save"
manual = "SIESTA 5.4.2 TranSIESTA §'Electrode calculations'"
type = "bool"
value = false
default = false
group = "output"
label = "Write the TranSIESTA .TSHS"
tier = "advanced"
help = """
Write `<SystemLabel>.TSHS` -- the Hamiltonian and overlap a device run's `TS.Elec.<name>` reference reads.
This is the ELECTRODE rungs' essential output, and it is the stage's ROLE rather than a preference: a lead run that omits it converges happily and produces nothing the device can attach to.  So the ladder turns it on for the two electrode rungs and nobody is offered a switch.
Three similar names, and only this one is the lead's job:

  TS.HS.Save   this row -- writes `.TSHS`, the Hamiltonian the device attaches to.
  SaveHS       writes `.HSX`, a post-processing file the ladder does not consume.  On by default for every SIESTA run; it costs disk, not correctness.
  TS.DE.Save   writes the lead's DENSITY MATRIX.  TranSIESTA asks for it only when `TS.Elecs.DM.Init` is `bulk` or `force-bulk` AND the device runs at zero bias -- the default chain lands on `diagon`, and a finite bias switches it off regardless -- so this ladder never reads it.
"""

