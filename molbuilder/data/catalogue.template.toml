# The molbuilder parameter catalogue.
# Every parameter both engines declare, in one file.
# Values are DEFAULTS; a calculation carries its own.
schema      = "molbuilder/template@2"
engines     = ["siesta", "pyscf"]

[item.system_label]
kind = "engine"
category = ["system", "procedure"]
engines = ["siesta"]
anchor = "SystemLabel"
engine_key = "SystemLabel"
manual = "SIESTA 5.4.2 §6.1 'General system descriptors'"
type = "str"
value = "siesta"
default = "siesta"
group = "setup"
label = "System label (output prefix)"
pattern = "^[A-Za-z0-9_\\-]+$"
help = "FDF SystemLabel; output files get this prefix.  Must match [A-Za-z0-9_-]+ (job-layout v1; no dots)."

[item.basis_size]
kind = "engine"
category = ["method", "accuracy"]
engines = ["siesta"]
anchor = "PAO.BasisSize"
engine_key = "PAO.BasisSize"
manual = "SIESTA 5.4.2 §6.3.3 'Size of the basis set'"
type = "enum"
choices = ["SZ", "SZP", "DZ", "DZP", "DZDP", "TZ", "TZP", "TZDP", "TZTP"]
value = "DZP"
default = "DZP"
group = "stage"
label = "Basis size"
help = """
Size of the numerical-orbital basis, roughest to tightest.  S/D/T = single / double / triple zeta (radial functions per valence orbital); P/DP/TP = one / two / three polarisation shells.
DZP is the production default and what most published SIESTA work uses.  SZ and SZP are screening-grade only.  Go to TZP or beyond for vibrational frequencies, weak interactions and anything where basis-set superposition error matters.
Cost grows steeply -- each step up roughly multiplies the orbital count, and diagonalisation scales as its cube.  All nine are accepted by SIESTA 5.4.2 (basis_specs.f::size_name); the manual's option list mentions only four, which is why four of these were missing here until 2026-08-15."""

[item.pao_energy_shift]
kind = "engine"
category = ["method", "accuracy"]
engines = ["siesta"]
anchor = "PAO.EnergyShift"
engine_key = "PAO.EnergyShift"
manual = "SIESTA 5.4.2 §6.3.4 'Range of the orbitals'"
type = "float"
value = 0.01
default = 0.01
unit = "Ry"
range = [0.001, 0.05]
group = "stage"
label = "Orbital confinement (energy shift)"
tier = "advanced"
help = """How diffuse the PAO orbitals are, in Ry: the energy rise that defines each orbital's cutoff radius.  Smaller = more diffuse = more accurate = slower.
Per-tier (Ry):
  0.05    fast screening only
  0.01    production (this project's default)
  0.005   accuracy-critical: band gaps, weak interactions, vdW
DEVIATION: SIESTA's own default is 0.02 Ry.  This catalogue starts at 0.01, because its targets are molecules and metal-molecule junctions, where the more diffuse tails are what set adsorption geometry and level alignment."""

[item.mesh_cutoff]
kind = "engine"
category = ["accuracy"]
engines = ["siesta"]
anchor = "MeshCutoff"
engine_key = "MeshCutoff"
manual = "SIESTA 5.4.2 §6.10 'The real-space grid and the eggbox-effect'"
type = "float"
value = 300.0
default = 300.0
unit = "Ry"
range = [100.0, 1000.0]
group = "stage"
label = "Real-space grid cutoff"
tier = "basic"
help = """
Real-space integration grid (Ry).  Sets the spacing of the 3D mesh SIESTA uses for Hartree + XC potentials, via the plane-wave-equivalent kinetic-energy cutoff.
Per-tier (Ry):
  150      screening (sanity-check only)
  200-250  loose preopt
  350      publishable -- forces stable to < 0.01 eV/Ang on organic + Au
  500+     tight / vibrational -- egg-box noise below 0.001 eV/Ang
           (600 for first-row elements)
Below 150 Ry the forces / energies are noticeably wrong on organic / biomolecule systems; the validator warns below that floor.  Egg-box noise sets the floor for vibrational work — test by varying ±50 Ry.  See docs/engines/tuning.md § 2.6."""

[item.xc_functional]
kind = "engine"
category = ["method"]
engines = ["siesta"]
anchor = "XC.functional"
engine_key = "XC.functional"
manual = "SIESTA 5.4.2 §6.6 'Exchange-correlation functionals'"
type = "enum"
choices = ["LDA", "GGA", "VDW"]
value = "GGA"
default = "GGA"
group = "profile"
label = "XC functional family"
help = """
XC functional family.  GGA (default) is the safe production choice for organic / biomolecule work + metals; LDA over-binds (bond lengths ~2-3% too short, energies ~10 kcal/mol off); VDW adds a non-local dispersion kernel and matters for non-covalent / vdW-stacked systems (DNA bases, MOFs).  IMPORTANT: the pseudopotential MUST match the functional family -- a PBE pseudo on an LDA calculation (or vice versa) silently gives wrong bond lengths.  PseudoDojo ships separate families for PBE / PBEsol / LDA -- pick the matching set.
DEVIATION: SIESTA's own default is LDA; this catalogue starts at GGA.  The reason is the over-binding above -- LDA's systematic error is large enough that essentially no current published work on molecules or biomolecules uses it for production geometries.  GGA/PBE has been the baseline since Perdew, Burke & Ernzerhof, Phys. Rev. Lett. 77, 3865 (1996).  LDA remains here because it is cheap and legitimate for screening."""

[item.xc_authors]
kind = "engine"
category = ["method"]
engines = ["siesta"]
anchor = "XC.authors"
engine_key = "XC.authors"
manual = "SIESTA 5.4.2 §6.6 'Exchange-correlation functionals'"
type = "enum"
choices = ["PBE", "PBEsol", "revPBE", "RPBE", "BLYP", "CA", "PZ", "PW", "DRSLL", "LMKLL"]
value = "PBE"
default = "PBE"
group = "profile"
label = "XC parameterisation"
help = """
XC parameterisation within the family.  GGA: PBE (default, all-purpose), PBEsol (better lattice constants for solids), revPBE / RPBE (better thermochemistry, slightly different binding), BLYP (rare but accepted).  VDW: DRSLL (vdW-DF1) / LMKLL (vdW-DF2-C09).  LDA: CA (Ceperley-Alder, default), PZ, PW.  This name MUST match what your pseudopotential was generated for -- mismatched XC + pseudo gives silently-wrong bond lengths.  PseudoDojo organises downloads by this name.
DEVIATION: SIESTA's own default is PZ, which is the LDA parameterisation that goes with its LDA default family.  This catalogue starts at PBE because it ships GGA -- the two move together, and a family and a parameterisation that do not belong to each other is not a configuration SIESTA implements.  Change one and check the other."""

[item.solution_method]
kind = "engine"
category = ["method", "convergence"]
engines = ["siesta"]
anchor = "SolutionMethod"
engine_key = "SolutionMethod"
manual = "SIESTA 5.4.2 §6.12 'Calculation of the electronic structure'"
type = "enum"
choices = ["diagon", "OMM", "transiesta"]
value = "diagon"
default = "diagon"
group = "profile"
label = "Solution method"
help = """Which solver produces the density matrix each SCF step.
  diagon      standard diagonalisation, O(N^3) -- the default, and right for almost everything this project runs
  OMM         order-N; worth it only for systems beyond ~500 atoms
  transiesta  non-equilibrium transport; requires the TranSIESTA build"""

[item.mixing_weight]
kind = "engine"
category = ["convergence"]
engines = ["siesta"]
anchor = "SCF.Mixer.Weight"
engine_key = "SCF.Mixer.Weight"
manual = "SIESTA 5.4.2 §6.9.2 'Mixing options'"
type = "float"
value = 0.02
default = 0.02
range = [0.001, 0.5]
group = "profile"
label = "SCF mixing weight"
tier = "advanced"
help = """
How much of each new SCF solution is mixed in.  SIESTA's own default is 0.25; this catalogue starts at 0.02, deliberately, because the systems it targets (metal junctions, open-shell metals) leave the convergence basin at high weights.  The manual backs the direction: "a low value ... is more likely to converge", at the cost of more SCF steps, and the value is "heavily system dependent".
FIRST THING TO TRY when the SCF oscillates -- lower this before touching anything else (manual: "experimentation with the mixing weight is preferred as a first resort").
Organic molecules with no metal converge happily at 0.1-0.25 and will run in far fewer steps; raise it if your system is well-behaved."""

[item.pulay_history]
kind = "engine"
category = ["convergence"]
engines = ["siesta"]
anchor = "SCF.Mixer.History"
engine_key = "SCF.Mixer.History"
manual = "SIESTA 5.4.2 §6.9.2 'Mixing options'"
type = "int"
value = 8
default = 8
range = [0, 20]
group = "profile"
label = "Pulay history depth"
tier = "advanced"
help = """
How many previous SCF steps the mixer uses to predict the next one.  Higher = steadier convergence, at a few vectors of memory.
8 because SIESTA's manual puts 2-6 in a band where "a too low value (say 2-6) might change the convergence properties a lot", advises "around 6 or above", and notes that two different high values barely differ -- so 8 buys the manual's advice with margin, at a cost the manual says is negligible.
DEVIATION: SIESTA's own default is 2.
Raise to 12-20 if the SCF still oscillates AFTER lowering the mixing weight -- the weight is the first thing to try (manual: "experimentation with the mixing weight is preferred as a first resort").
"""

[item.dm_tolerance]
kind = "engine"
category = ["accuracy"]
engines = ["siesta"]
anchor = "DM.Tolerance"
engine_key = "DM.Tolerance"
manual = "SIESTA 5.4.2 §6.9.8 'Convergence criteria'"
type = "float"
value = 1e-05
default = 1e-05
range = [1e-08, 0.001]
group = "stage"
label = "Density-matrix tolerance"
tier = "advanced"
help = """
Density-matrix element convergence threshold for the inner SCF loop.  Forces are derived from the converged density -- sloppy SCF -> noisy forces -> optimizer thrashes.
Per-tier (dimensionless):
  1e-3   screening (sanity-check only)
  1e-4   loose preopt / publishable
  1e-5   tight (vib / IR / accurate forces)
  1e-6   very-tight (band structure, phonons)
DEVIATION: SIESTA's own default is 1e-4; this catalogue starts at 1e-5, one decade tighter.  The work this project is built for is relaxations and vibrational analysis, where the forces come out of the converged density and a loose SCF shows up as force noise the optimiser then chases -- which costs more geometry steps than the extra SCF cycles cost.  For single-point screening, 1e-4 is the engine's own answer and is enough.
Rule of thumb: keep SCF tol ~10x tighter than the force-precision target you want at convergence.  See docs/engines/tuning.md § 2.5."""

[item.dm_energy_tolerance]
kind = "engine"
category = ["accuracy"]
engines = ["siesta"]
anchor = "DM.EnergyTolerance"
engine_key = "DM.EnergyTolerance"
manual = "SIESTA 5.4.2 §6.9.8 'Convergence criteria'"
type = "float"
value = 0.0001
default = 0.0001
unit = "eV"
range = [1e-08, 0.1]
group = "stage"
label = "SCF free-energy tolerance"
tier = "advanced"
help = """
How little the total FREE energy must change between SCF cycles before that cycle counts as settled.
ONLY HAS AN EFFECT WHEN THE SWITCH BELOW IS ON.  SIESTA reads this value either way and then ignores it: read_options.F90 loads it into tolerance_FreeE, and siesta_forces.F90 installs it as a criterion only `if (converge_FreeE)`.  Until 2026-08-15 molbuilder wrote this line and never wrote the switch, so the control looked live and could not change any result.
1e-4 eV is SIESTA's own default, and pairs sensibly with a 1e-5 density-matrix tolerance -- the intent is that the energy test is not the thing that stops you first."""

[item.scf_energy_converge]
kind = "engine"
category = ["accuracy"]
engines = ["siesta"]
anchor = "SCF.FreeE.Converge"
engine_key = "SCF.FreeE.Converge"
manual = "SIESTA 5.4.2 §6.9.8 'Convergence criteria'"
type = "bool"
value = false
default = false
group = "stage"
label = "Also require the free energy to settle"
tier = "advanced"
help = """
Whether the SCF must ALSO see the free energy settle, not just the density matrix.  Off by default, as in SIESTA.
HOW SIESTA DECIDES AN SCF IS CONVERGED: it checks several things each cycle and requires ALL THE ENABLED ONES to pass -- a plain AND (scfconvergence_test.F).  Density-matrix change, Hamiltonian change and energy-density-matrix change are ON by default; free-energy and Harris-energy convergence are OFF.  So turning this on can only make the SCF stop LATER.  It never makes a result wrong; it refuses to accept one early.
WHEN IT EARNS ITS COST: systems with many electronic states near the Fermi level -- metals, metal-molecule junctions, and large periodic cells where the spectrum is dense -- especially at a raised ELECTRONIC temperature (the ElectronicTemperature smearing, not the MD temperature).  There the free energy carries an entropy term (F = E - TS) large enough that the density-matrix criterion can go quiet while the energy is still drifting.  For a molecule with a clear HOMO-LUMO gap this changes nothing but the runtime.
THE COST LANDS WHERE THE BENEFIT DOES: those are the same systems with the most expensive SCF cycles, so budget for more of them and check max_scf_iter before turning this on.
SOURCES: the AND-combination, the per-criterion defaults and the gating are from SIESTA 5.4.2's source and manual (see engines/template.md 10b).  The F = E - TS argument and the dense-spectrum reasoning are standard DFT, not statements the manual makes; the manual says only that the smearing temperature is "useful specially for metals"."""


[item.max_scf_iter]
kind = "engine"
category = ["convergence"]
engines = ["siesta"]
anchor = "MaxSCFIterations"
engine_key = "MaxSCFIterations"
manual = "SIESTA 5.4.2 §6.9 'The self-consistent-field loop'"
type = "int"
value = 1000
default = 1000
range = [10, 5000]
group = "budget"
label = "Max SCF cycles per geometry step"
tier = "advanced"
help = """
INNER loop: the most self-consistency cycles SIESTA will run inside ONE geometry step.  A relaxation runs at most relax_steps outer steps, and each of those runs at most this many inner cycles (or until DM.Tolerance is met).
1000 is SIESTA's own default, and it is the right guard HERE because this catalogue ships mixing_weight 0.02 against SIESTA's 0.25: the manual says a low weight "may result in high number of SCF steps but is more likely to converge", so a run that is converging normally needs more cycles than a stock one.
This is a RUNAWAY GUARD, not a budget -- the budget is wall time and continue_retries.  The two failure modes are not symmetric: too high wastes some CPU on a run that was going to fail anyway, while too low KILLS A CONVERGING RUN at the cap and throws away that whole geometry step, which compounds over 200 outer steps.  With a 0.02 mixing weight, several hundred cycles is normal for a metal junction -- do not read this number as a target."""

[item.scf_must_converge]
kind = "engine"
category = ["convergence"]
engines = ["siesta"]
anchor = "SCF.MustConverge"
engine_key = "SCF.MustConverge"
manual = "SIESTA 5.4.2 \u00a76.9 'The self-consistent-field loop'"
type = "bool"
group = "budget"
label = "Abort if the SCF hits its cycle cap"
null_label = "(SIESTA default: abort)"
optional = true
tier = "advanced"
help = """
What SIESTA does when a geometry step's SCF loop hits max_scf_iter without meeting its tolerances: abort the run (SIESTA's own default, true), or accept the unconverged density and CONTINUE with a warning (false).
Leave it unset for ordinary work -- an unconverged density means the forces are noise, and a relaxation that keeps walking on noise wastes every step after the first bad one.  The abort is protecting your budget, not enforcing bureaucracy.
THE ONE ORDINARY REASON TO SET false: a run that is a MEASUREMENT rather than a result.  A benchmark trial deliberately caps the SCF at a few cycles to time an iteration (project-layout.md section 3.2's pins); with the abort left on, every properly-capped trial ends in ABNORMAL_TERMINATION and the timing machinery must read a 'failed' run.  The bench pins set this false so a capped trial ends cleanly as the single-point measurement it is.  Until 2026-08-19 this keyword had no catalogue item at all -- the retired deck-splicer used to invent the line -- so no described trial could say it, and no sweep could ever produce a verdict (its every point classified incomplete)."""

[item.electronic_temperature]
kind = "engine"
category = ["system", "accuracy"]
engines = ["siesta"]
anchor = "ElectronicTemperature"
engine_key = "ElectronicTemperature"
manual = "SIESTA 5.4.2 §6.12.3 'Occupation of electronic states and Fermi level'"
type = "float"
value = 300.0
default = 300.0
unit = "K"
range = [0.0, 5000.0]
group = "profile"
label = "Electronic temperature (smearing)"
tier = "advanced"
help = """
How sharply the electronic states fill at the Fermi level -- the width of the Fermi-Dirac smearing.
THIS IS NOT THE TEMPERATURE OF YOUR SIMULATION.  It is a property of the ELECTRONS and it applies to every run type, including a 0 K geometry relaxation with no atomic motion at all.  Do not confuse it with 'Initial temperature' / 'Target temperature', which are about how fast the ATOMS move and are read only by Verlet / Nose molecular dynamics.  The two are independent: a metal needs smearing whether or not its atoms are moving.
WHY IT EXISTS: in a metal, states sit right at the Fermi level and swap occupancy between SCF cycles, so the density oscillates and never settles.  Smearing lets states be partially occupied, which damps that.  A molecule with a clear HOMO-LUMO gap does not need it, and for such a system the value barely matters.
RAISE IT (1000-2000 K) for a metal or a metal-molecule junction whose SCF will not converge -- after lowering the mixing weight, which is the first thing to try.  LOWER IT toward 0 only for an insulator where you want strictly integer occupations.
COST: a raised smearing temperature adds an entropy term to the free energy (F = E - TS), which is what makes the free-energy convergence criterion worth turning on for exactly these systems -- see 'Also require the free energy to settle'.  300 K is SIESTA's own default."""

[item.kgrid]
kind = "engine"
category = ["accuracy"]
engines = ["siesta"]
anchor = "%block kgrid_Monkhorst_Pack"
engine_key = "%block kgrid_Monkhorst_Pack"
manual = "SIESTA 5.4.2 §6.5 'k-point sampling'"
type = "int3"
value = [1, 1, 1]
default = [1, 1, 1]
range = [1, 64]
group = "stage"
label = "k-point mesh"
tier = "basic"
help = """
Monkhorst-Pack sampling of the Brillouin zone, one count per axis.
  1x1x1          an isolated molecule -- only Gamma matters
  4x4x4 - 8x8x8  a periodic 3D crystal
  n x n x 1      a slab; no sampling along the vacuum axis

Cost scales linearly with the number of k-points.  Converge by raising the density ~1.5x per axis: the total energy should move less than 1 meV/atom.

SIESTA reports an EQUIVALENT CUTOFF for whatever mesh you give -- a length that says how dense the sampling really is.  That number, not the counts, is what makes two DIFFERENT cells comparable: the same 4x4x4 on a small and a large cell samples them differently."""

[item.kgrid_displacement]
kind = "engine"
category = ["accuracy"]
engines = ["siesta"]
anchor = "%block kgrid_Monkhorst_Pack"
engine_key = "%block kgrid_Monkhorst_Pack  (displ column)"
manual = "SIESTA 5.4.2 §6.5 'k-point sampling'"
type = "float3"
value = [0.0, 0.0, 0.0]
default = [0.0, 0.0, 0.0]
range = [0.0, 1.0]
group = "stage"
label = "k-grid displacement"
help = """
Shifts the k-point mesh off Gamma, one value per axis, in units of the mesh spacing.  [0,0,0] is Gamma-centred.

  0.0    Gamma-centred.  Required for a 1x1x1 mesh (an isolated molecule), and the safe choice for ODD meshes, which already contain Gamma.
  0.5    The classic Monkhorst-Pack shift.  Use on EVEN meshes -- it samples better than a Gamma-centred grid of the same size, and matters most for metals.

Axes are independent: [0.5, 0.5, 0.0] shifts two and leaves the third on Gamma -- which is what a slab wants when the third axis is vacuum.

TRANSPORT: SIESTA forces this to 0 along the transport direction, whatever you set, because that direction is sampled at one k-point."""

[item.relax_type]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "MD.TypeOfRun"
engine_key = "MD.TypeOfRun"
manual = "SIESTA 5.4.2 §7 'STRUCTURAL RELAXATION, PHONONS, AND MOLECULAR DYNAMICS'"
type = "enum"
choices = ["CG", "Broyden", "FIRE", "Verlet", "Nose", "none"]
value = "CG"
default = "CG"
group = "stage"
label = "Relaxation / MD algorithm"
help = """
MD/relax algorithm.  Per-tier guidance:
  • CG       — robust for loose warm-up stages (far from minimum, large forces).  No memory cost.  Oscillates near a minimum on stiff / coupled systems (metals, interfaces, vdW stacks).
  • Broyden  — quasi-Newton; best for publishable / tight stages on organic-on-metal interfaces, surfaces, anything where CG oscillates.
  • FIRE     — MD-inspired; robust on rough landscapes (random builder guesses).
  • Verlet/Nose — NOT geometry relax; finite-T MD only.
  • none     — single-point (skip MD block entirely).
Recommended workflow: stage 1 CG (warm-up) → stage 2 Broyden (refine).  See docs/engines/tuning.md § 2.1 for full algorithm comparison + citations."""

[item.relax_steps]
kind = "deck"
category = ["procedure"]
engines = ["siesta"]
expands = ["MD.Steps", "MD.FinalTimeStep"]
engine_key = "MD.Steps (CG / Broyden / FIRE) | MD.FinalTimeStep (Verlet / Nose)"
manual = "SIESTA 5.4.2 §7.2 'Structural relaxation' + §7.4 'Molecular dynamics'"
type = "int"
value = 200
default = 200
range = [1, 10000]
group = "budget"
label = "Max geometry-optimisation steps"
tier = "advanced"
help = """
OUTER loop: max geometry steps the optimiser is allowed (each step = full SCF + forces + atom move).  Which keyword carries it is decided by MD.TypeOfRun: CG / Broyden / FIRE relax and bound the loop with ``MD.Steps``; Verlet / Nose integrate and bound it with ``MD.FinalTimeStep`` instead (SIESTA 5.4.2, siesta_init.F -- idyn 0 uses MD.Steps, idyn 1-5 use MD.InitialTimeStep..MD.FinalTimeStep).  ``MD.Steps`` DEPRECATES the older ``MD.NumCGsteps``, whose CG-prefixed name hid that it was never CG-only.
Per-tier: loose warm-up ~50, publishable ~200, tight (vib/IR) ~100 (small displacement cap = slow but few steps from a publishable-converged starting geometry).  See docs/engines/tuning.md § 2.10.

A well-behaved relaxation converges in 30-150 steps, so 200+ is a safety cap rather than a target -- it is there to stop a run that is not going to converge, not to describe one that is. For molecular dynamics the count is not a cap but a duration: steps x timestep is the timescale you actually sample, so pick it from the physics you want to see."""

[item.relax_force_tol]
kind = "engine"
category = ["accuracy"]
engines = ["siesta"]
anchor = "MD.MaxForceTol"
engine_key = "MD.MaxForceTol"
manual = "SIESTA 5.4.2 §7.2 'Structural relaxation'"
type = "float"
value = 0.02
default = 0.02
unit = "eV/Å"
range = [0.001, 0.5]
group = "stage"
label = "Force convergence threshold"
tier = "advanced"
help = """
Force-tol stop criterion: max unconstrained atomic force below which the relaxation declares success.  Ignored by Verlet/Nose (those are MD, not relax).
Per-tier (eV/Å): screening 0.10, loose preopt 0.05, publishable 0.04 (Gaussian-OPT default), tight (vib/IR) 0.01, very-tight (NEB barrier) 0.001.
DEVIATION: SIESTA's own default is 0.04 eV/Å -- the 'publishable' row above.  This catalogue starts at 0.02, twice as tight, because a relaxation that stops at the loose end leaves residual forces big enough to contaminate a frequency calculation run on top of it, and re-relaxing afterwards costs more than the extra steps did.  For a single-point or a screening pass, 0.04 is the engine's own answer.
SIESTA only checks max force.  See docs/engines/tuning.md § 2.3 for the 5-criteria geomeTRIC/Gaussian convention + citations."""

[item.relax_max_displ]
kind = "engine"
category = ["procedure", "convergence"]
engines = ["siesta"]
anchor = "MD.MaxDispl"
engine_key = "MD.MaxDispl (CG / Broyden / FIRE)"
manual = "SIESTA 5.4.2 §7.2 'Structural relaxation'"
type = "float"
value = 0.05
default = 0.05
unit = "Å"
range = [0.001, 0.5]
group = "stage"
label = "Max displacement per step"
tier = "advanced"
help = """
Displacement cap per optimiser step (Å).  Applies across CG, Broyden AND FIRE.  Hard ceiling that catches line-search over-shoot.  ``MD.MaxDispl`` DEPRECATES the older ``MD.MaxCGDispl`` (SIESTA 5.4.2); same meaning, same 0.2 Bohr default, and the CG-prefixed name was never CG-only.
DEVIATION: that engine default of 0.2 Bohr is 0.106 Å; this catalogue starts at 0.05 Å, about half.  The cap only ever LIMITS a step, so a smaller one costs steps and never accuracy -- and the oscillation below is what a too-large cap looks like.  Raise it back toward 0.2 Å for a cheap first pass on a structure that starts far from its minimum.
Per-tier (Å): screening 0.30, loose preopt 0.20, publishable 0.05, tight (vib/IR) 0.02.
Symptom of too-large cap: max-force oscillates rather than descends (e.g. 0.09 → 0.44 → 0.13 → 0.31 → ...).  Halve the cap.  See docs/engines/tuning.md § 2.2 + the BDT/Au worked example in § 6.

It is a hard ceiling that catches line-search over-shoot, not a target. The symptom of one set too large is a maximum force that oscillates instead of descending (0.09 -> 0.44 -> 0.13 -> 0.31 ...); halve the cap and continue."""

[item.continue_retries]
kind = "wrapper"
category = ["execution"]
engines = ["siesta"]
engine_key = "(molbuilder: baked into the run wrapper at install time; never an .fdf line and never an sbatch flag)"
type = "int"
value = 1
default = 1
range = [0, 5]
group = "staging"
label = "Warm-retry budget"
tier = "advanced"
help = "How many extra relaxation batches the wrapper may run when a job hits its step cap without converging: it re-enters SIESTA with --continue from the current .XV.  Total step budget = relax_steps x (1 + continue_retries)."

[item.md_initial_temperature]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "MD.InitialTemperature"
engine_key = "MD.InitialTemperature"
manual = "SIESTA 5.4.2 §7.4 'Molecular dynamics'"
type = "float"
value = 300.0
default = 300.0
unit = "K"
range = [0.0, 5000.0]
group = "profile"
label = "Initial temperature"
tier = "advanced"
help = """
Temperature the initial atomic velocities are drawn for, in Verlet / Nose molecular dynamics.  IGNORED by CG / Broyden / FIRE geometry relaxation -- those don't have velocities to seed.
THIS IS ABOUT THE ATOMS, not the electrons.  It is a different quantity from 'Electronic temperature (smearing)', which shares the word and the unit and nothing else: that one sets how sharply electronic states fill at the Fermi level and applies to every run type, including this one.  Setting them to match means nothing -- an MD at 0 K still needs electronic smearing if the system is metallic.
DEVIATION: SIESTA's own default is 0 K, i.e. start from rest.  This catalogue starts at 300 K because a run seeded at 0 K spends its opening picoseconds simply acquiring thermal motion, and 300 K is both room temperature and the condition most reported simulations are run at.  Set it to 0 deliberately if you want the cold start."""

[item.md_target_temperature]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "MD.TargetTemperature"
engine_key = "MD.TargetTemperature"
manual = "SIESTA 5.4.2 §7.4 'Molecular dynamics'"
type = "float"
unit = "K"
range = [0.0, 5000.0]
group = "profile"
label = "Target temperature (NVT)"
null_label = "(use MD.InitialTemperature)"
optional = true
tier = "advanced"
help = """Nose-Hoover NVT target temperature (K).  Used ONLY by Nose dynamics; CG / Broyden / FIRE / Verlet ignore it.  Defaults to md_initial_temperature when unset.
REQUIRED for the thermostat: without it SIESTA defaults the target to 0 K and the run QUENCHES instead of equilibrating."""

[item.md_length_timestep]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "MD.LengthTimeStep"
engine_key = "MD.LengthTimeStep"
manual = "SIESTA 5.4.2 §7.4 'Molecular dynamics'"
type = "float"
value = 1.0
default = 1.0
unit = "fs"
range = [0.1, 5.0]
group = "profile"
label = "MD timestep"
tier = "advanced"
help = "integration timestep for Verlet/Nose dynamics (fs).  1.0 fs is SIESTA's default and works for systems without H; bonded H typically needs 0.5 fs for stable energy conservation.  IGNORED by CG / Broyden / FIRE geometry relaxation."

[item.restart]
kind = "deck"
category = ["convergence", "execution"]
engines = ["siesta", "pyscf"]
expands = ["DM.UseSaveDM", "MD.UseSaveXV", "MD.UseSaveCG"]
engine_key = "(molbuilder: one field, one mechanism per engine -- SIESTA expands it to DM.UseSaveDM / MD.UseSaveXV / MD.UseSaveCG; PySCF emits control flow that reads <JOB>.chk and <JOB>_optimized.xyz.  Not a single engine key on either)"
manual = "SIESTA 5.4.2 §6.9.5 'Initialization of the density-matrix' + §6.4.4 'Input of structural information from external files' + §7.2.1 'Conjugate-gradients optimization'"
type = "enum"
choices = ["clean", "continue"]
value = "continue"
default = "continue"
group = "staging"
label = "Start from"
tier = "advanced"
help = """
Whether this run starts from what is already in the folder.
  continue  -- read it (the default).  Nothing there is not an error: the engine starts from the deck's own coordinates.
  clean     -- ignore it and start over, OVERWRITING what is there as the run proceeds.
Which files that means is the engine's own: SIESTA reads .XV / .DM / .CG, PySCF reads <JOB>_optimized.xyz and <JOB>.chk.
Continuing is the default because a run you start in a folder that already holds a result is a run you started after looking at that result.  To keep the old state, save it first with `molbuilder checkpoint save` -- the launcher warns before a clean run overwrites anything and stops unless you pass --force."""

[item.wrap_into_cell]
kind = "produce"
category = ["procedure"]
engines = ["siesta"]
engine_key = "(molbuilder: pre-emission positioning)"
type = "bool"
value = true
default = true
group = "profile"
label = "Wrap atoms into cell"
help = """
Move any atom that sits outside the cell box back inside it, by shifting it a whole number of cell vectors.
MOLBUILDER DOES THIS, NOT SIESTA.  It rewrites the coordinates that get written into the .fdf, so what you see in the deck is what ran.  In a periodic crystal it changes nothing physical: shifting an atom by a whole lattice vector lands it on an identical position, so the energy and forces are the same.  It just keeps the numbers tidy and comparable between runs.
WHEN TO TURN IT OFF: a MOLECULE that straddles a cell face.  Wrapping moves only the atoms that stuck out, so the molecule is split -- half at one edge of the box, half at the opposite edge.  The physics is still right for a periodic calculation, but the structure LOOKS torn in the viewer, and anything that measures geometry directly from the coordinates (bond lengths, a centre of mass, an RMSD against another frame) reads the box-crossing distance instead of the real one.  If your system is one molecule in a vacuum box, or a slab with an adsorbate near an edge, turn this off.
It has no effect when the cell was built from the structure itself: that path already centres the atoms in the box, so nothing is outside to fold back."""

[item.verbose_comments]
kind = "produce"
category = ["procedure"]
engine_key = "(molbuilder: comment-block control in the generated input)"
type = "bool"
value = true
default = true
group = "output"
label = "Verbose inline comments"
help = """
Emit inline tuning hints and a Troubleshooting block in the generated script, in whatever comment syntax that engine uses."""
[item.write_forces]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "WriteForces"
engine_key = "WriteForces"
manual = "SIESTA 5.4.2 §7.5 'Output options for dynamics'"
type = "bool"
value = true
default = true
group = "output"
label = "Write forces each step"
help = """
Write the atomic forces into the main .out at every relaxation or MD step, so the force history can be read back from the log.
DEVIATION: SIESTA ships this off; we ship it on.  A relaxation whose force history was not recorded cannot be diagnosed afterwards -- "did it descend or oscillate?" is the first question about any run that did not converge, and the answer costs a few lines of text per step.
It does NOT control the .FA file.  This help said "write forces to the .FA file (required for relaxation)" until 2026-08-15 and both halves were wrong: the manual says the last step's forces "can be found in the file .FA" whatever this flag is set to, and a relaxation runs perfectly well without either."""

[item.write_coor_step]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "WriteCoorStep"
engine_key = "WriteCoorStep"
manual = "SIESTA 5.4.2 §7.5 'Output options for dynamics'"
type = "bool"
value = true
default = true
group = "output"
label = "Write coordinates each step"
help = """
Write the atomic coordinates into the main .out at every relaxation or MD step.
DEVIATION: SIESTA defaults this to LongOutput (off unless you asked for verbose output); we ship it on, for the same reason as the force history -- the .out is the one file that always survives, so the trajectory should be recoverable from it alone.
CAUTION -- IT HAS A SIDE EFFECT ON ANOTHER KEYWORD: WriteMDXmol (the .ANI animation file) defaults to `.not. WriteCoorStep` (read_options.F90), so turning this ON turns .ANI OFF unless WriteMDXmol is set explicitly."""

[item.write_coor_xmol]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "WriteCoorXmol"
engine_key = "WriteCoorXmol"
manual = "SIESTA 5.4.2 §6.4.3 'Output of structural information'"
type = "bool"
value = true
default = true
group = "output"
label = "Write XMOL .xyz"
help = """
Write an extra <label>.xyz holding the FINAL atomic coordinates, in Angstrom whatever input format was used, readable by XMol / JMol / Molden.
DEVIATION: SIESTA ships this off; we ship it on, because a finished relaxation whose result is only inside the .out has to be re-extracted before anything else can open it.
ONE STRUCTURE, NOT A MOVIE.  This help promised ".xyz of every relaxation step (movie viewer)" until 2026-08-15; the manual is explicit that the file holds the final coordinates.  The per-step animation file is .ANI, and it comes from a different keyword (WriteMDXmol)."""

[item.write_md_history]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "WriteMDhistory"
engine_key = "WriteMDhistory"
manual = "SIESTA 5.4.2 §7.5 'Output options for dynamics'"
type = "bool"
value = true
default = true
group = "output"
label = "Write MD history (.MD/.MDE)"
help = """
Accumulate the trajectory into <label>.MD -- positions and velocities (and cell, for a variable cell) at every step, written UNFORMATTED for post-processing -- plus <label>.MDE, a short per-step line of energy, temperature and the like.  Both are appended across runs, so a restarted job extends them rather than replacing them.
DEVIATION: SIESTA ships this off; we ship it on, because it is the only complete record of what the trajectory did.
IT DOES NOT WRITE .ANI.  The label and this help said "Write .ANI trajectory ... (xcrysden / vmd / OVITO)" until 2026-08-15 and that was wrong: read_options.F90 binds this keyword to `writmd`, which write_md_record.F routes to `iomd` (the .MD file).  .ANI is written by `pixmol` under `writpx`, which is the separate WriteMDXmol keyword.
NOTE the .MD file is unformatted, so it is not something a viewer opens directly."""

[item.write_md_xmol]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "WriteMDXmol"
engine_key = "WriteMDXmol"
manual = "SIESTA 5.4.2 §6.4.3 'Output of structural information'"
type = "bool"
value = true
default = true
group = "output"
label = "Write XMOL animation (.ANI)"
help = """
Accumulate every step's coordinates into <label>.ANI, a plain-text multi-frame .xyz in Angstrom that xcrysden, VMD and OVITO open directly as an animation.  Appended across runs, so a restart extends it.
WHY THIS IS A SWITCH AND NOT JUST ON: SIESTA defaults it to `.not. WriteCoorStep` (read_options.F90) -- the two keywords are coupled, and nothing in the form said so.  Because this project ships WriteCoorStep on, that default resolved to OFF and no molbuilder run ever wrote a .ANI, while the form advertised one on a different control (fixed the same day).  Setting it explicitly is the only way to stop one keyword silently deciding another.
MOLBUILDER DOES NOT READ THIS FILE.  Trajectory coordinates come from <label>.MD.nc, which carries full double precision rather than text; .ANI is listed among a run's files but never parsed.  So it is purely for opening the trajectory in an external viewer -- turn it off if disk matters and you do not need that, and nothing inside molbuilder changes."""

[item.write_hs]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "SaveHS"
engine_key = "SaveHS"
manual = "SIESTA 5.4.2 §6.11 'Matrix elements of the Hamiltonian and overlap'"
type = "bool"
value = true
default = true
group = "output"
label = "Write H+S matrices"
help = """
Write the Hamiltonian and overlap matrices to <label>.HSX.  The manual: it "contains all relevant information to construct the Brillouin zone Hamiltonian and can thus be used for subsequent density of states calculations" -- and it is what TranSIESTA / TBtrans read for transport.
DEFAULT CHANGED false -> true on 2026-08-15, to match SIESTA's own default (read_options.F90: fdf_get('SaveHS', .true.)).  Shipping it off meant a finished relaxation had no .HSX, so wanting bands, DOS or transport afterwards meant re-running the SCF.  The cost of having it is disk; the cost of not having it is a repeat run."""

[item.write_molwatch_log]
kind = "produce"
category = ["procedure"]
engine_key = "(molbuilder: writes <basename>.molwatch.log for the live viewer)"
type = "bool"
value = true
default = true
group = "output"
label = "Write the molwatch trajectory log"
help = """
Write <job>.molwatch.log alongside the run: per-step coordinates, energy and forces, in one additive file the Watch tab reads.  It exists so a trajectory can be followed while the engine is still running."""
[item.mpi_np]
kind = "wrapper"
category = ["execution"]
engines = ["siesta"]
engine_key = "(molbuilder: .run.sh ``mpirun -np N`` only; not in .fdf)"
type = "int"
allocation = true
range = [1, 1024]
group = "staging"
label = "MPI ranks (np)"
null_label = "(single-process)"
optional = true
help = """
MPI rank count baked into ``mpirun -np N siesta`` in the generated run-wrapper.  Pick based on your host: typically N = physical cores; for memory-bound jobs N = sockets x cores_per_socket / 2 is a common rule of thumb.  Cluster schedulers (Slurm / PBS) usually set this for you; on a workstation you pick it manually.  Leave blank for the auto default (physical_cores).

RUNTIME OVERRIDE: this value bakes a DEFAULT into the wrapper but is not final.  The wrapper accepts ``bash run.sh -np N`` and ``MB_NP=N bash run.sh``, so you can experiment with different rank counts WITHOUT regenerating.  This matters because SIESTA can crash with ``propor: ERROR: IMAX = 0`` for certain mpi_np / molecule combinations -- the crash depends on the ProcessorY x ProcessorX grid SIESTA auto-picks for that rank count, which is hard to predict.  If you hit propor, retry with smaller -np (powers of 2 are usually safe).  The wrapper prints a focused diagnostic on the propor crash with specific suggestions."""

[item.gpu_count]
kind = "wrapper"
category = ["execution"]
engines = ["siesta"]
engine_key = "(molbuilder: scheduler ``--gres=gpu:<type>:G``; not in .fdf)"
type = "int"
allocation = true
range = [1, 16]
group = "staging"
label = "GPUs per trial (G)"
help = """
How many GPU devices one trial (or run) asks the scheduler for.  Ranks per device follow as mpi_np / G, and the split must be EVEN -- ELPA's own rule is the same rank count on every device (tuning.md 2.12) -- so a bench cell whose mpi_np does not divide by G is dropped by name at prep.  Declared in the bench block it is an axis: gpu_count = [1, 2, 4] measures exactly those device counts.  Leave it out and prep proposes the divisors of each declared rank count."""

[item.block_size]
kind = "engine"
category = ["execution"]
engines = ["siesta"]
anchor = "BlockSize"
engine_key = "BlockSize"
manual = "SIESTA 5.4.2 §6.27 'Parallel options'"
type = "int"
group = "budget"
label = "ScaLAPACK block size"
null_label = "(auto)"
optional = true
help = """
How many consecutive orbitals go to one MPI rank before the distribution moves to the next -- the ScaLAPACK block.  It cannot change the answer, only how evenly the ranks are fed and therefore how long the run takes.
TWO STATES.  Left as (auto) the keyword is NOT WRITTEN and SIESTA uses its own automatic, which is what its manual declares as the default.  Set to a number, that number is written verbatim -- which is what you want after benchmarking, and a benchmark is the only thing that really answers this: the best block depends on the matrix size, the rank count, the interconnect and the node's memory layout at once.
molbuilder DERIVED a value here until 2026-08-15, and it should not have: the guess went into the deck as if it were a decision, and below four atoms it wrote BlockSize 1 -- legal, and the opposite of the cache blocking the parameter exists for.
GUIDANCE if you set one by hand: powers of two (16, 32, 64, 128); smaller for few orbitals, larger for thousands. Stay under n_orbitals / ranks or some rank gets no block at all.
GPU: with an ELPA diagonaliser on the GPU the block must be a power of two or ELPA silently runs on the CPU. `prep` realigns it there -- that is the layer that knows the GPU flag and the rank count (tuning.md 2.11).
It does NOT fix ``propor: ERROR: IMAX = 0``.  That claim was disproved by direct sweep (BS = 1, 2, 4 all crash at the same mpi_np); propor is a vector-proportionality check in matel_table's MPI-deduplication step.  Lower the rank count to clear it."""

[item.parallel_over_k]
kind = "engine"
category = ["execution"]
engines = ["siesta"]
anchor = "Diag.ParallelOverK"
engine_key = "Diag.ParallelOverK"
manual = "SIESTA 5.4.2 §6.12.1 'Diagonalization options'"
type = "bool"
group = "budget"
label = "ParallelOverK"
optional = true
help = "MPI parallelise over k-points; None=auto from kgrid"

[item.omp_threads]
kind = "wrapper"
category = ["execution"]
engines = ["siesta"]
engine_key = "(molbuilder: .run.sh OMP_NUM_THREADS + .fdf runtime_info comment)"
type = "int"
allocation = true
group = "staging"
label = "OMP threads per rank"
null_label = "(auto: physical cores)"
optional = true
help = "OpenMP threads per MPI process.  Default (blank) auto-detects physical cores at run time (divided by N_MPI when applicable).  Set explicitly to bench or leave cores free for other jobs.  The emitted run-wrapper pins BLAS to 1 thread per rank so OMP*BLAS doesn't oversubscribe -- the canonical recipe shared with /spectra + Build PySCF."

[item.max_memory_mb]
kind = "wrapper"
category = ["execution"]
engine_key = "(molbuilder: memory cap for the run -- ulimit -v in .run.sh / mol.max_memory)"
type = "int"
allocation = true
unit = "MB"
range = [100, 1000000]
group = "staging"
label = "Max memory"
null_label = "(no cap)"
optional = true
tier = "advanced"
help = """
How much memory this run may use.  Left blank -- the normal state -- it is the machine's maximum, resolved at prep on the node that granted it; set a number only when you need a ceiling.

Each engine applies it its own way: SIESTA emits a SystemMemory hint into the deck and caps the wrapper, PySCF passes it to mol.max_memory, which is what it consults to choose in-core versus out-of-core."""
[item.enable_gpu]
kind = "engine"
category = ["execution"]
engines = ["siesta"]
anchor = "Diag.ELPA.GPU"
engine_key = "Diag.ELPA.GPU"
manual = "SIESTA 5.4.2 §6.12.1 'Diagonalization options'"
type = "bool"
value = false
default = false
group = "staging"
label = "Use GPU (NVIDIA, via ELPA-CUDA)"
read_by = ["wrapper"]
help = "OPTIONAL: run the ELPA diagonalization on an NVIDIA CUDA GPU.  This does NOT turn ELPA on -- pick the solver in ``Diagonalizer`` (ELPA-1STAGE / -2STAGE). This toggle only moves that ELPA solve onto the GPU (GPU-only, no CPU fallback).  Requires an ELPA diagonalizer (GPU + ScaLAPACK is rejected) and an NVIDIA GPU on the run machine.  Off = the chosen ELPA solver runs on CPU (or ScaLAPACK if that's selected). This toggle is the ONLY thing that needs the source-built ``molbuilder-siesta-gpu`` env: the packaged SIESTA runs ELPA on CPU perfectly well, but its ELPA is built without the GPU entry.  The wrapper refuses to emit if that env is missing. Affinity hint: GPU favors 1STAGE."

[item.diag_algorithm]
kind = "engine"
category = ["execution"]
engines = ["siesta"]
anchor = "Diag.Algorithm"
engine_key = "Diag.Algorithm"
manual = "SIESTA 5.4.2 §6.12.1 'Diagonalization options'"
type = "enum"
choices = ["ScaLAPACK", "ELPA-1STAGE", "ELPA-2STAGE"]
value = "ScaLAPACK"
default = "ScaLAPACK"
group = "budget"
label = "Diagonalizer"
tier = "advanced"
help = """
Eigensolver for the SCF diagonalization.  ELPA works on CPU AND GPU -- it is NOT GPU-only.  Hardware affinity (a performance hint, not a restriction): GPU favors 1STAGE, CPU favors 2STAGE.
  * ScaLAPACK: SIESTA's built-in Divide-and-Conquer. Runs in the precompiled ``molbuilder-siesta`` env (no ELPA needed).  The safe default.
  * ELPA-1STAGE: direct tridiagonalisation in one step.  Faster on NVIDIA GPUs (arXiv:2502.02460 reports ~3x over 2-stage on A100).  Best for GPU.
  * ELPA-2STAGE: tridiagonalise via a banded form; the band-reduction exposes more BLAS-3 work, so it is typically faster on CPU.  Best for CPU.
Both ELPA variants are algorithmic strategies, not versions -- one library ships both.  Either runs on CPU in the packaged ``molbuilder-siesta`` env, so this choice needs no particular environment.  Turn ``Use GPU`` on to run that ELPA solve on the GPU (GPU-only, no CPU fallback) -- THAT is what needs the source-built ``molbuilder-siesta-gpu``."""

[item.psml_lib]
kind = "produce"
category = ["method"]
engines = ["siesta"]
engine_key = "(molbuilder: stages .psml files next to .fdf; SIESTA reads them by element basename)"
type = "str"
group = "setup"
label = "Pseudopotential directory (.psml)"
null_label = "(none)"
optional = true
help = """
Path to a directory of .psml pseudopotential files (one per element).  Accepts an absolute path, ``~/...``, or a relative path.  A relative path is tried against the calculation folder first, then against the ``projects/`` tree the calculation lives in (found by walking up from the calculation folder -- so just ``pseudopotential`` finds ``projects/pseudopotential/`` from anywhere inside the tree, whatever directory you run from), then against ``<cwd>/projects/``.  Tip: use the file-picker button next to this field to browse and avoid typing the path by hand.  SIESTA pseudos are NOT bundled with molbuilder -- you have to download them.  RECOMMENDED SOURCE: PseudoDojo (http://www.pseudo-dojo.org) -- well-tested, peer-reviewed, free.  WHICH SET TO PICK from PseudoDojo:
 * Format = PSML (NOT PSP8 -- that's for ABINIT only; PSML is SIESTA's native format).
 * Functional MUST match cfg.xc_authors -- pick the SAME family (PBE-SR for PBE / GGA, PBEsol-SR for PBEsol, PW for LDA, etc.).
 * Relativistic level: SR (scalar-relativistic) for almost everything.  FR (fully-relativistic, with spin-orbit) only when you actually need spin-orbit coupling (heavy-element spectroscopy, topological insulators).  SR is the safe default.
 * NC vs PAW: PseudoDojo only ships NC (norm-conserving) -- right for SIESTA (PAW is for ABINIT / VASP / Quantum ESPRESSO).
 * Standard vs Stringent: 'standard' is production-quality + smaller mesh cutoff (300-400 Ry); 'stringent' is for benchmarking / publication + needs MeshCutoff >= 500 Ry.
Download recipe for hemeC-like systems: grab the 'PBE-SR / standard / PSML' set for {C, H, N, O, S, Fe}, unzip into one directory, point this field at it."""

[item.copy_psml]
kind = "produce"
category = ["procedure"]
engines = ["siesta"]
engine_key = "(molbuilder: triggers .psml staging step)"
type = "bool"
value = true
default = true
group = "output"
label = "Stage pseudopotential files"
help = "copy psml files into the output directory (alongside the FDF)"

[item.species_order]
kind = "produce"
category = ["system"]
engines = ["siesta"]
engine_key = "(molbuilder: ChemicalSpeciesLabel block ordering)"
type = "strlist"
group = "profile"
label = "Species order"
optional = true
help = "comma-separated species order (e.g. 'C,H,S,Au')"

[item.net_charge]
# MERGED 2026-08-19.  This was two items -- `net_charge` (SIESTA) and `charge`
# (PySCF) -- two names for one question, which is the defect § 6.3's merge rule
# was rewritten to end and named as its own worked example.  All seven fields
# rule 4 gates on already agreed; only the spellings differed.
#
# `kind = "deck"` with no anchor is what § 6.3 says a merged item becomes, and
# it is not a new shape: `relax_steps` and `spin_total` already declare several
# keywords and let the writer pick which one this run calls for.  The check
# gate demands only the keyword the emitted line actually names, so SIESTA is
# asked for `NetCharge` and PySCF for `gto.M` -- never each other's.
kind = "deck"
category = ["system"]
engines = ["siesta", "pyscf"]
expands = ["NetCharge", "gto.M"]
engine_key = "NetCharge (SIESTA) | gto.M(charge=...) (PySCF)"
manual = "SIESTA 5.4.2 §6.23 'Systems with net charge or dipole, and electric fields'; PySCF 2.13 pyscf.gto.mole.MoleBase 'charge'"
type = "int"
range = [-10, 10]
group = "profile"
label = "Net charge"
null_label = "(auto-detect from phosphates)"
optional = true
tier = "basic"
help = "Net charge of the system, in units of |e|.  Default (blank) auto-detects from phosphate protonation -- one negative charge per backbone phosphate, which is right for DNA/RNA from tleap.  For everything else (peptide, SMILES, PDB load) auto resolves to 0, so set this EXPLICITLY for a charged species: carboxylates (Asp/Glu), protonated amines (Lys/Arg/His+), sulfonates.  Sign convention: -1 = one extra electron; +1 = one missing electron."

[item.spin_treatment]
kind = "engine"
category = ["system"]
engines = ["siesta"]
anchor = "Spin"
engine_key = "Spin"
manual = "SIESTA 5.4.2 §6.7 'Spin polarization'"
type = "enum"
choices = ["non-polarized", "polarized", "non-colinear", "spin-orbit"]
value = "non-polarized"
default = "non-polarized"
group = "profile"
label = "Spin treatment"
help = "How spin is treated.  non-polarized: spin-degenerate, the cheap default.  polarized: collinear open-shell, required for radicals / transition metals / triplets.  non-colinear: moments may point in any direction (canted or spiral magnetic order).  spin-orbit: couples spin to orbital motion -- matters for heavy elements (Au, Bi, Pt) and REQUIRES fully-relativistic pseudopotentials.  Only 'polarized' can carry a fixed total spin."

[item.spin_total]
kind = "deck"
category = ["system"]
engines = ["siesta"]
expands = ["Spin.Fix", "Spin.Total"]
engine_key = "Spin.Fix + Spin.Total"
type = "float"
group = "profile"
label = "Target spin moment"
null_label = "(default)"
optional = true
help = """Target total spin moment in mu_B (= the number of unpaired electrons).  Emits BOTH `Spin.Fix .true.` and `Spin.Total <v>`: the first is required or the second is silently ignored, which is why one item writes two keywords.  Only emitted with a polarized spin treatment.
NOTE 0.0 with a POLARIZED treatment asks for a constrained singlet via open-shell DFT (broken-symmetry capable).  Most users wanting a singlet are better served by the non-polarized treatment -- the spin-restricted formalism is cheaper and gives the same answer.  Set 0.0 here only when you specifically want an anti-ferromagnetic / broken-symmetry singlet."""

[item.job_name]
kind = "produce"
category = ["system", "procedure"]
engines = ["pyscf"]
engine_key = "(molbuilder: filename + log-name basename)"
type = "str"
value = "pyscf_relax"
default = "pyscf_relax"
group = "setup"
label = "Job name"
pattern = "^[A-Za-z0-9_\\-]+$"
help = "job name; output files get this prefix.  Must match [A-Za-z0-9_-]+ (job-layout v1; no dots)."

[item.spin]
kind = "engine"
category = ["system"]
engines = ["pyscf"]
