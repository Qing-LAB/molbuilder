default = 0.0012
unit = "Å"
range = [1e-05, 1.0]
group = "stage"
label = "Δx RMS"
tier = "advanced"
help = """
The optimisation is converged when the root-mean-square (RMS) distance the atoms moved on the last step drops below this, in Å -- one of geomeTRIC's convergence criteria, checked alongside the gradient ones.
Loosen it for a quick pre-optimisation, tighten it when the structure feeds a frequency job. Too loose and the geometry is declared finished while it is still drifting.
"""

[item.geom_etol]
kind = "engine"
category = ["accuracy"]
engines = ["pyscf"]
anchor = "convergence_energy"
engine_key = "geomeTRIC convergence_energy"
manual = "PySCF 2.13 geomeTRIC 1.0 'convergence_energy' (driven via pyscf.geomopt)"
type = "float"
value = 1e-06
default = 1e-06
unit = "Hartree"
range = [1e-12, 0.01]
group = "stage"
label = "ΔE tol"
tier = "advanced"
help = """
How little the energy may change from one optimizer step to the next before geomeTRIC accepts the geometry as converged, in Hartree.
It is one of geomeTRIC's convergence criteria and they all have to pass in the same step, so this one alone never stops the optimization.
Set it too loose and you stop while the geometry is still moving; too tight and the optimizer keeps taking steps that no longer change the energy.
"""

[item.geom_max_steps]
kind = "engine"
category = ["procedure"]
engines = ["pyscf"]
anchor = "maxsteps"
engine_key = "geomeTRIC maxsteps"
manual = "PySCF 2.13 geomeTRIC 1.0 'maxsteps' (driven via pyscf.geomopt)"
type = "int"
