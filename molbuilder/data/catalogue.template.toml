How many orbitals below the HOMO -- the highest occupied orbital -- to record at each displaced geometry.  Five is enough to study HOMO/LUMO behaviour for transport; raise it to see a richer slice of the orbital landscape, for example for density-of-states plots.  It changes the size of the record, not the cost of the run.
