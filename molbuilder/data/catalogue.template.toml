enable point-group symmetry; faster but rarely matches builder-output geometry exactly

A symmetric molecule can run 2-10x faster with this on, because PySCF skips the integrals symmetry makes redundant. It is unforgiving of numerical drift, though: builder output rarely places atoms on the symmetry elements to the precision PySCF checks, and a near miss is refused rather than approximated. Leave it off unless you know the geometry is exact."""

