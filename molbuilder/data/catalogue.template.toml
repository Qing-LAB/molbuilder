[item.optimizer]
kind = "engine"
category = ["procedure"]
engines = ["pyscf"]
anchor = "geomeTRIC"
type = "enum"
choices = ["geometric", "berny"]
value = "geometric"
default = "geometric"
group = "profile"
label = "Optimizer"
help = """
Geometry optimizer driver.
  • geometric (default)  — translation-rotation-invariant internal coords (Wang & Song JCP 2016); BFGS quasi-Newton under the hood.  Robust on large flexible molecules, transition states, surface-anchored systems.  REQUIRED for the staged-opt loop (#534) — only geometric accepts the per-stage convergence_drms / convergence_dmax kwargs.
  • berny  — Cartesian + redundant internals; ships with PySCF (no extra dep).  Less robust on biomolecules; DOES NOT work with the staged-opt loop (incompatible kwarg set).  Use only for single-stage runs.
Both are quasi-Newton; both converge tightly near a minimum.  See docs/engines/tuning.md § 2.1."""

