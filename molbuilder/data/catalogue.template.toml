type = "int"
value = 5
default = 5
range = [0, 50]
group = "output"
label = "Orbitals above LUMO to save"
tier = "advanced"
help = """
how many frontier orbitals ABOVE the LUMO to record at each displaced geometry.  Five matches the HOMO setting for a symmetric window around the gap.  Doesn't change cost."""
