# The molbuilder parameter catalogue.
# Every parameter both engines declare, in one file.
# Values are DEFAULTS; a calculation carries its own.
schema      = "molbuilder/template@2"
engines     = ["siesta", "pyscf"]

[item.system_label]
kind = "engine"
category = ["procedure", "system"]
engines = ["siesta"]
anchor = "SystemLabel"
type = "str"
value = "siesta"
default = "siesta"
group = "profile"
label = "System label (output prefix)"
help = "FDF SystemLabel; output files get this prefix.  Must match [A-Za-z0-9_-]+ (job-layout v1; no dots)."

[item.basis_size]
kind = "engine"
category = ["method", "accuracy"]
engines = ["siesta"]
anchor = "PAO.BasisSize"
type = "enum"
choices = ["SZ", "DZ", "SZP", "DZP", "TZP"]
value = "DZP"
default = "DZP"
group = "stage"
label = "Basis size"
help = "PAO basis size: SZ / DZ / SZP / DZP / TZP (rough -> tight)"

[item.pao_energy_shift]
kind = "engine"
category = ["method", "accuracy"]
engines = ["siesta"]
anchor = "PAO.EnergyShift"
type = "float"
value = 0.01
default = 0.01
unit = "Ry"
range = [0.001, 0.05]
group = "stage"
label = "Orbital confinement (energy shift)"
help = "smaller = more diffuse / more accurate; production work uses 0.005-0.01 Ry"

[item.mesh_cutoff]
kind = "engine"
category = ["accuracy"]
engines = ["siesta"]
anchor = "MeshCutoff"
type = "float"
value = 300.0
default = 300.0
unit = "Ry"
range = [100.0, 1000.0]
group = "stage"
label = "Real-space grid cutoff"
help = """
Real-space integration grid (Ry).  Sets the spacing of the 3D mesh SIESTA uses for Hartree + XC potentials, via the plane-wave-equivalent kinetic-energy cutoff.
Per-tier: screening 150, loose preopt 200-250, publishable 350, tight (vib/phonons) 500 (600 for first-row elements).
Below 150 Ry the forces / energies are noticeably wrong on organic / biomolecule systems; the validator warns below that floor.  Egg-box noise sets the floor for vibrational work — test by varying ±50 Ry.  See docs/engines/tuning.md § 2.6."""

[item.xc_functional]
kind = "engine"
category = ["method"]
engines = ["siesta"]
anchor = "XC.functional"
type = "enum"
choices = ["LDA", "GGA", "VDW"]
value = "GGA"
default = "GGA"
group = "profile"
label = "XC.Functional"
help = "XC functional family.  GGA (default) is the safe production choice for organic / biomolecule work + metals; LDA over-binds (bond lengths ~2-3% too short, energies ~10 kcal/mol off); VDW adds a non-local dispersion kernel and matters for non-covalent / vdW-stacked systems (DNA bases, MOFs).  IMPORTANT: the pseudopotential MUST match the functional family -- a PBE pseudo on an LDA calculation (or vice versa) silently gives wrong bond lengths.  PseudoDojo ships separate families for PBE / PBEsol / LDA -- pick the matching set."

[item.xc_authors]
kind = "engine"
category = ["method"]
engines = ["siesta"]
anchor = "XC.authors"
type = "enum"
choices = ["PBE", "PBEsol", "revPBE", "RPBE", "BLYP", "CA", "PZ", "PW", "DRSLL", "LMKLL"]
value = "PBE"
default = "PBE"
group = "profile"
label = "XC.Authors"
help = "XC parameterisation within the family.  GGA: PBE (default, all-purpose), PBEsol (better lattice constants for solids), revPBE / RPBE (better thermochemistry, slightly different binding), BLYP (rare but accepted).  VDW: DRSLL (vdW-DF1) / LMKLL (vdW-DF2-C09).  LDA: CA (Ceperley-Alder, default), PZ, PW.  This name MUST match what your pseudopotential was generated for -- mismatched XC + pseudo gives silently-wrong bond lengths.  PseudoDojo organises downloads by this name."

[item.solution_method]
kind = "engine"
category = ["method", "convergence"]
engines = ["siesta"]
anchor = "SolutionMethod"
type = "enum"
choices = ["diagon", "OMM", "transiesta"]
value = "diagon"
default = "diagon"
group = "profile"
label = "Solution method"
help = "diagon / OMM / transiesta (transiesta requires the TranSIESTA build)"

[item.mixing_weight]
kind = "engine"
category = ["convergence"]
engines = ["siesta"]
anchor = "DM.MixingWeight"
type = "float"
value = 0.02
default = 0.02
range = [0.001, 0.5]
group = "profile"
label = "SCF mixing weight"
help = "DM mixing weight; smaller = more conservative SCF, lower if oscillating"

[item.pulay_history]
kind = "engine"
category = ["convergence"]
engines = ["siesta"]
anchor = "DM.NumberPulay"
type = "int"
value = 3
default = 3
range = [0, 20]
group = "profile"
label = "Pulay history depth"
help = "Pulay history depth; 3 is SIESTA-tutorial default for relaxation"

[item.dm_tolerance]
kind = "engine"
category = ["accuracy"]
engines = ["siesta"]
anchor = "DM.Tolerance"
type = "float"
value = 1e-05
default = 1e-05
range = [1e-08, 0.001]
group = "stage"
label = "Density-matrix tolerance"
help = """
Density-matrix element convergence threshold for the inner SCF loop.  Forces are derived from the converged density -- sloppy SCF -> noisy forces -> optimizer thrashes.
Per-tier (dimensionless): screening 1e-3, loose preopt 1e-4, publishable 1e-4, tight (vib/IR) 1e-5.
Rule of thumb: keep SCF tol ~10x tighter than the force-precision target you want at convergence.  See docs/engines/tuning.md § 2.5."""

[item.dm_energy_tolerance]
kind = "engine"
category = ["accuracy"]
engines = ["siesta"]
anchor = "DM.Energy.Tolerance"
type = "float"
value = 0.0001
default = 0.0001
unit = "eV"
range = [1e-08, 0.1]
group = "stage"
label = "SCF energy tolerance"
help = "redundant SCF energy guard (eV)"

[item.max_scf_iter]
kind = "engine"
category = ["convergence"]
engines = ["siesta"]
anchor = "MaxSCFIterations"
type = "int"
value = 500
default = 500
range = [10, 5000]
group = "budget"
label = "MaxSCFIterations (SCF cycles per geometry step)"
help = "INNER loop: max self-consistency cycles SIESTA runs inside each geometry step.  A geometry optimisation runs at most relax_steps OUTER steps, and each outer step runs at most max_scf_iter inner SCF cycles (until DM.Tolerance is met).  500 is generous; bump higher if SCF is oscillating."

[item.electronic_temperature]
kind = "engine"
category = ["accuracy", "system"]
engines = ["siesta"]
anchor = "ElectronicTemperature"
type = "float"
value = 300.0
default = 300.0
unit = "K"
range = [0.0, 5000.0]
group = "profile"
label = "Electronic temperature"
help = "electronic temperature for Fermi-Dirac smearing (K)"

[item.kgrid]
kind = "engine"
category = ["accuracy"]
engines = ["siesta"]
anchor = "%block kgrid_Monkhorst_Pack"
type = "int3"
value = [1, 1, 1]
default = [1, 1, 1]
group = "stage"
label = "kgrid_Monkhorst_Pack"
help = """
Monkhorst-Pack sampling of the Brillouin zone, one count per axis.
  1x1x1          an isolated molecule -- only Gamma matters
  4x4x4 - 8x8x8  a periodic 3D crystal
  n x n x 1      a slab; no sampling along the vacuum axis

Cost scales linearly with the number of k-points.  Converge by raising the density ~1.5x per axis: the total energy should move less than 1 meV/atom.

SIESTA reports an EQUIVALENT CUTOFF for whatever mesh you give -- a length that says how dense the sampling really is.  That number, not the counts, is what makes two DIFFERENT cells comparable: the same 4x4x4 on a small and a large cell samples them differently."""

[item.kgrid_displacement]
kind = "engine"
category = ["accuracy"]
engines = ["siesta"]
anchor = "%block kgrid_Monkhorst_Pack"
type = "float3"
value = [0.0, 0.0, 0.0]
default = [0.0, 0.0, 0.0]
group = "stage"
label = "k-grid displacement"
help = """
Shifts the k-point mesh off Gamma, one value per axis, in units of the mesh spacing.  [0,0,0] is Gamma-centred.

  0.0    Gamma-centred.  Required for a 1x1x1 mesh (an isolated molecule), and the safe choice for ODD meshes, which already contain Gamma.
  0.5    The classic Monkhorst-Pack shift.  Use on EVEN meshes -- it samples better than a Gamma-centred grid of the same size, and matters most for metals.

Axes are independent: [0.5, 0.5, 0.0] shifts two and leaves the third on Gamma -- which is what a slab wants when the third axis is vacuum.

TRANSPORT: SIESTA forces this to 0 along the transport direction, whatever you set, because that direction is sampled at one k-point."""

[item.relax_type]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "MD.TypeOfRun"
type = "enum"
choices = ["CG", "Broyden", "FIRE", "Verlet", "Nose", "none"]
value = "CG"
default = "CG"
group = "stage"
label = "Relaxation / MD algorithm"
help = """
MD/relax algorithm.  Per-tier guidance:
  • CG       — robust for loose warm-up stages (far from minimum, large forces).  No memory cost.  Oscillates near a minimum on stiff / coupled systems (metals, interfaces, vdW stacks).
  • Broyden  — quasi-Newton; best for publishable / tight stages on organic-on-metal interfaces, surfaces, anything where CG oscillates.
  • FIRE     — MD-inspired; robust on rough landscapes (random builder guesses).
  • Verlet/Nose — NOT geometry relax; finite-T MD only.
  • none     — single-point (skip MD block entirely).
Recommended workflow: stage 1 CG (warm-up) → stage 2 Broyden (refine).  See docs/engines/tuning.md § 2.1 for full algorithm comparison + citations."""

[item.relax_steps]
kind = "deck"
category = ["procedure"]
engines = ["siesta"]
expands = ["MD.NumCGsteps", "MD.FinalTimeStep"]
type = "int"
value = 200
default = 200
range = [1, 10000]
group = "budget"
label = "MD.NumCGsteps (max geometry-optimisation steps)"
help = """
OUTER loop: max geometry steps the optimiser is allowed (each step = full SCF + forces + atom move).  In SIESTA 5.4.2 ``MD.NumCGsteps`` is the universal step-count keyword for CG, Broyden, AND FIRE despite the CG-prefixed name; Verlet/Nose use MD.FinalTimeStep instead.
Per-tier: loose warm-up ~50, publishable ~200, tight (vib/IR) ~100 (small displacement cap = slow but few steps from a publishable-converged starting geometry).  See docs/engines/tuning.md § 2.10."""

[item.relax_force_tol]
kind = "engine"
category = ["accuracy"]
engines = ["siesta"]
anchor = "MD.MaxForceTol"
type = "float"
value = 0.02
default = 0.02
unit = "eV/Å"
range = [0.001, 0.5]
group = "stage"
label = "Force convergence threshold"
help = """
Force-tol stop criterion: max unconstrained atomic force below which the relaxation declares success.  Ignored by Verlet/Nose (those are MD, not relax).
Per-tier (eV/Å): screening 0.10, loose preopt 0.05, publishable 0.04 (Gaussian-OPT default), tight (vib/IR) 0.01, very-tight (NEB barrier) 0.001.
SIESTA only checks max force.  See docs/engines/tuning.md § 2.3 for the 5-criteria geomeTRIC/Gaussian convention + citations."""

[item.relax_max_displ]
kind = "engine"
category = ["procedure", "convergence"]
engines = ["siesta"]
anchor = "MD.MaxCGDispl"
type = "float"
value = 0.05
default = 0.05
unit = "Å"
range = [0.001, 0.5]
group = "stage"
label = "Max displacement per step"
help = """
Displacement cap per optimiser step (Å).  In SIESTA 5.4.2 ``MD.MaxCGDispl`` is the universal displacement-cap keyword across CG, Broyden, AND FIRE despite the CG-prefixed name.  Hard ceiling that catches line-search over-shoot.
Per-tier (Å): screening 0.30, loose preopt 0.20, publishable 0.05, tight (vib/IR) 0.02.
Symptom of too-large cap: max-force oscillates rather than descends (e.g. 0.09 → 0.44 → 0.13 → 0.31 → ...).  Halve the cap.  See docs/engines/tuning.md § 2.2 + the BDT/Au worked example in § 6."""

[item.continue_retries]
kind = "wrapper"
category = ["execution"]
engines = ["siesta"]
type = "int"
value = 1
default = 1
range = [1, 5]
group = "budget"
label = "Warm-retry budget"
help = "How many extra relaxation batches the wrapper may run when a job hits its step cap without converging: it re-enters SIESTA with --continue from the current .XV.  Total step budget = relax_steps x (1 + continue_retries)."

[item.md_initial_temperature]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "MD.InitialTemperature"
type = "float"
value = 300.0
default = 300.0
unit = "K"
range = [0.0, 5000.0]
group = "profile"
label = "Initial temperature"
help = "initial-velocity-seed temperature for Verlet/Nose molecular dynamics (K).  IGNORED by CG / Broyden / FIRE geometry relaxation -- those don't have velocities to seed."

[item.md_target_temperature]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "MD.TargetTemperature"
type = "float"
unit = "K"
range = [0.0, 5000.0]
group = "profile"
label = "Target temperature (NVT)"
null_label = "(use MD.InitialTemperature)"
help = "Nose-Hoover NVT target temperature (K).  Used ONLY by Nose dynamics; CG / Broyden / FIRE / Verlet ignore this.  Defaults to md_initial_temperature when unset."

[item.md_length_timestep]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "MD.LengthTimeStep"
type = "float"
value = 1.0
default = 1.0
unit = "fs"
range = [0.1, 5.0]
group = "profile"
label = "MD timestep"
help = "integration timestep for Verlet/Nose dynamics (fs).  1.0 fs is SIESTA's default and works for systems without H; bonded H typically needs 0.5 fs for stable energy conservation.  IGNORED by CG / Broyden / FIRE geometry relaxation."

[item.restart]
kind = "deck"
category = ["convergence", "execution"]
engines = ["siesta"]
expands = ["DM.UseSaveDM", "MD.UseSaveXV", "MD.UseSaveCG"]
type = "enum"
choices = ["clean", "continue"]
value = "clean"
default = "clean"
group = "stage"
label = "Start from"
help = """
Whether this run starts from what is already in the folder.
  clean     -- ignore any .XV/.DM/.CG left there and start over.
  continue  -- read them, warm-starting from the previous run's geometry and density.
In a staged ladder the first stage is normally 'clean' and the rest 'continue', which is what makes a ladder a ladder rather than three unrelated runs.  See docs/execution/run-identity.md § 4 -- continuing works because the engine finds warm files keyed by the SystemLabel it was given, so nothing is copied or pointed at."""

[item.wrap_into_cell]
kind = "produce"
category = ["procedure"]
engines = ["siesta"]
type = "bool"
value = true
default = true
group = "profile"
label = "Wrap atoms into cell"
help = "fold atoms with fractional coords outside [0,1) back into the cell"

[item.verbose_comments]
kind = "produce"
category = ["procedure"]
type = "bool"
value = true
default = true
group = "profile"
label = "Verbose inline comments"
help = """
Emit inline tuning hints and a Troubleshooting block in the generated
script, in whatever comment syntax that engine uses."""
[item.write_forces]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "WriteForces"
type = "bool"
value = true
default = true
label = "Write forces (.FA)"
help = "write forces to the .FA file (required for relaxation)"

[item.write_coor_step]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "WriteCoorStep"
type = "bool"
value = true
default = true
label = "Write coordinates each step"
help = "write coordinates at every MD step in the main .out"

[item.write_coor_xmol]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "WriteCoorXmol"
type = "bool"
value = true
default = true
group = "profile"
label = "Write XMOL .xyz per step"
help = "write .xyz of every relaxation step (movie viewer)"

[item.write_md_history]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "WriteMDhistory"
type = "bool"
value = true
default = true
group = "profile"
label = "Write .ANI trajectory"
help = "write the .ANI trajectory file (xcrysden / vmd / OVITO)"

[item.write_hs]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "SaveHS"
type = "bool"
value = false
default = false
group = "profile"
label = "Write H+S matrices"
help = "write H + S matrices (TranSIESTA / DOS / transport)"

[item.write_molwatch_log]
kind = "produce"
category = ["procedure"]
type = "bool"
value = true
default = true
label = "Write the molwatch trajectory log"
help = """
Write <job>.molwatch.log alongside the run: per-step coordinates, energy
and forces, in one additive file the Watch tab reads.  It exists so a
trajectory can be followed while the engine is still running."""
[item.mpi_np]
kind = "wrapper"
category = ["execution"]
engines = ["siesta"]
type = "int"
resolver = "rank_count"
range = [1, 1024]
group = "budget"
label = "MPI ranks (np)"
null_label = "(single-process)"
help = """
MPI rank count baked into ``mpirun -np N siesta`` in the generated run-wrapper.  Pick based on your host: typically N = physical cores; for memory-bound jobs N = sockets x cores_per_socket / 2 is a common rule of thumb.  Cluster schedulers (Slurm / PBS) usually set this for you; on a workstation you pick it manually.  Leave blank for the auto default (physical_cores).

RUNTIME OVERRIDE: this value bakes a DEFAULT into the wrapper but is not final.  The wrapper accepts ``bash run.sh -np N`` and ``MB_NP=N bash run.sh``, so you can experiment with different rank counts WITHOUT regenerating.  This matters because SIESTA can crash with ``propor: ERROR: IMAX = 0`` for certain mpi_np / molecule combinations -- the crash depends on the ProcessorY x ProcessorX grid SIESTA auto-picks for that rank count, which is hard to predict.  If you hit propor, retry with smaller -np (powers of 2 are usually safe).  The wrapper prints a focused diagnostic on the propor crash with specific suggestions."""

[item.parallel_block_size]
kind = "engine"
category = ["execution"]
engines = ["siesta"]
anchor = "BlockSize"
type = "pow2"
resolver = "block_size"
group = "budget"
label = "ScaLAPACK block size"
null_label = "(auto)"
help = "ScaLAPACK BlockSize for the diagonaliser's orbital distribution; affects cache efficiency at moderate rank counts.  None = auto: largest power of 2 that leaves >= 2 blocks per rank.  0 = OMIT the keyword entirely -- SIESTA's own built-in default, the third state (tuning.md 2.11, decision 35).  NOTE: BlockSize does NOT fix the ``propor: ERROR: IMAX = 0`` crash -- that was the previous (incorrect) claim and is contradicted by direct empirical sweep (BS = 1, 2, 4 all crash at the same mpi_np).  Propor is a vector-proportionality check in matel_table's MPI-deduplication step; lower mpi_np (use the wrapper's ``-np`` override) to clear that crash.  Set BlockSize explicitly only for the rare ScaLAPACK perf-tuning case (>1000 atoms on >= 16 ranks, where 16 or 32 helps)."

[item.parallel_over_k]
kind = "engine"
category = ["execution"]
engines = ["siesta"]
anchor = "Diag.ParallelOverK"
type = "bool"
group = "budget"
label = "ParallelOverK"
help = "MPI parallelise over k-points; None=auto from kgrid"

[item.omp_threads]
kind = "wrapper"
category = ["execution"]
engines = ["siesta"]
type = "int"
resolver = "omp_threads"
group = "budget"
label = "OMP threads per rank"
null_label = "(auto: physical cores)"
help = "OpenMP threads per MPI process.  Default (blank) auto-detects physical cores at run time (divided by N_MPI when applicable).  Set explicitly to bench or leave cores free for other jobs.  The emitted run-wrapper pins BLAS to 1 thread per rank so OMP*BLAS doesn't oversubscribe -- the canonical recipe shared with /spectra + Build PySCF."

[item.max_memory_mb]
kind = "wrapper"
category = ["execution"]
type = "int"
resolver = "node_memory"
unit = "MB"
range = [100, 1000000]
group = "budget"
label = "Max memory"
null_label = "(no cap)"
help = """
How much memory this run may use.  Left blank -- the normal state -- it is
the machine's maximum, resolved at prep on the node that granted it; set a
number only when you need a ceiling.

Each engine applies it its own way: SIESTA emits a SystemMemory hint into
the deck and caps the wrapper, PySCF passes it to mol.max_memory, which is
what it consults to choose in-core versus out-of-core."""
[item.enable_gpu]
kind = "engine"
category = ["execution"]
engines = ["siesta"]
anchor = "Diag.ELPA.GPU"
type = "bool"
value = false
default = false
group = "budget"
label = "Use GPU (NVIDIA, via ELPA-CUDA)"
read_by = ["wrapper"]
help = "OPTIONAL: run the ELPA diagonalization on an NVIDIA CUDA GPU.  This does NOT turn ELPA on -- pick the solver in ``Diagonalizer`` (ELPA-1STAGE / -2STAGE). This toggle only moves that ELPA solve onto the GPU (GPU-only, no CPU fallback).  Requires an ELPA diagonalizer (GPU + ScaLAPACK is rejected) and an NVIDIA GPU on the run machine.  Off = the chosen ELPA solver runs on CPU (or ScaLAPACK if that's selected). This toggle is the ONLY thing that needs the source-built ``molbuilder-siesta-gpu`` env: the packaged SIESTA runs ELPA on CPU perfectly well, but its ELPA is built without the GPU entry.  The wrapper refuses to emit if that env is missing. Affinity hint: GPU favors 1STAGE."

[item.diag_algorithm]
kind = "engine"
category = ["execution"]
engines = ["siesta"]
anchor = "Diag.Algorithm"
type = "enum"
choices = ["ScaLAPACK", "ELPA-1STAGE", "ELPA-2STAGE"]
value = "ScaLAPACK"
default = "ScaLAPACK"
group = "budget"
label = "Diagonalizer"
help = """
Eigensolver for the SCF diagonalization.  ELPA works on CPU AND GPU -- it is NOT GPU-only.  Hardware affinity (a performance hint, not a restriction): GPU favors 1STAGE, CPU favors 2STAGE.
  * ScaLAPACK: SIESTA's built-in Divide-and-Conquer. Runs in the precompiled ``molbuilder-siesta`` env (no ELPA needed).  The safe default.
  * ELPA-1STAGE: direct tridiagonalisation in one step.  Faster on NVIDIA GPUs (arXiv:2502.02460 reports ~3x over 2-stage on A100).  Best for GPU.
  * ELPA-2STAGE: tridiagonalise via a banded form; the band-reduction exposes more BLAS-3 work, so it is typically faster on CPU.  Best for CPU.
Both ELPA variants are algorithmic strategies, not versions -- one library ships both.  Either runs on CPU in the packaged ``molbuilder-siesta`` env, so this choice needs no particular environment.  Turn ``Use GPU`` on to run that ELPA solve on the GPU (GPU-only, no CPU fallback) -- THAT is what needs the source-built ``molbuilder-siesta-gpu``."""

[item.psml_lib]
kind = "produce"
category = ["method"]
engines = ["siesta"]
type = "str"
group = "profile"
label = "Pseudopotential directory (.psml)"
null_label = "(none)"
help = """
Path to a directory of .psml pseudopotential files (one per element).  Accepts an absolute path, ``~/...``, OR a path relative to ``projects/`` (so just ``pseudopotential`` resolves to ``projects/pseudopotential/`` -- the conventional shared location).  Tip: use the file-picker button next to this field to browse and avoid typing the path by hand.  SIESTA pseudos are NOT bundled with molbuilder -- you have to download them.  RECOMMENDED SOURCE: PseudoDojo (http://www.pseudo-dojo.org) -- well-tested, peer-reviewed, free.  WHICH SET TO PICK from PseudoDojo:
 * Format = PSML (NOT PSP8 -- that's for ABINIT only; PSML is SIESTA's native format).
 * Functional MUST match cfg.xc_authors -- pick the SAME family (PBE-SR for PBE / GGA, PBEsol-SR for PBEsol, PW for LDA, etc.).
 * Relativistic level: SR (scalar-relativistic) for almost everything.  FR (fully-relativistic, with spin-orbit) only when you actually need spin-orbit coupling (heavy-element spectroscopy, topological insulators).  SR is the safe default.
 * NC vs PAW: PseudoDojo only ships NC (norm-conserving) -- right for SIESTA (PAW is for ABINIT / VASP / Quantum ESPRESSO).
 * Standard vs Stringent: 'standard' is production-quality + smaller mesh cutoff (300-400 Ry); 'stringent' is for benchmarking / publication + needs MeshCutoff >= 500 Ry.
Download recipe for hemeC-like systems: grab the 'PBE-SR / standard / PSML' set for {C, H, N, O, S, Fe}, unzip into one directory, point this field at it."""

[item.copy_psml]
kind = "produce"
category = ["procedure"]
engines = ["siesta"]
type = "bool"
value = true
default = true
label = "Stage pseudopotential files"
help = "copy psml files into the output directory (alongside the FDF)"

[item.species_order]
kind = "produce"
category = ["system"]
engines = ["siesta"]
type = "strlist"
label = "Species order"
help = "comma-separated species order (e.g. 'C,H,S,Au')"

[item.net_charge]
kind = "engine"
category = ["system"]
engines = ["siesta"]
anchor = "NetCharge"
type = "int"
range = [-10, 10]
group = "profile"
label = "Net charge"
null_label = "(auto-detect from phosphates)"
