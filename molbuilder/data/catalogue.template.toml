# The molbuilder parameter catalogue.
# Every parameter both engines declare, in one file.
# Values are DEFAULTS; a calculation carries its own.
schema      = "molbuilder/template@2"
engines     = ["siesta", "pyscf"]

[item.system_label]
kind = "engine"
category = ["system", "procedure"]
engines = ["siesta"]
anchor = "SystemLabel"
engine_key = "SystemLabel"
manual = "SIESTA 5.4.2 §6.1 'General system descriptors'"
type = "str"
value = "siesta"
default = "siesta"
group = "setup"
label = "System label (output prefix)"
pattern = "^[A-Za-z0-9_\\-]+$"
help = """
The FDF SystemLabel: every file SIESTA writes takes this as its prefix, so it is what tells one run's output from another's.  Must match [A-Za-z0-9_-]+ (job-layout v1; no dots).
"""

[item.basis_size]
kind = "engine"
category = ["method", "accuracy"]
engines = ["siesta"]
anchor = "PAO.BasisSize"
engine_key = "PAO.BasisSize"
manual = "SIESTA 5.4.2 §6.3.3 'Size of the basis set'"
citation = ["transport"]
type = "enum"
choices = ["SZ", "SZP", "DZ", "DZP", "DZDP", "TZ", "TZP", "TZDP", "TZTP"]
value = "DZP"
default = "DZP"
group = "stage"
label = "Basis size"
help = """
The number of numerical orbitals SIESTA puts on each atom, roughest to tightest. S/D/T = single / double / triple zeta, the count of radial functions per valence orbital; P/DP/TP = one / two / three polarisation shells on top.
What to pick:
  DZP -- the production default, and what most published SIESTA work uses.
  SZ, SZP -- screening-grade only.
  TZP or beyond -- vibrational frequencies, weak interactions, and anything where basis-set superposition error matters.
Cost grows steeply: each step up roughly multiplies the orbital count, and diagonalisation scales as its cube.
All nine choices are accepted by SIESTA 5.4.2 (basis_specs.f::size_name), though the manual's option list names only four.
"""

[item.pao_energy_shift]
kind = "engine"
category = ["method", "accuracy"]
engines = ["siesta"]
anchor = "PAO.EnergyShift"
engine_key = "PAO.EnergyShift"
manual = "SIESTA 5.4.2 §6.3.4 'Range of the orbitals'"
citation = ["transport"]
type = "float"
value = 0.01
default = 0.01
unit = "Ry"
range = [0.001, 0.05]
group = "stage"
label = "Orbital confinement (energy shift)"
tier = "advanced"
help = """
How diffuse SIESTA's pseudo-atomic orbitals (PAOs) are, in Ry: each orbital is cut off at the radius where confining it raises its energy by this much. Smaller = more diffuse = more accurate = slower.
Per-tier (Ry):
  0.05    fast screening only
  0.01    production (this project's default)
  0.005   accuracy-critical: band gaps, weak interactions, vdW
SIESTA's own default is 0.02 Ry. This catalogue starts at 0.01 because its targets are molecules and metal-molecule junctions, where the more diffuse tails are what set adsorption geometry and level alignment.
"""

[item.mesh_cutoff]
kind = "engine"
category = ["accuracy"]
engines = ["siesta"]
anchor = "MeshCutoff"
engine_key = "MeshCutoff"
manual = "SIESTA 5.4.2 §6.10 'The real-space grid and the eggbox-effect'"
citation = ["transport"]
type = "float"
value = 300.0
default = 300.0
unit = "Ry"
range = [100.0, 1000.0]
group = "stage"
label = "Real-space grid cutoff"
tier = "basic"
help = """
Real-space integration grid (Ry).  Sets the spacing of the 3D mesh SIESTA uses for Hartree + XC potentials, via the plane-wave-equivalent kinetic-energy cutoff -- a higher number means a finer mesh.

Per-tier (Ry):
  150      screening (sanity-check only)
  200-250  loose preopt
  300      general-purpose -- SIESTA's own default, and what ships here
  350      publishable -- forces stable to < 0.01 eV/Ang on organic + Au
  500+     tight / vibrational -- egg-box noise below 0.001 eV/Ang
           (600 for first-row elements)

Below 150 Ry the forces and energies are noticeably wrong on organic / biomolecule systems, and the validator warns below that floor.  Egg-box noise -- the energy wobbling as an atom moves across the grid -- sets the floor for vibrational work; test by varying +/- 50 Ry and watching whether the answer moves.
"""

[item.xc_functional]
kind = "engine"
category = ["method"]
engines = ["siesta"]
anchor = "XC.functional"
engine_key = "XC.functional"
manual = "SIESTA 5.4.2 §6.6 'Exchange-correlation functionals'"
citation = ["transport"]
type = "enum"
choices = ["LDA", "GGA", "VDW"]
value = "GGA"
default = "GGA"
group = "profile"
label = "XC functional family"
help = """
Which broad family of approximation is used for the exchange-correlation (XC) energy -- the part of DFT that is approximated rather than solved.

  - GGA (default) -- the safe production choice for organic / biomolecule work + metals.
  - LDA -- over-binds: bond lengths ~2-3% too short, energies ~10 kcal/mol off.
  - VDW -- adds a non-local dispersion kernel; matters for non-covalent / vdW-stacked systems (DNA bases, MOFs).

The pseudopotential MUST match the functional family: a PBE pseudo on an LDA calculation, or the reverse, silently gives wrong bond lengths.  PseudoDojo ships separate families for PBE / PBEsol / LDA -- pick the matching set.

SIESTA's own default is LDA; this catalogue starts at GGA.  The reason is the over-binding above -- LDA's systematic error is large enough that essentially no current published work on molecules or biomolecules uses it for production geometries.  GGA/PBE has been the baseline since Perdew, Burke & Ernzerhof, Phys. Rev. Lett. 77, 3865 (1996).  LDA remains here because it is cheap and legitimate for screening.
"""

[item.xc_authors]
kind = "engine"
category = ["method"]
engines = ["siesta"]
anchor = "XC.authors"
engine_key = "XC.authors"
manual = "SIESTA 5.4.2 §6.6 'Exchange-correlation functionals'"
citation = ["transport"]
type = "enum"
choices = ["PBE", "PBEsol", "revPBE", "RPBE", "BLYP", "CA", "PZ", "PW", "DRSLL", "LMKLL"]
value = "PBE"
default = "PBE"
group = "profile"
label = "XC parameterisation"
help = """
Which published parameterisation is used inside the functional family you picked -- the family sets the form, this sets whose numbers go into it.

  - GGA: PBE (ships here, all-purpose), PBEsol (better lattice constants for solids), revPBE / RPBE (better thermochemistry, slightly different binding), BLYP (rare but accepted)
  - VDW: DRSLL (vdW-DF1) / LMKLL (vdW-DF2-C09)
  - LDA: CA (Ceperley-Alder, the usual LDA choice), PZ (SIESTA's own default), PW

This name MUST match what your pseudopotential was generated for -- a mismatched XC + pseudo gives silently-wrong bond lengths.  PseudoDojo organises downloads by this name.

SIESTA's own default is PZ, the LDA parameterisation that goes with its LDA default family.  This catalogue starts at PBE because it ships GGA -- the two move together, and a family and a parameterisation that do not belong to each other is not a configuration SIESTA implements.  Change one and check the other.
"""

[item.solution_method]
# role: a transport rung's SOLVER is its identity -- a closed periodic warm-up, a bulk lead, an NEGF device.
role = ["transport"]
kind = "engine"
category = ["method", "convergence"]
engines = ["siesta"]
anchor = "SolutionMethod"
engine_key = "SolutionMethod"
manual = "SIESTA 5.4.2 §6.12 'Calculation of the electronic structure'"
type = "enum"
choices = ["diagon", "OMM", "transiesta"]
value = "diagon"
default = "diagon"
group = "profile"
label = "Solution method"
help = """
Which solver produces the density matrix each SCF step.

  diagon      standard diagonalisation, O(N^3) -- the default, and right for almost everything this project runs
  OMM         order-N; worth it only for systems beyond ~500 atoms
  transiesta  non-equilibrium transport; requires the TranSIESTA build
"""

[item.mixing_weight]
kind = "engine"
category = ["convergence"]
engines = ["siesta"]
anchor = "SCF.Mixer.Weight"
engine_key = "SCF.Mixer.Weight"
manual = "SIESTA 5.4.2 §6.9.2 'Mixing options'"
type = "float"
value = 0.02
default = 0.02
range = [0.001, 0.5]
group = "profile"
label = "SCF mixing weight"
tier = "advanced"
help = """
How much of each new SCF solution is mixed into the density that starts the next cycle.
FIRST THING TO TRY when the SCF oscillates -- lower this before touching anything else (manual: "experimentation with the mixing weight is preferred as a first resort").
SIESTA's own default is 0.25; this catalogue starts at 0.02, deliberately, because the systems it targets (metal junctions, open-shell metals) leave the convergence basin at high weights.  The manual backs the direction: "a low value ... is more likely to converge", at the cost of more SCF steps, and the value is "heavily system dependent".
Organic molecules with no metal converge happily at 0.1-0.25 and will run in far fewer steps; raise it if your system is well-behaved.
"""

[item.pulay_history]
kind = "engine"
category = ["convergence"]
engines = ["siesta"]
anchor = "SCF.Mixer.History"
engine_key = "SCF.Mixer.History"
manual = "SIESTA 5.4.2 §6.9.2 'Mixing options'"
type = "int"
value = 8
default = 8
range = [0, 20]
group = "profile"
label = "Pulay history depth"
tier = "advanced"
help = """
How many previous SCF steps the mixer uses to predict the next one.  Higher is steadier convergence, at a few vectors of memory.
Raise it to 12-20 if the SCF still oscillates AFTER you have lowered the mixing weight -- the weight is the first thing to try (manual: "experimentation with the mixing weight is preferred as a first resort").
SIESTA's own default is 2.  This catalogue starts at 8 because the manual puts 2-6 in a band where "a too low value (say 2-6) might change the convergence properties a lot", advises "around 6 or above", and notes that two different high values barely differ -- so 8 buys the manual's advice with margin, at a cost the manual says is negligible.
"""

[item.dm_tolerance]
kind = "engine"
category = ["accuracy"]
engines = ["siesta"]
anchor = "DM.Tolerance"
engine_key = "DM.Tolerance"
manual = "SIESTA 5.4.2 §6.9.8 'Convergence criteria'"
type = "float"
value = 1e-05
default = 1e-05
range = [1e-08, 0.001]
group = "stage"
label = "Density-matrix tolerance"
tier = "advanced"
help = """
How little the density-matrix elements may change from one cycle to the next before SIESTA calls the inner SCF loop converged.
Per-tier (dimensionless):
  1e-3   screening (sanity-check only)
  1e-4   loose preopt; publishable for ENERGIES -- SIESTA's own default
  1e-5   tight -- relaxations, vibrations, IR, accurate forces (ships here)
  1e-6   very-tight (band structure, phonons)
Forces are derived from the converged density, so a sloppy SCF gives noisy forces and the optimizer thrashes chasing them.
Rule of thumb: keep the SCF tolerance ~10x tighter than the force-precision target you want at convergence.
SIESTA's own default is 1e-4; this catalogue starts at 1e-5, one decade tighter.  The work this project is built for is relaxations and vibrational analysis, where the forces come out of the converged density and a loose SCF shows up as force noise the optimiser then chases -- which costs more geometry steps than the extra SCF cycles cost.  For a single-point energy, 1e-4 is the engine's own answer and is enough; it is the forces that want the extra decade.
"""

[item.dm_energy_tolerance]
kind = "engine"
category = ["accuracy"]
engines = ["siesta"]
anchor = "DM.EnergyTolerance"
engine_key = "DM.EnergyTolerance"
manual = "SIESTA 5.4.2 §6.9.8 'Convergence criteria'"
type = "float"
value = 0.0001
default = 0.0001
unit = "eV"
range = [1e-08, 0.1]
group = "stage"
label = "SCF free-energy tolerance"
tier = "advanced"
help = """
How little the total FREE energy may change between SCF cycles before that cycle counts as settled.
It only has an effect when the switch 'Also require the free energy to settle' is on.  SIESTA reads this value either way and then ignores it: read_options.F90 loads it into tolerance_FreeE, and siesta_forces.F90 installs it as a criterion only `if (converge_FreeE)`.
1e-4 eV is SIESTA's own default, and pairs sensibly with a 1e-5 density-matrix tolerance -- the intent is that the energy test is not the thing that stops you first.
"""

[item.scf_energy_converge]
kind = "engine"
category = ["accuracy"]
engines = ["siesta"]
anchor = "SCF.FreeE.Converge"
engine_key = "SCF.FreeE.Converge"
manual = "SIESTA 5.4.2 §6.9.8 'Convergence criteria'"
type = "bool"
value = false
default = false
group = "stage"
label = "Also require the free energy to settle"
tier = "advanced"
help = """
Whether the SCF must also see the free energy settle, not just the density matrix. Off by default, as in SIESTA.
How SIESTA decides an SCF is converged: it checks several things each cycle and requires all the enabled ones to pass -- a plain AND (scfconvergence_test.F). Density-matrix change, Hamiltonian change and energy-density-matrix change are on by default; free-energy and Harris-energy convergence are off. So turning this on can only make the SCF stop later. It never makes a result wrong; it refuses to accept one early.
When it earns its cost: systems with many electronic states near the Fermi level -- metals, metal-molecule junctions, and large periodic cells where the spectrum is dense -- especially at a raised electronic temperature (the ElectronicTemperature smearing, not the MD temperature). There the free energy carries an entropy term (F = E - TS) large enough that the density-matrix criterion can go quiet while the energy is still drifting. For a molecule with a clear HOMO-LUMO gap this changes nothing but the runtime.
The cost lands where the benefit does: those are the same systems with the most expensive SCF cycles, so budget for more of them and check max_scf_iter before turning this on.
The AND-combination, the per-criterion defaults and the gating are from SIESTA 5.4.2's source and manual. The F = E - TS argument and the dense-spectrum reasoning are standard DFT, not statements the manual makes; the manual says only that the smearing temperature is "useful specially for metals".
"""


[item.max_scf_iter]
kind = "engine"
category = ["convergence"]
engines = ["siesta"]
anchor = "MaxSCFIterations"
engine_key = "MaxSCFIterations"
manual = "SIESTA 5.4.2 §6.9 'The self-consistent-field loop'"
type = "int"
value = 1000
default = 1000
range = [10, 5000]
group = "budget"
label = "Max SCF cycles per geometry step"
tier = "advanced"
help = """
Inner loop: the most self-consistency cycles SIESTA will run inside one geometry step. A relaxation runs at most relax_steps outer steps, and each of those runs at most this many inner cycles, or until DM.Tolerance is met.
1000 is SIESTA's own default, and it is the right guard here because this catalogue ships mixing_weight 0.02 against SIESTA's 0.25: the manual says a low weight "may result in high number of SCF steps but is more likely to converge", so a run that is converging normally needs more cycles than a stock one.
This is a runaway guard, not a budget -- the budget is wall time and continue_retries. The two failure modes are not symmetric: too high wastes some CPU on a run that was going to fail anyway, while too low kills a converging run at the cap and throws away that whole geometry step, which compounds over 200 outer steps. With a 0.02 mixing weight, several hundred cycles is normal for a metal junction, so do not read this number as a target.
"""

[item.scf_must_converge]
kind = "engine"
category = ["convergence"]
engines = ["siesta"]
anchor = "SCF.MustConverge"
engine_key = "SCF.MustConverge"
manual = "SIESTA 5.4.2 \u00a76.9 'The self-consistent-field loop'"
type = "bool"
group = "budget"
label = "Abort if the SCF hits its cycle cap"
null_label = "(SIESTA default: abort)"
optional = true
tier = "advanced"
help = """
What SIESTA does when a geometry step's SCF loop hits max_scf_iter without meeting its tolerances: abort the run (true, SIESTA's own default), or accept the unconverged density and continue with a warning (false).

Leave it unset for ordinary work.  An unconverged density means the forces are noise, and a relaxation that keeps walking on noise wastes every step after the first bad one -- the abort is protecting your budget, not enforcing bureaucracy.

The one ordinary reason to set false is a run that is a measurement rather than a result.  A benchmark trial deliberately caps the SCF at a few cycles to time an iteration; with the abort left on, every properly-capped trial ends in ABNORMAL_TERMINATION and the timing machinery has to read a 'failed' run.  The bench pins set this false so a capped trial ends cleanly as the single-point measurement it is.
"""

[item.electronic_temperature]
kind = "engine"
category = ["system", "accuracy"]
engines = ["siesta"]
anchor = "ElectronicTemperature"
engine_key = "ElectronicTemperature"
manual = "SIESTA 5.4.2 §6.12.3 'Occupation of electronic states and Fermi level'"
citation = ["transport"]
type = "float"
value = 300.0
default = 300.0
unit = "K"
range = [0.0, 5000.0]
group = "profile"
label = "Electronic temperature (smearing)"
tier = "advanced"
help = """
How sharply the electronic states fill at the Fermi level -- the width of the Fermi-Dirac smearing.
This is not the temperature of your simulation. It is a property of the electrons and it applies to every run type, including a 0 K geometry relaxation with no atomic motion at all. Do not confuse it with 'Initial temperature' / 'Target temperature', which are about how fast the atoms move and are read only by Verlet / Nose molecular dynamics. The two are independent: a metal needs smearing whether or not its atoms are moving.
Why it exists: in a metal, states sit right at the Fermi level and swap occupancy between SCF cycles, so the density oscillates and never settles. Smearing lets states be partially occupied, which damps that. A molecule with a clear HOMO-LUMO gap does not need it, and for such a system the value barely matters.
Raise it to 1000-2000 K for a metal or a metal-molecule junction whose SCF will not converge -- after lowering the mixing weight, which is the first thing to try. Lower it toward 0 only for an insulator where you want strictly integer occupations.
A raised smearing temperature adds an entropy term to the free energy (F = E - TS), which is what makes the free-energy convergence criterion worth turning on for exactly these systems -- see 'Also require the free energy to settle'. 300 K is SIESTA's own default.
"""

[item.kgrid]
kind = "engine"
category = ["accuracy"]
engines = ["siesta"]
anchor = "%block kgrid_Monkhorst_Pack"
engine_key = "%block kgrid_Monkhorst_Pack"
manual = "SIESTA 5.4.2 §6.5 'k-point sampling'"
citation = ["transport"]
type = "int3"
value = [1, 1, 1]
default = [1, 1, 1]
range = [1, 64]
group = "stage"
label = "k-point mesh"
tier = "basic"
help = """
Monkhorst-Pack sampling of the Brillouin zone -- how finely the periodic directions are sampled -- one count per axis.
  1x1x1          an isolated molecule -- only Gamma matters
  4x4x4 - 8x8x8  a periodic 3D crystal
  n x n x 1      a slab; no sampling along the vacuum axis
Cost scales linearly with the number of k-points.  Converge by raising the density ~1.5x per axis: the total energy should move less than 1 meV/atom.
SIESTA reports an equivalent cutoff for whatever mesh you give -- a length that says how dense the sampling really is.  That number, not the counts, is what makes two different cells comparable: the same 4x4x4 on a small and a large cell samples them differently.
"""

[item.kgrid_displacement]
kind = "engine"
category = ["accuracy"]
engines = ["siesta"]
anchor = "%block kgrid_Monkhorst_Pack"
engine_key = "%block kgrid_Monkhorst_Pack  (displ column)"
manual = "SIESTA 5.4.2 §6.5 'k-point sampling'"
type = "float3"
value = [0.0, 0.0, 0.0]
default = [0.0, 0.0, 0.0]
range = [0.0, 1.0]
group = "stage"
label = "k-grid displacement"
help = """
Shifts the k-point mesh off Gamma, one value per axis, in units of the mesh spacing. [0,0,0] is Gamma-centred.
  0.0    Gamma-centred. Required for a 1x1x1 mesh (an isolated molecule), and the safe choice for odd meshes, which already contain Gamma.
  0.5    The classic Monkhorst-Pack shift. Use on even meshes -- it samples better than a Gamma-centred grid of the same size, and matters most for metals.
Axes are independent: [0.5, 0.5, 0.0] shifts two and leaves the third on Gamma, which is what a slab wants when the third axis is vacuum.
In a transport run, SIESTA forces this to 0 along the transport direction whatever you set, because that direction is sampled at one k-point.
"""

[item.relax_type]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "MD.TypeOfRun"
engine_key = "MD.TypeOfRun"
manual = "SIESTA 5.4.2 §7 'STRUCTURAL RELAXATION, PHONONS, AND MOLECULAR DYNAMICS'"
calculations = ["optimization"]
type = "enum"
choices = ["CG", "Broyden", "FIRE", "Verlet", "Nose", "none"]
value = "CG"
default = "CG"
group = "stage"
label = "Relaxation / MD algorithm"
help = """
How the atoms are moved between steps: either an optimiser walking downhill to a minimum, or a molecular-dynamics integrator following the atoms in time.

  - CG       -- robust for loose warm-up stages (far from minimum, large forces).  No memory cost.  Oscillates near a minimum on stiff / coupled systems (metals, interfaces, vdW stacks).
  - Broyden  -- quasi-Newton; best for publishable / tight stages on organic-on-metal interfaces, surfaces, anything where CG oscillates.
  - FIRE     -- MD-inspired; robust on rough landscapes (random builder guesses).
  - Verlet / Nose -- not geometry relax; finite-T MD only.
  - none     -- single-point (skip MD block entirely).

Recommended workflow: stage 1 CG (warm-up), then stage 2 Broyden (refine).
"""

[item.relax_steps]
kind = "deck"
category = ["procedure"]
engines = ["siesta"]
expands = ["MD.Steps", "MD.FinalTimeStep"]
engine_key = "MD.Steps (CG / Broyden / FIRE) | MD.FinalTimeStep (Verlet / Nose)"
manual = "SIESTA 5.4.2 §7.2 'Structural relaxation' + §7.4 'Molecular dynamics'"
calculations = ["optimization"]
type = "int"
value = 200
default = 200
range = [1, 10000]
group = "budget"
label = "Max geometry-optimisation steps"
tier = "advanced"
help = """
Outer loop: the most geometry steps the optimiser is allowed, each step being a full SCF plus forces plus one move of the atoms.
Which keyword carries it is decided by MD.TypeOfRun: CG / Broyden / FIRE relax and bound the loop with ``MD.Steps``; Verlet / Nose integrate and bound it with ``MD.FinalTimeStep`` instead (SIESTA 5.4.2, siesta_init.F -- idyn 0 uses MD.Steps, idyn 1-5 use MD.InitialTimeStep..MD.FinalTimeStep). ``MD.Steps`` deprecates the older ``MD.NumCGsteps``, whose CG-prefixed name hid that it was never CG-only.
Per-tier: loose warm-up ~50, publishable ~200, tight (vib/IR) ~100 -- a small displacement cap is slow per step but needs few steps from a publishable-converged starting geometry.
A well-behaved relaxation converges in 30-150 steps, so 200 is a safety cap, not a target. For molecular dynamics it is a duration instead: steps x timestep is the timescale you sample, so pick it from the physics you want to see.
"""

[item.relax_force_tol]
kind = "engine"
category = ["accuracy"]
engines = ["siesta"]
anchor = "MD.MaxForceTol"
engine_key = "MD.MaxForceTol"
manual = "SIESTA 5.4.2 §7.2 'Structural relaxation'"
calculations = ["optimization"]
type = "float"
value = 0.02
default = 0.02
unit = "eV/Å"
range = [0.001, 0.5]
group = "stage"
label = "Force convergence threshold"
tier = "advanced"
help = """
The relaxation declares success when the largest force on any unconstrained atom falls below this, in eV/Å. Ignored by Verlet/Nose, which are MD, not relax.
Per-tier (eV/Å): screening 0.10, loose preopt 0.05, publishable 0.04 (SIESTA's own default), tight (vib/IR) 0.01, very-tight (NEB barrier) 0.001.
SIESTA's own default is 0.04 eV/Å -- the 'publishable' row above. This catalogue starts at 0.02, twice as tight, because a relaxation that stops at the loose end leaves residual forces big enough to contaminate a frequency calculation run on top of it, and re-relaxing afterwards costs more than the extra steps did. For a single-point or a screening pass, 0.04 is the engine's own answer.
SIESTA checks max force only, unlike the 5-criteria geomeTRIC/Gaussian convention.
"""

[item.relax_max_displ]
kind = "engine"
category = ["procedure", "convergence"]
engines = ["siesta"]
anchor = "MD.MaxDispl"
engine_key = "MD.MaxDispl (CG / Broyden / FIRE)"
manual = "SIESTA 5.4.2 §7.2 'Structural relaxation'"
calculations = ["optimization"]
type = "float"
value = 0.05
default = 0.05
unit = "Å"
range = [0.001, 0.5]
group = "stage"
label = "Max displacement per step"
tier = "advanced"
help = """
A hard ceiling on how far any atom may move in one optimiser step, in Å -- it catches line-search over-shoot. Applies across CG, Broyden AND FIRE. ``MD.MaxDispl`` deprecates the older ``MD.MaxCGDispl`` (SIESTA 5.4.2); same meaning, same 0.2 Bohr default, and the CG-prefixed name was never CG-only.
Per-tier (Å): screening 0.30, loose preopt 0.20, publishable 0.05, tight (vib/IR) 0.02.
That engine default of 0.2 Bohr is 0.106 Å; this catalogue starts at 0.05 Å, about half. The cap only ever limits a step, so a smaller one costs steps and never accuracy. Raise it toward the loose-preopt 0.20 Å for a cheap first pass on a structure that starts far from its minimum.
Symptom of a cap set too large: max force oscillates rather than descends (e.g. 0.09 -> 0.44 -> 0.13 -> 0.31 -> ...). Halve the cap.
"""

[item.continue_retries]
kind = "wrapper"
category = ["execution"]
engines = ["siesta"]
engine_key = "(molbuilder: baked into the run wrapper at install time; never an .fdf line and never an sbatch flag)"
type = "int"
value = 1
default = 1
range = [0, 5]
group = "staging"
label = "Warm-retry budget"
tier = "advanced"
help = """
When a relaxation hits its step cap without converging, the run wrapper can start another batch instead of giving up: it re-enters SIESTA with --continue from the current .XV. This is how many extra batches it may run.
Total step budget = relax_steps x (1 + continue_retries).
Set it low and a long relaxation gets cut off mid-descent; set it high and a run that was never going to converge burns the whole wall-clock allocation.
"""

[item.md_initial_temperature]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "MD.InitialTemperature"
engine_key = "MD.InitialTemperature"
manual = "SIESTA 5.4.2 §7.4 'Molecular dynamics'"
calculations = ["optimization"]
type = "float"
value = 300.0
default = 300.0
unit = "K"
range = [0.0, 5000.0]
group = "profile"
label = "Initial temperature"
tier = "advanced"
help = """
The temperature the initial atomic velocities are drawn for, in Verlet and Nose molecular dynamics.  CG, Broyden and FIRE geometry relaxation ignore it -- they have no velocities to seed.
This is about the ATOMS, not the electrons.  It is a different quantity from 'Electronic temperature (smearing)', which shares the word and the unit and nothing else: that one sets how sharply electronic states fill at the Fermi level and applies to every run type, including this one.  Setting them to match means nothing -- an MD at 0 K still needs electronic smearing if the system is metallic.
SIESTA's own default is 0 K, a start from rest.  This catalogue starts at 300 K because a run seeded at 0 K spends its opening picoseconds simply acquiring thermal motion, and 300 K is both room temperature and the condition most reported simulations are run at.  Set it to 0 deliberately if you want the cold start.
"""

[item.md_target_temperature]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "MD.TargetTemperature"
engine_key = "MD.TargetTemperature"
manual = "SIESTA 5.4.2 §7.4 'Molecular dynamics'"
calculations = ["optimization"]
type = "float"
unit = "K"
range = [0.0, 5000.0]
group = "profile"
label = "Target temperature (NVT)"
null_label = "(use MD.InitialTemperature)"
optional = true
tier = "advanced"
help = """
The temperature a Nose-Hoover thermostat holds the system at during NVT dynamics (K).

Only Nose dynamics reads it; CG, Broyden, FIRE and Verlet ignore it.  Left unset it falls back to md_initial_temperature.

Set it for any thermostatted run: without a target SIESTA aims at 0 K and the run quenches instead of equilibrating.
"""

[item.md_length_timestep]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "MD.LengthTimeStep"
engine_key = "MD.LengthTimeStep"
manual = "SIESTA 5.4.2 §7.4 'Molecular dynamics'"
calculations = ["optimization"]
type = "float"
value = 1.0
default = 1.0
unit = "fs"
range = [0.1, 5.0]
group = "profile"
label = "MD timestep"
tier = "advanced"
help = """
How much simulated time one step of Verlet/Nose dynamics advances, in fs.
1.0 fs is SIESTA's default and works for systems without H; bonded H vibrates fast enough that it typically needs 0.5 fs for stable energy conservation. Too long a step and the total energy drifts instead of being conserved.
Ignored by CG / Broyden / FIRE geometry relaxation, which do not integrate time.
"""

[item.restart]
kind = "deck"
category = ["convergence", "execution"]
engines = ["siesta", "pyscf"]
# The vibration deck neither reads nor writes deck-level restart state
# (it always recomputes from its own relaxation, or your already_relaxed
# assertion); showing the knob there was a shown-but-unread parameter.
calculations = ["optimization"]
expands = ["DM.UseSaveDM", "MD.UseSaveXV", "MD.UseSaveCG"]
engine_key = "(molbuilder: one field, one mechanism per engine -- SIESTA expands it to DM.UseSaveDM / MD.UseSaveXV / MD.UseSaveCG; PySCF emits control flow that reads <JOB>.chk and <JOB>_optimized.xyz.  Not a single engine key on either)"
manual = "SIESTA 5.4.2 §6.9.5 'Initialization of the density-matrix' + §6.4.4 'Input of structural information from external files' + §7.2.1 'Conjugate-gradients optimization'"
type = "enum"
choices = ["clean", "continue"]
value = "continue"
default = "continue"
group = "staging"
label = "Start from"
tier = "advanced"
help = """
Whether this run starts from what is already in the folder.
  continue  -- read it (the default). Nothing there is not an error: the engine starts from the deck's own coordinates.
  clean     -- ignore it and start over, overwriting what is there as the run proceeds.
Which files that means is the engine's own: SIESTA reads .XV / .DM / .CG, PySCF reads <JOB>_optimized.xyz and <JOB>.chk.
Continuing is the default because a run you start in a folder that already holds a result is a run you started after looking at that result. To keep the old state, save it first with `molbuilder checkpoint save` -- the launcher warns before a clean run overwrites anything and stops unless you pass --force.
"""

[item.wrap_into_cell]
# role: wrapping can reorder atoms, and TranSIESTA identifies each electrode by a CONTIGUOUS atom range.
role = ["transport"]
kind = "produce"
category = ["procedure"]
engines = ["siesta"]
engine_key = "(molbuilder: pre-emission positioning)"
type = "bool"
value = true
default = true
group = "profile"
label = "Wrap atoms into cell"
help = """
Move any atom that sits outside the cell box back inside it, by shifting it a whole number of cell vectors.

molbuilder does this, not SIESTA.  It rewrites the coordinates that get written into the .fdf, so what you see in the deck is what ran.  In a periodic crystal it changes nothing physical: shifting an atom by a whole lattice vector lands it on an identical position, so the energy and forces are the same.  It just keeps the numbers tidy and comparable between runs.

Turn it off for a MOLECULE that straddles a cell face -- one molecule in a vacuum box, or a slab with an adsorbate near an edge.  Wrapping moves only the atoms that stuck out, so the molecule is split: half at one edge of the box, half at the opposite edge.  The physics is still right for a periodic calculation, but the structure looks torn in the viewer, and anything that measures geometry directly from the coordinates (bond lengths, a centre of mass, an RMSD against another frame) reads the box-crossing distance instead of the real one.

It has no effect when the cell was built from the structure itself: that path already centres the atoms in the box, so nothing is outside to fold back.
"""

[item.verbose_comments]
kind = "produce"
category = ["procedure"]
engine_key = "(molbuilder: comment-block control in the generated input)"
type = "bool"
value = true
default = true
group = "output"
label = "Verbose inline comments"
help = """
Emit inline tuning hints and a Troubleshooting block in the generated script, in whatever comment syntax that engine uses.  Turn it off for a bare deck -- only the comments go, nothing the engine reads.
"""
[item.write_forces]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "WriteForces"
engine_key = "WriteForces"
manual = "SIESTA 5.4.2 §7.5 'Output options for dynamics'"
type = "bool"
value = true
default = true
group = "output"
label = "Write forces each step"
help = """
Write the atomic forces into the main .out at every relaxation or MD step, so the force history can be read back from the log.
SIESTA ships this off; we ship it on. A relaxation whose force history was not recorded cannot be diagnosed afterwards -- "did it descend or oscillate?" is the first question about any run that did not converge, and the answer costs a few lines of text per step.
It does NOT control the .FA file. The last step's forces reach the .FA file whatever this is set to, and a relaxation runs without either.
"""

[item.write_coor_step]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "WriteCoorStep"
engine_key = "WriteCoorStep"
manual = "SIESTA 5.4.2 §7.5 'Output options for dynamics'"
type = "bool"
value = true
default = true
group = "output"
label = "Write coordinates each step"
help = """
Write the atomic coordinates into the main .out at every relaxation or MD step.
CAUTION -- IT HAS A SIDE EFFECT ON ANOTHER KEYWORD: WriteMDXmol (the .ANI animation file) defaults to `.not. WriteCoorStep` (read_options.F90), so turning this ON turns .ANI OFF unless WriteMDXmol is set explicitly.
SIESTA defaults this to LongOutput -- off unless you asked for verbose output.  We ship it on, for the same reason as the force history: the .out is the one file that always survives, so the trajectory should be recoverable from it alone.
"""

[item.write_coor_xmol]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "WriteCoorXmol"
engine_key = "WriteCoorXmol"
manual = "SIESTA 5.4.2 §6.4.3 'Output of structural information'"
type = "bool"
value = true
default = true
group = "output"
label = "Write XMOL .xyz"
help = """
Write an extra <label>.xyz holding the FINAL atomic coordinates, in Angstrom whatever input format was used, readable by XMol / JMol / Molden.
ONE STRUCTURE, NOT A MOVIE.  The per-step animation is a different file (.ANI) from a different keyword, WriteMDXmol.
SIESTA ships this off; we ship it on, because a finished relaxation whose result is only inside the .out has to be re-extracted before anything else can open it.
"""

[item.write_md_history]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "WriteMDhistory"
engine_key = "WriteMDhistory"
manual = "SIESTA 5.4.2 §7.5 'Output options for dynamics'"
calculations = ["optimization"]
type = "bool"
value = true
default = true
group = "output"
label = "Write MD history (.MD/.MDE)"
help = """
Accumulate the trajectory into <label>.MD -- positions and velocities (and cell, for a variable cell) at every step -- plus <label>.MDE, a short per-step line of energy, temperature and the like.  Both are appended across runs, so a restarted job extends them rather than replacing them.

SIESTA ships this off; we ship it on, because it is the only complete record of what the trajectory did.

It does not write .ANI.  That file comes from the separate WriteMDXmol keyword, not this one.  And <label>.MD is written UNFORMATTED -- meant for post-processing, not for a viewer to open directly.
"""

[item.write_md_xmol]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "WriteMDXmol"
engine_key = "WriteMDXmol"
manual = "SIESTA 5.4.2 §6.4.3 'Output of structural information'"
calculations = ["optimization"]
type = "bool"
value = true
default = true
group = "output"
label = "Write XMOL animation (.ANI)"
help = """
Accumulate every step's coordinates into <label>.ANI, a plain-text multi-frame .xyz in Angstrom that xcrysden, VMD and OVITO open directly as an animation.  Appended across runs, so a restart extends it.
WHY THIS IS A SWITCH AND NOT JUST ON: SIESTA defaults it to `.not. WriteCoorStep` (read_options.F90), so the two keywords are coupled.  This project ships WriteCoorStep on, which resolves that default to OFF -- setting this explicitly is the only way to stop one keyword silently deciding another.
MOLBUILDER DOES NOT READ THIS FILE.  Trajectory coordinates come from <label>.MD.nc, which carries full double precision rather than text; .ANI is listed among a run's files but never parsed.  So it is purely for opening the trajectory in an external viewer -- turn it off if disk matters and you do not need that, and nothing inside molbuilder changes.
"""

[item.write_hs]
kind = "engine"
category = ["procedure"]
engines = ["siesta"]
anchor = "SaveHS"
engine_key = "SaveHS"
manual = "SIESTA 5.4.2 §6.11 'Matrix elements of the Hamiltonian and overlap'"
type = "bool"
value = true
default = true
group = "output"
label = "Write H+S matrices"
help = """
Write the Hamiltonian and overlap matrices to <label>.HSX.  The manual: it "contains all relevant information to construct the Brillouin zone Hamiltonian and can thus be used for subsequent density of states calculations" -- and it is what TranSIESTA / TBtrans read for transport.

On by default, matching SIESTA's own.  Without it a finished relaxation has no .HSX, so bands, DOS or transport afterwards mean re-running the SCF.  The cost of having it is disk; the cost of not having it is a repeat run.
"""

[item.write_molwatch_log]
kind = "produce"
category = ["procedure"]
engine_key = "(molbuilder: writes <basename>.molwatch.log for the live viewer)"
type = "bool"
value = true
default = true
group = "output"
label = "Write the molwatch trajectory log"
help = """
Write <job>.molwatch.log alongside the run: per-step coordinates, energy and forces, in one additive file the Watch tab reads.  It exists so a trajectory can be followed while the engine is still running; with it off, nothing can be seen until the job finishes.
"""
[item.mpi_np]
kind = "wrapper"
category = ["execution"]
engines = ["siesta"]
engine_key = "(molbuilder: .run.sh ``mpirun -np N`` only; not in .fdf)"
type = "int"
allocation = true
range = [1, 1024]
group = "staging"
label = "MPI ranks (np)"
null_label = "(single-process)"
optional = true
help = """
How many MPI processes SIESTA runs on: the N baked into ``mpirun -np N siesta`` in the generated run-wrapper.
Pick it from your host. Typically N = physical cores; for memory-bound jobs N = sockets x cores_per_socket / 2 is a common rule of thumb. Cluster schedulers (Slurm / PBS) usually set this for you; on a workstation you pick it manually. Leave it blank for the auto default, physical_cores.
The value only bakes in a default, it is not final. The wrapper accepts ``bash run.sh -np N`` and ``MB_NP=N bash run.sh``, so you can try other rank counts without regenerating. That matters because SIESTA can crash with ``propor: ERROR: IMAX = 0`` for certain mpi_np / molecule combinations: the crash depends on the ProcessorY x ProcessorX grid SIESTA auto-picks for that rank count, which is hard to predict. If you hit propor, retry with a smaller -np (powers of 2 are usually safe). The wrapper prints a focused diagnostic on that crash with specific suggestions.
"""

[item.gpu_count]
kind = "wrapper"
category = ["execution"]
engines = ["siesta"]
engine_key = "(molbuilder: scheduler ``--gres=gpu:<type>:G``; not in .fdf)"
type = "int"
allocation = true
range = [1, 16]
group = "staging"
label = "GPUs per trial (G)"
help = """
How many GPU devices one trial (or run) asks the scheduler for.
Ranks per device follow as mpi_np / G, and the split must be even -- ELPA's own rule is the same rank count on every device -- so a bench cell whose mpi_np does not divide by G is dropped by name at prep.
Declared in the bench block it is an axis: gpu_count = [1, 2, 4] measures exactly those device counts. Leave it out and prep proposes the divisors of each declared rank count.
"""

[item.block_size]
kind = "engine"
category = ["execution"]
engines = ["siesta"]
anchor = "BlockSize"
engine_key = "BlockSize"
manual = "SIESTA 5.4.2 §6.27 'Parallel options'"
type = "int"
group = "budget"
label = "ScaLAPACK block size"
null_label = "(auto)"
optional = true
help = """
How many consecutive orbitals go to one MPI rank before the distribution moves to the next -- the ScaLAPACK block. It cannot change the answer, only how evenly the ranks are fed and therefore how long the run takes.
It has two states. Left as (auto) the keyword is not written and SIESTA uses its own automatic, which is what its manual declares as the default. Set to a number, that number is written verbatim -- which is what you want after benchmarking, and a benchmark is the only thing that really answers this: the best block depends on the matrix size, the rank count, the interconnect and the node's memory layout at once.
If you set one by hand: powers of two (16, 32, 64, 128); smaller for few orbitals, larger for thousands. Stay under n_orbitals / ranks or some rank gets no block at all.
On GPU, an ELPA diagonaliser needs a power of two or ELPA silently runs on the CPU. prep realigns it there -- that is the layer that knows the GPU flag and the rank count.
It does not fix ``propor: ERROR: IMAX = 0``. BS = 1, 2 and 4 all crash at the same mpi_np; propor is a vector-proportionality check in matel_table's MPI-deduplication step. Lower the rank count to clear it.
"""

[item.parallel_over_k]
kind = "engine"
category = ["execution"]
engines = ["siesta"]
anchor = "Diag.ParallelOverK"
engine_key = "Diag.ParallelOverK"
manual = "SIESTA 5.4.2 §6.12.1 'Diagonalization options'"
type = "bool"
group = "budget"
label = "ParallelOverK"
optional = true
help = """
How the MPI ranks split the diagonalisation: over k-points (on) or over orbitals (off).  Left blank it is chosen automatically from your k-point mesh -- off for a Gamma-only run, on when the mesh holds more than one k-point.
Splitting over k-points when there is only one leaves the other ranks nothing to do.
"""

[item.omp_threads]
kind = "wrapper"
category = ["execution"]
engines = ["siesta"]
engine_key = "(molbuilder: .run.sh OMP_NUM_THREADS + .fdf runtime_info comment)"
type = "int"
allocation = true
group = "staging"
label = "OMP threads per rank"
null_label = "(auto: physical cores)"
optional = true
help = """
How many OpenMP threads each MPI process gets.
Left blank it auto-detects physical cores at run time, divided by N_MPI when applicable. Set it explicitly to bench a configuration, or to leave cores free for other jobs.
The emitted run-wrapper pins BLAS to 1 thread per rank so OMP x BLAS doesn't oversubscribe the node -- the same recipe /spectra and Build PySCF use.
"""

[item.max_memory_mb]
kind = "wrapper"
category = ["execution"]
engine_key = "(molbuilder: memory cap for the run -- ulimit -v in .run.sh / mol.max_memory)"
type = "int"
allocation = true
unit = "MB"
range = [100, 1000000]
group = "staging"
label = "Max memory"
null_label = "(no cap)"
optional = true
tier = "advanced"
help = """
How much memory this run may use.  Left blank -- the normal state -- it is the machine's maximum, resolved at prep on the node that granted it; set a number only when you need a ceiling.

Each engine applies it its own way: SIESTA emits a SystemMemory hint into the deck and caps the wrapper, PySCF passes it to mol.max_memory, which is what it consults to choose in-core versus out-of-core.
"""
[item.use_gpu]
# MERGED 2026-08-23, following `net_charge`'s worked example (2026-08-19).
# This was two items -- `enable_gpu` (SIESTA) and `use_gpu` (PySCF) -- two
# names for one question: DOES THIS RUN USE A GPU?  The merge was ruled
# 2026-08-13, restated 08-14 and marked do-not-re-open (template.md 6.3);
# what had not landed was the rename, and it could not land separately
# because TOML cannot hold the key twice.  `use_gpu` is the survivor per
# that ruling.
#
# `kind = "deck"` with no anchor is what a merged item becomes.  `expands`
# names BOTH reaches and the check gate demands only the keyword the
# emitted line actually names -- so SIESTA is asked for `Diag.ELPA.GPU`
# and PySCF for `gpu4pyscf`, never each other's.  The one imprecise row
# (PySCF carries an `expands` entry it does not honour as a keyword) is
# the cost 6.3 states out loud for `restart`, and it is deliberate: a
# per-engine `expands` was considered and rejected 2026-08-18, because
# `section` was that per-engine key and was retired at @2 for the drift
# such a key invites.
kind = "deck"
category = ["execution"]
expands = ["Diag.ELPA.GPU", "gpu4pyscf"]
engine_key = "Diag.ELPA.GPU (SIESTA) | mf = mf.to_gpu() (PySCF)"
manual = "SIESTA 5.4.2 §6.12.1 'Diagonalization options'; PySCF 2.13 pyscf.dft.rks.RKS 'to_gpu()'"
type = "bool"
value = false
default = false
group = "staging"
label = "Use GPU (NVIDIA)"
# SIESTA's half needs the wrapper: a GPU deck needs the source-built env AND
# a GPU runtime (the gres ask, MPS, the NUMA pin, the rank/thread budget).
# PySCF has no env routing in `runwrap` at all -- it checks the DEVICE at run
# start instead -- so the declaration is SIESTA's and applies to the item
# (`execution/gpu.md` G7, G8).
read_by = ["wrapper"]
help = """
OPTIONAL: move the heavy linear algebra onto an NVIDIA CUDA GPU.  It means something different for each engine.
SIESTA: run the ELPA diagonalization on the GPU.  This does NOT turn ELPA on -- pick the solver in ``Diagonalizer`` (ELPA-1STAGE / -2STAGE); this toggle only moves that ELPA solve onto the GPU (GPU-only, no CPU fallback).  Requires an ELPA diagonalizer (GPU + ScaLAPACK is rejected) and an NVIDIA GPU on the run machine.  Off = the chosen ELPA solver runs on CPU (or ScaLAPACK if that's selected).  This toggle is the ONLY thing that needs the source-built ``molbuilder-siesta-gpu`` env: the packaged SIESTA runs ELPA on CPU perfectly well, but its ELPA is built without the GPU entry.  The wrapper refuses to emit if that env is missing.  Affinity hint: GPU favors 1STAGE.
PySCF: run the SCF (and geom-opt forces) on an NVIDIA GPU via the gpu4pyscf extension.  The recipe for ``molbuilder-pySCF`` installs the matching ``cupy-cudaNx[ctk]`` + ``gpu4pyscf-cudaNx`` wheels for the project's pinned CUDA toolkit (see ``molbuilder envs doctor molbuilder-pySCF``).  The script probes gpu4pyscf at run start and STOPS with an actionable message if the package isn't importable or the GPU is missing / too old (compute capability < 7.0).  There is no silent CPU fallback: a run that changed where it executed would report a CPU time under a GPU label.
"""

[item.diag_algorithm]
kind = "engine"
category = ["execution"]
engines = ["siesta"]
anchor = "Diag.Algorithm"
engine_key = "Diag.Algorithm"
manual = "SIESTA 5.4.2 §6.12.1 'Diagonalization options'"
type = "enum"
choices = ["ScaLAPACK", "ELPA-1STAGE", "ELPA-2STAGE"]
value = "ScaLAPACK"
default = "ScaLAPACK"
group = "budget"
label = "Diagonalizer"
tier = "advanced"
help = """
Which library performs the matrix diagonalization at the heart of every SCF step -- usually the single largest cost of the run.  ELPA works on CPU as well as GPU; it is not GPU-only.  The hardware affinity below is a performance hint, not a restriction.

  - ScaLAPACK: SIESTA's built-in Divide-and-Conquer, no ELPA needed.  The safe default.
  - ELPA-1STAGE: direct tridiagonalisation in one step.  Faster on NVIDIA GPUs (arXiv:2502.02460 reports ~3x over 2-stage on A100).  Best for GPU.
  - ELPA-2STAGE: tridiagonalise via a banded form; the band-reduction exposes more BLAS-3 work, so it is typically faster on CPU.  Best for CPU.

The two ELPA entries are strategies, not versions -- one library ships both, and either runs on CPU in the packaged ``molbuilder-siesta`` env, so this choice needs no particular environment.  Turn ``Use GPU`` on to run that ELPA solve on the GPU (GPU-only, no CPU fallback) -- that is what needs the source-built ``molbuilder-siesta-gpu``.
"""

[item.psml_lib]
kind = "produce"
category = ["method"]
engines = ["siesta"]
engine_key = "(molbuilder: stages .psml files next to .fdf; SIESTA reads them by element basename)"
type = "str"
group = "setup"
label = "Pseudopotential directory (.psml)"
null_label = "(none)"
optional = true
help = """
Path to a directory of .psml pseudopotential files, one per element.  A pseudopotential stands in for an atom's core electrons, and SIESTA needs one for every element in your structure.
Give a path INSIDE the projects tree, measured from the tree root: the convention is ``pseudopotential``.  Do NOT write the ``projects/`` prefix -- paths are measured from the tree root already.  An absolute path is accepted if it lies inside the tree; a ``./`` spelling is not, and pseudos already sitting beside the calculation are used without this field.  Tip: use the file-picker button next to this field and avoid typing the path by hand.
SIESTA pseudos are NOT bundled with molbuilder -- you have to download them.  RECOMMENDED SOURCE: PseudoDojo (http://www.pseudo-dojo.org) -- well-tested, peer-reviewed, free.  WHICH SET TO PICK from PseudoDojo:
 * Format = PSML (NOT PSP8 -- that's for ABINIT only; PSML is SIESTA's native format).
 * Functional MUST match cfg.xc_authors -- pick the SAME family (PBE-SR for PBE / GGA, PBEsol-SR for PBEsol, PW for LDA, etc.).
 * Relativistic level: SR (scalar-relativistic) for almost everything.  FR (fully-relativistic, with spin-orbit) only when you actually need spin-orbit coupling (heavy-element spectroscopy, topological insulators).  SR is the safe default.
 * NC vs PAW: PseudoDojo only ships NC (norm-conserving), which is right for SIESTA; PAW is for ABINIT / VASP / Quantum ESPRESSO.
 * Standard vs Stringent: 'standard' is production-quality and takes a smaller mesh cutoff (300-400 Ry); 'stringent' is for benchmarking / publication and needs MeshCutoff >= 500 Ry.
Download recipe for hemeC-like systems: grab the 'PBE-SR / standard / PSML' set for {C, H, N, O, S, Fe}, unzip into one directory, point this field at it.
"""

[item.copy_psml]
kind = "produce"
category = ["procedure"]
engines = ["siesta"]
engine_key = "(molbuilder: triggers .psml staging step)"
type = "bool"
value = true
default = true
group = "output"
label = "Stage pseudopotential files"
help = """
Copy the psml pseudopotential files into the output directory, alongside the generated FDF.  SIESTA needs one pseudopotential per species at run time, so without them the deck is not self-contained -- turn this off only when the run will pick them up from somewhere else.
"""

[item.species_order]
kind = "produce"
category = ["system"]
engines = ["siesta"]
engine_key = "(molbuilder: ChemicalSpeciesLabel block ordering)"
type = "strlist"
group = "profile"
label = "Species order"
optional = true
help = """
The order the species are listed in, comma-separated (e.g. 'C,H,S,Au').  It fixes which species index each element gets in the deck's ChemicalSpeciesLabel block, so runs you want to compare use the same numbering.  Leave it blank to let the builder choose the order.
"""

[item.net_charge]
# MERGED 2026-08-19.  This was two items -- `net_charge` (SIESTA) and `charge`
# (PySCF) -- two names for one question, which is the defect § 6.3's merge rule
# was rewritten to end and named as its own worked example.  All seven fields
# rule 4 gates on already agreed; only the spellings differed.
#
# `kind = "deck"` with no anchor is what § 6.3 says a merged item becomes, and
# it is not a new shape: `relax_steps` and `spin_total` already declare several
# keywords and let the writer pick which one this run calls for.  The check
# gate demands only the keyword the emitted line actually names, so SIESTA is
# asked for `NetCharge` and PySCF for `gto.M` -- never each other's.
#
# NOT A TRANSPORT PARAMETER, and that is physics rather than a gap.  A
# transport calculation has OPEN boundaries: the device's electron number is
# set by the electrodes' chemical potentials and found by the contour
# integration, not fixed by the deck.  A lead is bulk metal and must stay
# neutral -- charging it moves the Fermi level that every downstream stage is
# measured against.  `engines/transport.md` 2a.7 rules net charge and gating
# DEFERRED for exactly this reason: *"in NEGF the charge is set by the leads'
# chemical potentials, so for a neutral junction it is moot; a gated or
# electrochemical junction is separate work."*
#
# The ruling was written and the declaration was not changed, so a transport
# template carried this row, a person could answer it, and no rung wrote it
# (measured 2026-09-16: `NetCharge -2` in an optimization deck, absent from all
# five transport decks, while the validation report BESIDE the deck asserted
# the charge was there).  `calculations` is how the catalogue states a ruling
# like this one.
kind = "deck"
category = ["system"]
engines = ["siesta", "pyscf"]
calculations = ["optimization", "vibration"]
expands = ["NetCharge", "gto.M"]
engine_key = "NetCharge (SIESTA) | gto.M(charge=...) (PySCF)"
manual = "SIESTA 5.4.2 §6.23 'Systems with net charge or dipole, and electric fields'; PySCF 2.13 pyscf.gto.mole.MoleBase 'charge'"
type = "int"
range = [-10, 10]
group = "profile"
label = "Net charge"
null_label = "(auto-detect from phosphates)"
optional = true
tier = "basic"
help = """
Net charge of the system, in units of |e|.  Sign convention: -1 = one extra electron; +1 = one missing electron.

Left blank it auto-detects from phosphate protonation -- one negative charge per backbone phosphate, which is right for DNA/RNA from tleap.  For everything else (peptide, SMILES, PDB load) auto resolves to 0, so set this explicitly for a charged species: carboxylates (Asp/Glu), protonated amines (Lys/Arg/His+), sulfonates.

Get it wrong and the run solves for the wrong number of electrons, which is a different molecule from the one you meant.
"""

[item.spin_treatment]
kind = "engine"
category = ["system"]
engines = ["siesta"]
anchor = "Spin"
engine_key = "Spin"
manual = "SIESTA 5.4.2 §6.7 'Spin polarization'"
type = "enum"
choices = ["non-polarized", "polarized", "non-colinear", "spin-orbit"]
value = "non-polarized"
default = "non-polarized"
group = "profile"
label = "Spin treatment"
help = """
How the calculation treats electron spin.
  non-polarized  spin-degenerate; the cheap default.
  polarized      collinear open-shell; required for radicals, transition metals and triplets.
  non-colinear   moments may point in any direction (canted or spiral magnetic order).
  spin-orbit     couples spin to orbital motion; matters for heavy elements (Au, Bi, Pt) and REQUIRES fully-relativistic pseudopotentials.
Only 'polarized' can carry a fixed total spin.
"""

[item.spin_total]
kind = "deck"
category = ["system"]
engines = ["siesta"]
expands = ["Spin.Fix", "Spin.Total"]
engine_key = "Spin.Fix + Spin.Total"
type = "float"
group = "profile"
label = "Target spin moment"
null_label = "(default)"
optional = true
help = """
The target total spin moment the calculation is held to, in mu_B -- equivalently, the number of unpaired electrons.
It emits BOTH `Spin.Fix .true.` and `Spin.Total <v>`: the first is required or the second is silently ignored, which is why one item writes two keywords. Only emitted with a polarized spin treatment.
0.0 with a polarized treatment asks for a constrained singlet via open-shell DFT (broken-symmetry capable). Most users wanting a singlet are better served by the non-polarized treatment -- the spin-restricted formalism is cheaper and gives the same answer. Set 0.0 here only when you specifically want an anti-ferromagnetic / broken-symmetry singlet.
"""

[item.job_name]
kind = "produce"
category = ["system", "procedure"]
engines = ["pyscf"]
engine_key = "(molbuilder: filename + log-name basename)"
type = "str"
value = "pyscf_relax"
default = "pyscf_relax"
group = "setup"
label = "Job name"
pattern = "^[A-Za-z0-9_\\-]+$"
help = """
Name for this job.  Output files get it as a prefix, and the logs are named from it.
Must match [A-Za-z0-9_-]+ -- letters, digits, underscore and hyphen, and no dots (the job-layout v1 rule).
"""

[item.spin]
kind = "engine"
category = ["system"]
engines = ["pyscf"]
anchor = "gto.M"
engine_key = "gto.M(spin=...)  # 2S, # of unpaired electrons"
manual = "PySCF 2.13 pyscf.gto.mole.MoleBase 'spin'"
type = "int"
value = 0
default = 0
range = [0, 10]
group = "profile"
label = "Spin (2S)"
help = """
The number of unpaired electrons, written as 2S -- NOT the multiplicity 2S+1.  So 0 = closed shell, 1 = doublet, 2 = triplet, and so on.  Enter a multiplicity here by mistake and you ask for a different electronic state: 1 on a closed-shell molecule requests a doublet, which does not exist for an even electron count.
"""

[item.symmetry]
refs = ["Wilson1955"]
kind = "engine"
category = ["system"]
engines = ["pyscf"]
anchor = "gto.M"
engine_key = "gto.M(symmetry=...)"
manual = "PySCF 2.13 pyscf.gto.mole.MoleBase 'symmetry'"
type = "bool"
value = false
default = false
group = "profile"
label = "Use point-group symmetry"
help = """
Have PySCF detect the molecule's point group and use it, skipping the integrals that symmetry makes redundant.
A symmetric molecule can run 2-10x faster with this on. It is unforgiving of numerical drift, though: builder output rarely places atoms on the symmetry elements to the precision PySCF checks, and a near miss is refused rather than approximated.
Leave it off unless you know the geometry is exact.
"""

[item.engine]
# `produce`, not `engine`, and no authored `anchor` -- template.md 6.0.  The
# engine_key is a molbuilder NOTE, so `_bare_anchor` derives "" and the
# default kind is refused; and an anchor is DERIVED, never authored, so the
# `anchor = "pyscf"` that stood here contradicted its own engine_key.  This
# item selects WHICH producer writes the deck, which is what `produce` means.
# The dataclass half (`config/pyscf.py`) says the same -- 6.0's two homes.
kind = "produce"
category = ["method"]
engines = ["pyscf"]
calculations = ["vibration"]
engine_key = "(molbuilder: selects the deck composer + the backend env)"
type = "enum"
choices = ["pyscf"]
value = "pyscf"
default = "pyscf"
group = "profile"
label = "Calculation engine"
tier = "basic"
help = """
Which program runs the vibrational calculation.

PySCF is the only engine wired to the Spectrum tab today: it supplies the analytic Hessian, the normal modes, and -- through pyscf.prop -- the IR and Raman intensities, and it runs in the managed `molbuilder-pySCF` env.

There is one choice today, named here rather than assumed, so it travels on the form, in the task description and in the results sidecar like every other parameter.
"""

[item.method]
kind = "engine"
category = ["method"]
engines = ["pyscf"]
anchor = "RKS"
engine_key = "RKS / UKS / RHF / UHF  (PySCF class selection)"
manual = "PySCF 2.13 pyscf.dft.rks 'RKS / UKS / RHF / UHF'"
type = "enum"
choices = ["RKS", "UKS", "RHF", "UHF"]
value = "RKS"
default = "RKS"
group = "profile"
label = "SCF method"
help = """
Which self-consistent field the run solves.  RKS and UKS are Kohn-Sham DFT and use the functional you pick; RHF and UHF are Hartree-Fock and ignore it.
R is restricted -- the two electrons of a pair share one spatial orbital.  U is unrestricted -- the two spin channels are solved separately and are allowed to differ, which is what a system with unpaired electrons needs.
Choosing R where the spins are not paired is not a cheaper answer, it is a different one.
"""

[item.functional]
kind = "engine"
category = ["method"]
engines = ["pyscf"]
anchor = "mf.xc"
engine_key = "mf.xc = ..."
manual = "PySCF 2.13 pyscf.dft.rks.KohnShamDFT 'xc'"
type = "str"
value = "B3LYP"
default = "B3LYP"
group = "profile"
label = "Functional"
help = """
The exchange-correlation functional -- the approximation DFT uses for the part of the energy it cannot compute exactly.  Written into the deck as ``mf.xc`` (B3LYP / PBE / PBE0 / M06-2X / wB97X-D / ...).
Pure GGAs (PBE, BLYP) run 2-3x faster than a hybrid because they need no exact-exchange build.  What they lose with it is the partial cancellation of self-interaction error that exact exchange provides, so a pure functional suffers more of it -- which surfaces as underestimated gaps and over-delocalised anions.  Worth taking for a pre-optimization, rarely for the number you publish.
PySCF's own default is 'LDA,VWN'.  That is the fallback ``dft.RKS`` carries when nothing has been set, not a recommendation -- setting mf.xc is expected of every real calculation.  This catalogue starts at B3LYP, the most widely used hybrid in molecular chemistry (Becke, J. Chem. Phys. 98, 5648 (1993); Lee, Yang & Parr, Phys. Rev. B 37, 785 (1988)), and it pairs with the D3(BJ) dispersion this project also defaults to -- which is what repairs B3LYP's known weakness on non-covalent interactions.
"""

[item.basis]
kind = "engine"
category = ["method", "accuracy"]
engines = ["pyscf"]
anchor = "gto.M"
engine_key = "gto.M(basis=...)"
manual = "PySCF 2.13 pyscf.gto.mole.MoleBase 'basis'"
type = "str"
value = "def2-SVP"
default = "def2-SVP"
group = "profile"
label = "Basis set"
help = """
The set of Gaussian functions each atom's orbitals are built from -- the level of theory, fixed once for the whole job.  The convergence ladder varies tolerances, not this, so pick it from the chemistry.

What to pick:
  - screening / loose preopt: def2-SVP (current default)
  - publishable:              def2-TZVP (modern standard for organic chemistry; ECPs bundled to Rn)
  - tight (vib/IR/energy):    def2-TZVPP or def2-QZVP

def2-SVP is a double-zeta set: fine for screening and preoptimisation, and usable for structures when paired with a dispersion correction (this project defaults to D3BJ).  Its real weakness is basis-set superposition error -- each fragment borrowing the other's functions.  For double-zeta sets that can exceed 40% of a binding energy, and it artificially shortens intermolecular distances.  So treat def2-SVP interaction energies and complex geometries as unconverged, and move to def2-TZVP for anything published.  Covalent bond lengths are much less affected: DFT bond-length errors are typically 0.01-0.07 A and are driven more by the functional than by the basis.

D3BJ repairs the missing dispersion, not the superposition error -- PySCF applies no geometric counterpoise (gCP).  The composite methods built for exactly this (PBEh-3c, r2SCAN-3c) pair a small basis with both corrections.

Sources: Weigend & Ahlrichs, Phys. Chem. Chem. Phys. 7, 3297 (2005) for the basis sets themselves; Sure & Grimme, J. Comput. Chem. 34, 1672 (2013) for the small-basis error analysis; Bursch et al., Angew. Chem. Int. Ed. 61, e202205735 (2022) for the best-practice recommendation.
"""

[item.auxbasis]
refs = ["Weigend2002"]
kind = "engine"
category = ["method"]
engines = ["pyscf"]
anchor = "density_fit"
engine_key = "mf = mf.density_fit(auxbasis=...)"
manual = "PySCF 2.13 pyscf.df.addons / scf.hf.SCF.density_fit 'auxbasis' (an argument of the density-fitting call, not a standalone assignment -- pyscf/layout.py reads it there)"
type = "str"
group = "profile"
label = "Auxiliary fitting basis"
optional = true
help = """
The smaller extra basis that density fitting uses to approximate the electron-repulsion integrals, which is what makes density fitting fast.
Leave it as None and density_fit() auto-picks a fitting basis matched to your orbital basis. Name one yourself only to reproduce a setup that specified it; a fitting basis that does not match the orbital basis adds fitting error for no speed.
"""

[item.density_fit]
kind = "engine"
category = ["method", "execution"]
engines = ["pyscf"]
anchor = "mf"
engine_key = "mf = mf.density_fit()"
manual = "PySCF 2.13 pyscf.scf.hf.SCF 'density_fit()'"
type = "bool"
value = true
default = true
group = "profile"
label = "Density fitting"
help = """
Approximate the four-centre electron-repulsion integrals by three-centre ones over an auxiliary basis (also called resolution of the identity), which is what makes the Coulomb and exchange build cheap.

PySCF applies no density fitting unless ``mf.density_fit()`` is called; we default it on.  The SCF iteration cost drops by roughly 5-10x, and for organic systems the total-energy error it introduces stays under about 0.1 kcal/mol -- well below the error of the orbital basis itself when the auxiliary set matches the basis, which is why it is standard practice rather than a shortcut.

Turn it off when you need exact-integral reference numbers, or when comparing against a published value that did not use it.
"""

[item.dispersion]
kind = "engine"
category = ["method"]
engines = ["pyscf"]
anchor = "mf.disp"
engine_key = "mf.disp = ..."
manual = "PySCF 2.13 pyscf.scf.dispersion 'mf.disp'"
type = "enum"
choices = ["d3bj", "d3zero", "d4", "none"]
value = "d3bj"
default = "d3bj"
group = "profile"
label = "Dispersion"
optional = true
help = """
Adds the long-range attraction that standard DFT functionals miss -- Grimme's dispersion correction, written as ``mf.disp``.
  d3bj    D3 with Becke-Johnson damping (the default).
  d3zero  D3 with the original zero damping.
  d4      the newer, charge-dependent D4.
  none    no correction at all.
BJ damping is the usual recommendation for D3: it does not go to zero at short range, which is where zero damping tends to under-bind. Use d3zero only to reproduce a published number that used it.
It matters most for biomolecules and anything weakly bound: pi-stacking, van der Waals contacts and hydrogen-bond geometries are all under-bound without a correction, and the cost of adding one is negligible.
The accepted spellings are PySCF 2.13's own (pyscf/scf/dispersion.py); a value outside that set raises NotImplementedError at run time, not at setup.
"""

[item.ecp]
kind = "engine"
category = ["method"]
engines = ["pyscf"]
anchor = "gto.M"
engine_key = "gto.M(ecp=...)"
manual = "PySCF 2.13 pyscf.gto.mole.MoleBase 'ecp'"
type = "str"
value = ""
default = ""
group = "profile"
label = "Effective core potential"
null_label = "(none)"
help = """
Replaces the inert core electrons of heavy atoms with a potential, so fewer electrons are treated explicitly -- an effective core potential, named like a basis, e.g. 'lanl2dz'. Empty means no ECP.
It applies only to the atoms named by --ecp-atoms; with no atoms selected it does nothing.
"""

[item.ecp_atoms]
kind = "engine"
category = ["method"]
engines = ["pyscf"]
anchor = "gto.M"
engine_key = "gto.M(ecp={<element>: ...})"
manual = "PySCF 2.13 pyscf.gto.mole.MoleBase 'ecp'"
type = "strlist"
value = []
group = "profile"
label = "ECP atoms"
null_label = "(none)"
help = """
Which elements get an effective core potential (ECP) -- the core electrons replaced by a fitted potential instead of being treated explicitly.

Give element patterns:
  - empty = none
  - '*' = every element in the structure
  - 'Au' = that element
  - 'A*' = every element whose symbol starts with A

Several may be given.
"""

[item.scf_conv_tol]
kind = "engine"
category = ["accuracy"]
engines = ["pyscf"]
anchor = "mf.conv_tol"
engine_key = "mf.conv_tol"
manual = "PySCF 2.13 pyscf.scf.hf.SCF 'conv_tol'"
type = "float"
value = 1e-09
default = 1e-09
unit = "Hartree"
range = [1e-12, 0.0001]
group = "stage"
label = "scf.conv_tol"
tier = "advanced"
help = """
The SCF stops once the total energy changes by less than this between cycles, in Hartree.
Tighten it to 1e-10 when forces look noisy, or when DFT energies drift between geometry steps. Both are symptoms of an SCF that stopped while the density was still moving, which shows up in the derivative long before it shows up in the energy.
The cost of tightening is extra SCF cycles at every geometry step.
"""

[item.scf_conv_tol_grad]
kind = "engine"
category = ["accuracy"]
engines = ["pyscf"]
anchor = "mf.conv_tol_grad"
engine_key = "mf.conv_tol_grad"
manual = "PySCF 2.13 pyscf.scf.hf.SCF 'conv_tol_grad'"
type = "float"
value = 0.0
default = 0.0
range = [0.0, 0.01]
group = "stage"
label = "scf.conv_tol_grad"
tier = "advanced"
help = """
The second SCF stopping test: how small the orbital gradient must get -- how far the orbitals still want to rotate.
0 means take PySCF's own value, sqrt(conv_tol), which is ~3e-5 at conv_tol=1e-9.
The gradient is what the forces come from, so tighten this to 1e-6 or 1e-7 when forces look noisy.
"""

[item.scf_soscf]
refs = ["Bacskay1981"]
kind = "engine"
category = ["convergence"]
engines = ["pyscf"]
anchor = "mf.newton"
engine_key = "mf.newton()"
manual = "PySCF 2.13 pyscf.scf.hf.SCF 'newton()'"
type = "bool"
value = false
default = false
group = "profile"
label = "Second-order SCF (SOSCF)"
tier = "advanced"
help = """
Switch the SCF to a second-order Newton solver, which uses curvature rather than extrapolating from previous iterations.  Slower per iteration and needs more memory, but it converges cases where DIIS oscillates forever (open-shell metals, near-degenerate frontier orbitals).  The usual escalation order is DIIS, then level shift / damping, then SOSCF.
"""

[item.scf_max_cycle]
kind = "engine"
category = ["convergence"]
engines = ["pyscf"]
anchor = "mf.max_cycle"
engine_key = "mf.max_cycle"
manual = "PySCF 2.13 pyscf.scf.hf.SCF 'max_cycle'"
type = "int"
value = 100
default = 100
range = [10, 1000]
group = "budget"
label = "scf.max_cycle"
tier = "advanced"
help = """
The most SCF cycles PySCF will run for one single-point before giving up.

PySCF's own default is 50; this catalogue starts at 100.  Treat it as a runaway guard, not a target -- the two failure modes are not symmetric.  Too high wastes some CPU on a run that was not going to converge anyway; too low stops a converging SCF at the cap and throws away that geometry step, which then repeats at every step of a relaxation.

A well-behaved closed-shell molecule converges in 10-30.
"""

[item.scf_init_guess]
refs = ["Lehtola2019"]
kind = "engine"
category = ["convergence"]
engines = ["pyscf"]
anchor = "mf.init_guess"
engine_key = "mf.init_guess"
manual = "PySCF 2.13 pyscf.scf.hf.SCF 'init_guess'"
type = "enum"
choices = ["minao", "atom", "1e", "huckel"]
value = "minao"
default = "minao"
group = "profile"
label = "scf.init_guess"
help = """
The starting density PySCF builds before the first SCF cycle.  It decides where the SCF starts, and on a hard system that can decide which solution it finds -- or whether it converges at all.
  minao   -- from atomic densities projected onto a minimal basis.
  atom    -- from superposed atomic calculations.
  1e      -- from the one-electron part of the Hamiltonian only, with electron-electron repulsion ignored.
  huckel  -- from a cheap model Hamiltonian.
"""

[item.grid_level]
kind = "engine"
category = ["accuracy"]
engines = ["pyscf"]
anchor = "mf.grids.level"
engine_key = "mf.grids.level"
manual = "PySCF 2.13 pyscf.dft.gen_grid.Grids 'level'"
type = "int"
value = 4
default = 4
range = [0, 9]
group = "stage"
label = "DFT grid level"
tier = "advanced"
help = """
Density of the numerical grid the exchange-correlation energy is integrated on: 0 = coarse, 3 = screening, 4 = production, 5 = tight, 9 = ultra.

PySCF's own default is 3; this catalogue starts at 4.  Level 3 is fine for an energy, but the quadrature error does not cancel in derivatives -- it shows up in forces and, most visibly, in vibrational frequencies, where grid noise produces spurious low-frequency modes.  Since this project exists to run geometry optimisations and Hessians, the grid that supports them is the right default.

Drop to 3 for single-point screening.
"""

[item.level_shift]
refs = ["Saunders1973"]
kind = "engine"
category = ["convergence"]
engines = ["pyscf"]
anchor = "mf.level_shift"
engine_key = "mf.level_shift"
manual = "PySCF 2.13 pyscf.scf.hf.SCF 'level_shift'"
type = "float"
value = 0.0
default = 0.0
unit = "Hartree"
range = [0.0, 1.0]
group = "profile"
label = "Level shift"
tier = "advanced"
help = """
Raises the empty orbitals by this much energy (Hartree) during the SCF, widening the gap so occupied and empty orbitals stop trading places between cycles.
Use 0 when the SCF converges cleanly; 0.1-0.3 helps a hard one.
A shift left switched on once the SCF is well behaved just costs extra cycles.
"""

[item.diis_space]
refs = ["Pulay1980", "Pulay1982"]
kind = "engine"
category = ["convergence"]
engines = ["pyscf"]
anchor = "mf.diis_space"
engine_key = "mf.diis_space"
manual = "PySCF 2.13 pyscf.scf.hf.SCF 'diis_space'"
type = "int"
value = 8
default = 8
range = [4, 20]
group = "profile"
label = "DIIS subspace size"
tier = "advanced"
help = """
How many previous SCF steps DIIS keeps and extrapolates from when it builds the next guess.
The default suits most molecules; raise it to 12-20 when the SCF oscillates instead of settling.
A bigger subspace costs memory and can drag in early steps that no longer describe the current region, which stalls convergence rather than helping it.
"""

[item.damp]
kind = "engine"
category = ["convergence"]
engines = ["pyscf"]
anchor = "mf.damp"
engine_key = "mf.damp"
manual = "PySCF 2.13 pyscf.scf.hf.SCF 'damp'"
type = "float"
value = 0.0
default = 0.0
range = [0.0, 0.9]
group = "profile"
label = "SCF damping factor"
tier = "advanced"
help = """
Mixes part of the previous cycle's Fock matrix into the current one so the SCF cannot swing past the solution -- Roothaan damping.
It ships off, which is right while the SCF converges on its own. Try 0.3-0.5 when DIIS alone isn't enough and the energy keeps bouncing between cycles.
Damping slows every cycle down, so a healthy SCF just takes longer for nothing.
"""

[item.optimize]
calculations = ["optimization"]
kind = "produce"
category = ["procedure"]
engines = ["pyscf"]
engine_key = "(molbuilder: gates geomeTRIC opt() vs single-point)"
type = "bool"
value = true
default = true
group = "profile"
label = "Optimize geometry"
help = """
Whether to relax the geometry.  On, the optimizer moves the atoms until the convergence criteria are met; off, the run is a single point -- one SCF at the geometry you gave, with no atom moved.
On the command line, --no-optimize is the spelling for off.
"""

[item.optimizer]
kind = "engine"
category = ["procedure"]
engines = ["pyscf"]
anchor = "geomeTRIC"
engine_key = "geomeTRIC / berny  (driver selection)"
manual = "PySCF 2.13 pyscf.geomopt.geometric_solver 'optimize()'"
type = "enum"
choices = ["geometric", "berny"]
value = "geometric"
default = "geometric"
group = "profile"
label = "Optimizer"
help = """
Which driver moves the atoms during a geometry optimization.
  geometric (default) -- translation-rotation-invariant internal coords (Wang & Song JCP 2016); BFGS quasi-Newton under the hood.  Robust on large flexible molecules, transition states, surface-anchored systems.  REQUIRED for the staged-opt loop -- only geometric accepts the per-stage convergence_drms / convergence_dmax kwargs.
  berny -- Cartesian + redundant internals; ships with PySCF, so no extra dependency.  Less robust on biomolecules, and it DOES NOT work with the staged-opt loop (incompatible kwarg set).  Use it only for single-stage runs.
Both are quasi-Newton; both converge tightly near a minimum.
"""

[item.solvent]
refs = ["Tomasi2005", "Cances1997"]
kind = "engine"
category = ["system"]
engines = ["pyscf"]
anchor = "mf"
engine_key = "mf = mf.PCM()"
manual = "PySCF 2.13 pyscf.solvent.pcm 'PCM()' (SMD is compiled out of this build -- -DENABLE_SMD; the gate refuses solvent_method=SMD by name)"
type = "str"
group = "profile"
label = "Solvent"
null_label = "(gas phase)"
optional = true
help = """
Surround the molecule with an implicit solvent instead of vacuum: PySCF wraps the SCF in a polarizable continuum rather than placing real solvent molecules.  Name the liquid (water / methanol / dmso / chloroform / ...), or leave it blank for a gas-phase calculation.
"""

[item.solvent_method]
refs = ["Marenich2009", "Lipparini2014"]
kind = "engine"
category = ["system"]
engines = ["pyscf"]
anchor = "mf.with_solvent.method"
engine_key = "mf.with_solvent.method"
manual = "PySCF 2.13 pyscf.solvent.pcm.PCM 'method'"
type = "enum"
choices = ["IEF-PCM", "C-PCM", "COSMO"]
value = "IEF-PCM"
default = "IEF-PCM"
group = "profile"
label = "PCM model"
help = """
Which polarisable-continuum model represents the solvent: no solvent molecules are placed, the solute instead sits in a dielectric that polarises around it.
PySCF's own default is C-PCM (pyscf.solvent.pcm.PCM.method); this catalogue starts at IEF-PCM. IEF-PCM solves the full integral-equation formalism, so it is the more general of the two and is what most quantum-chemistry packages default to; C-PCM is the conductor-like approximation, cheaper and very close to IEF-PCM for polar solvents but less reliable as the dielectric constant falls. COSMO is the original conductor-like model.
For water the three agree closely; the choice matters in low-dielectric solvents.
"""

[item.threads]
kind = "engine"
category = ["execution"]
engines = ["pyscf"]
allocation = true
anchor = "lib.num_threads"
engine_key = "lib.num_threads(N) + os.environ['OMP_NUM_THREADS']"
manual = "PySCF 2.13 pyscf.lib.misc 'num_threads()'"
type = "int"
group = "staging"
label = "CPU threads"
null_label = "(auto: physical cores)"
optional = true
help = """
How many CPU threads PySCF uses.  Left blank, the run asks what this job was GIVEN before it asks how big the machine is: OMP_NUM_THREADS, then the scheduler's allocation (SLURM_CPUS_PER_TASK / PBS_NCPUS / NSLOTS), and only as a last resort this node's PHYSICAL cores (not logical/HT) -- hyperthreading rarely helps quantum-chemistry kernels and can hurt cache locality.
Ask the node first instead, and a job holding 8 cores of a 128-core machine starts 128 threads and has them time-sliced onto its 8.
The emitted script pins BLAS to 1 thread per worker (OPENBLAS_NUM_THREADS=1, MKL_NUM_THREADS=1) so PySCF threads * BLAS threads don't multiply.  Set a number explicitly to bench, or to leave cores free for other jobs.
"""


