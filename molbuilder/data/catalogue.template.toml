default = 0.0018
unit = "Å"
range = [1e-05, 1.0]
group = "stage"
label = "Δx max"
tier = "advanced"
help = """
Geometry optimisation stops when no atom moves further than this in a single step (Å) -- geomeTRIC's max-displacement convergence criterion, checked alongside its other thresholds.  Set it too loose and the optimiser stops while the structure is still drifting; too tight and it keeps taking steps that no longer change the geometry.
"""

[item.geom_drms]
kind = "engine"
category = ["accuracy"]
engines = ["pyscf"]
anchor = "convergence_drms"
engine_key = "geomeTRIC convergence_drms"
