[item.geom_gmax]
kind = "engine"
category = ["accuracy"]
engines = ["pyscf"]
anchor = "convergence_gmax"
engine_key = "geomeTRIC convergence_gmax"
manual = "PySCF 2.13 geomeTRIC 1.0 'convergence_gmax' (driven via pyscf.geomopt)"
type = "float"
value = 0.00045
default = 0.00045
unit = "Ha/Bohr"
range = [1e-06, 0.1]
group = "stage"
label = "‖F‖∞"
tier = "advanced"
help = """
The largest force left on any single atom, in Ha/Bohr, that geomeTRIC will accept as converged.  It watches the worst atom, not the average.
It is one of geomeTRIC's convergence criteria and they all have to pass in the same step, so this one alone never stops the optimization.
Set it too loose and you accept a geometry with one atom still being pushed; too tight and the optimizer spends steps chasing force noise from the SCF.
"""

[item.geom_grms]
kind = "engine"
category = ["accuracy"]
engines = ["pyscf"]
anchor = "convergence_grms"
engine_key = "geomeTRIC convergence_grms"
manual = "PySCF 2.13 geomeTRIC 1.0 'convergence_grms' (driven via pyscf.geomopt)"
type = "float"
