[item.threads]
kind = "engine"
category = ["execution"]
engines = ["pyscf"]
anchor = "lib.num_threads"
type = "int"
group = "budget"
label = "CPU threads"
null_label = "(auto: physical cores)"
help = "how many CPU threads PySCF uses.  Default (blank) asks what this job was GIVEN before it asks how big the machine is: OMP_NUM_THREADS, then the scheduler's allocation (SLURM_CPUS_PER_TASK / PBS_NCPUS / NSLOTS), and only as a last resort this node's PHYSICAL cores (not logical/HT) -- hyperthreading rarely helps QC kernels and can hurt cache locality.  Asking the node first is how a job holding 8 cores of a 128-core machine started 128 threads and had them time-sliced onto its 8.  The emitted script pins BLAS to 1 thread per worker (OPENBLAS_NUM_THREADS=1, MKL_NUM_THREADS=1) so PySCF threads * BLAS threads don't multiply -- the canonical anti-oversubscription recipe.  Set explicitly to bench, or to leave cores free for other jobs."

