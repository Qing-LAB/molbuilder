help = """
How many k-points the ELECTRODE runs use along the transport direction.
This is the one axis where the lead and the device deliberately disagree.  The device is an open boundary and is never sampled along transport (kz = 1); the electrode is a genuinely periodic bulk calculation and needs a dense kz for its Fermi level to be well defined.
Too coarse here and the lead self-energy is built on a badly converged bulk.
"""
