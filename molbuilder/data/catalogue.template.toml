group = "stage"
label = "Raman-activity threshold"
tier = "advanced"
help = """
Raman-activity cutoff in A^4/amu: every mode brighter than this gets orbital-energy data.  Used only when Mode selection is set to threshold.
The final mode count is unpredictable -- it depends on how many modes happen to land above your cutoff, so you cannot know the cost of the run in advance.
"""

[item.es_explicit_indices]
kind = "deck"
