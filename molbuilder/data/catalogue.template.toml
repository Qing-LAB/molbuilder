tier = "basic"
help = """
compute Raman scattering intensity for every mode.  Cost: roughly 6 x (number of free atoms) extra response calculations (one polarizability per +/- finite-difference displacement in each Cartesian direction) -- the expensive optional.  Turn off if you only want frequencies or IR (IR is far cheaper; the two are independent toggles over one shared displacement loop)."""

[item.compute_ir]
kind = "deck"
calculations = ["vibration"]
expands = ["finite-difference dipole loop"]
category = ["procedure"]
engines = ["pyscf"]
engine_key = "(molbuilder: finite-diff dipole-moment derivative path)"
type = "bool"
value = false
default = false
group = "profile"
label = "Compute IR intensities"
tier = "basic"
help = """
compute IR absorption intensities (km/mol) from finite-difference dipole-moment derivatives.  Independent of Raman since 2026-08-20 (one Hessian, one mode set, one shared displacement loop computing whichever properties are ticked) -- and far cheaper: a dipole read per displacement versus Raman's response calculation.  VALIDATED at the band level 2026-08-20 (the vibration E2E holds water at B3LYP/def2-SVP to its literature windows: bend ~55 km/mol > asym ~27 > sym ~5, pattern and magnitudes both); an external cross-code digit match would harden it further and is welcome, not owed."""

[item.displacement_amplitude_ang]
kind = "deck"
calculations = ["vibration"]
expands = ["mode displacement step"]
category = ["accuracy"]
engines = ["pyscf"]
engine_key = "(molbuilder: finite-difference step amplitude)"
type = "float"
value = 0.02
default = 0.02
range = [0.02, 0.2]
unit = "Å"
group = "stage"
label = "Displacement amplitude"
tier = "advanced"
help = """
how far atoms are pushed along each mode eigenvector when probing how the orbitals shift (only used by the per-mode electronic-structure step).  The default 0.02 A sits inside the linear-response regime where the orbital-energy change is proportional to the displacement, so the slope you extract is the physically meaningful number rather than a finite-difference-amplitude artefact.  Trade-off: orbital-energy differences shrink to ~meV at small amplitude and need a tight SCF tolerance (the default scf_conv_tol=1e-9 is sufficient).  Above ~0.10 A anharmonic mixing starts to contaminate the response ([Mills1972] section 2.4); above ~0.20 A the linear-response assumption breaks outright."""

[item.es_mode_selection]
kind = "deck"
calculations = ["vibration"]
expands = ["per-mode displaced-SCF loop"]
category = ["procedure"]
engines = ["pyscf"]
engine_key = "(molbuilder: per-mode electronic-structure selector)"
type = "enum"
value = "skip"
default = "skip"
choices = ["skip", "all", "top_n", "threshold", "explicit"]
group = "stage"
label = "Mode selection"
tier = "basic"
help = """
which vibrational modes get the displaced-geometry orbital-energy probe.  Each chosen mode costs two extra SCF calculations (one at +A, one at -A along the mode), so this is the most expensive part of the run and its cost scales linearly with how many modes you pick.
    skip      -- don't run this step at all; you get a spectrum but no per-mode HOMO/LUMO data.  Use this for first-pass exploration.
    all       -- every mode (cost ~ 2 N modes).
    top_n     -- the N modes with the strongest Raman activity.
    threshold -- every mode whose Raman activity exceeds your cutoff.
    explicit  -- you list specific mode numbers.
Caveat: top_n and threshold rank by Raman brightness, which is NOT the same as electron-phonon coupling strength -- a mode that's transport-critical can be Raman-weak ([Galperin2007]).  When in doubt, use explicit (after looking at the spectrum) or all."""

[item.es_top_n]
kind = "deck"
calculations = ["vibration"]
expands = ["per-mode displaced-SCF loop"]
category = ["procedure"]
engines = ["pyscf"]
engine_key = "(molbuilder: per-mode selector parameter)"
type = "int"
value = 10
default = 10
range = [1, 1000]
group = "stage"
label = "Top-N modes"
tier = "advanced"
help = """
(only used when selector = top_n) how many of the brightest Raman-active modes to compute orbital-energy data for.  Cost grows linearly: N modes = 2 N SCF calculations."""

[item.es_threshold]
kind = "deck"
calculations = ["vibration"]
expands = ["per-mode displaced-SCF loop"]
category = ["procedure"]
engines = ["pyscf"]
engine_key = "(molbuilder: per-mode selector parameter)"
type = "float"
value = 1.0
default = 1.0
range = [0.0, 1000.0]
unit = "Å⁴/amu"
group = "stage"
label = "Raman-activity threshold"
tier = "advanced"
help = """
(only used when selector = threshold) Raman activity cutoff in A^4/amu; every mode brighter than this gets orbital-energy data.  Final mode count is unpredictable -- depends on how many modes happen to be above your cutoff."""

[item.es_explicit_indices]
kind = "deck"
calculations = ["vibration"]
expands = ["per-mode displaced-SCF loop"]
category = ["procedure"]
engines = ["pyscf"]
engine_key = "(molbuilder: per-mode selector parameter)"
type = "str"
value = ""
default = ""
group = "stage"
label = "Explicit modes"
tier = "advanced"
help = """
(only used when selector = explicit) comma-separated list of 1-based mode numbers to compute orbital-energy data for, e.g. "3, 7, 12".  Ranges supported: "3-7, 12".  ONE string format, parsed at the emitter (the T9 precedent: one format, no aliases).  Typical workflow: run with selector = skip first, look at the spectrum, then re-run with selector = explicit and the modes you care about."""

[item.freq_min_cm1]
kind = "deck"
calculations = ["vibration"]
expands = ["per-mode displaced-SCF loop"]
category = ["procedure"]
engines = ["pyscf"]
engine_key = "(molbuilder: per-mode frequency filter)"
type = "float"
optional = true
unit = "cm⁻¹"
null_label = "(no lower bound)"
group = "stage"
label = "Min frequency"
tier = "advanced"
help = """
restrict orbital-energy data to modes at or above this frequency.  Useful for skipping low-frequency rocking / librational modes that are often noisy and rarely matter for transport.  Caveat: filtering may skip modes whose strong electron-phonon coupling lies outside your chosen window ([Galperin2007]).  Ignored when selector = explicit."""

[item.freq_max_cm1]
kind = "deck"
calculations = ["vibration"]
expands = ["per-mode displaced-SCF loop"]
category = ["procedure"]
engines = ["pyscf"]
engine_key = "(molbuilder: per-mode frequency filter)"
type = "float"
optional = true
unit = "cm⁻¹"
null_label = "(no upper bound)"
group = "stage"
label = "Max frequency"
tier = "advanced"
help = """
restrict orbital-energy data to modes at or below this frequency.  Combine with Min frequency to target a specific spectral window (e.g. 2800-3200 cm^-1 for C-H stretches).  Ignored when selector = explicit."""

[item.es_n_homo_below]
kind = "deck"
calculations = ["vibration"]
expands = ["orbital-window record"]
category = ["procedure"]
engines = ["pyscf"]
engine_key = "(molbuilder: orbital-window record size)"
type = "int"
value = 5
default = 5
range = [0, 50]
group = "output"
label = "Orbitals below HOMO to save"
tier = "advanced"
help = """
how many frontier orbitals BELOW the HOMO to record at each displaced geometry.  Five is enough to study HOMO/LUMO behaviour for transport; raise it to see a richer slice of the orbital landscape (e.g. for density-of-states plots).  Doesn't change cost."""

[item.es_n_lumo_above]
kind = "deck"
calculations = ["vibration"]
expands = ["orbital-window record"]
category = ["procedure"]
