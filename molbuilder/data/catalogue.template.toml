default = 200
range = [1, 10000]
group = "stage"
label = "Max steps"
tier = "advanced"
help = """
The most geometry iterations geomeTRIC may run in this stage before it stops.
It is a runaway guard, not a target: a well-behaved optimisation finishes well inside it. Hitting the cap is not the end of the job by itself -- what happens next is decided by on_nonconvergence.
"""

[item.on_nonconvergence]
kind = "produce"
category = ["procedure"]
engines = ["pyscf"]
engine_key = "(molbuilder: per-stage non-convergence policy)"
type = "enum"
value = "halt"
default = "halt"
choices = ["proceed", "continue", "halt"]
group = "stage"
label = "If max_steps runs out"
tier = "advanced"
help = """
What this deck does if geomeTRIC's 5 criteria aren't all met when max_steps runs out:
  proceed  -- accept the partial geometry and let the next rung start from it.
  continue -- extend this rung with more iterations.
  halt     -- raise, rather than hand on a geometry nobody accepted.
This is THIS rung's answer: a ladder is N decks and N jobs, so each deck carries its own policy and none of them can see the others.
"""

[item.geom_continue_retries]
kind = "produce"
category = ["procedure"]
engines = ["pyscf"]
engine_key = "(molbuilder: max optimize() re-entries when on_nonconvergence=continue)"
type = "int"
value = 1
default = 1
range = [0, 5]
group = "stage"
label = "Continue retries"
tier = "advanced"
help = """
When geomeTRIC stops at its step cap without converging, this is how many further max_steps batches the job may spend before it falls through to halt. Only meaningful when on_nonconvergence='continue'.
Total step budget = max_steps * (1 + continue_retries).
The geom_ prefix keeps it distinct from Resources.continue_retries, which is the wrapper's warm-restart count and a different thing entirely.
"""


