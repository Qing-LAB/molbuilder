# THE CHART TABLE -- what each chart on the Results page draws, as a data file
# holds it (model/datafiles.md § 5b, § 9.7; web/results.md § 1.2).  Read by
# `molbuilder.chartdata` and nowhere else.
#
# [charts.<chart>]  a chart that exports: its `words` -- what it shows -- and
#                   the `tags` of the curves and the `marks` of the threshold
#                   lines it may draw; any other is refused.
# [xs.<x>]          what a curve runs along, the variable named <x>.
# [tags.<tag>]      a kind of curve: its `y` and the [xs] row it runs along,
#                   `x`; or a kind of threshold line: its `mark`.
#
# A VARIABLE IS ITS OWNER'S WHERE ONE DECLARES IT -- one concept, one name,
# one statement (§ 2a rule 1):
#   { of = "<module:NAME>", name = "<variable>" }  a data file's table of
#                                                  variables, its words, kind,
#                                                  units and source as they
#                                                  are there;
#   { of = "scf", name = "<variable>" }            the calculation's engine's
#                                                  SCF column (the engine
#                                                  table's `scf_columns`);
#   { of = "axis" }                                an [xs] row: the axis's own
#                                                  row of ncdata.AXES;
# and only what no file declares is stated here, whole: `name`, `kind`,
# `units`, `long_name`, `definition`, and a raw one's `source`.

[charts.total-energy]
words = "the energy at each geometry step of the run shown"
tags = ["total_energy"]
marks = []

[charts.max-force]
words = "the largest force at each geometry step, and the run's tolerance"
tags = ["max_force", "max_force_free"]
marks = ["force_tolerance"]

[charts.scf-energy]
words = "an SCF's energy at each cycle -- a step's, a stage's, or each run of a frame set"
tags = ["scf_energy"]
marks = []

[charts.scf-residuals]
words = "an SCF's residuals at each cycle, and their tolerances"
tags = ["dDmax", "dHmax", "dq", "delta_E", "gnorm"]
marks = ["dDmax", "dHmax", "dq", "delta_E", "gnorm"]

[charts.transmission]
words = "the transmission T(E) of the points drawn"
tags = ["transmission", "transmission_by_spin", "transmission_total", "average_transmission", "eigenchannel_transmission"]
marks = []

[charts.dos]
words = "the density of states of the points drawn"
tags = ["dos_total", "dos_total_by_spin", "dos_region", "lead_spectral_dos", "lead_bulk_dos", "pdos"]
marks = []

[charts.iv]
words = "the current against the bias"
tags = ["current", "iv_current", "iv_current_by_spin"]
marks = []

[charts.spectrum]
words = "a vibration's Raman and IR spectrum -- each lane's bands and its broadened curve"
tags = ["raman_strength", "raman_curve", "ir_intensity", "ir_curve"]
marks = []

[charts.levels]
words = "a mode's frontier orbitals at its two displaced geometries and at equilibrium"
tags = ["mo_energy"]
marks = []

[charts.thermo]
words = "the thermochemistry over temperature"
tags = ["thermo_g", "thermo_h", "thermo_ts"]
marks = []

[charts.thermo-parts]
words = "the thermochemistry's parts at one temperature"
tags = ["thermo_part"]
marks = []

[charts.bench]
words = "a benchmark sweep's trials: the time per SCF iteration, the memory peaks, how busy the CPU and the GPU were"
tags = ["s_per_iter", "mem_peak_gb", "gpu_vram_peak_gb", "cpu_mean_pct", "gpu_sm_mean_pct"]
marks = []

# ---- what the curves run along -------------------------------------------------------------

[xs.step_index]
units = "1"
long_name = "the step's number"
definition = "the geometry step's number in the run's output, as the chart counts it"

[xs.scf_iscf]
of = "scf"

[xs.energy_ev]
of = "axis"

[xs.bias_v]
of = "molbuilder.transport.datafile:VARIABLES"

[xs.iv_bias_v]
of = "molbuilder.transport.datafile:VARIABLES"

[xs.frequency_cm1]
of = "molbuilder.spectra.datafile:MODE_VARS"

[xs.curve_frequency_cm1]
units = "cm-1"
long_name = "the frequency the curve is evaluated at"
definition = "a point of the broadened curve, in cm-1"

[xs.mode_displacement_ang]
units = "angstrom"
long_name = "the displacement along the mode"
definition = "-A, 0 and +A: the geometries the electronic-structure probe ran at, A its amplitude (amplitude_ang)"

[xs.temperature_k]
of = "molbuilder.spectra.datafile:GRID_VARS"

[xs.thermo_part]
units = ""
long_name = "a part of the thermochemistry"
definition = "ZPE, U_vib, trans + rot + pV (full RRHO), -T*S, and their sum: G - E_elec, or F_vib on vibrational contributions only"

[xs.bench_setting]
units = ""
long_name = "the trial's setting"
definition = "the trial's value of the setting the sweep varies, as the chart lists it"

# ---- a step's energy and force, the steps file's ---------------------------------------------

[tags.total_energy]
x = "step_index"
y = { of = "molbuilder.stepsdata:STEP_VARS", name = "total_energy_ev" }

# The viewer draws the largest force AS THE ENGINE STATES IT -- on PySCF a
# per-atom magnitude, not the steps file's component -- so its own name.
[tags.max_force]
x = "step_index"
y = { name = "stated_max_force_ev_per_ang", kind = "raw", units = "eV/angstrom", long_name = "the largest force, over every atom, as the engine states it", definition = "as the engine states it: SIESTA's Max line, its largest absolute Cartesian component; a PySCF run's largest per-atom magnitude, |F| -- the figure the run's reader gives (the steps file's max_force_ev_per_ang is the component, recomputed from the forces)", source = "the run's own output" }

[tags.max_force_free]
x = "step_index"
y = { name = "stated_max_force_free_ev_per_ang", kind = "raw", units = "eV/angstrom", long_name = "the largest force, over the atoms the run moved, as the engine states it", definition = "SIESTA's Max ... constrained, the value it compares with MD.MaxForceTol; a PySCF run's largest per-atom magnitude over the atoms it moves", source = "the run's own output" }

[tags.force_tolerance]
mark = { of = "molbuilder.stepsdata:RUN_VARS", name = "force_tolerance_ev_per_ang" }

# ---- an SCF's rows, the engine's columns; what only the chart draws, its own -----------------

[tags.scf_energy]
x = "scf_iscf"
y = { of = "scf", name = "scf_energy_ev" }

[tags.dDmax]
x = "scf_iscf"
y = { of = "scf", name = "scf_ddmax" }
mark = { name = "scf_ddmax_tolerance", kind = "raw", units = "1", long_name = "dDmax's tolerance", definition = "the tolerance the SCF on screen had to reach", source = "the run's stated SCF criteria" }

[tags.dHmax]
x = "scf_iscf"
y = { of = "scf", name = "scf_dhmax_ev" }
mark = { name = "scf_dhmax_tolerance_ev", kind = "raw", units = "eV", long_name = "dHmax's tolerance", definition = "the tolerance the SCF on screen had to reach", source = "the run's stated SCF criteria" }

[tags.dq]
x = "scf_iscf"
y = { name = "scf_dq_abs_e", kind = "derived", units = "e", long_name = "the charge not conserved, its size", definition = "|dQ| of a TranSIESTA NEGF row (the engine's scf_dq_e), as the log axis draws it" }
mark = { name = "scf_dq_tolerance_e", kind = "raw", units = "e", long_name = "dQ's tolerance", definition = "the tolerance the SCF on screen had to reach", source = "the run's stated SCF criteria" }

[tags.delta_E]
x = "scf_iscf"
y = { name = "scf_delta_e_abs_ev", kind = "derived", units = "eV", long_name = "the energy's change, its size", definition = "|dE| (the engine's scf_delta_e_ev), as the log axis draws it" }
mark = { name = "scf_delta_e_tolerance_ev", kind = "raw", units = "eV", long_name = "dE's tolerance", definition = "the tolerance the SCF on screen had to reach", source = "the run's stated SCF criteria" }

[tags.gnorm]
x = "scf_iscf"
y = { of = "scf", name = "scf_gnorm_ev" }
mark = { name = "scf_gnorm_tolerance_ev", kind = "raw", units = "eV", long_name = "|g|'s tolerance", definition = "the tolerance the SCF on screen had to reach", source = "the run's stated SCF criteria" }

# ---- a transport point's curves, the transport file's; the two spins summed, the chart's -----

[tags.transmission]
x = "energy_ev"
y = { of = "molbuilder.transport.datafile:VARIABLES", name = "transmission" }

[tags.transmission_by_spin]
x = "energy_ev"
y = { of = "molbuilder.transport.datafile:VARIABLES", name = "transmission_by_spin" }

[tags.transmission_total]
x = "energy_ev"
y = { name = "transmission_total", kind = "derived", units = "1", long_name = "the two spins' transmission summed", definition = "T_up + T_down, a polarized point's two channels (transmission_by_spin) summed" }

[tags.average_transmission]
x = "energy_ev"
y = { of = "molbuilder.transport.datafile:VARIABLES", name = "average_transmission" }

[tags.eigenchannel_transmission]
x = "energy_ev"
y = { of = "molbuilder.transport.datafile:VARIABLES", name = "eigenchannel_transmission" }

[tags.dos_total]
x = "energy_ev"
y = { of = "molbuilder.transport.datafile:VARIABLES", name = "dos_total_per_ev" }

[tags.dos_total_by_spin]
x = "energy_ev"
y = { of = "molbuilder.transport.datafile:VARIABLES", name = "dos_total_by_spin_per_ev" }

[tags.dos_region]
x = "energy_ev"
y = { of = "molbuilder.transport.datafile:VARIABLES", name = "dos_region_per_ev" }

[tags.lead_spectral_dos]
x = "energy_ev"
y = { of = "molbuilder.transport.datafile:VARIABLES", name = "lead_spectral_dos_per_ev" }

[tags.lead_bulk_dos]
x = "energy_ev"
y = { of = "molbuilder.transport.datafile:VARIABLES", name = "lead_bulk_dos_per_ev" }

[tags.pdos]
x = "energy_ev"
y = { name = "pdos_per_ev", kind = "derived", units = "1/eV", long_name = "a chosen selection's projected DOS", definition = "the density of states projected on the orbitals the person chose (postprocess.pdos), a curve each selection; a polarized point's two channels summed" }

[tags.current]
x = "bias_v"
y = { of = "molbuilder.transport.datafile:VARIABLES", name = "current_a" }

[tags.iv_current]
x = "iv_bias_v"
y = { of = "molbuilder.transport.datafile:VARIABLES", name = "iv_current_a" }

[tags.iv_current_by_spin]
x = "iv_bias_v"
y = { of = "molbuilder.transport.datafile:VARIABLES", name = "iv_current_by_spin_a" }

# ---- a vibration's spectrum, its levels and its thermochemistry, as the charts draw them -----

[tags.raman_strength]
x = "frequency_cm1"
y = { name = "raman_strength_ang4_per_amu", kind = "derived", units = "angstrom^4/amu", long_name = "a mode's Raman strength, as drawn", definition = "SIESTA's at the laser named (the Raman view's strength_laser_ang4_per_amu; the laser in the root's chosen) or PySCF's activity (raman_activity_ang4_per_amu); a gap where no band is drawn -- hidden by the display floor, the lane below its band floor, or no value" }

[tags.raman_curve]
x = "curve_frequency_cm1"
y = { name = "raman_curve_ang4_per_amu", kind = "derived", units = "angstrom^4/amu", long_name = "the Raman lane's broadened curve", definition = "a Lorentzian of each real band drawn -- its height the band's, its full width at half maximum the broadening chosen -- summed; an imaginary mode's band is drawn and left out of the curve" }

[tags.ir_intensity]
x = "frequency_cm1"
y = { name = "ir_intensity_relative_percent", kind = "derived", units = "%", long_name = "a mode's IR intensity, as drawn", definition = "the run's km/mol -- the infrared view's, from its charges or from its dipoles where it held atoms, or the result's own -- as a percentage of the lane's strongest real band (an imaginary mode's may pass 100); a gap where no band is drawn -- hidden by the display floor, the lane below its band floor, or no value" }

[tags.ir_curve]
x = "curve_frequency_cm1"
y = { name = "ir_curve_relative_percent", kind = "derived", units = "%", long_name = "the IR lane's broadened curve", definition = "a Lorentzian of each real band drawn, its height the band's percentage of the strongest real band, its full width at half maximum the broadening chosen -- summed; an imaginary mode's band is drawn and left out of the curve" }

[tags.mo_energy]
x = "mode_displacement_ang"
y = { name = "mo_energy_ev", kind = "derived", units = "eV", long_name = "an orbital's energy", definition = "the probe's mo_energy_minus_eh, mo_energy_eq_eh and mo_energy_plus_eh, in eV: a curve each orbital of the window, named by its place beside the HOMO and LUMO" }

[tags.thermo_g]
x = "temperature_k"
y = { name = "free_energy_above_electronic_kcal_per_mol", kind = "derived", units = "kcal/mol", long_name = "the free energy above the electronic energy", definition = "G - E_elec on the full RRHO, F_vib on vibrational contributions only: the grid's g_eh less the equilibrium SCF energy, in kcal/mol" }

[tags.thermo_h]
x = "temperature_k"
y = { name = "enthalpy_above_electronic_kcal_per_mol", kind = "derived", units = "kcal/mol", long_name = "the enthalpy above the electronic energy", definition = "H - E_elec on the full RRHO, ZPE + U_vib on vibrational contributions only: the grid's h_eh less the equilibrium SCF energy, in kcal/mol" }

[tags.thermo_ts]
x = "temperature_k"
y = { name = "temperature_times_entropy_kcal_per_mol", kind = "derived", units = "kcal/mol", long_name = "the temperature times the entropy", definition = "T*S, or T*S_vib on vibrational contributions only: T times the grid's s_eh_per_k, in kcal/mol" }

[tags.thermo_part]
x = "thermo_part"
y = { name = "part_kcal_per_mol", kind = "derived", units = "kcal/mol", long_name = "a part's value", definition = "each part at the grid temperature nearest the headline one (the root's chosen), in kcal/mol: ZPE the grid's zpe_eh; U_vib its u_vib_eh; trans + rot + pV (full RRHO) its h_eh less the equilibrium SCF energy, less ZPE and U_vib; -T*S its -T*s_eh_per_k; and G - E_elec (F_vib) its g_eh less the equilibrium SCF energy" }

# ---- a benchmark sweep's trials, as the sweep's summary states them ------------------------------

[tags.s_per_iter]
x = "bench_setting"
y = { name = "scf_iteration_time_s", kind = "derived", units = "s", long_name = "the time per SCF iteration", definition = "the trial's mean seconds per SCF iteration, molbuilder's from the run's SCF timing (its record's s_per_iter)" }

[tags.mem_peak_gb]
x = "bench_setting"
y = { name = "memory_peak_gib", kind = "raw", units = "GiB", long_name = "the memory peak", definition = "the trial's memory peak (its record's mem_peak_gb, 2^30 bytes despite the name)", source = "the trial's utilisation log" }

[tags.gpu_vram_peak_gb]
x = "bench_setting"
y = { name = "gpu_memory_peak_gib", kind = "raw", units = "GiB", long_name = "the GPU memory peak", definition = "the trial's GPU memory peak (its record's gpu_vram_peak_gb, 2^30 bytes despite the name)", source = "the trial's utilisation log" }

[tags.cpu_mean_pct]
x = "bench_setting"
y = { name = "cpu_busy_percent", kind = "derived", units = "%", long_name = "how busy the CPU was", definition = "the trial's mean CPU use over its run, molbuilder's from its utilisation log (its record's cpu_mean_pct)" }

[tags.gpu_sm_mean_pct]
x = "bench_setting"
y = { name = "gpu_busy_percent", kind = "derived", units = "%", long_name = "how busy the GPU was", definition = "the trial's mean GPU streaming-multiprocessor use over its run, molbuilder's from its utilisation log (its record's gpu_sm_mean_pct)" }
