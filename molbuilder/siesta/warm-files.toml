# SIESTA's warm-state vocabulary -- job-contracts.md § 4.2a.
# ONE file: the declaration builder, the wrapper inventory, validation
# and the guards all derive from these rows.  Row order is load-bearing
# (Job.warm order; the banner/test order) -- append, don't reorder.
# The vocabulary is closed: suffix · carry · requires_same · honoured_by.

schema = "molbuilder/warm-files@1"
engine = "siesta"

# ---- every SIESTA calculation ---------------------------------------

[[base.file]]
suffix      = ".XV"             # coordinates + velocities (the geometry)
carry       = "when-continuing"
honoured_by = "MD.UseSaveXV"

[[base.file]]
suffix      = ".DM"             # converged density matrix
carry       = "when-continuing"
honoured_by = "DM.UseSaveDM"

# ---- the accumulative records ---------------------------------------
# SIESTA OPENS THESE AND APPENDS; it never reads them back.  So they carry
# for a different reason than .XV / .DM / .CG do, and they have no
# `honoured_by` -- there is no deck keyword that reads them.
#
# They carry because THE SHAPE MUST NOT CHANGE THE DATA (2026-08-15).  In
# `flat` all attempts and stages share one directory, so SIESTA appends and
# these files hold the whole calculation.  In `hierarchical` each attempt is
# its own directory, so without carrying them a continued stage's records
# start empty and the earlier frames are only in the previous attempt's
# copy -- the same run yielding a different record depending on a layout
# flag.  Carrying restores parity: the engine appends to what came before,
# exactly as it would have in flat.
#
# `.MD.nc` is the one molbuilder itself reads (parse/engines/siesta_mdnc.py);
# the other three are for external tools.  A run that did not write them --
# write_md_history / write_md_xmol off -- simply has nothing to copy, and
# `materialize` skips a file that is not there.

[[base.file]]
suffix      = ".MD.nc"          # netCDF MD history: the trajectory we parse
carry       = "when-continuing"

[[base.file]]
suffix      = ".MD"             # the same, unformatted Fortran
carry       = "when-continuing"

[[base.file]]
suffix      = ".MDE"            # per-step energy / temperature summary
carry       = "when-continuing"

[[base.file]]
suffix      = ".ANI"            # XMol animation, for xcrysden / VMD / OVITO
carry       = "when-continuing"

[[base.file]]
suffix = ".LWF"                 # localized Wannier functions
[[base.file]]
suffix = ".ZM"                  # Z-matrix state
[[base.file]]
suffix = ".Bonds"
[[base.file]]
suffix = ".PARTIAL"
[[base.file]]
suffix = ".EIG"                 # eigenvalues
[[base.file]]
suffix = ".HSX"                 # Hamiltonian + overlap
[[base.file]]
suffix = ".WFSX"                # saved wavefunctions
[[base.file]]
suffix = ".STRUCT_NEXT_ITER"    # next-iteration geometry

# ---- optimization: extends base -------------------------------------

[[optimization.file]]
suffix        = ".CG"           # the optimizer's own history
carry         = "when-continuing"
requires_same = "optimizer"     # meaningless across algorithms -- a CG
                                # history handed to Broyden corrupts the
                                # restart (project-layout § 2.3.4 row 3)
honoured_by   = "MD.UseSaveCG"

# ---- transport: a different vocabulary, same format -----------------

[[transport.file]]
suffix = ".TSHS"                # TranSIESTA Hamiltonian + overlap.
                                # Inventory-only ON PURPOSE: it is a
                                # PRODUCT of its own deck (the electrode
                                # stages write it; the device recomputes
                                # its own), so carrying it into a
                                # continued attempt could mask a changed
                                # deck.  The device's copies arrive by
                                # the structural gather (prep's
                                # transport arm), never by continuation.

[[transport.file]]
suffix = ".TSDE"                # the NEGF density -- THE warm state of a
                                # device re-run, and the file the bias
                                # chain hands from point to point
                                # (transport-design.md 4.3).  No
                                # honoured_by: TranSIESTA reads
                                # <SystemLabel>.TSDE by PRESENCE, no deck
                                # keyword involved -- same class as the
                                # accumulative records above.
carry  = "when-continuing"
