# SIESTA's warm-state vocabulary -- job-contracts.md § 4.2a.
# ONE file: the declaration builder, the wrapper inventory, validation
# and the guards all derive from these rows.  Row order is load-bearing
# (Job.warm order; the banner/test order) -- append, don't reorder.
# The vocabulary is closed: suffix · carry · requires_same · honoured_by.
#
# ---- HOW TO CHANGE WHAT ONE CALCULATION CARRIES ----------------------
# This is molbuilder's list for SIESTA, and every calculation follows it
# unless it has its own.  To give one calculation its own list:
#
#   1. copy this file into the calculation's folder, beside its task.json,
#      keeping the name: <calculation>/warm-files.toml
#   2. edit the copy -- that copy is then read instead of this one, for
#      that calculation alone, by everything that reads the list: prep's
#      carry, the run script's restart check, `jobset status`
#      (job-contracts.md § 4.2a).  The Task setup page says which list a
#      calculation follows.
#
# What a row says:
#   suffix        the file's name after the label: <label><suffix>
#   carry         "when-continuing" -- a stage that continues from a run
#                 takes this file from it; leave the key out and the file
#                 is only known (listed, never copied)
#   requires_same a trait both runs must share for the file to carry,
#                 e.g. "optimizer": a CG history is never handed to Broyden
#   honoured_by   the deck keyword that reads the file, which the deck must
#                 write whenever the file carries
# and the facts a section states of its kind: `resumes`, whether a re-run of
# that kind of run continues from what the last one left (true unless
# stated); for a sweep, `along`, what a done point hands the next, and
# `scratch`, the engine's scratch at a point -- never carried, never taken
# over into a new run (engines/transport.md 2a.11).
#
# What an edit does: drop a row's `carry` to stop a file carrying (withhold
# .DM for one debugging ladder); add a row for a file a new engine build
# writes; add `requires_same` to tighten when a file may carry.  The
# vocabulary is closed -- those four keys -- and a copy that adds another is
# refused, naming the key.

schema = "molbuilder/warm-files@1"
engine = "siesta"

# ---- every SIESTA calculation ---------------------------------------

[[base.file]]
suffix      = ".XV"             # coordinates + velocities (the geometry)
carry       = "when-continuing"
honoured_by = "MD.UseSaveXV"

[[base.file]]
suffix      = ".DM"             # converged density matrix
carry       = "when-continuing"
honoured_by = "DM.UseSaveDM"

[[base.file]]
suffix = ".LWF"                 # localized Wannier functions
[[base.file]]
suffix = ".ZM"                  # Z-matrix state
[[base.file]]
suffix = ".BONDS"                # bond lengths, as SIESTA spells it (`.Bonds` until 2026-10-04)
[[base.file]]
suffix = ".PARTIAL"
[[base.file]]
suffix = ".EIG"                 # eigenvalues
[[base.file]]
suffix = ".HSX"                 # Hamiltonian + overlap
[[base.file]]
suffix = ".WFSX"                # saved wavefunctions
[[base.file]]
suffix = ".STRUCT_NEXT_ITER"    # next-iteration geometry

# ---- optimization: extends base -------------------------------------

[[optimization.file]]
suffix        = ".CG"           # the optimizer's own history
carry         = "when-continuing"
requires_same = "optimizer"     # meaningless across algorithms -- a CG
                                # history handed to Broyden corrupts the
                                # restart (project-layout § 2.3.4 row 3)
honoured_by   = "MD.UseSaveCG"

# ---- transport: a different vocabulary, same format -----------------

[transport]
along = [".TSDE"]               # WHAT A SWEEP HANDS FROM POINT TO POINT: a
                                # device point starts from the converged
                                # density of the closest done point before
                                # it -- the manual's "copy the TSDE from the
                                # closest, previously, calculated bias"
                                # (engines/transport.md 2a.11)
scratch = [".TSGFL", ".TSGFR"]  # THE ENGINE'S SCRATCH AT A RUN: the leads'
                                # surface Green's functions, one pair per
                                # voltage in the run's folder, written by
                                # the first point at that voltage and read
                                # by every other frame's (tens of GB each)
                                # -- never carried, never taken over into a
                                # new run, always large to the checkpoint
                                # (engines/transport.md 2a.11, *What a run's
                                # points share*)

[[transport.file]]
suffix = ".TSHS"                # TranSIESTA Hamiltonian + overlap.
                                # Inventory-only ON PURPOSE: it is a
                                # PRODUCT of its own deck (the electrode
                                # stages write it; the device recomputes
                                # its own), so carrying it into a
                                # continued attempt could mask a changed
                                # deck.  The device's copies arrive by
                                # the structural gather (prep's
                                # transport arm), never by continuation.

[[transport.file]]
suffix = ".TSDE"                # the NEGF density -- THE warm state of a
                                # device re-run, and the file the bias
                                # chain hands from point to point
                                # (engines/transport.md 2a.11).  No
                                # honoured_by: TranSIESTA reads it under
                                # DM.UseSaveDM (m_new_dm.F90), which the
                                # device deck always writes .true.
carry  = "when-continuing"

# ---- vibration: the force-constant run --------------------------------
# The run nudges the free atoms and writes the force constants; nothing it
# leaves is a state a later attempt resumes from -- SIESTA restarts an FC
# run at FC.First every time -- so both rows are inventory-only.
#
# THE BASE `.XV` ROW DOES NOT MEAN HERE WHAT IT MEANS FOR A RELAXATION.  An
# FC run writes its LAST DISPLACEMENT to <SystemLabel>.XV (measured: the
# last free atom sits FC.Displacement off the input along z after the
# run), not a geometry to continue from.  The vocabulary cannot withhold a
# base row per section, so the deck declines it instead: the force-
# constant deck writes `MD.UseSaveXV .false.` whatever the description
# says (siesta/vibration_deck.py::start_state_lines), and a carried `.XV`
# is a copied file the engine is told not to read.

[vibration]
resumes = false                 # A RE-RUN DOES NOT CONTINUE: SIESTA starts
                                # an FC run at its reference step
                                # (siesta_init.F, idyn 6) and reloads the
                                # density it saved there before every
                                # displacement (m_new_dm.F90) -- so a retry
                                # continues an SCF that stopped the
                                # reference step, and meets the same SCF
                                # again after one that stopped at a
                                # displacement; the wrapper says so rather
                                # than calling it a resume
                                # (running-a-job.md 3.5; job-contracts.md
                                # 4.2a's one section-level fact)

[[vibration.file]]
suffix = ".FC"                  # the force constants, eV/A^2: the PRODUCT
                                # of the run, read beside it by the job's
                                # finish through parse/engines/siesta_fc.py
                                # (engines/vibration.md 5.5)

[[vibration.file]]
suffix = ".FCC"                 # the same with the held atoms' rows zeroed
