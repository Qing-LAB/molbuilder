repos:
  # File / format hygiene: cheap, runs first so subsequent hooks see
  # normalised input.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-merge-conflict

  # Python syntax + simple correctness via pyflakes (already in
  # ``[test]`` extras).  Doesn't lint style; only "would Python
  # actually run this" issues.
  - repo: https://github.com/PyCQA/pyflakes
    rev: '3.2.0'
    hooks:
      - id: pyflakes
        # Skip third-party-shaped vendored files / tests that
        # deliberately use unused imports (e.g. import * lookups).
        exclude: '^(molbuilder/web/static/vendor/|tests/data/)'

  # Local-repo hooks: pytest + JS syntax check.
  - repo: local
    hooks:
      # Run the full pytest suite except ``slow``-marked tests and
      # the chromium-required atom-list file.  ``-m "not e2e"`` is
      # DELIBERATELY ABSENT: the 2026-06-14 workspace-dispatcher
      # clobber-BLOCKER shipped through three commits because the
      # pre-existing e2e tests that caught it lived behind that
      # filter (existed, passed locally on ``make test-all``, never
      # ran pre-commit).  When a test catches a class of production
      # bug, GATE on it -- don't filter it out for speed.  Memory:
      # feedback_dont_hide_failing_tests.
      - id: pytest
        name: pytest (full suite, slow excluded)
        entry: python -m pytest -q --no-header
            --ignore=tests/test_atom_list_render_paths.py
            -m "not slow"
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit]

      # node -c on every modified static/*.js so a typo doesn't
      # silently break the form renderer.  No bundler -> no other
      # JS check.
      - id: node-js-syntax
        name: node -c (syntax-check modified .js)
        entry: bash -c 'for f in "$@"; do node -c "$f" || exit 1; done' --
        language: system
        files: '\.js$'
        exclude: '^(molbuilder/web/static/vendor/)'
