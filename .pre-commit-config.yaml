repos:
  # File / format hygiene: cheap, runs first so subsequent hooks see
  # normalised input.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-merge-conflict

  # Python syntax + simple correctness via pyflakes (already in
  # ``[test]`` extras).  Doesn't lint style; only "would Python
  # actually run this" issues.
  - repo: https://github.com/PyCQA/pyflakes
    rev: '3.2.0'
    hooks:
      - id: pyflakes
        # Skip third-party-shaped vendored files, test data, and
        # molbuilder/data/, where nothing is imported (the notebook server's
        # config is executed by Jupyter, which gives it its `c`).
        exclude: '^(molbuilder/web/static/vendor/|molbuilder/data/|tests/data/)'

  # Local-repo hook: the JS syntax check.  The tests a commit must pass
  # are not a hook -- they are the tests the change touched, chosen by
  # what it touched (docs/process/testing.md § 7).
  - repo: local
    hooks:
      # node -c on every modified static/*.js so a typo doesn't
      # silently break the form renderer.  No bundler -> no other
      # JS check.
      - id: node-js-syntax
        name: node -c (syntax-check modified .js)
        # The host env's own node, by its path (docs/ops/installation.md M6).
        entry: bash -c 'n="${CONDA_PREFIX:?}/bin/node"; [ -x "$n" ] || { echo "no node in the host env ($n) -- it is its opt-in test tooling (docs/ops/env-framework.md 3.2a)" >&2; exit 1; }; for f in "$@"; do "$n" -c "$f" || exit 1; done' --
        language: system
        files: '\.js$'
        exclude: '^(molbuilder/web/static/vendor/)'
