[build-system]
# >=62.3 for RECURSIVE ``**`` in package-data (below).  On an older
# setuptools the pattern matches nothing and the wheel ships no static
# files at all -- a louder failure than the silent partial list it
# replaced, but a floor is what stops it happening.
requires = ["setuptools>=62.3", "wheel"]
build-backend = "setuptools.build_meta"

# WHAT THIS FILE IS FOR, and what it is not *(stated 2026-09-18)*.
#
# molbuilder is NOT published, and is deliberately never pip-installed to be
# run: there is no release workflow and no `[project.urls]`, and
# `process/conventions.md` makes `pythonpath=["."]` an ENFORCED convention
# with a guard test -- "no `pip install -e`" -- because a molbuilder wheel in
# site-packages shadows the working tree from any cwd but the repo root.
# `scripts/install-env.sh` builds conda envs and runs `python -m molbuilder`
# against the tree; that is the supported shape.
#
# So this file is BUILD METADATA and a DEPENDENCY LEDGER, not a distribution
# route:
#   * `requires-python` is read for real -- the shim shape-checks `--python`
#     against it before the solver runs;
#   * `[tool.setuptools.package-data]` decides what a built wheel carries,
#     and has been wrong twice in ways that only showed up in an installed
#     copy, so it is kept correct;
#   * the dependency lists say what each capability needs.
#
# THE LISTS HERE ARE A SECOND HOME.  `molbuilder/envs/recipes.py` is the
# first, it is the one every install actually uses, and nothing compares
# them -- unlike the shim's host array, which has a drift-guard test.  They
# answer different questions (a recipe says what an env CONTAINS; an extra
# says what a consumer may choose), so they are not expected to match
# package-for-package -- but a capability the code needs must appear in
# both, and `plotly` was missing from this one for months.
#
# Making PyPI real would mean: URLs, a release workflow, deciding whether
# `tests/` ships (it does not -- `include = ["molbuilder*"]`), and putting
# these lists under a guard. None of that is done, and none of it is implied
# by the metadata below.

[project]
name = "molbuilder"
version = "1.1.0"
description = "Build 3-D molecules from sequences / SMILES / names; emit SIESTA / PySCF / ASE input."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Quan Qing", email = "qqing@asu.edu" }]
license = { text = "BSD-3-Clause" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24",
    "ase>=3.22",                 # XYZ I/O + atomic-number table for siesta module
    "plotly>=5",                 # NOT imported as a library -- the web app serves
                                 # its JS BUNDLE.  `app.py`'s /vendor/plotly.min.js
                                 # reads `plotly/package_data/plotly.min.js` through
                                 # importlib.resources so the browser needs no CDN,
                                 # and every chart in the UI is drawn with it
                                 # (spectra, trajectory, transport, bench-summary,
                                 # projects-sidebar, system-load).  Missing here
                                 # until 2026-09-18, while `_HOST.conda_packages`
                                 # has always had it: an install from this metadata
                                 # 404s that route and degrades every chart to
                                 # "unavailable".  Core, not an extra, for the same
                                 # reason flask is -- it is what the web UI needs to
                                 # work at all.  >=5 is the floor the bundle path
                                 # requires.
    "PeptideBuilder>=1.1",       # peptide backbone geometry
    "biopython>=1.81",           # required by PeptideBuilder
    "flask>=3.0",                # bundled web UI (build + watch); core post-merge
    "click>=8.1",                # CLI plumbing for `molbuilder ...` subcommands
    "sisl>=0.14",                # SIESTA / TranSIESTA / TBtrans output parsing
                                 # (NetCDF binary + ASCII).  Required by the
                                 # Transport tab for T(E) reading, eigenchannel
                                 # decomposition, orbital-resolved transmission,
                                 # and I(V) integration.  Pulls netCDF4 + h5py
                                 # transitively -- heavier install but a
                                 # one-time cost.
    "psutil>=5.9",               # Cross-platform CPU + RAM stats for the
                                 # Results-tab system-load monitor (cpu_percent,
                                 # virtual_memory).  ~150 KB pure-Python +
                                 # tiny C ext, on conda-forge.
]

[project.optional-dependencies]
# NO `gpu` EXTRA.  It declared `nvidia-ml-py` for the system-load
# monitor, and that monitor stopped importing NVML in-process on
# 2026-08-28: a request thread entered the driver during someone's GPU
# work and never came back, freezing the server for eight hours, so GPU
# stats now come from `nvidia-smi` as a SUBPROCESS with a hard timeout
# (`web/blueprints/system_load.py`).  Nothing under `molbuilder/` has
# imported `pynvml` since.  Removed 2026-09-18: an extra that installs a
# package no code imports, justified by a mechanism that no longer
# exists, is a promise to whoever reads it next.

# Hydrogen addition on peptides + SMILES building
rdkit = ["rdkit>=2023.9"]

# Common-name lookup
name = ["pubchempy>=1.0"]

# Browser UI -- kept for back-compat; flask is now in core dependencies
# above, so `pip install molbuilder` already pulls it in.
web = ["flask>=3.0"]

# Optional auth integration -- only needed when ``molbuilder.json``
# has an ``auth`` section (the default is no-auth, which is correct
# for the localhost-only single-user deployment shape).  When auth is
# enabled, molbuilder verifies identity tokens / tickets from one or
# more external identity providers; no credentials are stored locally.
#
# Two libraries cover the five supported backend kinds:
#   * ``authlib``     -- OAuth 2.0 / OIDC (kind: google / github /
#                        microsoft / orcid)
#   * ``python-cas``  -- Apereo CAS protocol (kind: cas; e.g. ASURITE
#                        sign-in through ASU's CAS)
#
# Installing both is cheap (~6 MB total) and the imports are lazy,
# so the unused library is a no-op at runtime.  See
# ``docs/ops/deployment.md`` for the per-backend setup walkthroughs.
auth = ["authlib>=1.3", "python-cas>=1.6"]

# Test runner + static-analysis tools.  Install with:
#     pip install ".[test]"
# (NOT ``pip install -e``: molbuilder is invoked as
# ``python -m molbuilder ...`` from the repo root, the package isn't
# imported from site-packages.  Editable-install was retired -- see
# the CLAUDE.md memory entry "No pip install -e .".)
test = [
    "pytest>=7",
    "pyflakes>=3",
]

# Browser-driven end-to-end tests for the Modify (and future)
# tabs.  Skipped automatically when these aren't installed; install
# with:
# THE CONDA ROUTE DOES NOT USE THIS EXTRA -- see below.
#
#     pip install ".[e2e]"
#     pip uninstall -y molbuilder      # keeps the extras, drops the wheel
#     python -m playwright install chromium
#
# The three lines above were how the conda host env got its test tooling until
# 2026-09-18, and the uninstall was mandatory: asking pip for the extras makes
# it install the PROJECT to reach them, and a molbuilder wheel in site-packages
# shadows the working tree from any cwd but the repo root.
#
# THAT IS NO LONGER THE ROUTE.  `recipes.py` declares playwright,
# pytest-playwright and nodejs on the host recipe as `opt_in`, so
#
#     bash scripts/install-env.sh install molbuilder --with-dev-tools --yes
#
# installs all of it plus a chromium confined to the env -- and never installs
# the project, so there is no wheel to uninstall.  This extra is kept for a
# pip-only consumer of the published package; note that the wheel ships
# `molbuilder*` only, so it carries no tests to run with it.
e2e = [
    "playwright>=1.40",
    "pytest-playwright>=0.4",
]

# Everything molbuilder itself can use (build-time deps only).
all = [
    "rdkit>=2023.9",
    "pubchempy>=1.0",
    "flask>=3.0",
    "authlib>=1.3",
    "python-cas>=1.6",
]

[project.scripts]
molbuilder = "molbuilder.cli:main"
# `molwatch` DELETED 2026-09-17.  A back-compat shim from the molwatch merge,
# it ran `main(["serve"])` -- and `serve` became a GROUP on 2026-08-28, where
# a verb is named and never implied, so a bare group invocation prints help
# and exits 2.  The shipped script could not start a server.  `molbuilder
# serve start` is the verb; there is one spelling for one act.

[tool.setuptools.packages.find]
include = ["molbuilder*"]

[tool.setuptools.package-data]
molbuilder = [
    "web/templates/*.html",
    # THE WHOLE STATIC TREE, recursively.  This was a hand-kept list of
    # per-directory globs, and on 2026-09-03 a built wheel was measured
    # carrying 90 of the 141 files on disk: the entire MolView module
    # (13 files), the structure page (9), VibrationView (5), and the
    # Task-setup, Documents, Transport and This-machine tabs' own assets
    # -- every directory added after the list was last touched.  An
    # installed copy served a broken UI while the repo worked, which is
    # the same shape as the .toml omission noted below.
    #
    # A list that must be edited whenever a directory is added will be
    # wrong again; a recursive glob cannot be.  Vendor licence texts are
    # covered by it too, and they must ship with every wheel.
    "web/static/**/*",
    # Fundamental-data tables loaded at import time.  See
    # molbuilder/data/README.md for citations + the override mechanism.
    "data/*.json", "data/*.md",
    # The parameter catalogue (data/catalogue.template.toml) and the per-engine
    # warm-file rules (siesta/, pyscf/) are TOML loaded at runtime.  No .toml
    # pattern existed until 2026-08-14, so NEITHER shipped in a built wheel --
    # it worked from the repo and would have failed on an installed copy.
    "data/*.toml", "siesta/*.toml", "pyscf/*.toml",
    # `data/jupyter_server_config.py` -- Python that is COPIED, never
    # imported: the framed notebook server's config file, which subclasses
    # jupyter_server's checkpoints class and so cannot be imported by the
    # host env.  `packages.find` does not carry it because `data/` is not a
    # package (no `__init__.py`), which is exactly what keeps it unimportable
    # -- so it needs a pattern here, the same way the .toml tables did.
    "data/*.py",
]

[tool.pytest.ini_options]
# pythonpath lets pytest import the in-tree molbuilder/ package without
# requiring `pip install -e .` first.  testpaths keeps `pytest` (no args)
# scoped to the tests/ folder.
minversion   = "7.0"
testpaths    = ["tests"]
pythonpath   = ["."]
addopts      = "-ra"
markers      = [
    # ---- Pyramid layers (docs/process/testing.md) ---- #
    # Markers are orthogonal to directory structure: a test in
    # tests/validation/test_chemistry.py is L2 by directory but might
    # be marked @pytest.mark.integration if it exercises the full
    # validate() pipeline.  Pick by intent, not file location.
    "unit:        L1 — pure helper, no I/O, no globals (microsecond cost)",
    "module:      L2 — single submodule's public surface end-to-end",
    "interface:   L3 — contract between two modules (registry, severity, shape)",
    "integration: L4 — multiple subsystems agreeing on a shared fact",
    "smoke: end-to-end smoke tests that subprocess-run a generated script (slow; require pyscf)",
    "e2e: browser-driven Playwright tests (slow; require chromium install)",
    "slow: tests that take > 1s (full-suite runs include these; pre-commit skips)",
    "capture_on_fail: dump browser state + console to test-artifacts/ on failure (flagged intermittents)",
]
